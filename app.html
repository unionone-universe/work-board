/* 마지막으로 본 화면을 이 기기에 저장해둔다.
   다음에 열 때 서버를 기다리지 않고 바로 그려서 체감 대기를 없앤다.
   ★★ v11 (2026-09-30 본인 업무 권한) — v10 까지는 모든 직원의 기기에 **전체 업무**가 담겨 있었습니다.
     그 저장본을 부팅하자마자 그리면 권한이 바뀐 뒤에도 남의 업무가 잠깐(끊겼으면 계속) 보입니다.
     그래서 이름을 바꿔 **예전 것은 읽지 않고 지웁니다.** 서버 정책 번호(ACCESS_POLICY)가 다른 저장본도 버립니다.
   ★ 끊긴 채로 보여 주는 지난 화면은 **서버가 마지막으로 확인한 뒤 24시간까지만** (예전 3일).
     서버에 닿지 못하는 동안 바뀐 권한은 이 기기가 알 수 없으므로, 오래된 화면을 오래 두지 않습니다. */
var SNAP='uo_snap_v11';
var SNAP_OLD=['uo_snap_v10','uo_snap_v9','uo_snap_v8','uo_snap_v7'];
var ACCESS_POLICY='own-v1';          // 서버 Code.js 의 ACCESS_POLICY 와 같은 값
var SNAP_MAX_MS=1000*60*60*24;

/** 기기 토큰을 그대로 적지 않고 짧은 지문으로 (2026-09-30 검수 1차).
 *  저장본은 **이 토큰으로 로그인한 화면**에서만 다시 그린다 — 토큰이 바뀌면 이전 계정의 저장본은 버린다 */
function tokenTag(t){
  t=String(t||''); if(!t) return '';
  var h=2166136261;
  for(var i=0;i<t.length;i++){ h^=t.charCodeAt(i); h=Math.imul(h,16777619)>>>0; }
  return t.length+'-'+h.toString(36);
}

/** 본인 업무만 보는 사람인가 — **서버가 보낸 값(scope)만** 본다. 화면이 등급으로 스스로 정하지 않는다 */
function ownScope(){ return !!(S.data && S.data.scope === 'own'); }

/** 사람·권한이 바뀌었을 때 이 화면이 들고 있던 것을 전부 버린다 (2026-09-30) */
function resetUserCaches(){
  S.epoch++;
  S.taskCache={}; S.docCache={}; S.docCacheAt={}; S.postCache=null; S.postCacheAt=null;
  S.readers={}; S.readSent={}; S.setCache=null; S.owner='';
  try{ MON.cache={}; }catch(e){}               // 월별 보고 (임원) — 사람이 바뀌면 버린다
  TF_DRAFT=null;                               // 앞사람의 저장 실패 글 (2026-09-30 검수 1차)
}

/** ★ 업무 한 건을 이 기기에서 잊는다 (2026-09-30 검수 1차).
 *  카드 · 상세 재료(기록·댓글·자료·정산) · 방금 올라온 기록 · 알림까지 — 저장본에도 남지 않게.
 *  세대 번호를 올려서, 그 업무에 대해 이미 보낸 요청의 답이 늦게 와도 버리게 한다. */
function forgetTask(id){
  if(!id) return;
  /* ★ 볼 수 있는 업무가 줄었다 — 이 앞에 보낸 요청(판 · 현장 · 저장 되돌리기)은 모두 옛것이 된다 (검수 2차) */
  S.epoch++;
  S.taskGen[id]=(S.taskGen[id]||0)+1;
  var 현장=null;                                 // 그 업무에 연결돼 있던 현장 (지우기 전에 알아 둔다)
  ((S.data && Array.isArray(S.data.tasks)) ? S.data.tasks : []).forEach(function(t){ if(t && t.id===id) 현장=String(t.site||'').trim(); });
  if(현장===null && S.taskCache[id] && S.taskCache[id].task) 현장=String(S.taskCache[id].task.site||'').trim();
  delete S.taskCache[id]; delete S.readers[id]; delete S.readSent[id];
  var d=S.data; if(!d) return;
  if(Array.isArray(d.tasks)) d.tasks=d.tasks.filter(function(t){ return t && t.id!==id; });
  ['logsByTask','logCount','settle','commentsByTask','commentCount','filesByTask','docsByTask','cmtDot']
    .forEach(function(k){ if(d[k]) delete d[k][id]; });
  if(Array.isArray(d.recent)) d.recent=d.recent.filter(function(x){ return x && x.taskId!==id; });
  if(Array.isArray(d.noti)) d.noti=d.noti.filter(function(n){ return n && n.to!==id; });
  /* ★ 본인 업무만 보는 사람의 현장(견적) 목록은 '본인 업무에 연결된 현장' 입니다 (검수 2차).
     잊은 업무에만 걸려 있던 현장은 이름 · 주소 · 견적금액까지 화면과 저장본에서 숨긴다 — 다시 확인받을 때(판)까지.
     어느 현장이었는지 모르면 남은 업무에 연결된 현장만 남긴다 (좁게). 전체를 보는 사람은 손대지 않는다 */
  if(d.scope==='own' && S.meta && Array.isArray(S.meta.sites)){
    var 남은={};
    (Array.isArray(d.tasks) ? d.tasks : []).forEach(function(t){ if(t && t.site) 남은[String(t.site).trim()]=1; });
    S.meta.sites=S.meta.sites.filter(function(x){
      var c=String((x && x.code) || '').trim();
      if(남은[c]) return true;
      return 현장 ? c!==현장 : false;
    });
    if(Array.isArray(d.sites)) d.sites=S.meta.sites.slice();
  }
}

/** 거절(denied)된 요청이 어느 업무에 대한 것이었나 — 보낸 값에서 찾는다 (검수 2차).
 *  '' = 업무에 딸린 요청인데 번호를 못 찾음 · null = 업무와 상관없는 요청 */
function deniedTaskOf(fn, a){
  var p=a && a[1];
  if(fn==='api_saveTask') return (p && p.id) || '';
  if(fn==='api_saveLog' || fn==='api_addSettle' || fn==='api_saveDoc') return (p && p.taskId) || '';
  if(fn==='api_addTaskFile' || fn==='api_guestLink' || fn==='api_deleteTask' || fn==='api_taskDetail' || fn==='api_settle') return p || '';
  if(fn==='api_deleteSettle') return (a && a[2]) || '';
  if(fn==='api_markRead' || fn==='api_saveComment') return p==='업무' ? ((a && a[2]) || '') : null;
  if(fn==='api_deleteLog') return taskHolding('logsByTask', p);
  if(fn==='api_deleteComment') return taskHolding('commentsByTask', p);
  if(fn==='api_dropTaskFile') return taskHolding('filesByTask', p);
  return null;
}
/** 기록·댓글·자료 한 건이 어느 업무에 딸렸나 (화면이 들고 있는 것에서) */
function taskHolding(k, itemId){
  var m=S.data && S.data[k], hit='';
  if(!m || !itemId) return '';
  Object.keys(m).forEach(function(tid){
    if(!hit && Array.isArray(m[tid]) && m[tid].some(function(x){ return x && x.id===itemId; })) hit=tid;
  });
  return hit;
}

/** ★ 실패한 저장을 되돌려도 되나 (검수 2차).
 *  요청을 보낸 뒤 계정·권한이 바뀌었거나 볼 수 있는 업무가 줄었으면(S.epoch 가 오름)
 *  요청 전에 떠 둔 옛 목록을 되살리지 않고, 서버에서 판을 다시 받는다. */
function sameAccess(ep){
  if(ep === S.epoch) return true;
  softRefresh();
  return false;
}

/** 이 업무에 대해 보낸 요청의 답을 지금 써도 되나 — 사람·권한이 바뀌었거나 그 업무를 잊었으면 버린다 */
function taskTicket(id){ return { ep:S.epoch, id:id||'', g:(id && S.taskGen[id])||0 }; }
function ticketOk(tk){ return tk.ep===S.epoch && (!tk.id || ((S.taskGen[tk.id]||0)===tk.g)); }

/** 열어 둔 업무 상세를 닫고 알린다 — 그 업무를 더는 볼 수 없게 됐을 때 */
function accessLost(id, msg){
  if(id) forgetTask(id);
  if(S.openTask && (!id || S.openTask===id)){
    BACK_TASK=null;                              // 닫은 뒤 그 업무 창으로 되돌아가지 않게
    closeModal(true);
    S.openTask=null; S.openTaskFromBoard=false;
    if(msg !== '') toast(msg || '이 업무를 볼 수 있는 권한이 없어 창을 닫았습니다.');
  }
  /* ★ 카드·건수·저장본에서도 바로 지운다 (검수 1차 — 예전에는 창만 닫고 카드가 남았다) */
  if(id){
    try{ renderBoard(); navCount(); showNoti((S.data&&S.data.noti)||[]); if(S.view==='me') renderMe(); }
    catch(e){ quiet('볼 수 없게 된 업무 지우기', e); }
    saveSnap();
  }
}

/** 판을 통째로 비운다 — 로그인이 필요해졌을 때 (지난 사람의 화면을 남기지 않는다) */
function clearBoardData(){
  try{ localStorage.removeItem(SNAP); }catch(e){ quiet('지난 화면 지우기', e); }
  if(S.openTask) accessLost(null, '');
  resetUserCaches();
  S.me=null;
  S.data={ ok:true, me:null, scope:'none', tasks:[], approvals:[], staff:[], recent:[], noti:[],
           attendance:{ linked:false, rows:[] }, docs:{ toAct:[], drafts:[], others:[] }, docPack:{},
           logsByTask:{}, logCount:{}, docsByTask:{}, filesByTask:{}, settle:{}, notices:[], noticeCmt:{},
           commentsByTask:{}, commentCount:{}, cmtDot:{}, leaves:[], events:[] };
  try{ renderBoard(); renderNotices(); navCount(); showNoti([]); }catch(e){ quiet('판 비우기', e); }
}

/** 판 응답이 **지금 화면에 반영해도 되는 것**인가 — 먼저 보낸 옛 요청이 늦게 오면 버린다 */
function boardFresh(seq, ep){
  if(ep !== S.epoch) return false;
  if(seq < S.boardApplied) return false;
  S.boardApplied = seq;
  return true;
}

function saveSnap(){
  try{
    if(!S.data) return;
    var d=S.data;
    /* ★ 권한 정책을 모르는 서버 응답(옛 서버)은 담지 않는다 — 전체 업무가 이 이름으로 남지 않게 (2026-09-30) */
    if(d.policy !== ACCESS_POLICY) return;
    // 어느 댓글까지 봤는지만 따로 챙긴다 (안 그러면 새로고침할 때마다 점이 되살아난다)
    /* 댓글 배지는 이제 서버가 판정해서 cmtDot 으로 준다 (v44).
       화면 변수(S.seen)에 담아 저장하던 것을 없앴다 — 그게 다른 기기와 결과가 달랐던 원인이다. */
    localStorage.setItem(SNAP, JSON.stringify({
      /* t = 서버가 마지막으로 확인해 준 시각. 화면 안에서 고친 것을 저장해도 이 시각은 늘어나지 않는다 */
      t:S.confirmedAt||Date.now(), day:todayStr(), me:S.me, meta:S.meta, corp:S.corp,
      pol:d.policy, who:(d.me&&d.me.phone)||'',        // 어느 정책 · 누구의 화면인가 (2026-09-30)
      tk:tokenTag(S.token),                             // 어느 로그인의 화면인가 (검수 1차)
      data:{ ok:true, me:d.me, scope:d.scope, policy:d.policy, tasks:d.tasks, approvals:d.approvals,
             sites:d.sites,       // 현장(견적) 목록 — 판과 같은 권한 범위 (검수 1차)
             staff:d.staff,       // 담당자 드롭다운 재료 (v46c)
             attendance:d.attendance, recent:d.recent, stat:d.stat,
             statByCorp:d.statByCorp, noti:d.noti, at:d.at,
             /* ★★ 여기 여섯 줄이 **통째로 빠져 있었습니다** (2026-09-03에 발견).
                `board_` 는 진작부터 보내고 있었는데 이 기기에 담지를 않았습니다.
                그래서 앱을 열자마자 달력을 누르면 **승인받은 연차도, 등록한 일정도
                하나도 안 보였습니다.** 판을 다시 받아오기 전까지 계속 비어 있었고,
                창을 열어 둔 동안에는 30초 갱신이 멈추므로 닫았다 열기 전에는 안 채워졌습니다.
                ★ 위의 `SNAP` 주석은 v49 에 `events·eventKinds 가 늘었다` 고 적어 두었는데
                  **정작 담는 줄을 안 적었습니다.** 주석만 고치고 코드를 빠뜨린 경우입니다. */
             leaves:d.leaves, events:d.events,
             eventKinds:d.eventKinds, eventKindAll:d.eventKindAll,
             noticeCmt:d.noticeCmt,      // 공지를 열 때 댓글까지 왕복 0회
             filesByTask:d.filesByTask,  // 업무 상세의 `자료 N개`
             // 업무 상세·결재 탭·공지·댓글을 왕복 없이 열기 위한 재료도 같이 저장한다
             logsByTask:d.logsByTask, logCount:d.logCount,
             docsByTask:d.docsByTask, settle:d.settle, docs:d.docs, docPack:d.docPack,
             docBox:d.docBox,            // 종류별 보기를 볼 수 있는 사람인가 (2026-09-17)
             costItems:d.costItems,      // 마케팅·구독·채용비 재료 (2026-09-22) — docs 와 같은 권한 범위
             notices:d.notices, commentsByTask:d.commentsByTask, commentCount:d.commentCount,
             cmtDot:d.cmtDot,     // 안 읽은 댓글 배지 (서버 판정, v44)
             vers:d.vers }        // 분야별 번호표도 같이 (다음 접속 때 캐시 판정에 쓴다)
    }));
  }catch(e){ quiet('마지막 화면 저장', e); }   // 다음 접속이 느려질 뿐, 이번 화면은 그대로
}

function loadSnap(){
  try{
    /* ★ 정책 이전의 저장본은 읽지 않고 지운다 (전체 업무가 들어 있다) */
    SNAP_OLD.forEach(function(k){ try{ localStorage.removeItem(k); }catch(e){} });
    var raw=localStorage.getItem(SNAP);
    if(!raw) return null;
    var o=JSON.parse(raw);
    if(!o || !o.data || !o.me) return null;
    if(o.pol !== ACCESS_POLICY || !o.who || o.who !== o.me.phone){ localStorage.removeItem(SNAP); return null; }
    if(!o.tk || o.tk !== tokenTag(S.token)){ localStorage.removeItem(SNAP); return null; }   // 다른 로그인의 저장본
    if(Date.now()-o.t > SNAP_MAX_MS){ localStorage.removeItem(SNAP); return null; }   // 서버 확인 뒤 24시간 지난 건 버린다

    /* ★★ 날짜가 바뀌었으면 **'오늘' 짜리 자료는 지우고 그립니다** (2026-09-03).
       지난번 화면을 그대로 그리면, 다음 날 아침에 앱을 열었을 때
       `오늘 출근` 에 **어제 출근이** 뜨고 `방금 올라온 기록` 에 어제 기록이 떴습니다.
       서버는 진작부터 오늘 것만 보냅니다 — 이 기기에 남아 있던 어제 화면이 문제였습니다.
       비워 두면 1초 뒤 서버가 준 오늘 값으로 채워집니다. */
    if(o.day !== todayStr()){
      o.data.attendance = { linked:true, rows:[] };
      o.data.recent = [];
    }
    return o;
  }catch(e){ return null; }
}

/* ── 오프라인 (2026-09-02) ─────────────────────────────────
 *
 *  워크보드는 여태 **온라인 전용**이었습니다. 지하 현장에서 통신이 끊기면
 *  지난번 화면은 떠 있는데 왜 안 바뀌는지 알 길이 없었습니다.
 *
 *  ★ 서비스워커가 이미 화면 파일을 담아 두고, 스냅샷이 지난번 판을 그려 줍니다.
 *    여기서 하는 일은 **끊겼다는 것을 계속 보이게** 하고,
 *    **붙는 순간 스스로 다시 받아오는** 것뿐입니다.
 *  ★ 저장은 막지 않습니다 — `call()` 이 이미 `{ok:false, net:true}` 로 돌려주고
 *    부르는 쪽 54곳이 되돌리기를 갖고 있습니다.
 */
var OFFLINE = false;

function setOffline(on){
  if(OFFLINE === on) return;
  OFFLINE = on;
  var bar = $('offBar');
  if(bar) bar.classList.toggle('hide', !on);
  markStale(on);
}

(function(){
  if(typeof window==='undefined') return;
  window.addEventListener('offline', function(){ setOffline(true); });
  window.addEventListener('online', function(){
    setOffline(false);
    /* 붙는 순간 바로 받아온다. 사람이 새로고침을 누를 이유가 없다 */
    try{ refresh(false); }catch(e){ quiet('통신 복구', e); }
  });
  if(navigator && navigator.onLine === false) setOffline(true);
})();

function markStale(on){
  var el=$('atTime'), b=$('refBtn');
  if(el) el.style.opacity = on ? '.6' : '';
  /* ★ 시각이 작은 폰에서도 알 수 있게 단추째 노랗게 (2026-09-30). 끊김 자체는 위 노란 줄이 알립니다 */
  if(b){ b.classList.toggle('stale', !!on);
         b.title = on ? '이전 화면입니다 · 새 자료를 받는 중 · 누르면 다시 받아옵니다' : '마지막으로 받아온 시각 · 누르면 다시 받아옵니다'; }
}

function boot(){
  applyTheme();

  if(LAUNCH_TOKEN){
    S.token = LAUNCH_TOKEN;
    /* 여기서 실패하면 이번 접속은 멀쩡하지만 다음에 다시 로그인해야 합니다.
       지금 할 수 있는 일이 없으므로 사람에게 알리지 않고 콘솔에만 남깁니다. */
    try{ localStorage.setItem('uo_token', S.token); }catch(e){ quiet('기기 기억', e); }
  } else {
    try{ S.token = localStorage.getItem('uo_token') || ''; }catch(e){ S.token=''; }
    if(!S.token){
      S.token = 'T'+Date.now()+Math.random().toString(36).substr(2,7);
      try{ localStorage.setItem('uo_token', S.token); }catch(e){ quiet('기기 기억', e); }
    }
  }
  loadFont();                    // 글꼴은 서버를 기다리지 않는다. 같은 폴더에 있다

  // ① 지난번 화면이 있으면 먼저 그린다 (서버를 기다리지 않음)
  var snap=loadSnap();
  if(snap){
    S.meta=snap.meta; S.me=snap.me; S.corp=snap.corp||'ALL'; S.data=snap.data;
    S.confirmedAt=snap.t;         // 이 화면을 서버가 마지막으로 확인해 준 시각
    useRanks(S.meta);
    takeDocPack(S.data);          // 지난번에 받아둔 문서 상세도 되살린다
    $('brandName').textContent=(S.meta.company||'UNION ONE').replace('(주)','').trim()||'UNION ONE';
    loadFont(S.meta.fontTitle, S.meta.fontNum);
    renderFilters();
    S.anim=true;
    renderBoard();
    renderNotices();
    $('atTime').textContent=S.data.at||'';
    navCount(); showNoti(S.data.noti);
    markStale(true);
    hideBooting();
  } else {
    showSkeleton();
  }

  // ② 진짜 데이터는 왕복 한 번으로 받는다
  var seq0=++S.boardSeq, ep0=S.epoch;
  call('api_start', S.token, S.corp).then(function(r){
    /* ★ 보낸 뒤 권한이 줄었으면(업무 창에서 거절을 받는 등) 이 답은 옛것이다 (검수 2차).
       판은 다시 받고, 기준정보는 화면을 그릴 재료가 없을 때만 쓰되 현장 목록은 비운다 */
    var 옛답 = !!(r && r.ok && !boardFresh(seq0, ep0));
    if(r.meta && (!옛답 || !S.meta)){
      S.meta=r.meta;
      if(옛답) S.meta.sites=[];
      useRanks(r.meta);
      $('brandName').textContent=(r.meta.company||'UNION ONE').replace('(주)','').trim()||'UNION ONE';
      loadFont(r.meta.fontTitle, r.meta.fontNum);
    }
    hideBooting();

    /* ★ 통신이 잠깐 끊긴 것과 '로그인이 필요하다' 는 것을 구분합니다.
       예전에는 둘을 같이 봐서, 엘리베이터에서 앱을 열면 그대로 로그인 화면이
       떴습니다. 통신 문제일 때는 지난번 화면을 그대로 두고 낡았다고만 표시합니다. */
    if(r.net){
      markStale(true);
      /* 지난번 화면조차 없으면(이 기기에서 처음 여는 경우) 회색 뼈대를
         영원히 두지 않고 무엇이 문제인지 알려 줍니다. */
      if(!snap) showOffline();
      return;
    }
    if(!r.ok){
      markStale(false);
      /* ★ 로그인이 필요하면 이 기기의 지난 화면을 지우고 판도 비웁니다 (2026-09-30).
         기기토큰이 풀린 뒤에도 로그인 창 뒤로 지난 사람의 업무가 보이면 안 됩니다. */
      if(snap) clearBoardData();
      showLogin(); return;
    }
    if(옛답){ markStale(false); if(ep0!==S.epoch) softRefresh(); startPolling(); return; }
    renderFilters();
    S.anim = !snap;              // 스냅샷을 이미 그렸으면 조용히 갈아끼운다
    applyBoard(r);
    markStale(false);
    saveSnap();
    startPolling();
  });
}

/* 지금 돌고 있는 화면의 판 번호.
   런처(index.html)가 app.html 을 부를 때 `?v=v36` 을 붙여 줍니다.
   따로 관리할 번호를 늘리지 않으려고 그것을 그대로 읽습니다. */
function screenVer(){
  try{
    var m=/[?&]v=([^&]+)/.exec(location.search||'');
    return m ? decodeURIComponent(m[1]) : '(모름)';
  }catch(e){ return '(모름)'; }
}

/* 게시글·댓글을 조용히 미리 받아 둔다 (2026-09-02).
 *
 * ★ 왜 —
 *   board 가 실어 보내는 공지 3건에는 **본문만 있고 댓글이 없습니다.**
 *   그래서 공지를 열면 글은 바로 뜨는데 **댓글만 1초쯤 뒤에** 나타났습니다.
 *   미리 받아 두면 공지도 댓글도 왕복 0회로 함께 뜹니다.
 *
 * ★ 바뀐 게 없으면 서버에 가지 않습니다 (areaVer('post')).
 *   그래서 평소에는 왕복이 하나도 늘지 않습니다.
 * ★ 실패해도 아무 말 하지 않습니다 — 그때 열면 예전처럼 그 자리에서 받아옵니다.
 */
var POSTS_LOADING = null;

function prefetchPosts(){
  if(!S.token || !S.me) return Promise.resolve();
  if(S.postCache && S.postCacheAt === areaVer('post')) return Promise.resolve();

  /* ★ 이미 받아오는 중이면 그것을 같이 기다린다.
     예전에는 미리받기와 '공지 열기' 가 따로 불러서 같은 것을 두 번 받았습니다. */
  if(POSTS_LOADING) return POSTS_LOADING;

  var at=areaVer('post');
  POSTS_LOADING = call('api_posts', S.token).then(function(r){
    if(r && r.ok){ S.postCache=r; S.postCacheAt=at; }
    POSTS_LOADING=null;
  }, function(){ POSTS_LOADING=null; });

  return POSTS_LOADING;
}

/* 상단바의 로고를 그대로 복제해 로그인 화면 머리를 만든다.
   경로 데이터를 한 곳에만 적어두려는 것입니다. 상단바가 없으면 글자로 대신합니다. */
function brandBlock(){
  var m=document.querySelector('.brand .bmark'), w=document.querySelector('.brand .bword');
  if(!m || !w) return '<h3 class="tt">UNION ONE WORK BOARD</h3>';
  return '<h3 class="sronly">UNION ONE WORK BOARD</h3>'+
         '<div class="loginlogo">'+m.outerHTML+w.outerHTML+'<p>WORK BOARD</p></div>';
}

function showLogin(){
  $('modal').innerHTML =
   '<div class="veil"><div class="sheet">'+
   brandBlock()+
   '<div class="field"><label class="fl req">휴대폰 번호</label>'+
   '<input type="tel" id="lgPhone" inputmode="numeric" onkeydown="enterGo(event, stepPhone)"></div>'+
   '<div class="actions"><button class="btn pri" id="lgNextBtn" onclick="stepPhone()">다음</button></div>'+
   '<p class="muted" id="lgMsg" style="margin-top:10px"></p>'+
   '<div id="lgSignup"></div></div></div>';
  setTimeout(function(){ var e=$('lgPhone'); if(e) e.focus(); }, 200);
}

/* 엔터를 누르면 다음 단계로 넘어간다.
   한글 입력 중(조합 중)에 눌린 엔터는 무시한다. */
function enterGo(ev, fn){
  if(!ev) return;
  if(ev.key !== 'Enter' && ev.keyCode !== 13) return;
  if(ev.isComposing || ev.keyCode === 229) return;
  ev.preventDefault();
  try { fn(); } catch(e){ quiet('엔터로 다음 단계', e); }
}

function stepPhone(){
  var v=$('lgPhone').value.replace(/[^0-9]/g,'');
  if(v.length<10){ $('lgMsg').textContent='번호를 정확히 입력해주세요.'; return; }
  $('lgNextBtn').disabled=true; $('lgMsg').textContent='확인 중입니다...';
  call('api_checkPhone', v).then(function(r){
    $('lgNextBtn').disabled=false;
    if(!r.ok){
      $('lgMsg').textContent=r.msg;
      var box=$('lgSignup');
      if(box){
        box.innerHTML = (r.code==='NOT_FOUND')
          ? '<div class="actions" style="margin-top:6px">'+
            '<button class="btn" onclick="showSignup(\''+v+'\')">처음이신가요? 사용 신청</button></div>'
          : '';
      }
      return;
    }
    showPinStep(v, r.name, r.hasPin);
  });
}

    if(/^(\d)\1{3}$/.test(pin) || pin==='1234' || pin==='0000'){
      $('lgMsg').textContent='너무 쉬운 번호입니다. 다른 번호로 정해주세요.'; return;
    }
  }
  $('lgGo').disabled=true; $('lgMsg').textContent='확인 중입니다...';
  call('api_login', phone, pin, S.token).then(function(r){
    $('lgGo').disabled=false;

    S.me=r.me; $('modal').innerHTML='';
    try{ localStorage.removeItem(SNAP); }catch(e){ quiet('지난 화면 지우기', e); }
    resetUserCaches();
    renderFilters();
    showSkeleton();
    var seq=++S.boardSeq, ep=S.epoch;
    call('api_start', S.token, S.corp).then(function(b){
      hideBooting();
      if(!b.ok){ toast(b.msg || '자료를 불러오지 못했습니다.'); return; }
      if(!boardFresh(seq, ep)){ if(ep!==S.epoch){ softRefresh(); startPolling(); } return; }

      S.anim=true; applyBoard(b); saveSnap(); startPolling();
    });
  });
}

/* ===================== 갱신 ===================== */

/* 지난번에 그린 뒤로 날짜가 바뀌었나 (2026-09-03).
   ★ 바뀌었으면 **`lastUpdate` 와 상관없이** 다시 받아옵니다.
     밤새 아무도 아무것도 저장하지 않으면 `lastUpdate` 는 그대로라,
     아침에 판을 보면 `오늘 출근` 에 **어제 출근이 그대로** 떠 있었습니다. */
function dayChanged(){
  var t=todayStr();
  if(S.day===t) return false;
  S.day=t;
  return true;
}
function startPolling(){
  if(S.timer) clearInterval(S.timer);
  /* 왕복 한 번에 고정으로 1초 넘게 든다. 확인 자체가 비용이므로 자주 묻지 않는다.
     - 화면을 안 보고 있으면 묻지 않는다
     - 창(모달)을 열어 뭔가 하는 중이면 묻지 않는다 (그 왕복 뒤로 사용자 동작이 밀린다)
     - 방금 스스로 갱신했으면 건너뛴다 */
  S.timer = setInterval(function(){
    if(document.hidden) return;
    if($('modal') && $('modal').innerHTML) return;
    if(SOFT) return;
    if(dayChanged()){ S.lastSync=Date.now(); S.lastCheck=Date.now(); refresh(false); return; }
    if(Date.now() - (S.lastSync||0) < 50000) return;
    S.lastSync=Date.now(); S.lastCheck=Date.now();
    call('api_lastUpdate').then(function(v){
      if(v && v.net) return;                 // 통신이 안 된 것 — 그냥 넘어간다
      if(v && v !== S.lastUpdate){ refresh(false); }
    });
  }, 60000);
  /* 앱으로 돌아올 때도 바뀐 게 있을 때만 받아온다 (무조건 board 를 받지 않는다).
     ★ 휴대폰에서는 앱을 자주 왔다갔다 하므로 20초 안에는 다시 묻지 않는다 (v43).
       확인 자체가 왕복 한 번이고, 그 왕복이 0.5~1초다. */
  document.addEventListener('visibilitychange', function(){
    if(document.hidden) return;
    if(dayChanged()){ S.lastCheck=Date.now(); S.lastSync=Date.now(); refresh(false); return; }
    if(Date.now() - (S.lastCheck||0) < 20000) return;
    S.lastCheck=Date.now();
    call('api_lastUpdate').then(function(v){
      if(v && v.net) return;                 // 통신이 안 된 것 — 그냥 넘어간다
      if(v && v !== S.lastUpdate) refresh(false);
    });
  });
}

/** 저장 결과를 서버 응답 전에 화면에 먼저 반영 */
function applyTaskLocal(p){
  if(!S.data) return;
  var typeName='', corpName='';
  (S.meta.typeAll||S.meta.types||[]).forEach(function(t){ if(t.code===p.type) typeName=t.name; });
  (S.meta.corps||[]).forEach(function(c){ if(c.code===p.corp) corpName=c.name; });
  var ownerName=S.me.name;
  S.data.tasks.forEach(function(t){ if(t.owner===p.owner) ownerName=t.ownerName||ownerName; });

  var found=null;
  S.data.tasks.forEach(function(t){ if(p.id && t.id===p.id) found=t; });
  var d=new Date();
  var obj = found || { id:'(저장중)', flags:[], manpower:{g:0,j:0}, waste:0, progress:0,
                       lastLog:'', next:'', status:'대기', start:'', site:'', area:'',
                       scope:'', addr:'', tel:'', amount:0,
                       at: todayStr()+' '+p2(d.getHours())+':'+p2(d.getMinutes()) };
  obj.type=p.type; obj.typeName=typeName; obj.corp=p.corp; obj.corpName=corpName;
  obj.title=p.title; obj.content=p.content||''; obj.owner=p.owner; obj.ownerName=ownerName;
  obj.due=p.due; obj.co=p.co;
  obj.upAt=nowStamp();                     // 방금 손댔으니 판의 맨 위로 (2026-09-11)
  if(found){ obj.editAt=obj.upAt; readersMovedLocal(obj.id, obj.editAt); }   // 글을 고쳤으니 읽음도 처음부터 (2026-09-14)
  // 창에서 넘어온 것만 바꾼다 (안 받는 칸은 예전 값을 그대로 둔다)
  if(p.site!==undefined) obj.site=p.site;
  if(p.amount!==undefined) obj.amount=Number(p.amount||0);
  /* 진행률·상태도 즉시 반영합니다 (2026-09-03).
     안 그러면 100% 로 저장하고 창을 닫아도 카드가 30초 동안 `진행중` 으로 남아,
     저장이 안 된 줄 알고 한 번 더 누르게 됩니다. */
  if(p.progress!==undefined && p.progress!==null && p.progress!==''){
    obj.progress=Number(p.progress);
    if(p.status) obj.status=p.status;
    obj.done=(obj.status==='완료') ? (obj.done||todayStr()) : '';
  }
  if(!found) S.data.tasks.push(obj);
  renderBoard();
  if(S.view==='me') renderMe();
}

function applyLogLocal(p){
  if(!S.data) return;
  S.data.tasks.forEach(function(t){
    if(t.id!==p.taskId) return;
    if(p.progress!=null && p.progress!==''){
      var pg=Number(p.progress);
      t.progress=pg;
      if(pg>=100){ t.status='완료'; t.done=p.date; }
      else if(pg>0){ t.status='진행중'; t.done=''; }
    }
    t.lastLog=(p.date||'')+' '+String(p.text||'').split('\n')[0];
    t.next=p.next||'';
    t.upAt=nowStamp();                     // 방금 기록했으니 판의 맨 위로 (2026-09-11)
    t.editAt=t.upAt; readersMovedLocal(t.id, t.editAt);   // 기록이 붙었으니 읽음도 처음부터 (2026-09-15)
    if(p.g||p.j) t.manpower={g:Number(p.g||0), j:Number(p.j||0)};
    if(p.wton) t.waste=Math.round((Number(t.waste||0)+Number(p.wton))*10)/10;
  });
  renderBoard();
  if(S.view==='me') renderMe();
}

/* ===================== 분야별 번호표 (v43) =====================
   예전에는 '내가 들고 있는 게 아직 쓸 만한가' 를 `lastUpdate` 로 판단했다.
   그런데 그 값은 **누가 무엇을 저장하든** 바뀐다. 남이 업무 하나만 저장해도
   결재 문서 캐시와 게시글 캐시가 통째로 버려져서, 문서를 누를 때마다
   왕복 1회가 되살아났다 (v35에서 없앤 그 왕복이다).
   이제 결재는 결재 시트가, 게시글은 게시글·댓글이 바뀔 때만 버린다. */
function areaVer(k){
  return (S.data && S.data.vers && S.data.vers[k]) || '';
}

/** board 가 실어 보낸 결재 문서 상세를 캐시에 담는다 (문서를 눌러도 기다릴 것이 없게) */
function takeDocPack(b){
  if(!b || !b.docPack) return;
  var at=(b.vers && b.vers.doc) || '';   // 결재 쪽 번호표로 맞춘다
  Object.keys(b.docPack).forEach(function(no){
    S.docCache[no]=b.docPack[no];
    S.docCacheAt[no]=at;
  });
}

/** 누구의 · 어떤 권한의 화면인가 — 이것이 바뀌면 들고 있던 것을 버린다 */
function whoKey(me, d){ return me ? (String(me.phone||'')+'|'+String(me.grade||'')+'|'+String((d&&d.scope)||'')) : ''; }

function applyBoard(b){
  if(!b || !b.ok) return false;
  /* ★ `me` 가 없으면 로그인한 사람이 아닙니다. 그리려 들면 흰 화면이 됩니다. */
  if(!b.me && !S.me) return false;
  /* ★★ 사람이나 권한이 바뀌었나 (2026-09-30 본인 업무 권한).
     다른 계정으로 들어왔거나, 등급·열람 범위가 바뀌었으면 이 화면이 들고 있던
     업무 상세 · 결재 · 공지 캐시를 전부 버리고, 열린 업무 창도 닫습니다. */
  var 바뀜 = !!(S.data && whoKey(S.data.me || S.me, S.data) !== whoKey(b.me || S.me, b));
  if(바뀜){
    if(S.openTask) accessLost(null, '계정이나 권한이 바뀌어 열려 있던 업무 창을 닫았습니다.');
    /* ★ 업무 창이 아니어도(완료 목록 · 월별 보고 · 설정) 이전 권한으로 그린 창은 닫는다 (검수 1차) */
    else if($('modal') && $('modal').innerHTML){
      BACK_TASK=null; BACK_BOX='';
      closeModal(true);
      toast('계정이나 권한이 바뀌어 열려 있던 창을 닫았습니다.');
    }
    resetUserCaches();
  }
  /* ★ 지난 판에 있다가 새 판에서 사라진 업무 — 담당자가 바뀌었거나 지워졌다 (검수 1차).
     들고 있던 상세·읽음을 버리고 세대 번호를 올려, 그 업무에 대해 보낸 요청의 답이 늦게 와도 버린다 */
  if(!바뀜 && S.data && Array.isArray(S.data.tasks)){
    var 새판={}; (Array.isArray(b.tasks) ? b.tasks : []).forEach(function(t){ if(t && t.id) 새판[t.id]=1; });
    var 줄어듦=false;
    S.data.tasks.forEach(function(t){
      if(!t || !t.id || 새판[t.id] || t.id==='(저장중)') return;
      줄어듦=true;
      S.taskGen[t.id]=(S.taskGen[t.id]||0)+1;
      delete S.taskCache[t.id]; delete S.readers[t.id]; delete S.readSent[t.id];
    });
    if(줄어듦) S.epoch++;                   // 이 앞에 보낸 요청의 답 · 저장 되돌리기는 옛것 (검수 2차)
  }
  S.data=b; S.me=b.me||S.me;
  S.confirmedAt=Date.now();                 // 서버가 확인해 준 시각 (지난 화면 저장본의 기준)
  if(ownScope()) S.owner='';                // 본인 업무만 보는 사람에게 담당자 거르기는 없다
  /* ★ 현장(견적) 목록도 판과 같이 지금 권한으로 갈아끼운다 (검수 1차).
     등급이 낮아졌는데 예전 현장 · 견적금액이 '답 없는 견적' 과 저장본에 남지 않게 */
  if(Array.isArray(b.sites)){ S.meta=S.meta||{}; S.meta.sites=b.sites; }
  else if(바뀜 && S.meta) S.meta.sites=[];
  S.lastUpdate=b.lastUpdate||S.lastUpdate; S.lastSync=Date.now(); if(b.t) S.lastT=b.t;
  takeDocPack(b);
  mkSetNames(b.staff);          /* @이름 강조·고르기에 쓰는 명부 (2026-09-02) */
  /* ★ 필터 줄은 **그린 때의 범위**가 지금과 다르면 다시 그린다 (검수 1차).
     첫 접속에는 판을 받기 전에 필터를 먼저 그려서 담당자 칸이 남아 있었다 */
  if(바뀜 || !$('corpFilter').innerHTML || S.filterScope !== (b.scope||'')) renderFilters();
  /* 판에서 연 업무 창이 새 판에 없으면 — 담당자가 바뀌었거나 지워졌다 — 닫고 알린다 */
  if(S.openTask && S.openTaskFromBoard && !(Array.isArray(b.tasks) ? b.tasks : []).some(function(t){ return t && t.id===S.openTask; })){
    accessLost(S.openTask, '이 업무를 더 볼 수 없어 창을 닫았습니다.');
  }
  renderBoard();
  renderNotices();
  $('atTime').textContent=b.at;
  navCount();
  showNoti(b.noti);
  if(S.view==='doc') renderDocs();     // 결재 목록도 같이 왔으니 바로 갈아끼운다
  saveSnap();

  /* ★ 공지·댓글이 바뀌었으면 뒤에서 미리 받아 둔다 (2026-09-02).
     prefetchPosts 안에서 '바뀐 게 없으면 서버에 안 간다' 를 이미 봅니다.
     그래서 평소에는 왕복이 하나도 늘지 않고, 누가 댓글을 달았을 때만 한 번 받아옵니다.
     덕분에 공지를 열면 댓글이 기다림 없이 같이 뜹니다.
     ★ 미루지 않고 바로 시작합니다 — 사람이 공지를 누르기 전에 끝나 있어야 합니다. */
  prefetchPosts();

  return true;
}

/**
 * 저장 뒤 화면 데이터를 뒤에서 조용히 맞춘다.
 * 저장 API 는 board 를 만들지 않으므로(시트 11회 읽기가 사라짐)
 * 화면은 낙관 반영으로 이미 바뀌어 있고, 정확한 값만 여기서 늦게 갈아끼운다.
 * 연달아 여러 번 저장해도 한 번만 받아온다.
 */
var SOFT=null;
function softRefresh(){
  if(SOFT) clearTimeout(SOFT);
  SOFT=setTimeout(function(){
    SOFT=null;
    /* ★ 판 받기는 모두 applyBoard 한 길로 (2026-09-30) — 사람·권한이 바뀐 것을 한 곳에서 알아챈다.
       먼저 보낸 요청이 늦게 오면(boardFresh) 버린다 */
    var seq=++S.boardSeq, ep=S.epoch;
    call('api_board', S.token, S.corp).then(function(r){
      if(!r || !r.ok) return;
      if(!boardFresh(seq, ep)){ if(ep!==S.epoch) softRefresh(); return; }   // 권한이 줄어든 뒤 온 옛 판 — 다시 받는다
      applyBoard(r);
      if(S.view==='me') renderMe();
    });
  }, 400);
}

function refresh(showMsg){
  if(showMsg) S.anim=true;
  var rb=$('refBtn'); if(rb) rb.classList.add('spin');
  var seq=++S.boardSeq, ep=S.epoch;
  return call('api_board', S.token, S.corp).then(function(r){
    if(rb) rb.classList.remove('spin');
    if(!r.ok) return;
    if(!boardFresh(seq, ep)){ if(ep!==S.epoch) softRefresh(); return; }     // 권한이 줄어든 뒤 온 옛 판 — 다시 받는다
    applyBoard(r);
    if(S.view==='me') renderMe();
  });
}

/* ===================== 워크보드 ===================== */
/* 필터 줄 — 법인 칩 + (담당자를 골랐으면) 이름 칩.
   ★ 예전에는 setCorp 가 칸 번호를 세어 `.on` 을 옮겼습니다 (S.meta.corps[i-1].code).
     칩을 하나라도 더 붙이면 그 계산이 어긋나므로, 지금은 통째로 다시 그립니다.
     칩 대여섯 개를 그리는 일이라 비용이 없습니다. */
function renderFilters(){
  /* ★ 법인이 하나뿐이면 `전체 / UNION ONE` 두 칩은 **아무 일도 하지 않습니다** (2026-09-02).
     누를 이유가 없는 단추를 늘어놓으면 진짜 누를 것(담당자·종류)이 묻힙니다. */
  var corps = S.meta.corps || [];
  var h = '';
  S.filterScope = (S.data && S.data.scope) || '';   // 어느 범위로 그렸나 (applyBoard 가 비교한다)
  if(corps.length > 1){
    h += '<button class="chip'+(S.corp==='ALL'?' on':'')+'" onclick="setCorp(&#39;ALL&#39;)">전체</button>';
    corps.forEach(function(c){
      h+='<button class="chip'+(S.corp===c.code?' on':'')+'" onclick="setCorp(&#39;'+c.code+'&#39;)">'+
         esc(c.name)+'</button>';
    });
  }

  /* ★ 누가 · 무엇 두 가지로 거른다 (2026-09-01).
     칩으로 늘어놓으면 직원 여섯 + 종류 일곱 = 열세 개가 되어 오히려 못 찾습니다.
     '선택지는 드롭다운 고정' 원칙 그대로 두 칸으로 둡니다. */
  if(corps.length > 1) h+='<span class="fgap"></span>';

  /* ★ 본인 업무만 보는 사람에게는 담당자 거르기가 없다 (2026-09-30) — 볼 수 있는 업무가 전부 본인 것입니다 */
  if(!ownScope()){
    h+='<label class="fsel"><span>담당자</span><select'+(S.owner?' class="on"':'')+' onchange="setOwner(this.value)">'+
         '<option value=""'+(S.owner?'':' selected')+'>전체</option>';
    staffSorted().forEach(function(x){
      h+='<option value="'+esc(x.phone)+'"'+(S.owner===x.phone?' selected':'')+'>'+esc(x.name)+'</option>';
    });
    h+='</select></label>';
  }

  h+='<label class="fsel"><span>종류</span><select'+(S.type?' class="on"':'')+' onchange="setType(this.value)">'+
       '<option value=""'+(S.type?'':' selected')+'>전체</option>';
  (S.meta.types||[]).forEach(function(t){
    h+='<option value="'+esc(t.code)+'"'+(S.type===t.code?' selected':'')+'>'+esc(t.name)+'</option>';
  });
  h+='</select></label>';

  $('corpFilter').innerHTML=h;

  /* ★ 걸어 둔 조건 · [초기화] (2026-09-30) — 필터 칸이 접혀 있어도 늘 보입니다 (#fSum).
     넓은 화면에서는 칸 자체가 값을 보여주므로 CSS 가 [초기화] 만 남깁니다. [필터] 단추에는 걸어 둔 개수 */
  var 조건=[];
  if(corps.length>1 && S.corp!=='ALL') corps.forEach(function(c){ if(c.code===S.corp) 조건.push(c.name); });
  if(S.owner && !ownScope()) 조건.push(ownerNameOf(S.owner));
  if(S.type) 조건.push(typeNameOf(S.type));
  var sum=$('fSum');
  if(sum) sum.innerHTML = 조건.length
    ? 조건.map(function(x){ return '<span class="fcond">'+ic('filter')+esc(x)+'</span>'; }).join('')+
      '<button class="btn sm freset" onclick="clearFilter()" aria-label="거른 조건 초기화">'+ic('reset')+'<span>초기화</span></button>'
    : '';
  var bd=$('fBadge');
  if(bd){ bd.textContent = 조건.length ? String(조건.length) : ''; bd.classList.toggle('hide', !조건.length); }
}

/* [필터] — 1023px 이하에서 필터 칸을 펴고 접는다. 저장하지 않는다 (앱을 열면 늘 접힌 채) */
function toggleFilters(){
  var v=$('view-board'); if(!v) return;
  var on=!v.classList.contains('fopen');
  v.classList.toggle('fopen', on);
  var b=$('fToggle'); if(b) b.setAttribute('aria-expanded', on? 'true' : 'false');
  if(on){ var first=document.querySelector('#corpFilter select, #corpFilter button'); if(first) first.focus(); }
}

/** 담당자 목록 — 직급 순. ★ board 가 준 배열은 고치지 않는다 (베껴서 정렬) */
function staffSorted(){
  var list=((S.data&&S.data.staff)||[]).slice();
  list.sort(function(a,b){ return rankNo(a.rank)-rankNo(b.rank) || (a.name<b.name?-1:1); });
  return list;
}

/** 종류 코드 → 이름. ★ typeAll 을 본다 (그만 쓰는 유형의 이름도 들어 있다) */
function typeNameOf(code){
  var n='';
  ((S.meta&&S.meta.typeAll)||[]).forEach(function(t){ if(t.code===code) n=t.name; });
  return n||code;
}

function clearFilter(){
  S.owner=''; S.type='';
  if(((S.meta && S.meta.corps) || []).length > 1) S.corp='ALL';   // [초기화] 는 법인까지 (2026-09-30)
  S.anim=true;
  renderFilters(); renderBoard();
}

/* 서버에 가지 않는다. 이미 받아둔 것을 거를 뿐이다 (왕복 0회) */
function setType(code){
  S.type=code||'';
  S.anim=true;
  renderFilters(); renderBoard();
}

function ownerNameOf(phone){
  var n='';
  ((S.data&&S.data.staff)||[]).forEach(function(x){ if(x.phone===phone) n=x.name; });
  if(!n) ((S.data&&S.data.tasks)||[]).forEach(function(t){ if(t.owner===phone) n=t.ownerName||n; });
  return n||'담당자';
}

/** 담당자 이름 — 누르면 판이 그 사람 것만 남는다. 다시 누르면 풀린다 */
function ownerChip(t){
  if(!t.ownerName) return '';
  /* 본인 업무만 보는 사람에게는 이름을 눌러 거를 일이 없다 — 글자만 (2026-09-30) */
  if(ownScope()) return '<span class="who">'+esc(t.ownerName)+'</span>';
  return '<button class="who" onclick="event.stopPropagation();setOwner(\''+t.owner+'\')">'+
         esc(t.ownerName)+'</button>';
}

/* 서버에 가지 않는다. 이미 받아둔 것을 거를 뿐이다 (왕복 0회).
   ★ 스냅샷에 담지 않습니다 — 내일 앱을 열었는데 판이 비어 있으면 고장난 줄 압니다. */
function setOwner(phone){
  S.owner = (S.owner===phone) ? '' : (phone||'');
  S.anim=true;
  renderFilters();
  renderBoard();
}

function setCorp(c){
  S.corp=c;
  S.anim=true;
  renderFilters();
  renderBoard();          // 서버에 가지 않는다. 이미 받아둔 데이터를 거를 뿐
  if(S.view==='me') renderMe();
}

/**
 * 업무 차례 — 판(대기·진행중)과 '내 업무' 가 같이 씁니다.
 *
 * ★★ **새로 움직인 것이 위로** (2026-09-02).
 *
 *   `upAt` 은 서버가 넣어 주는 '마지막으로 움직인 시각' 입니다 —
 *   올린 때 · 고친 때 · 마지막 작업기록 · 마지막 댓글 중 가장 나중 것.
 *
 *   예전에는
 *     · 대기   정렬이 아예 없어 시트에 쌓인 차례 그대로였습니다 (오래된 것이 맨 위)
 *     · 진행중 급한 표시 → 마감일 순이었습니다
 *   그래서 방금 기록을 남긴 업무가 화면 아래에 묻혀 있었습니다.
 *
 * ★★ 급한 표시(빨강·노랑)로 앞세우지 **않습니다.**
 *   예전 진행중 목록은 급한 것을 맨 위로 올렸는데, 그러면 표시가 붙은 업무가
 *   계속 맨 위에 못박혀 **'새로 들어오면 위로' 가 성립하지 않습니다.**
 *   급한 것은 카드의 빨강·노랑으로 이미 눈에 띕니다 (2026-09-02 대표님 지시).
 */
function taskRecent(a, b){
  var ua=a.upAt||a.at||'', ub=b.upAt||b.at||'';
  if(ua!==ub) return ua<ub ? 1 : -1;              // 새로 움직인 것이 위
  return (a.id<b.id) ? 1 : -1;                    // 같으면 늦게 만든 것이 위
}

function renderBoard(){
  /* 서버가 이상한 줄을 보내도 화면은 떠야 합니다 — 빈 줄만 걸러 냅니다 */
  if(S.data && S.data.tasks && !Array.isArray(S.data.tasks)) S.data.tasks = [];
  if(S.data && Array.isArray(S.data.tasks)){
    S.data.tasks = S.data.tasks.filter(function(t){ return t && t.id; });
  }
  var d=S.data;
  var A=S.anim;            // 이번 그리기에서 애니메이션을 쓸지
  S.anim=false;            // 다음 자동갱신부터는 조용히
  var wait=[], run=[], done=[];
  var list=(d.tasks||[]).filter(function(t){
    if(S.corp!=='ALL' && t.corp!==S.corp) return false;
    if(S.owner && t.owner!==S.owner) return false;    // 담당자 필터 (v55)
    if(S.type && t.type!==S.type) return false;       // 업무 종류 필터 (2026-09-01)
    return true;
  });
  list.forEach(function(t){
    if(t.status==='완료') done.push(t);
    else if(t.status==='진행중') run.push(t);
    else wait.push(t);
  });
  /* ★★ 대기·진행중 둘 다 **새로 움직인 것이 위로** (2026-09-02).
   *
   *   `upAt` 은 서버가 넣어 주는 '마지막으로 움직인 시각' 입니다 —
   *   올린 때 · 고친 때 · 마지막 작업기록 · 마지막 댓글 중 가장 나중 것.
   *
   *   예전에는
   *     · 대기   정렬이 아예 없어 시트에 쌓인 차례 그대로였습니다 (오래된 것이 위)
   *     · 진행중 급한 표시(flags) → 마감일 순이었습니다
   *   그래서 방금 기록을 남긴 업무가 화면 아래에 묻혀 있었습니다.
   *
   *   ★ 급한 표시(빨강·노랑)로 앞세우지 **않습니다** — `taskRecent` 의 설명을 보세요.
   *   ★ 저장 직후에는 화면이 `upAt` 을 지금으로 올려 둡니다 (`touchTaskLocal`·`nowStamp`, 2026-09-11).
   *     서버 값은 softRefresh 가 뒤에서 갈아끼웁니다. */
  run.sort(taskRecent);
  wait.sort(taskRecent);

  countUp($('cWait'), wait.length);
  /* 접혀 있어도 몇 건인지는 보여야 합니다. '최근 7일' 은 머리글의 .csub 에 따로 있습니다 */
  countUp($('cDone'), done.length);
  countUp($('cRun'), run.length);
  /* 좁은 화면의 상태 탭에도 같은 숫자 (2026-09-22) */
  if($('tWait')) $('tWait').textContent = wait.length;
  if($('tRun'))  $('tRun').textContent  = run.length;
  if($('tDone')) $('tDone').textContent = done.length;
  /* ★ 새 업무 더하기는 **대기 목록 바로 아래 가운데**에 둔다 (2026-09-01).
     머리글 오른쪽에 두었더니 '완료 · 전체 보기' 와 헷갈렸습니다.
     글자 없이 ＋ 하나. 손가락으로 누르는 자리라 44px 로 둡니다. */
  var addBtn = '<button class="addwait" onclick="openTaskForm()">'+ic('plus')+'<span>업무 추가</span></button>';
  /* ★ `＋`(새 업무)는 접기 밖에 그립니다 — 접었다고 업무를 못 올리면 안 됩니다.
     ★ 누적 상자는 `.foldpart` 라 **펼쳐야 보입니다** (2026-09-03 대표님 지시). */
  /* ★ 본인 업무만 보는 사람 (2026-09-30) — 제목은 '내 업무 현황', 맡은 업무가 하나도 없으면
     '아직 배정된 업무가 없습니다'. 남의 업무로 빈자리를 채우지 않습니다. 판정은 서버가 보낸 scope 입니다 */
  var 본인만 = ownScope();
  if($('boardTitle')) $('boardTitle').classList.toggle('hide', !본인만);
  var 하나도없음 = 본인만 && !(d.tasks||[]).length;
  $('listWait').innerHTML = wait.length? wait.map(function(t,i){ return cardSlim(t, A?i:-1); }).join('')
                                      : emptyBoard(하나도없음 ? '아직 배정된 업무가 없습니다' : '대기 중인 업무 없음');
  if($('waitAdd')) $('waitAdd').innerHTML = addBtn;
  $('listRun').innerHTML  = run.length ? run.map(function(t,i){ return cardFull(t, A?(i+2):-1); }).join('')
                                       : emptyBoard(하나도없음 ? '아직 배정된 업무가 없습니다' : '진행중인 업무 없음');
  $('listDone').innerHTML = done.length? done.map(function(t,i){ return cardSlim(t, A?(i+4):-1); }).join('') : emptyBoard('최근 7일 완료 없음');
  if($('doneSum')) $('doneSum').innerHTML = sumBox(A);

  // 새로 올라온 업무는 한 번만 반짝
  list.forEach(function(t){
    if(S.seen[t.id]) return;
    S.seen[t.id]=1;
    if(!A) {
      var el=document.querySelector('[data-tid="'+t.id+'"]');
      if(el) el.classList.add('justnow');
    }
  });

  renderHealth();          // 자가진단 줄 (관리자에게만, 이상 있을 때만)
  pushOnce();              // 폰 알림 주소표 갱신 (한 번만)
  roomDot();               // 로고 위의 점 (명단에 든 사람에게만)

  // 우측 패널
  renderTodo();
  /* ★★ 0건이면 구역 자체를 그리지 않습니다 (2026-09-02).
     `결재 대기 0` 과 `없습니다` 두 줄이 늘 떠 있었습니다.
     '없습니다' 를 반복해 빈 공간을 만들지 않는다 — 규칙 그대로입니다. */
  var apv=d.approvals||[];
  var apvBox = $('apvTitle') ? $('apvTitle').parentNode : null;
  if(apvBox) apvBox.classList.toggle('hide', apv.length===0);
  /* ★ 숫자는 탭 하나에만 (2026-09-09). 탭 `결재 ③` · 레일 `결재 대기 3` ·
     구역 `내가 결재할 문서 3` 세 곳에 같은 숫자가 있었습니다. 아래 상자 개수가 곧 숫자입니다.
     ★ 상자는 결재 탭과 같은 모양(흰 바탕 + 왼쪽 빨간 선). 제목·배경·글자가 전부 빨강이라
       진짜 빨간 것(마감 지남·못 받은 돈)과 무게가 같아졌습니다. */
  $('apvTitle').textContent = (S.me&&S.me.grade>=3)?'결재 대기':'내 결재';
  $('railApv').innerHTML = apv.map(function(a){
    return '<div class="ucard hot apv" onclick="openDoc(\''+a.no+'\')"><div class="m">'+
           '<p class="t">'+esc(a.title)+'</p>'+
           '<p class="b">'+esc([a.amount? won(a.amount)+'원':'', a.who].filter(function(x){return x;}).join(' · '))+'</p>'+
           '</div></div>';
  }).join('');
  renderTodoBar(d, apv.length);

  var att=d.attendance||{rows:[]};
  var 출근줄=(att.rows)||[];
  /* 접혀 있어도 **몇 명 왔는지는 보여야** 합니다. 그게 이 칸의 요점입니다.
     휴가는 '안 온 사람' 이 아니므로 전체 인원에서 뺍니다. */
  if($('cAtt')){
    var 온사람=0, 셀사람=0;
    출근줄.forEach(function(a){
      if(a.leave) return;
      셀사람 += 1;

/** 숫자가 바뀌면 짧게 굴려서 바뀐 걸 알아채게 한다 */
function countUp(el, to){
  if(!el) return;
  var from=Number(el.textContent||0);
  if(from===to){ el.textContent=to; return; }
  var steps=Math.min(Math.abs(to-from),8);
  if(steps<=1){ el.textContent=to; bump(el); return; }
  var i=0, dir=(to>from)?1:-1, step=Math.ceil(Math.abs(to-from)/steps);
  var timer=setInterval(function(){
    i++;
    var v=from+dir*step*i;
    if((dir>0&&v>=to)||(dir<0&&v<=to)||i>=steps){ v=to; clearInterval(timer); bump(el); }
    el.textContent=v;
  }, 40);
}
function bump(el){
  el.style.transition='none';
  el.style.transform='scale(1.5)';
  requestAnimationFrame(function(){
    el.style.transition='transform .34s cubic-bezier(.16,.9,.28,1)';
    el.style.transform='none';
  });
}

 * ★ 둘 다 0이면 블록 자체를 그리지 않습니다 (0건인 구역은 만들지 않는다).
 */
var UNPAID_DAYS = 7;          // 견적을 보내고 이만큼 지나면 '답이 없는 것' 으로 본다

  var d=S.data||{}, out=[];

  Object.keys(d.settle||{}).forEach(function(id){

    if(!s || !t || !(s.unpaid>0)) return;
    if(S.corp!=='ALL' && t.corp!==S.corp) return;
    out.push({ id:id, title:t.title, owner:t.ownerName||'', status:t.status,
               claim:s.total||0, paid:s.paid||0, unpaid:s.unpaid });
  });
  out.sort(function(a,b){ return b.unpaid-a.unpaid; });
  return out;
}

function quietList(){
  var out=[], td=todayStr();
  ((S.meta&&S.meta.sites)||[]).forEach(function(x){
    if(String(x.state||'').trim()) return;            // 계약이 잡혔으면 뺀다
    var sent=String(x.sent||'').substring(0,10);
    if(sent.length!==10) return;                      // 아직 보내지 않았다
    var days=daysBetweenStr(sent, td);
    if(days < UNPAID_DAYS) return;
    out.push({ code:x.code, name:x.name||x.code, sent:sent, days:days });
  });
  out.sort(function(a,b){ return b.days-a.days; });
  return out;
}

function daysBetweenStr(a,b){
  var x=new Date(a+'T00:00:00Z'), y=new Date(b+'T00:00:00Z');
  if(isNaN(x)||isNaN(y)) return 0;
  return Math.round((y-x)/86400000);
}

    (볼수있나? '<p class="muted" style="font-size:var(--fs-sm);font-weight:400;margin-top:4px">이번 달 한 장 '+ic('chev')+'</p>' : '')+
    '</div>';
}

/* ★★ 서버가 칸 하나를 안 보내도 **흰 화면이 되면 안 됩니다** (2026-09-02).
   화면이 통째로 안 뜨면 사람은 '앱이 안 켜져요' 말고는 할 말이 없습니다.
   `_점검/화면튼튼시험.js` 가 칸을 하나씩 빼 가며 이것을 지킵니다. */
function lv(t){
  var fl=(t&&t.flags)||[];
  var d=fl.some(function(f){return f&&f.lv==='danger'});
  var w=fl.some(function(f){return f&&f.lv==='warn'});
  return d?'dg':(w?'wn':'');
}

function anim_(i){
  return i>=0 ? ' in" style="animation-delay:'+Math.min(i*80,640)+'ms' : '';
}

/* ★★ 마감 표시는 태그가 아니라 **날짜 글자만 빨갛게** (2026-09-09).
   `09-04 D+3` 옆에 태그 `마감 지남` 이 또 붙어 같은 사실이 한 카드에 두 번 적혔습니다.
   서버가 주는 표시(flags) 중 마감 계열은 카드의 왼쪽 빨간 선과 날짜 색으로만 보이고,
   태그 줄에는 노랑 계열(기록 N일 없음 · 추가견적 필요 · 미승인 추가)만 남습니다.
   ★ 법인명은 **법인이 둘 이상일 때만** — 필터 칩과 같은 조건입니다. */
function isDueFlag(f){ return !!(f && (f.t==='마감 지남' || f.t==='오늘 마감')); }
function dueHot(t){ return ((t&&t.flags)||[]).some(isDueFlag); }
function manyCorps(){ return ((S.meta && S.meta.corps) || []).length > 1; }

/* 선 아이콘 ic() 는 글 서식 구역 맨 앞에 있습니다 (시험이 그 구역을 뽑아 씁니다) */
/* ★ 안전모 도우미 (2026-09-30) — 빈 목록 · 연결 안내에만 작게 둡니다. 업무와 단추를 가리지 않습니다 */
var HELPER='<svg class="helper" viewBox="0 0 64 64" aria-hidden="true" focusable="false">'+

  '<rect class="h-hat" x="14" y="29.8" width="36" height="4.6" rx="2.3"/>'+

/** 판의 빈 칸 — 도우미 + 한 줄 */
function emptyBoard(msg){ return '<div class="none">'+HELPER+'<p class="emsg">'+esc(msg)+'</p></div>'; }

/* 판에서 쓰는 선 아이콘 — 상단바와 같은 한 벌 */
var ICO_CMT='<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5a2 2 0 0 1-2 2H9l-4.5 3.5V6.5a2 2 0 0 1 2-2H18a2 2 0 0 1 2 2z"/></svg>';
var ICO_PLUS='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
/* 창 안의 아이콘 (2026-09-22) — 상단바와 같은 선 굵기 */
var ICO_SVG=function(d){ return '<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" '+
  'stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+d+'</svg>'; };
var ICO_X=ICO_SVG('<path d="M6 6l12 12M18 6L6 18"/>');
var ICO_DOTS=ICO_SVG('<circle cx="5.5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="18.5" cy="12" r="1.2"/>');

/* ★★ 카드 차례 (2026-09-30 디자인) — 업무명 → 현장 → 담당자 · 기간 → (철거 칸) → 진행 상태 → 마지막 기록 → 다음 할 일.
   대기·진행중·완료 세 칸이 같은 머리(cardHead) · 현장 줄(cardSite) · 담당·기간 줄(cardMeta)을 씁니다.
   ★ 표시(flags) 판정은 서버가 합니다. 여기서는 받은 것을 그대로 글자로 보여줄 뿐입니다.
     추가견적 필요 · 미승인 추가 · 기록 N일 없음 · 새 댓글 점 · 댓글 수는 업무명 줄 오른쪽에 붙습니다.
   ★ 법인명은 **법인이 둘 이상일 때만** — 필터 칩과 같은 조건입니다.
   ★ 빈 값은 조각째, 다 비면 줄째 만들지 않습니다 (v42 원칙 그대로). */
function cardOpen(t, cls, i){
  return '<div data-tid="'+t.id+'" role="button" tabindex="0" class="card '+cls+anim_(i)+'"'+
         ' onkeydown="cardKey(event)" onclick="openTask(\''+t.id+'\')">';
}
/** 업무명 줄 — 제목(두 줄까지, 전체는 title) + 오른쪽 표시 */
function cardHead(t, done){
  /* 마감 계열 표시는 기간 글자(빨강 + D+3)가 이미 말하므로 태그로 또 적지 않습니다 (2026-09-09) */
  var 표시들=((t&&t.flags)||[]).filter(function(f){ return f && !isDueFlag(f); });
  var tags=표시들.map(function(f){
    return '<span class="tag '+(f.lv==='danger'?'dg':'wn')+'">'+esc(f.t)+'</span>';
  }).join('');
  var side=(done? '<span class="cdone">'+ic('checkc')+'완료</span>' : '')+tags+cmtBadge(t.id)+
    (hasNewComment(t.id)? '<span class="cdot" title="새 댓글"><span class="sronly">새 댓글</span></span>' : '');
  var title=esc(t.title);
  return '<div class="chead"><p class="cn tt" title="'+title.replace(/"/g,'&quot;')+'">'+title+'</p>'+
           (side? '<span class="cside">'+side+'</span>' : '')+'</div>';
}
/** 현장 코드 → 현장 이름 (기준정보의 현장 목록에서). 모르면 빈 값 */
function siteNameOf(code){
  var n='';
  ((S.meta && S.meta.sites) || []).forEach(function(x){ if(x && x.code===code) n=String(x.name||''); });
  return n;
}
/** 현장 줄 — 업무 종류 · 현장 · (법인이 둘 이상이면) 법인. 현장은 이름으로(모르면 코드) */
function cardSite(t){
  var kind=t.typeName? '<span class="ckind">'+esc(t.typeName)+'</span>' : '';
  var 이름=t.site? (siteNameOf(t.site) || t.site) : '';
  var place=이름? '<span class="cplace">'+ic('pin')+'<span class="sronly">현장 </span><span>'+esc(이름)+'</span></span>' : '';
  var corp=(manyCorps() && t.corpName)? '<span>'+esc(t.corpName)+'</span>' : '';
  return (kind || place || corp)? '<p class="csite">'+kind+place+corp+'</p>' : '';
}
/** 마감 — 언제나 '마감 MM-DD · D-2' 한 모양 (업무 상세의 제목 아래 줄이 씁니다). D-숫자는 기존 dday() 그대로 */
function dueText(t){
  if(!t.due) return '';
  var dd=dday(t.due);
  if(/NaN/.test(dd)) dd='';                       // 날짜가 아닌 값이 와도 'D+NaN' 을 적지 않는다
  var hot=dueHot(t);
  return '<span class="due'+(hot?' dgv':'')+'">마감 '+esc(shortDate(t.due))+(dd? ' · '+dd : '')+'</span>';
}
/** 기간 — 시작 ~ 마감 · D-2. 마감만 있으면 '마감 MM-DD · D-2', 시작만 있으면 'MM-DD 시작', 완료는 '완료 MM-DD' */
function periodText(t){
  if(t.status==='완료'){
    return t.done? '<span class="due">'+ic('checkc')+'완료 '+esc(shortDate(t.done))+'</span>' : '';
  }
  if(!t.due && !t.start) return '';
  var dd=t.due? dday(t.due) : '';
  if(/NaN/.test(dd)) dd='';
  var 글=(t.start && t.due) ? esc(shortDate(t.start))+' ~ '+esc(shortDate(t.due))
        : (t.due ? '마감 '+esc(shortDate(t.due)) : esc(shortDate(t.start))+' 시작');
  return '<span class="due'+(dueHot(t)?' dgv':'')+'">'+ic('cal')+'<span class="sronly">기간 </span>'+글+(dd? ' · '+dd : '')+'</span>';
}
/** 담당자 — 사람 아이콘 + 이름 (임원·관리자는 눌러서 거르기) */
function cardWho(t){
  if(!t.ownerName) return '';
  return '<span>'+ic('user')+'<span class="sronly">담당 </span>'+ownerChip(t)+'</span>';
}
/** 담당 · 기간 한 줄. 빈 조각은 빼고, 다 비면 줄 자체를 만들지 않는다 (v42) */
function cardMeta(parts){
  parts=parts.filter(function(x){ return x; });
  return parts.length? '<p class="cb">'+parts.join('')+'</p>' : '';
}

function cardSlim(t, i){
  var done=(t.status==='완료');
  var parts=[cardWho(t), periodText(t)];
  if(done && t.amount) parts.push('<span>'+won(t.amount)+'원</span>');
  return cardOpen(t, lv(t)+(done?' done':''), i)+
    cardHead(t, done)+cardSite(t)+cardMeta(parts)+
  '</div>';
}

function cardFull(t, i){
  var h=cardOpen(t, lv(t), i)+cardHead(t)+cardSite(t)+cardMeta([cardWho(t), periodText(t)]);

  /* ★★ 격자는 **철거에만** 둡니다 (2026-09-02).
     ★ 철거의 네 칸(오늘 투입·폐기물·계약·남는 것)은 **다른 데 없는 값**이라 그대로 둡니다. */
  var cells = (t.type==='DEMO')
    ? kv('오늘 투입', (function(){ var m=t.manpower||{};
          return (m.g||m.j)? ('기공'+(m.g||0)+' 조공'+(m.j||0)) : ''; })())+
      kv('폐기물', t.waste? t.waste+'t' : '')+
      kv('계약', t.amount? won(t.amount) : '')+
      kv('남는 것', settleMargin_(t.id))
    : '';
  if(cells) h+='<div class="stats">'+cells+'</div>';

  /* 진행 상태 — 진행중 칸의 카드는 언제나 그립니다 (0% 도) */
  if(t.type==='DEMO' || t.progress>0 || t.status==='진행중'){
    var p=Number(t.progress); if(!isFinite(p)) p=0;
    p=Math.max(0, Math.min(100, Math.round(p)));  // 그리기만 막대 안에 — 상태는 서버가 정한다
    h+='<div class="cprog"><div class="bar" role="progressbar" aria-label="진행률" '+
         'aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+p+'"><i style="width:'+p+'%"></i></div>'+
       '<span class="pct">'+p+'%</span></div>';
  }

  /* 마지막 기록 — **있을 때만** 한 줄. 빈 줄로 자리를 지키지 않습니다 */
  if(t.lastLog){
    var sp=String(t.lastLog).indexOf(' ');
    var dt=sp>0? shortDate(t.lastLog.substring(0,sp)) : '';
    var tx=sp>0? t.lastLog.substring(sp+1) : t.lastLog;
    h+='<p class="lastline">'+(dt? '<span class="dt">'+esc(dt)+'</span>' : '')+
       '<span class="tx">'+esc(tx)+'</span></p>';
  }
  /* 다음 할 일 — 카드의 맨 끝, 세이지 상자 (있을 때만) */
  if(t.next){
    h+='<p class="cnext"><span class="k">다음 할 일</span><span class="tx">'+esc(t.next)+'</span></p>';
  }
  return h+'</div>';
}
/** 값이 없으면 칸 자체를 만들지 않는다 (하이픈·'없음' 을 남기지 않는다) */
/** 철거 카드에 '남는 것' — 단가를 안 넣었으면 칸을 만들지 않는다 */
function settleMargin_(id){
  var s = (S.data && S.data.settle && S.data.settle[id]) || null;
  if(!s || !s.cost) return '';
  return (s.margin<0? '-':'') + won(Math.abs(s.margin));
}

function kv(k,v){
  if(v===null||v===undefined||v===''||v==='-') return '';
  return '<div><p class="k">'+k+'</p><p class="num">'+esc(v)+'</p></div>';
}
function dday(due){
  var d=Math.round((new Date(due+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/86400000);
  if(d===0) return 'D-0';
  return d>0? ('D-'+d) : ('D+'+(-d));
}

/* ===================== 화면 전환 ===================== */
function go(v){
  S.view=v;
  S.anim=true;
  var box=$('view-'+v);
  if(box){ box.classList.remove('viewin'); void box.offsetWidth; box.classList.add('viewin'); }
  var gear=document.querySelector('.icobtn[title="설정"]');
  if(gear) gear.style.color = (v==='settings') ? 'var(--t1)' : '';
  ['board','doc','me','settings','note'].forEach(function(k){
    var el=$('view-'+k); if(el) el.classList.toggle('hide', k!==v);
  });
  [].forEach.call(document.querySelectorAll('.tabs button,.navtabs button'),function(b){
    b.classList.toggle('on', b.dataset.view===v);
    if(b.dataset.view===v) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  if(v==='doc') renderDocs();
  if(v==='me') renderMe();
  if(v==='settings') renderSettings();
  /* 들어가 있는 동안에는 탭이 남고, 나가면 다시 사라집니다 */
  if(v==='note'){
    if(ROOM.timer){ clearTimeout(ROOM.timer); ROOM.timer=null; }
    ['roomPC','roomM'].forEach(function(k){ var b=$(k); if(b) b.classList.add('stay'); });
    renderNote();
  } else if(ROOM.on){
    ['roomPC','roomM'].forEach(function(k){ var b=$(k); if(b) b.classList.remove('stay'); });
    roomHide();
  }
}

/** 접었다 펴는 구역. 제목줄에 요약을 얹는다 */
function foldBox(key, head, body){
  return '<div class="fold'+(FOLD[key]?' open':'')+'">'+
    '<button class="fh" onclick="toggleFold(\''+key+'\',this)">'+head+
    '<span class="arrow">'+ic('chev-d')+'</span></button>'+
    '<div class="fb">'+body+'</div></div>';
}
function toggleFold(key, el){
  var box=el.parentNode;
  var on=!box.classList.contains('open');
  box.classList.toggle('open', on);
  FOLD[key]=on;
}

/** 워크보드가 이미 들고 있는 재료로 상세 화면을 만든다 (서버 왕복 0회) */
function detailFromBoard(id, t){
  var d=S.data||{};
  var s=(d.settle && d.settle[id]) || null;      // 철거가 아니면 서버가 아예 안 보낸다
  return {
    ok:true, task:t,
    logs:(d.logsByTask && d.logsByTask[id]) || [],
    total:(d.logCount && d.logCount[id]) || 0,
    docs:(d.docsByTask && d.docsByTask[id]) || [],
    comments:(d.commentsByTask && d.commentsByTask[id]) || [],
    cmtTotal:(d.commentCount && d.commentCount[id]) || 0,
    files:(d.filesByTask && d.filesByTask[id]) || [],
    settle: s? { rows:s.rows||[], sum:s } : null
  };
}

function openTask(id, keepFold){
  if(!keepFold) FOLD={};         // 창을 새로 열면 접힘 상태를 처음으로
  // 창 열기는 서버에 가지 않는다. 이미 받아둔 데이터로 바로 그린다.
  var t=null;
  (S.data? S.data.tasks:[]).forEach(function(x){ if(x.id===id) t=x; });

  if(t){
    var hadDot = hasNewComment(id);      // 점을 지우기 전에 기억해둔다
    var r = S.taskCache[id] || detailFromBoard(id, t);
    $('modal').innerHTML = taskSheetHtml(t, r);
    S.openTask=id; S.openTaskFromBoard=true;   // 어느 업무 창이 열려 있나 (권한이 바뀌면 닫으려고)
    markCommentsSeen(id);
    paintReaders(id);
    sendRead(id, hadDot);        // 뒤에서 조용히. 창은 기다리지 않는다
    return;
  }

  // 진행판에 없는 업무(오래된 완료 건 등)일 때만 서버에 묻는다
  var tk=taskTicket(id);
  call('api_taskDetail', S.token, id).then(function(r){
    if(!ticketOk(tk)) return;                 // 그사이 계정·권한이 바뀌었거나 그 업무를 잊었으면 옛 답을 그리지 않는다
    if(!r.ok){ if(r.denied) accessLost(id, r.msg); else toast(r.msg); return; }
    S.taskCache[id]=r;
    S.openTask=id; S.openTaskFromBoard=false;
    if(r.readers) S.readers[id]={up:taskEditOf(id), names:r.readers};
    $('modal').innerHTML = taskSheetHtml(r.task, r);
    markCommentsSeen(id);
    paintReaders(id);
    sendRead(id, true);
  });
}

/* ---- 읽음 표시 ---- */

/**
 * 읽음 기록은 뒤에서 조용히 보낸다.
 * 접속 중 같은 업무를 또 열면 다시 보내지 않는다.
 * 단 **새 댓글이 있었으면 다시 보낸다** — 댓글을 어디까지 봤는지 갱신해야 하기 때문 (v44).
 *
 * ★★ 업무 글을 고치거나 작업기록이 붙으면(editAt 이 바뀌면) 읽음은 처음부터 다시 쌓입니다
 *   (2026-09-14·15 대표님 지시). 댓글은 비우지 않습니다.
 *   판정은 서버 readersOf_ 가 합니다. 화면은 '보냈다' 와 '받아 둔 목록' 에 그때의 editAt 을
 *   붙여 두고, editAt 이 달라졌으면 다시 보내고 옛 목록은 그리지 않습니다.
 */
function taskEditOf(id){
  var up='';
  ((S.data && S.data.tasks) || []).forEach(function(t){ if(t.id===id) up=t.editAt||''; });
  return up;
}

function sendRead(id, force){
  var up=taskEditOf(id);
  if(S.readSent[id]===up && !force) return;
  S.readSent[id]=up;
  var tk=taskTicket(id);
  call('api_markRead', S.token, '업무', id).then(function(r){
    if(!ticketOk(tk)) return;
    /* ★ 서버가 '볼 수 없는 업무' 라고 하면 창을 닫고 이 기기에서도 지운다 (2026-09-30).
       지난 화면 저장본으로 열었는데 그사이 담당자가 바뀐 경우가 여기서 걸립니다. */
    if(r && r.denied){ accessLost(id, r.msg); return; }
    if(!r || !r.ok) return;
    S.readers[id]={up:up, names:r.readers||[]};
    paintReaders(id);
  });
}

/** 방금 내가 글을 고친 업무 — 읽음을 나 하나로 비운다 (서버도 고친 사람을 본 사람으로 칩니다) */
function readersMovedLocal(id, up){
  S.readers[id]={up:up, names:(S.me && S.me.name) ? [S.me.name] : []};
  S.readSent[id]=up;          // 저장과 엇갈려 옛 목록을 받아 오지 않게 — 서버가 이미 나를 셉니다
  paintReaders(id);
}

function paintReaders(id){
  var box=$('tdRead'); if(!box) return;
  var e=S.readers[id];
  var names=(e && e.up===taskEditOf(id)) ? e.names : [];
  /* 맨 아래 '누가 올림' 줄에 이어 붙인다. 아무도 안 읽었으면 줄을 만들지 않는다 (v55)
     ★ 이름이 많으면 셋까지 + '외 N명' (2026-09-22). 누르면 전부 보입니다 */
  if(!names.length){ box.innerHTML=''; return; }
  var all = !!READ_OPEN[id] || names.length<=3;
  box.innerHTML = ' · 읽음 '+esc((all? names : names.slice(0,3)).join(', '))+
    (all? '' : ' <button type="button" class="linkbtn" onclick="readersAll(\''+esc(id)+'\')">외 '+
               (names.length-3)+'명</button>');
}
var READ_OPEN={};
function readersAll(id){ READ_OPEN[id]=1; paintReaders(id); }

/* ---- 안 읽은 댓글 점 ---- */

/**
 * 남이 쓴 댓글 중 아직 안 본 것이 있는가.
 *
 * ★ 판정은 서버가 한다 (v44). 화면은 서버가 준 값만 그린다.
 *   예전에는 화면 변수(S.seen)로 스스로 판단해서, 새로고침하면 이미 본 댓글에
 *   점이 되살아나고 다른 기기에서는 결과가 달랐다.
 *   지금은 '읽음' 시트에 사람별·업무별 마지막으로 본 시각이 남는다.
 */
/**
 * 업무 카드 제목 옆 댓글 수 — [2] (2026-09-02 대표님 지시).
 *
 * ★ 0건이면 아무것도 그리지 않습니다. '[0]' 은 빈 값을 적는 것과 같습니다.
 * ★ 옆의 빨간 점(.cdot)과 뜻이 다릅니다 —
 *     [2]   달린 댓글이 모두 몇 개인가
 *     빨간 점  내가 아직 안 본 것이 있는가
 *   그래서 둘은 같이 뜰 수 있습니다.
 */
/* 댓글 수 — 말풍선 + 숫자 (2026-09-22). 예전 `[3]` 은 무엇의 숫자인지 알 수 없었습니다.
   화면 읽기 프로그램에는 '댓글 3개' 로 읽힙니다. */
function cmtBadge(id){
  var n=(S.data && S.data.commentCount && S.data.commentCount[id]) || 0;
  if(!n) return '';
  return '<span class="cico" title="댓글 '+n+'개">'+ICO_CMT+
         '<span class="sronly">댓글 </span>'+n+'<span class="sronly">개</span></span>';
}

function hasNewComment(id){
  var d=S.data||{};
  return !!(d.cmtDot && d.cmtDot[id]);
}

/** 상세를 열면 그 자리에서 점을 끈다 (낙관 처리). 서버 기록은 sendRead 가 뒤에서 남긴다 */
function markCommentsSeen(id){
  var d=S.data||{};
  if(!d.cmtDot || !d.cmtDot[id]) return;
  delete d.cmtDot[id];
  renderBoard();
  if(S.view==='me') renderMe();
  saveSnap();
}

/** '기록 더 보기' · '댓글 더 보기' 를 눌렀을 때만 전체를 받아온다 (왕복 1회) */
function loadTaskAll(id, btnId){
  var btn=btnId? $(btnId):null;
  if(btn){ btn.disabled=true; btn.textContent='불러오는 중...'; }
  var tk=taskTicket(id);
  call('api_taskDetail', S.token, id).then(function(r){
    if(!ticketOk(tk)) return;                 // 늦게 온 답이 잊은 업무의 상세를 되살리지 않게 (검수 1차)
    if(!r.ok){ if(r.denied){ accessLost(id, r.msg); return; } toast(r.msg); if(btn){ btn.disabled=false; } return; }
    S.taskCache[id]=r;
    if(r.readers) S.readers[id]={up:taskEditOf(id), names:r.readers};
    if(!$('tdBody')) return;                 // 그새 창을 닫았으면 그만
    FOLD['flow:'+id]=1;                      // 더 보기를 눌렀으니 그 뒤로는 다 보여준다
    $('tdBody').innerHTML = taskDetailBody(r);
    paintReaders(id);
  });
}

/* ---- 화면이 가진 데이터를 직접 고친다 (board 를 기다리지 않는다) ---- */

/** 방금 쓴 기록을 상세·카드에 즉시 붙인다 */
function addLogLocal(taskId, log){
  if(!S.data || !log) return;
  if(!S.data.logsByTask) S.data.logsByTask={};
  if(!S.data.logCount) S.data.logCount={};
  var list=(S.data.logsByTask[taskId]||[]).slice();
  list.push(log);
  if(list.length>5) list=list.slice(list.length-5);
  S.data.logsByTask[taskId]=list;
  S.data.logCount[taskId]=(S.data.logCount[taskId]||0)+1;
  if(S.taskCache[taskId]) delete S.taskCache[taskId];
  touchTaskLocal(taskId);
}

/** ★★ 방금 손댄 업무를 판·내 업무의 맨 위로 (2026-09-11).
 *   서버가 주는 `upAt`(마지막으로 움직인 시각)을 화면에서 미리 지금으로 올려 둡니다.
 *   softRefresh 가 400ms 뒤에 서버 값으로 갈아끼우지만, 그 사이에도 카드가
 *   맨 위에 있어야 '저장이 됐다' 를 눈으로 알 수 있습니다.
 *   업무 저장·기록(applyTaskLocal·applyLogLocal)은 값만 올리고 스스로 그립니다.
 *   사진 있는 기록·댓글은 여기서 그립니다. */
function touchTaskLocal(taskId){
  if(!S.data || !Array.isArray(S.data.tasks)) return;
  var hit=false;
  S.data.tasks.forEach(function(t){ if(t.id===taskId){ t.upAt=nowStamp(); hit=true; } });
  if(!hit) return;
  renderBoard();
  if(S.view==='me') renderMe();
}

/** 지운 기록을 상세에서 즉시 뺀다 */
function dropLogLocal(taskId, logId){
  if(!S.data) return;
  if(S.data.logsByTask && S.data.logsByTask[taskId]){
    S.data.logsByTask[taskId]=S.data.logsByTask[taskId].filter(function(l){ return l.id!==logId; });
  }
  if(S.data.logCount && S.data.logCount[taskId]){
    S.data.logCount[taskId]=Math.max(0, S.data.logCount[taskId]-1);
  }
  delete S.taskCache[taskId];
}

/** 방금 쓴 댓글을 board 데이터에도 붙인다 (다시 열어도 보이게) */
function addCommentLocal(taskId, c){
  if(!S.data || !c) return;
  if(!S.data.commentsByTask) S.data.commentsByTask={};
  if(!S.data.commentCount) S.data.commentCount={};
  var list=(S.data.commentsByTask[taskId]||[]).slice();
  list.push(c);
  if(list.length>3) list=list.slice(list.length-3);
  S.data.commentsByTask[taskId]=list;
  S.data.commentCount[taskId]=(S.data.commentCount[taskId]||0)+1;
  S.seen['C'+taskId]=c.at;                 // 내가 쓴 것이니 점을 켜지 않는다
  if(S.taskCache[taskId]) delete S.taskCache[taskId];
  touchTaskLocal(taskId);
}

/** 서버가 돌려준 정산 합계·줄을 board 데이터에 바로 반영 */
function applySettleRows(taskId, sum, rows){
  if(!S.data || !sum) return;
  if(!S.data.settle) S.data.settle={};
  sum.rows=rows||[];
  if(sum.claim==null) sum.claim=sum.total;
  S.data.settle[taskId]=sum;
  S.data.tasks.forEach(function(t){ if(t.id===taskId) t.amount=sum.supply; });
  renderBoard();
}

/** 지운 공지를 상단 줄에서 즉시 뺀다 */
function dropNoticeLocal(no){
  if(!S.data) return;
  S.data.notices=(S.data.notices||[]).filter(function(n){ return n.no!==no; });
  renderNotices();
}

/** 지운 결재문서를 목록에서 즉시 뺀다 */
function dropDocLocal(no){
  if(!S.data || !S.data.docs) return;
  var d=S.data.docs;
  ['toAct','drafts','others'].forEach(function(k){
    d[k]=(d[k]||[]).filter(function(x){ return x.no!==no; });
  });
  S.data.approvals=(S.data.approvals||[]).filter(function(a){ return a.no!==no; });
  delete S.docCache[no]; delete S.docCacheAt[no];
  navCount();
  if(S.view==='doc') renderDocs();
}

/** 업무 상세의 정산 블록 — 서버가 settle 을 보낸 업무(철거)에서만 부른다 */
function settleHtml(r, t){
  var st=r.settle; if(!st || !st.sum) return '';
  var m=st.sum, rows=st.rows||[];
  if(m.total==null) m.total=m.claim||0;      // board 가 보낸 요약에도 대비
  var canPay=S.me && S.me.grade>=3;
  var isOwner=S.me && (S.me.grade>=3 || (t && t.owner===S.me.phone));
  var canDel=S.me && S.me.grade>=9;
  var tid=(t&&t.id)||r.task.id;

  var h='<div class="settle">'+
    '<div class="top"><span class="sub">계약금액 <span class="muted">(공급가)</span></span>'+
      '<span class="big">'+won(m.supply)+'원</span></div>'+
    (m.supply? '<p class="muted" style="margin:-4px 0 8px;font-size:var(--fs-sm);text-align:right">'+
      wonKo(m.supply)+' · 부가세 포함 '+won(m.total)+'원</p>' : '')+
    '<div class="grid">'+
      '<div><p class="k">최초견적</p><p class="num">'+won(m.base)+'</p></div>'+
      // 돈 칸은 넉 줄이 나란히 서야 읽히므로 칸을 없애지 않고, 하이픈 대신 0 을 쓴다
      '<div><p class="k">추가</p><p class="num" style="color:'+(m.add?'var(--wn)':'')+'">'+
        (m.add? '+'+won(m.add):'0')+'</p></div>'+
      '<div><p class="k">차감</p><p class="num">'+(m.minus? '-'+won(m.minus):'0')+'</p></div>'+
      '<div><p class="k">미수금</p><p class="num" style="color:'+(m.unpaid>0?'var(--dg)':'var(--ok)')+'">'+
        (m.total? won(m.unpaid):'0')+'</p></div>'+
    '</div>';

  /* ★ 들어간 돈과 남는 돈 (2026-09-02).
     서버가 `cost` 를 안 보내면 단가를 아직 안 정한 것이라 **아예 안 그립니다** —
     '0원 남음' 같은 거짓말을 그리지 않습니다. */
  if(m.cost){
    var 남 = m.margin;
    h+='<div class="grid" style="margin-top:var(--sp-3)">'+
      '<div><p class="k">인건비</p><p class="num">'+won(m.cost.man)+'</p></div>'+
      '<div><p class="k">장비</p><p class="num">'+won(m.cost.eq)+'</p></div>'+
      '<div><p class="k">폐기물</p><p class="num">'+won(m.cost.waste)+'</p></div>'+
      '<div><p class="k">남는 것</p><p class="num" style="color:'+
        (남<0?'var(--dg)':'')+'">'+(남<0?'-':'')+won(Math.abs(남))+'</p></div>'+
    '</div>'+
    '<p class="sub" style="margin:4px 0 0;font-size:var(--fs-sm)">'+
      '기공 '+won(m.cost.g)+' · 조공 '+won(m.cost.j)+
      (m.cost.eqDays? ' · 장비 '+m.cost.eqDays+'일':'')+
      (m.cost.tons? ' · 폐기물 '+m.cost.tons+'톤':'')+'</p>';
  }

  if(m.total){
    h+='<div class="paybar"><i style="width:'+Math.min(m.rate,100)+'%"></i></div>'+
       '<p class="sub" style="margin:0;font-size:var(--fs-sm)">입금 '+won(m.paid)+'원 / '+won(m.total)+'원'+
       ' ('+m.rate+'%)'+(m.taxCount? ' · 세금계산서 '+m.taxCount+'건 발행':'')+'</p>';
  }
  h+='</div>';

  if(rows.length){
    h+='<h4 class="sech">정산 내역</h4>';
    rows.forEach(function(x){
      var cls = x.kind==='입금'?'pay':(x.kind==='추가'?'add':'');
      h+='<div class="slrow"><div style="flex:1;min-width:0">'+
         '<span class="tagk '+cls+'">'+esc(x.kind)+'</span> '+esc(x.memo||'')+
         '<div class="muted" style="font-size:var(--fs-sm)">'+
         esc([shortDate(x.date), x.docNo, x.tax].filter(function(y){ return y; }).join(' · '))+
         '</div></div>'+
         '<div style="text-align:right;white-space:nowrap">'+
         '<span class="num">'+(x.kind==='차감'?'-':'')+won(x.amount)+'</span>'+
         (canDel? ' <button class="del icodel" onclick="delSettle(\''+x.id+'\',\''+tid+'\')" aria-label="정산 줄 삭제">'+ic('x')+'</button>':'')+
         '</div></div>';
    });
  }

  h+='<div class="actions" style="margin:12px 0 4px">';
  if(isOwner) h+='<button class="btn sm" onclick="openAddWork(\''+tid+'\')">추가공사 요청</button>';
  if(isOwner) h+='<button class="btn sm" onclick="openSettleForm(\''+tid+'\',\'차감\')">차감 등록</button>';
  if(canPay)  h+='<button class="btn sm pri" onclick="openSettleForm(\''+tid+'\',\'입금\')">입금 등록</button>';
  h+='</div>';

  return h;
}

/**
 * 업무 상세 (v55에서 다시 짬).
 *
 * 예전에는 한 창이 세 가지 일을 같이 했습니다 — 뭔지 보여주고, 무슨 일이 있었는지
 * 보여주고, 할 수 있는 일을 늘어놓았습니다. 셋이 같은 무게라 누를 수 있는 것이 13개였고,
 * 기록이 하나도 없는 업무에서도 '없습니다' 를 담는 틀이 실제 내용보다 컸습니다.
 *
 * 지금은 이렇게만 있습니다.
 *
 *   제목                          ⋯  ✕     ⋯ 를 눌러야 수정·삭제가 나온다
 *   95% ▓▓▓▓░ 진행중 · 마감 09-01          가장 자주 보는 것
 *   ───────────────────────────
 *   내용                                    (있을 때만)
 *   ───────────────────────────
 *   08-31  최원찬  진행률 95%               기록과 댓글이 한 줄기
 *   08-30  조소희
 *   ───────────────────────────
 *   [ 적는 칸 ] [등록]
 *   최원찬이 08-28 올림 · 읽음 …            거의 안 보는 것은 맨 아래
 *
 * ★ 덩어리 사이는 반드시 선으로 끊습니다. 예전에는 간격이 6 / 13 / 21 / 21px 이라
 *   덩어리 안쪽과 덩어리 사이가 사실상 같았고, 그래서 제목·작성자·본문이 붙어 보였습니다.
 * ★ 0건인 구역은 그리지 않습니다. '없습니다' 를 담을 틀도 만들지 않습니다.
 */
function taskSheetHtml(t, r){
  var demo=(t.type==='DEMO');
  var pct=Math.max(0, Math.min(100, Number(t.progress||0)));

  // 철거 현장 정보도 라벨 없이 한 줄로 (있는 것만)
  var site=[];
  if(demo){
    if(t.site) site.push(siteNameOf(t.site) || t.site);   // 현장은 이름으로 (모르면 코드 · 2026-09-30)
    if(t.addr) site.push(t.addr);
    if(t.area) site.push(t.area+'평');
    if(t.scope) site.push(t.scope);
    if(t.tel) site.push(t.tel);
    if(t.amount) site.push('계약 '+won(t.amount)+'원');
  }

  var safe=esc(t.title).replace(/'/g,'');
  /* ★★ 제목 바로 아래 한 줄 (2026-09-22) — 상태 · 담당 · 마감 · 유형.
     빈 값은 조각째 뺍니다. 구분점이 홀로 남지 않습니다.
     마감 모양과 빨강은 판의 카드와 같은 dueText() 를 씁니다 (기존 D-숫자·표시 판정 그대로). */
  var 상태 = (t.status==='완료')

    : '<span class="tdst">'+esc(t.status||'대기')+'</span>';
  var 조각=[];
  if(t.ownerName) 조각.push('<span class="k">담당</span> <b>'+esc(t.ownerName)+'</b>');
  if(t.status!=='완료'){
    if(t.due) 조각.push(dueText(t));
    else if(t.start) 조각.push('시작 '+esc(shortDate(t.start)));
  }
  var 유형=[t.typeName||'', manyCorps()? (t.corpName||'') : ''].filter(Boolean).map(esc).join(' · ');
  if(유형) 조각.push(유형);

  return '<div class="veil"><div class="sheet tdsheet">'+
    '<div class="tdhead">'+
      '<h3>'+esc(t.title)+'</h3>'+
      '<button class="tdico" onclick="taskMenu()" title="업무 수정·삭제" aria-label="업무 수정·삭제">'+ICO_DOTS+'</button>'+
      '<button class="tdico" onclick="closeModal()" title="닫기" aria-label="닫기">'+ICO_X+'</button>'+
    '</div>'+
    '<div class="tdmenu" id="tdMenu">'+
      '<button class="btn sm" onclick="openTaskForm(\''+t.id+'\')">수정</button>'+
      '<button class="btn sm dg" onclick="deleteTask(\''+t.id+'\',\''+safe+'\')">삭제</button>'+
    '</div>'+
    '<div class="tdtop">'+
      '<p class="tdmeta">'+상태+조각.join('<span class="sep"> · </span>')+'</p>'+
      '<div class="tdprog"><div class="bar" role="progressbar" aria-label="진행률" aria-valuemin="0" '+
        'aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div>'+
        '<span class="pct">'+pct+'%</span></div>'+
      (site.length? '<p class="tdsite">'+esc(site.join(' · '))+'</p>' : '')+
    '</div>'+
    (t.content? '<section class="tdsec"><h4 class="tdh">업무 내용</h4>'+
                '<div class="tdcontent">'+fmt(t.content)+'</div></section>' : '')+
    '<div id="tdBody">'+ (r? taskDetailBody(r) : '') +'</div>'+
    '</div></div>';
}

/** ⋯ — 수정·삭제는 평소에 화면에 없다. 눌러야 나온다 */

/** 확인창을 이미 눌렀으니 더 기다리게 하지 않는다. 실패하면 되돌린다 */
function deleteLogFromTask(logId, taskId){
  if(!confirm('이 기록을 삭제할까요?')) return;
  var back=S.data? JSON.parse(JSON.stringify({
    logs:(S.data.logsByTask||{})[taskId]||null,
    cnt:(S.data.logCount||{})[taskId]||0 })) : null;

  var ep=S.epoch;
  dropLogLocal(taskId, logId);
  toast('삭제되었습니다');
  closeOk();
  FOLD={};                             // 접는 구역은 정산 하나뿐이다 (v55)
  openTask(taskId, true);              // 다시 여는 것도 왕복 0회

  call('api_deleteLog', S.token, logId, S.corp).then(function(r){
    if(!r.ok){
      if(back && S.data && sameAccess(ep)){
        if(back.logs) S.data.logsByTask[taskId]=back.logs;
        S.data.logCount[taskId]=back.cnt;
        delete S.taskCache[taskId];
        renderBoard();
      }
      toast('삭제하지 못했습니다: '+r.msg);
      return;
    }
    softRefresh();
  });
}

/* 예전의 logEv() 는 v55에서 없앴습니다.
   기록과 댓글을 한 줄기로 합치면서 flowRow() 하나가 둘 다 그립니다. */

/**
 * 상세 본문 — 관련 결재 · 정산 · 시간 흐름 · 적는 칸.
 *
 * ★ 기록(업무일지)과 댓글을 **한 줄기**로 합쳤습니다 (v55).
 *   예전에는 `마지막 기록` · `이전 기록 N건` · `댓글 N` 세 구역으로 나뉘어 있었고,
 *   그래서 '기록' 이라는 말이 한 화면에 세 번, 뜻이 셋 다 다르게 나왔습니다.
 *   둘 다 '이 업무에 시간순으로 쌓인 것' 이라 나눌 이유가 없었습니다.
 *
 *   ▸ 저장되는 시트는 그대로 따로입니다 (`업무일지` / `댓글`).
 *     기록은 진행률을 옮기고 정산·임금계산의 근거가 되지만 댓글은 아무 영향이 없습니다.
 *     그 차이는 줄에 붙는 `진행률 95%` 뱃지로 갈라 보입니다. **색으로 가르지 않습니다.**
 *   ▸ 서버는 한 줄도 고치지 않았습니다. board_ 가 logsByTask 와 commentsByTask 를
 *     이미 같이 실어 보내므로 화면에서 날짜순으로 섞기만 하면 됩니다 (왕복 0회 그대로).
 */
/* ── 고객용 진행 링크 (2026-09-02) ────────────────────────────
 *
 *  고객이 "지금 어디까지 됐어요?" 라고 전화하는 대신 링크로 봅니다.
 *
 *  ★★ 고객이 보는 것은 **업무명 · 진행률 · 상태 · 날짜 · 현장사진**뿐입니다.
 *    금액 · 원가 · 정산 · 댓글 · 작업내용 · 직원 전화번호는 나가지 않습니다.
 *    **판정과 걸러내기는 전부 서버가 합니다** — 화면에서 가리는 방식이 아닙니다.
 *  ★ [끄기] 를 누르면 이미 보낸 링크가 **그 자리에서** 안 열립니다.
 */
/* ★ 수정 창의 한 칸에서 켜고 끕니다 (2026-09-09). `quiet` 는 이미 켜진 링크를 다시 보는 것 —
   확인창을 또 띄우지 않습니다. 창이 열려 있으면 그 칸(`#tfGuest`)만 갈아끼웁니다. */
function guestLink(taskId, on, quiet){
  if(on && !quiet && !confirm('이 현장의 진행률과 사진을 고객이 볼 수 있게 됩니다.\n' +
                    '금액과 내부 기록은 나가지 않습니다. 만들까요?')) return;

  call('api_guestLink', S.token, taskId, on).then(function(r){
    if(!r || !r.ok){ toast((r&&r.msg)||'만들지 못했습니다'); return; }
    var t=taskOf_(taskId); if(t) t.guest = on ? 'Y' : '';
    var box=$('tfGuest');
    if(!on){
      toast('링크를 껐습니다'); softRefresh();
      if(box && t) box.innerHTML=guestRow_(t, ''); else openTask(taskId, true);
      return;
    }
    if(box && t){
      box.innerHTML=guestRow_(t, r.url);
      var el=$('gsUrl'); if(el){ el.focus(); el.select(); }
      return;
    }
    guestShow(r.url, taskId);
  });
}

/** 수정 창의 '고객 진행 링크' 칸 — 주소를 받았으면 그 자리에 보여준다 */
function guestRow_(t, url){
  var id=esc(t.id);
  if(url){
    return '<input type="text" id="gsUrl" readonly value="'+esc(url)+'">'+
      '<div class="tfrow" style="margin-top:6px">'+
      '<button class="btn sm" onclick="guestCopy()">복사</button>'+
      '<button class="btn sm" onclick="guestSend()">보내기</button>'+
      '<button class="btn sm" onclick="guestLink(&quot;'+id+'&quot;,false)">끄기</button></div>';
  }
  if(t.guest){
    return '<div class="tfrow">'+
      '<button class="btn sm" onclick="guestLink(&quot;'+id+'&quot;,true,true)">링크 보기</button>'+
      '<button class="btn sm" onclick="guestLink(&quot;'+id+'&quot;,false)">끄기</button></div>';
  }
  return '<div class="tfrow">'+
    '<button class="btn sm" onclick="guestLink(&quot;'+id+'&quot;,true)">만들기</button></div>';
}

function guestShow(url, taskId){
  $('modal').innerHTML =
    '<div class="veil"><div class="sheet">'+
      '<div class="sheethead"><h3 class="tt">고객 링크</h3>'+
      '<button class="btn sm" onclick="openTask(&quot;'+esc(taskId)+'&quot;,true)">닫기</button></div>'+
      '<div class="field"><label class="fl">주소</label>'+
        '<input type="text" id="gsUrl" readonly value="'+esc(url)+'"></div>'+
      '<div class="actions">'+
        '<button class="btn" onclick="guestCopy()">복사</button>'+
        '<button class="btn pri" onclick="guestSend()">보내기</button>'+
      '</div></div></div>';
  var el=$('gsUrl'); if(el){ el.focus(); el.select(); }
}

function guestCopy(){
  var el=$('gsUrl'); if(!el) return;
  el.select();
  /* ★ navigator.clipboard 는 안전한 자리에서만 됩니다. 안 되면 옛 방법으로 */
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(el.value)
      .then(function(){ toast('복사했습니다'); })
      .catch(function(){ try{ document.execCommand('copy'); toast('복사했습니다'); }
                         catch(e){ toast('직접 복사해주세요'); } });
    return;
  }
  try{ document.execCommand('copy'); toast('복사했습니다'); }
  catch(e){ toast('직접 복사해주세요'); }
}

function guestSend(){
  var el=$('gsUrl'); if(!el) return;
  if(navigator.share){
    navigator.share({ title:'공사 진행 상황', url:el.value })
      .catch(function(){ /* 사람이 취소한 것도 여기로 옵니다 — 알릴 것 없음 */ });
    return;
  }
  guestCopy();
}

/**
 * 업무에 붙은 도면·문서 (2026-09-02).
 *
 * ★ 담당자·사무실만 붙일 수 있습니다 — **판정은 서버가 합니다.**
 *   여기서는 단추를 보여줄지만 정합니다.
 * ★ 뗀다고 드라이브 파일을 지우지 않습니다. 실수로 지우면 되돌릴 수 없습니다.
 */
/* ★★ 상세(edit=false)에는 **있는 자료만**, 붙이고 떼는 것은 수정 창(edit=true)에서 (2026-09-09).
   0개면 상세에 아무것도 안 그립니다 — '0건인 구역은 아예 그리지 않는다'. */
function fileBox_(t, files, edit){
  var 붙일수있나 = S.me && (S.me.grade>=2 || (t && t.owner===S.me.phone));
  if(!edit){
    if(!files.length) return '';
    return foldBox('files:'+t.id, '자료 '+files.length+'개', fileRows_(t, files, false));
  }
  if(!붙일수있나) return '';
  /* 올리고 떼면 `#tfFiles` 만 다시 그립니다 — 창을 통째로 다시 그리면 쓰던 글이 날아갑니다 */
  return '<div class="field"><label class="fl">자료</label>'+
         '<div id="tfFiles">'+fileRows_(t, files, true)+'</div>'+
         '<input type="file" id="tfFile" multiple '+
           'onchange="addTaskFile(&quot;'+esc(t.id)+'&quot;,this)"></div>';
}

function fileRows_(t, files, edit){
  var h = '';
  files.forEach(function(f){
    h += '<div class="lrow plain"><div class="m">'+
      '<p class="t"><a href="'+esc(f.url)+'" target="_blank" rel="noopener">'+esc(f.name)+'</a></p>'+
      byline([f.who])+'</div>'+
      ((edit && (f.mine || (S.me&&S.me.grade>=9)))
        ? '<div class="r"><button class="btn sm" onclick="dropTaskFile(&quot;'+esc(f.id)+
          '&quot;,&quot;'+esc(t.id)+'&quot;)">빼기</button></div>' : '')+
      '</div>';
  });
  return h;
}

/** 수정 창이 열려 있으면 자료 칸만 다시 그린다. 아니면 상세를 다시 연다 */
function refreshTaskFiles_(taskId){
  var box=$('tfFiles'), t=taskOf_(taskId);
  if(box && t){
    box.innerHTML=fileRows_(t, (S.data && S.data.filesByTask && S.data.filesByTask[taskId])||[], true);
    return;
  }
  openTask(taskId, true);
}

/** 판에 있는 업무 한 건 (없으면 null) */
function taskOf_(id){
  var t=null;
  (S.data? S.data.tasks:[]).forEach(function(x){ if(x.id===id) t=x; });
  return t;
}

/** 파일을 붙인다. ★ 한 번에 세 개까지 — 열 개를 한 번에 보내면 응답이 30초를 넘습니다 */
function addTaskFile(taskId, input){
  var list = [].slice.call(input.files||[]).slice(0,3);
  if(!list.length) return;
  var 큰것 = list.filter(function(f){ return f.size > 8*1024*1024; });
  if(큰것.length){ toast('8MB 가 넘는 파일은 올릴 수 없습니다'); input.value=''; return; }

  toast('올리는 중입니다');
  Promise.all(list.map(function(f){
    return new Promise(function(yes){
      var fr = new FileReader();
      fr.onload = function(){ yes({ name:f.name, data:fr.result }); };
      fr.onerror = function(){ yes(null); };
      fr.readAsDataURL(f);
    });
  })).then(function(arr){
    var 보낼것 = arr.filter(Boolean);
    input.value='';
    if(!보낼것.length){ toast('파일을 읽지 못했습니다'); return; }
    call('api_addTaskFile', S.token, taskId, 보낼것).then(function(r){
      if(!r || !r.ok){ toast((r&&r.msg)||'올리지 못했습니다'); return; }
      if(S.data && S.data.filesByTask){
        if(!S.data.filesByTask[taskId]) S.data.filesByTask[taskId]=[];
        (r.files||[]).forEach(function(f){
          S.data.filesByTask[taskId].push({ id:'', name:f.name, url:f.url,
                                            who:(S.me&&S.me.name)||'', mine:true });
        });
      }
      toast((r.files||[]).length+'개 올렸습니다');
      softRefresh();
      refreshTaskFiles_(taskId);
    });
  });
}

function dropTaskFile(id, taskId){
  if(!confirm('이 자료를 떼겠습니까? (드라이브 파일은 남습니다)')) return;
  if(S.data && S.data.filesByTask && S.data.filesByTask[taskId]){
    S.data.filesByTask[taskId] = S.data.filesByTask[taskId].filter(function(f){ return f.id!==id; });
  }
  refreshTaskFiles_(taskId);
  call('api_dropTaskFile', S.token, id).then(function(r){
    if(!r || !r.ok){ toast((r&&r.msg)||'떼지 못했습니다'); }
    softRefresh();
  });
}

/**
 * 이 업무에 붙은 사진 전부 (2026-09-02).
 * ★ 새 것이 앞에 오게 — 사람이 보고 싶은 것은 어제 찍은 사진입니다.
 * ★ 같은 주소가 두 번 나오지 않게 걸러 냅니다 (`photo` 와 `photos` 가 겹칩니다).
 */
function taskShots_(r){
  var 본것 = {}, 모음 = [];
  function 담기(list){
    (list||[]).forEach(function(u){
      if(!u || 본것[u]) return;
      본것[u] = 1; 모음.push(u);
    });
  }
  var flow = (r.logs||[]).slice().sort(function(a,b){
    return String(b.date||'') < String(a.date||'') ? -1 : 1;
  });
  flow.forEach(function(l){ 담기(l.photos && l.photos.length ? l.photos : (l.photo? [l.photo] : [])); });
  ((r.comments)||[]).forEach(function(c){ 담기(c.photos); });
  return 모음;
}

function taskDetailBody(r){
  var t=r.task;
  var h='', top='';

  // 관련 결재 — 구역 제목을 만들지 않고 누를 수 있는 한 줄로
  if(r.docs && r.docs.length){
    r.docs.forEach(function(d){
      top+='<button class="tdlink" onclick="openDoc(\''+d.no+'\')">'+
        '<span class="n">'+esc(d.title)+'</span>'+
        (d.amount? '<span class="g">'+won(d.amount)+'원</span>':'')+
        '<span class="g">'+docBadge(d.status)+'</span></button>';
    });
  }

  // 정산 — 서버가 settle 을 보낸 업무(철거)에만 있다
  if(r.settle && r.settle.sum){
    top+=foldBox('settle:'+t.id,
      '정산 · 공급가 '+won(r.settle.sum.supply)+'원'+
        (r.settle.sum.cost? ' · 남는 것 '+won(r.settle.sum.margin)+'원':''),
      settleHtml(r, t));
  }
  /* ★★ 자료 붙이기·고객 진행 링크는 **수정 창**에 있습니다 (2026-09-09 대표님 지시).
     첫 화면에는 중요한 정보만 남깁니다 — `자료 · 붙이기` `고객 진행 링크 · 만들기` 는
     정보가 아니라 단추인데 업무마다 두 줄씩 자리를 차지했습니다.
     이미 붙은 자료가 있을 때만 접힌 한 줄로 보여줍니다 (0개면 아무것도 안 그립니다). */
  top += fileBox_(t, r.files||[], false);

  /* ★ 사진 모아보기 (2026-09-02).
     기록마다 흩어져 있어서 **사실상 아무도 안 봤습니다.**
     접힌 줄 하나로 이 현장의 사진을 한자리에 모읍니다. 왕복 0회 — 이미 손에 있는 것입니다. */
  var 사진들 = taskShots_(r);
  if(사진들.length){
    top += foldBox('shots:'+t.id, '사진 '+사진들.length+'장', shotsHtml(사진들));
  }

  if(top) h+='<div class="tdextra">'+top+'</div>';

  // 시간 흐름 — 비어 있으면 아무것도 그리지 않는다 ('없습니다' 를 쓰지 않는다).
  // 빈 칸이라도 남겨두는 이유는 새로 쓴 것을 여기에 바로 끼워 넣기 때문이다
  var flow=taskFlow_(r);
  /* 다섯 줄까지만 보여준다. 창을 열자마자 스무 줄이 쏟아지면 '많다' 는 느낌이 그대로 남는다.
     '더 보기' 를 한 번 누르면 그 뒤로는 전부 보인다 (FOLD 에 표시해 둔다) */
  var showAll = !!FOLD['flow:'+t.id];
  /* ★ 오래된 것부터 놓으므로 '뒤에서 다섯 줄' 을 보여준다.
     앞에서 다섯 줄을 자르면 가장 오래된 것만 보이고 방금 쓴 글이 숨는다. */
  var shown   = showAll ? flow : flow.slice(-5);

  var more = (flow.length - shown.length)
           + Math.max(0,(r.total||0)   - (r.logs||[]).length)
           + Math.max(0,(r.cmtTotal||0)- (r.comments||[]).length);

  /* 진행률이 몇에서 몇으로 바뀌었는지 — 화면이 가진 기록만으로 (앞 기록이 없으면 지금 값만) */
  var 앞=null;
  flow.forEach(function(it){
    if(it.kind!=='log' || !it.o.progress) return;
    it.prev = 앞;
    앞 = Number(it.o.progress);
  });
  var 건수 = flow.length
           + Math.max(0,(r.total||0)   - (r.logs||[]).length)
           + Math.max(0,(r.cmtTotal||0)- (r.comments||[]).length);

  /* ★★ 「진행 기록」 한 구역 (2026-09-22). 기록과 댓글은 예전처럼 한 줄기입니다. */
  h+='<section class="tdsec"><h4 class="tdh">진행 기록'+(건수? ' <span class="n">'+건수+'</span>' : '')+'</h4>';

  /* ★ '지난 것 더 보기' 는 흐름 **위**에 둔다 (오래된 것이 위로 가므로) */
  if(more>0){
    h+='<button class="tdmore" id="tdMore" onclick="flowMore(\''+t.id+'\',\'tdMore\')">'+
       '지난 기록 '+more+'건 더 보기</button>';
  }

  h+='<div class="flow" id="tdFlow">'+
     shown.map(function(it){ return flowRow(it, t.id); }).join('')+'</div>';
  if(!건수) h+='<p class="tdempty" id="tdEmpty">아직 기록이 없습니다</p>';

  /* 적는 칸 — 엔터로 등록(댓글로 저장). 사진·진행률은 기존 기록 창으로 이어서 연다:
     거기서 고른 사진과 바꾼 진행률이 **저장 전에** 보입니다. 쓰던 글은 그 창으로 옮겨 갑니다.
     ★ 저장 방식은 그대로입니다 — 글만 쓰면 댓글, 기록 창에서 저장하면 업무일지. */
  h+='<div class="tdcompose">'+
       '<textarea id="tdWrite" rows="2" spellcheck="false" placeholder="진행 상황을 남겨주세요" '+
         'aria-label="진행 상황" onkeydown="flowKey(event,\''+t.id+'\')">'+esc(TD_DRAFT[t.id]||'')+'</textarea>'+
       '<div class="tdwbar">'+
         /* 기록 창은 완료된 업무를 고를 수 없으므로 완료 업무에는 두 단추가 없습니다 */
         (t.status==='완료' ? '' :
         '<button type="button" class="btn sm tdtool" onclick="tdLogWith(\''+t.id+'\',\'photo\')">'+
           ICO_CAM+'사진 첨부</button>'+
         '<button type="button" class="btn sm tdtool" onclick="tdLogWith(\''+t.id+'\',\'prog\')">'+
           ICO_PROG+(t.type==='DEMO' ? '진행률 · 인력' : '진행률 변경')+'</button>')+
         '<button type="button" class="btn sm pri" onclick="sendFlow(\''+t.id+'\')">등록</button>'+
       '</div>'+
     '</div></section>';

  // 맨 아래 — 누가 처음 올렸나, 누가 봤나. 거의 안 보는 것이라 여기로 내렸다
  var made='';
  if(t.ownerName) made = t.ownerName + (t.at? ('이 '+shortDate(String(t.at).substring(0,10))+' 올림') : '이 올림');
  else if(t.at)   made = shortDate(String(t.at).substring(0,10))+' 올림';
  /* 함께 보는 사람이 있으면 이름을 보여준다 (없으면 조각을 만들지 않는다) */
  var coNames=[];
  String(t.co||'').split(',').forEach(function(ph){
    ph=ph.trim(); if(!ph) return;
    var n=''; ((S.data&&S.data.staff)||[]).forEach(function(x){ if(x.phone===ph) n=x.name; });
    if(n) coNames.push(n);
  });
  h+='<p class="tdfoot">'+esc(made)+
     (coNames.length? (made? ' · ' : '')+'협업자 '+esc(coNames.join(', ')) : '')+
     '<span id="tdRead"></span></p>';
