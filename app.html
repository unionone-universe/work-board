  color:var(--t2);font-variant-numeric:tabular-nums}
.tdsheet .tdtop{margin:0}
.tdsheet .tdsite{margin:8px 0 0;font-size:var(--wb-fs-meta);color:var(--t3)}

/* 구역 — 짧은 제목 + 여백. 선이나 박스로 두르지 않는다 */
.tdsec{margin-top:28px}
.tdh{display:flex;align-items:center;gap:8px;margin:0 0 12px;font-size:var(--fs-body);
  font-weight:700;color:var(--t1);letter-spacing:.01em}
.tdh .n{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 6px;
  border-radius:99px;background:var(--panel2);color:var(--t1);font-size:var(--wb-fs-label);font-weight:600}
.tdcontent{font-size:var(--wb-fs-body);line-height:1.75;color:var(--t1);overflow-wrap:anywhere}
.tdcontent .mk{font-size:inherit;line-height:inherit;margin:0 0 10px}
.tdcontent .mk:last-child{margin-bottom:0}
.tdcontent ul.mk,.tdcontent ol.mk{padding-left:22px}
.tdcontent li{margin:3px 0}
.tdextra{margin-top:24px}
.tdextra .fold:first-child{border-top:0}

/* 진행 기록 */
.tdsheet .flow{gap:0}
.tdsheet .fitem{display:block;position:relative;padding:14px 0;border-top:1px solid var(--line)}
.tdsheet .flow .fitem + .fitem{padding-top:14px}
.tdsheet .flow .fitem:first-child{border-top:0;padding-top:2px}
.tdsheet .fitem.hasmenu .who{padding-right:40px}
.tdsheet .fitem .who{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin:0 0 6px;
  font-size:var(--wb-fs-meta);color:var(--t3)}
.tdsheet .fitem .who b{color:var(--t1);font-weight:600}
/* ★ '.who' 는 판의 담당자 단추 이름이기도 해서 밑줄·손가락 커서가 붙어 있었습니다 */
.tdsheet .fitem .who{text-decoration:none;cursor:auto}
.tdsheet .fitem .fwhen{font-variant-numeric:tabular-nums}
.tdsheet .fitem .num{font-size:var(--wb-fs-label);color:var(--t1);background:var(--panel2);
  border-radius:99px;padding:1px 8px;font-weight:600}
.tdsheet .fitem .txt{font-size:var(--wb-fs-body);line-height:1.7;color:var(--t1);overflow-wrap:anywhere}
.tdsheet .fitem .ex{margin:6px 0 0;font-size:var(--wb-fs-meta);color:var(--t3)}
.fmenu{position:absolute;top:8px;right:0}
.tdsheet .flow .fitem:first-child .fmenu{top:-4px}
.fmore{display:inline-flex;align-items:center;justify-content:center;width:var(--tap);height:var(--tap);padding:0;
  border:0;border-radius:var(--r-md);background:transparent;color:var(--t3);cursor:pointer}
.fmore:hover,.fmenu.on .fmore{background:var(--soft);color:var(--t1)}
.fmore svg{width:20px;height:20px;display:block}
.fpop{display:none;position:absolute;right:0;top:38px;z-index:4;padding:6px;border:1px solid var(--line2);
  border-radius:10px;background:var(--card);box-shadow:0 6px 18px rgba(0,0,0,.22)}
.fmenu.on .fpop{display:block}
.fpop .btn{min-width:88px}
.tdmore{display:block;width:100%;min-height:var(--tap);margin:0 0 var(--sp-2);padding:9px;border:0;border-radius:var(--r-md);
  background:var(--field);color:var(--t2);font-size:var(--wb-fs-meta);cursor:pointer}
.tdmore:hover{color:var(--t1);background:var(--panel2)}
.tdempty{margin:0;padding:16px;text-align:center;border:1px dashed var(--line2);border-radius:var(--wb-radius);
  color:var(--t3);font-size:var(--wb-fs-meta)}

/* 기록 입력 — 칸 하나 + 아래 도구 줄 (박스는 이 한 겹뿐) */
.tdcompose{margin-top:14px;border:1px solid var(--line2);border-radius:var(--wb-radius);background:var(--field)}
.tdcompose:focus-within{border-color:var(--t2)}
.tdcompose textarea,.tdcompose textarea:focus{display:block;width:100%;min-height:64px;margin:0;padding:12px 14px 6px;
  border:0;background:transparent;resize:none;font-size:var(--wb-fs-body);line-height:1.6}
.tdcompose textarea::placeholder{color:var(--t3)}
.tdwbar{display:flex;align-items:center;flex-wrap:wrap;gap:4px;padding:4px 6px 6px}
.tdwbar .tdtool{display:inline-flex;align-items:center;gap:6px;min-height:var(--tap);padding:0 12px;
  border-color:transparent;background:transparent;color:var(--t2);font-size:var(--wb-fs-meta)}
.tdwbar .tdtool:hover{background:var(--panel2);color:var(--t1)}
.tdwbar .tdtool svg{width:20px;height:20px;display:block}
.tdwbar .btn.pri{margin-left:auto;min-height:var(--tap-main);padding:0 20px;font-size:var(--wb-fs-body);font-weight:700}

/* 맨 아래 — 올린 사람 · 함께 보는 사람 · 읽음 (작은 보조 글) */
.tdsheet .tdfoot{margin:28px 0 0;padding-top:12px;border-top:1px solid var(--line);
  font-size:var(--wb-fs-label);line-height:1.6;color:var(--t3)}
.tdsheet .tdfoot .linkbtn{color:var(--t2)}

/* ── 업무 등록·수정 창 ── */
.tform .sheethead{margin-bottom:4px}
.tform .sheethead h3{font-size:var(--fs-h1)}
.tform .field{margin-bottom:20px}
.tform label.fl{margin:0 0 8px;font-size:var(--wb-fs-meta);font-weight:600;color:var(--t1)}
/* 입력칸 높이 통일 — 48px (2026-09-30 · 손가락으로 누르는 칸) */
.tform input[type=text],.tform input[type=number],.tform input[type=date],.tform select{
  height:var(--tap-main);padding-top:0;padding-bottom:0;font-size:var(--wb-fs-body);border-radius:var(--r-md)}
.tform select{padding-right:32px}
/* 업무명 — 가장 먼저 읽히는 칸. 길면 줄이 늘어난다 */
.tform .tftitle{display:block;min-height:52px;height:52px;padding:12px 14px;resize:none;overflow:hidden;
  font-size:var(--fs-h1);font-weight:600;line-height:1.5;border-radius:var(--r-md);word-break:keep-all;overflow-wrap:anywhere}
/* 업무 내용 — 낮게 시작해 글만큼 늘어난다. 창 안에 스크롤을 하나 더 만들지 않는다 */
.tform .mkin{max-height:none;font-size:var(--wb-fs-body);line-height:1.7;border-radius:var(--r-md)}
.tform .grid2{gap:12px}
@media (max-width:559px){ .tform .grid2{grid-template-columns:1fr;gap:0} }
/* 고르는 단추 — 고른 것은 은은한 바탕 + ✓ . 이름이 길거나 많으면 줄을 바꾼다 */
.tform .tfpick{gap:8px}
.tform .tfpick label{display:inline-flex;align-items:center;gap:6px;min-height:var(--tap);max-width:100%;
  padding:0 16px;border:1px solid var(--fieldline);border-radius:99px;background:transparent;color:var(--t2);
  font-size:var(--wb-fs-meta);font-weight:500;overflow-wrap:anywhere;user-select:none;cursor:pointer}
.tform .tfpick label:hover{border-color:var(--t3);color:var(--t1)}
.tform .tfpick label.on{background:var(--soft);border:2px solid var(--pri);padding:0 15px;color:var(--t1);font-weight:700}
/* 고른 표시 — 선 아이콘 체크 (글자 기호 ✓ 대신 · 2026-09-30) */
.tform .tfpick label.on::before{content:"";flex:none;width:18px;height:18px;background:var(--pri);
  -webkit-mask:var(--mask-check) center/contain no-repeat;mask:var(--mask-check) center/contain no-repeat}
.tform .tfpick label:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
/* 고르지 않아 막힌 무리 — 빨간 테두리로 감싼다 */
.tform .tfpick.err{padding:6px;margin:-6px;border:2px solid var(--dg);border-radius:var(--r-lg)}
/* 칸 바로 아래 이유 한 줄 */
.ferr{display:flex;align-items:flex-start;gap:6px;margin:8px 0 0;color:var(--dg);font-size:var(--fs-sm);font-weight:600}
.ferr::before{content:"";flex:none;width:16px;height:16px;margin-top:2px;background:currentColor;
  -webkit-mask:var(--mask-alert) center/contain no-repeat;mask:var(--mask-alert) center/contain no-repeat}
/* 진행률 — 상태와 퍼센트를 한 줄에, 아래 슬라이더와 빠른 선택. 눈금 줄은 뺐다 (같은 값을 두 번 적었다) */
.tform .prog{border:0;border-radius:var(--wb-radius);background:var(--field);padding:12px 14px 14px}
/* ★ '.top' 은 상단바 이름이기도 해서 배경·밑줄·고정(sticky)이 따라 들어와 어두운 띠가 생겼습니다 */
.tform .prog .top{position:static;z-index:auto;padding:0;border:0;background:none;
  flex-direction:row-reverse;justify-content:space-between;align-items:center;margin-bottom:6px}
.tform .prog .val{font-family:var(--font-ui);font-size:var(--wb-fs-body);font-weight:700;
  font-variant-numeric:tabular-nums;color:var(--t1)}
.tform .prog .st{font-size:var(--wb-fs-meta);font-weight:700}
.tform .prog .ticks{display:none}
.tform .prog .quick{margin-top:8px;gap:6px}
.tform .prog .quick button{min-height:var(--tap);padding:0 14px;border-color:var(--line2);background:var(--card);
  font-size:var(--wb-fs-meta);color:var(--t2)}
.tform .prog .quick button:hover{background:var(--panel2);color:var(--t1)}
/* 막혔을 때의 이유 — 빨간 상자로 또렷하게. 단추 위에 둡니다 */
.tform .tfmsg{display:flex;align-items:flex-start;gap:8px;margin:0 0 var(--sp-2);padding:10px 12px;border-radius:var(--r-md);
  background:var(--dg-bg);border:1px solid var(--dg-line);font-size:var(--wb-fs-meta);font-weight:600;color:var(--dg)}
.tform .tfmsg::before{content:"";flex:none;width:18px;height:18px;margin-top:1px;background:currentColor;
  -webkit-mask:var(--mask-alert) center/contain no-repeat;mask:var(--mask-alert) center/contain no-repeat}
.tform .tfmsg:empty{display:none}
/* 단추 줄 — 창 아래에 붙어 있다. 마지막 칸을 가리지 않도록 흐름 맨 끝에 둔다 */
.sheet.tform{padding-bottom:0}
.tform .actions.tfoot{position:sticky;bottom:0;z-index:3;margin:8px calc(-1 * var(--sh-px)) 0;
  padding:12px var(--sh-px) calc(12px + env(safe-area-inset-bottom));
  background:var(--card);border-top:1px solid var(--line)}
.tform .tfoot .btn{min-height:var(--tap-main);font-size:var(--wb-fs-body)}
.tform .tfoot .btn:not(.pri){flex:0 0 auto;min-width:96px;background:transparent;color:var(--t2)}
.tform .tfoot .btn.pri{flex:1 1 auto;font-weight:700}
.actions .btn{flex:1;padding:0 16px}

/* 카운터 */
.count{display:flex;align-items:center;gap:8px}
.count button{display:inline-flex;align-items:center;justify-content:center;width:var(--tap);height:var(--tap);border:1px solid var(--fieldline);background:var(--card);color:var(--t1);
  border-radius:var(--r);font-size:var(--fs-icon);cursor:pointer}
.count span{min-width:34px;text-align:center;font-size:var(--fs-h1);font-weight:600}
/* 결재를 종류별로 모아 보는 칸 (2026-09-17) — 대표·전무만 봅니다 */
.boxgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-2);margin-bottom:var(--sp-4)}
@media (min-width:900px){ .boxgrid{grid-template-columns:repeat(3,minmax(0,1fr))} }
.dbox{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2);min-width:0;
  padding:var(--sp-3) var(--sp-4);border:1px solid var(--line2);border-radius:var(--r-md);
  background:var(--card);color:var(--t1);font-size:var(--fs-body);text-align:left;cursor:pointer}
.dbox .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dbox .n{color:var(--t3);font-size:var(--fs-sm)}
.dboxbar{display:flex;align-items:center;justify-content:center;gap:var(--sp-3);margin-bottom:var(--sp-2)}

/* ===================== 결재 화면 · 마케팅·구독·채용비 (2026-09-22) =====================
   판(1차)의 --wb-* 규칙 — 글자 14/13/12 · 모서리 12 · 선은 옅게. 그래프·장식 없이 숫자가 먼저 읽히게.
   ★ 선택자는 전부 #view-doc 안입니다. */
#view-doc .dtabs{display:flex;gap:var(--sp-1);padding:3px;margin:0 0 var(--sp-4);
  background:var(--panel);border-radius:var(--r-lg);max-width:420px}
#view-doc .dtabs button{flex:1 1 0;min-width:0;min-height:var(--tap);border:0;border-radius:9px;background:transparent;
  color:var(--t2);font:inherit;font-size:var(--wb-fs-meta);font-weight:600;white-space:nowrap;cursor:pointer}
#view-doc .dtabs button:hover{color:var(--t1)}
#view-doc .dtabs button[aria-selected="true"]{background:var(--wb-sel);color:var(--t1);font-weight:700;
  box-shadow:0 1px 2px rgba(0,0,0,.14)}
#view-doc .dtabs button:focus-visible,#view-doc .costv :focus-visible{outline:2px solid var(--t1);outline-offset:2px}

.costv .cvhead{display:flex;align-items:center;flex-wrap:wrap;gap:var(--sp-2) var(--sp-3);margin:0 0 var(--sp-3)}
.costv .cvt{margin:0;font-size:var(--wb-fs-body);font-weight:700;color:var(--t1);flex:1 1 auto}
.costv .cvper{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.costv .cvper .ym{min-width:74px;text-align:center;font-size:var(--wb-fs-meta);font-weight:600;
  color:var(--t1);font-variant-numeric:tabular-nums}
.costv .cvper .chip{min-height:var(--tap);display:inline-flex;align-items:center;font-size:var(--wb-fs-label)}
.costv .cvcats{margin:0 0 var(--sp-3)}
.costv .cvcats label{min-height:var(--tap);display:inline-flex;align-items:center;font-size:var(--wb-fs-meta)}
/* 요약 — 넷이 한 줄(좁으면 둘씩). 크기를 키우지 않는다 */
.costv .cvsum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--sp-2);margin:0 0 var(--sp-2)}
@media (max-width:639px){ .costv .cvsum{grid-template-columns:repeat(2,minmax(0,1fr))} }
.costv .cvtile{display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left;
  padding:10px 12px;border:1px solid var(--line);border-radius:var(--wb-radius);background:var(--card);
  color:var(--t1);font:inherit;cursor:pointer}
.costv .cvtile.main{cursor:default;background:var(--field);border-color:transparent}
.costv button.cvtile:hover{border-color:var(--line2);background:var(--wb-hover)}
.costv .cvtile.on{border-color:var(--t2)}
.costv .cvtile .k{font-size:var(--wb-fs-label);color:var(--t3);font-weight:600;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.costv .cvtile .v{font-size:var(--wb-fs-body);font-weight:700;color:var(--t1);font-variant-numeric:tabular-nums;
  overflow-wrap:anywhere}
.costv .cvtile.main .v{font-size:17px}
.costv .cvnote{margin:0 0 var(--sp-3)}
.costv .cvnone{margin:var(--sp-3) 0;padding:var(--sp-4);text-align:center;border:1px dashed var(--line2);
  border-radius:var(--wb-radius);color:var(--t3);font-size:var(--wb-fs-meta)}
/* 목록 — 한 품목 한 줄. 폰: 이름·금액 / 분류·날짜·신청자·상태. PC: 표처럼 칸을 맞춘다 */
.costv .cvlist{border:1px solid var(--line);border-radius:var(--wb-radius);overflow:hidden;background:var(--card)}
.costv .cvrow{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n a" "m s";
  align-items:center;gap:2px var(--sp-3);width:100%;padding:9px 12px;border:0;border-top:1px solid var(--line);
  background:transparent;color:var(--t1);font:inherit;font-size:var(--wb-fs-meta);text-align:left;cursor:pointer}
.costv .cvrow:first-child{border-top:0}
.costv button.cvrow:hover{background:var(--wb-hover)}
.costv .cvrow .n{grid-area:n;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.costv .cvrow .n b{font-weight:600;font-size:var(--wb-fs-body)}
.costv .cvrow .n em{font-style:normal;color:var(--t3);margin-left:6px}
.costv .cvrow .meta{grid-area:m;min-width:0;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.costv .cvrow .meta .d::before,.costv .cvrow .meta .w::before{content:" · "}
.costv .cvrow .s{grid-area:s;justify-self:end}
.costv .cvrow .a{grid-area:a;justify-self:end;font-weight:700;font-size:var(--wb-fs-body);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.costv .cvrow .a i{font-style:normal;font-weight:400;color:var(--t3);font-size:var(--wb-fs-meta)}
.costv .cvhdr{display:none;cursor:default}
@media (min-width:720px){
  .costv .cvrow{grid-template-columns:minmax(0,1fr) 116px 58px 92px 76px 128px;
    grid-template-areas:"n c d w s a";gap:var(--sp-3)}
  .costv .cvrow .meta{display:contents}
  .costv .cvrow .meta .c{grid-area:c} .costv .cvrow .meta .d{grid-area:d;font-variant-numeric:tabular-nums}
  .costv .cvrow .meta .w{grid-area:w}
  .costv .cvrow .meta .c,.costv .cvrow .meta .d,.costv .cvrow .meta .w{min-width:0;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;color:var(--t2)}
  .costv .cvrow .meta .d::before,.costv .cvrow .meta .w::before{content:none}
  .costv .cvhdr{display:grid;background:var(--field);padding-top:7px;padding-bottom:7px}
  .costv .cvhdr span,.costv .cvhdr .meta span{font-size:var(--wb-fs-label);font-weight:600;color:var(--t3)}
  .costv .cvhdr .a{text-align:right}
}
.costv .cvbasis{margin-top:var(--sp-3)}
/* 딱지(상태·중복 의심·추천)는 판과 같은 12px — 한 화면 글자 크기 세 가지 */
.costv .tag{font-size:var(--wb-fs-label)}
.costv .fold{margin-top:var(--sp-4)}
.costv .cvurow{display:flex;flex-wrap:wrap;align-items:center;gap:4px var(--sp-2);padding:9px 0;
  border-top:1px solid var(--line);font-size:var(--wb-fs-meta)}
.costv .cvurow .n{font-weight:600;color:var(--t1);text-align:left}
.costv .cvurow .m{color:var(--t3);flex:1 1 220px;min-width:0}
.costv .cvurow .f{display:flex;gap:6px;align-items:center}
.costv .cvurow select{height:var(--tap);padding:0 28px 0 10px;width:auto;font-size:var(--wb-fs-meta)}
/* 문서 상세의 분류 바꾸기 */
.catedit{margin:var(--sp-2) 0 var(--sp-3);padding:var(--sp-3);border-radius:var(--wb-radius);background:var(--field)}
.catedit .catrow{display:flex;align-items:center;gap:var(--sp-2);padding:4px 0}
.catedit .catrow .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--wb-fs-meta)}
.catedit select{width:auto;height:var(--tap);padding:0 28px 0 10px;font-size:var(--wb-fs-meta)}
.catedit .tfmsg{margin:6px 0 0;font-size:var(--wb-fs-meta);color:var(--dg)}
.catedit .tfmsg:empty{display:none}
.catbtn{margin:var(--sp-2) 0 0}
/* 결재 작성 — 품목 줄마다 비용 분류 (2026-09-22) */
.itcat{display:flex;align-items:center;gap:var(--sp-2);margin:4px 0 0}
.itcat span{flex:none;font-size:var(--fs-xs);color:var(--t3)}
.itcat select{flex:1 1 auto;min-width:0;width:auto;max-width:220px;padding-top:7px;padding-bottom:7px}
.dboxbar .ym{font-size:var(--fs-body);color:var(--t1)}
.chks{display:flex;flex-wrap:wrap;gap:6px}
.chks label{display:inline-flex;align-items:center;gap:6px;min-height:var(--tap);border:1px solid var(--fieldline);border-radius:99px;
  padding:0 16px;cursor:pointer;font-size:var(--fs-sm);font-weight:600;color:var(--t2);background:var(--card)}
.chks input{display:none}
.chks label.on{background:var(--pri);color:var(--on-pri);border-color:var(--pri)}

/* 진행률 슬라이더 */
.prog{border:1px solid var(--line);border-radius:var(--r2);padding:14px 15px;background:var(--field)}
.prog .top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:9px}
.prog .val{font-size:var(--fs-num-lg);font-weight:700;font-family:var(--font-title);line-height:1}
.prog .st{font-size:var(--fs-sm);padding:3px 9px;border-radius:99px;background:var(--panel2);color:var(--t2)}
.prog .st.run{background:var(--soft);color:var(--pri)}
.prog .st.done{background:var(--panel2);color:var(--ok)}
.prog input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:var(--tap);
  background:transparent;margin:0;display:block}
.prog input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:99px;background:var(--panel2)}
.prog input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;
  width:28px;height:28px;border-radius:99px;background:var(--pri);border:3px solid var(--bg);
  margin-top:-9px;box-shadow:0 0 0 1px var(--line2);cursor:pointer}
.prog input[type=range]::-moz-range-track{height:8px;border-radius:99px;background:var(--panel2)}
.prog input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:99px;
  background:var(--pri);border:3px solid var(--bg);cursor:pointer}
.prog .ticks{display:flex;justify-content:space-between;margin-top:4px;font-size:var(--fs-xs);color:var(--t3)}
.prog .quick{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}
.prog .quick button{display:inline-flex;align-items:center;min-height:var(--tap);border:1px solid var(--line2);background:var(--card);border-radius:99px;
  padding:0 14px;font-size:var(--fs-sm);cursor:pointer;color:var(--t2)}
.prog .quick button:hover{background:var(--panel2)}

/* 정산 */
.settle{border:1px solid var(--line);border-radius:var(--r2);padding:14px 15px;
  background:var(--field);margin-bottom:16px}
.settle .top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.settle .big{font-size:var(--fs-num-md);font-weight:700;font-family:var(--font-title)}
.settle .grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;
  padding-top:10px;border-top:1px solid var(--line)}
.settle .grid p{margin:0;font-size:var(--fs-body)}
.settle .grid .k{color:var(--t3);font-size:var(--fs-sm)}
.settle .paybar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;margin:9px 0 4px}
.settle .paybar i{display:block;height:100%;background:var(--ok)}
.slrow{display:flex;justify-content:space-between;align-items:center;gap:8px;
  padding:7px 0;border-bottom:1px solid var(--line);font-size:var(--fs-body)}
.slrow:last-of-type{border-bottom:none}
.slrow .icodel{display:inline-flex;align-items:center;justify-content:center;min-width:var(--tap);min-height:var(--tap);
  border:none;background:transparent;color:var(--t3);cursor:pointer;border-radius:var(--r-md)}
.slrow .icodel:hover{background:var(--dg-bg);color:var(--dg)}
.slrow .tagk{font-size:var(--fs-sm);padding:2px 7px;border-radius:var(--r);background:var(--panel2);color:var(--t2)}
.slrow .tagk.add{background:var(--wn-bg);color:var(--wn)}
/* 입금 태그. 예전에는 첫 줄이 --bg-danger 라는 **어디에도 없는 변수**를 부르고 있었고
   (이름을 바꾸면서 남은 줄입니다), 그것을 가리려고 아래 두 줄에 색을 직접 적어
   두었습니다. 이제 토큰 하나로 두 테마가 같이 따라옵니다. */
.slrow .tagk.pay{background:var(--ok-bg);color:var(--ok)}

/* 타임라인 */
.tl{border-left:2px solid var(--line);padding-left:12px;margin-left:4px}
.tl .ev{margin-bottom:14px;position:relative}
.tl .ev::before{content:"";position:absolute;left:-17px;top:5px;width:7px;height:7px;
  border-radius:99px;background:var(--line2)}
.tl .d{font-size:var(--fs-sm);color:var(--t3);margin-bottom:2px}
.kv{display:grid;grid-template-columns:76px 1fr;gap:7px 12px;font-size:var(--fs-h2);
  color:var(--t1)}
.kv .k{color:var(--t3);font-size:var(--fs-sm)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));z-index:80;
  max-width:min(560px,calc(100vw - 32px));background:var(--t1);color:var(--bg);padding:12px 18px;border-radius:14px;
  font-size:var(--fs-body);box-shadow:0 8px 24px rgba(20,32,26,.25)}
@media (min-width:720px){ .toast{bottom:32px} }
.center{text-align:center;padding:40px 10px;color:var(--t3)}
.rowline{display:flex;justify-content:space-between;align-items:center;
  padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.rowline:last-child{border-bottom:none}

/* =====================================================================
   되풀이되는 덩어리 — 새 화면은 이 클래스만 쓴다 (v45)
   화면 코드에 style="font-size:..." 를 적지 마세요. 여기 없으면 여기에 만드세요.
   ===================================================================== */

/* ── 목록 한 줄: 제목 + 누가·언제 + 오른쪽 값 ── */
.lrow{display:flex;align-items:flex-start;gap:var(--sp-3);
  padding:var(--sp-3) var(--sp-2);border-bottom:1px solid var(--line);cursor:pointer;border-radius:var(--r-sm)}
.lrow:last-child{border-bottom:none}
.lrow:hover{background:var(--soft)}
.lrow.plain{cursor:default}
.lrow.plain:hover{background:transparent}
/* ★★ 목록 줄은 **언제나 두 줄 높이**입니다 (2026-09-09 대표님 지시).
   '누가 언제' 가 없는 줄만 한 줄이 되어 같은 목록 안에서 줄 높이가 들쭉날쭉했습니다
   (완료 목록·미수금·검색·달력·월간). 빈 값을 적지는 않되 자리는 지킵니다. */
.lrow > .m{flex:1;min-width:0;min-height:calc(var(--fs-body)*1.55 + var(--fs-sm)*1.55 + 2px)}
.lrow .t{margin:0;font-size:var(--fs-body);font-weight:600;color:var(--t1);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .b{margin:2px 0 0;font-size:var(--fs-sm);color:var(--t3);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ★★ 목록 줄 안의 '누가 언제' 는 위로 끌어올리지 않습니다 (v52).
   `.byline` 은 기본으로 `margin-top:-8px` 을 갖고 있습니다. 제목(h3·h4)처럼
   아래 여백이 있는 것 바로 밑에 놓으려고 만든 값인데, 목록 줄에서는 바로 위가
   여백 0 인 `.t` 라 **제목 글자 위로 8px 올라타 겹쳤습니다.**
   달력에서 날짜를 누르면 나오는 휴가·일정 줄이 전부 그랬습니다.
   같은 자리에 쓰는 `.b` 와 똑같이 맞춥니다. */
.lrow .byline{margin:2px 0 0}
.lrow > .r{text-align:right;white-space:nowrap;flex:none}
.lrow .v{font-size:var(--fs-body);font-weight:600;color:var(--t1);
  font-family:var(--font-title)}
.lrow .s{display:block;margin-top:3px}

/* ── 카드: 한 건을 통째로 묶어 보여줄 때 (결재 문서·최근 기록 등) ── */
.ucard{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);
  padding:var(--sp-3) var(--sp-4);margin-bottom:var(--sp-2);
  display:flex;align-items:flex-start;gap:var(--sp-3);cursor:pointer;
  /* transform 도 같이 — 누를 때 .ucard:active 가 부드럽게 눌린다.
     ★ transition 은 '마지막에 적은 것' 하나만 살아남습니다.
       여기 말고 다른 곳에 .ucard{transition:...} 을 또 적으면
       둘 중 하나가 조용히 죽습니다. 반드시 이 줄을 고치세요. */
  transition:border-color .12s ease, transform .12s ease}
.ucard:hover{border-color:var(--fieldline);background:var(--wb-hover)}
.ucard.plain{cursor:default}
.ucard.plain:hover{border-color:var(--line)}
.ucard.hot{border-left:3px solid var(--dg);border-color:var(--dg-line)}
.ucard > .m{flex:1;min-width:0;min-height:calc(var(--fs-h2)*1.55 + var(--fs-sm)*1.55 + 3px)}
.ucard .t{margin:0;font-size:var(--fs-h2);font-weight:600;color:var(--t1);
  font-family:var(--font-title);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ucard .b{margin:3px 0 0;font-size:var(--fs-sm);color:var(--t3)}
.ucard .x{margin:var(--sp-2) 0 0;font-size:var(--fs-body);color:var(--t2);line-height:1.55;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ucard > .r{text-align:right;white-space:nowrap;flex:none}
.ucard .v{display:block;font-size:var(--fs-h2);font-weight:700;color:var(--t1);
  font-family:var(--font-title)}
.ucard .s{display:block;margin-top:var(--sp-1)}

/* ── 구역 제목 + 개수 ── */
.sec{display:flex;align-items:baseline;gap:var(--sp-2);margin:var(--sp-5) 0 var(--sp-2)}
.sec:first-child{margin-top:0}
.sec h4,.sech{margin:0;font-size:var(--fs-h2);font-weight:700;color:var(--t1)}
.sech{margin:var(--sp-5) 0 var(--sp-2)}
.sech.hot{color:var(--dg)}
.sec .n{font-size:var(--fs-sm);color:var(--t3);font-family:var(--font-title)}

/* ── 비어 있음 ── */
.none{margin:0;padding:var(--sp-2) var(--sp-1);font-size:var(--fs-sm);color:var(--t3)}

/* 고른 사진 미리보기 (2026-08-31) — 결재·기록·공지 세 곳이 같은 것을 쓴다 */
.thumbs{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin-top:var(--sp-2)}
.thumbs:empty{display:none}
.thumb{position:relative;width:72px;height:72px;flex:none}
.thumb.pdf{display:flex;align-items:center;justify-content:center;padding:6px;
  border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--field);
  font-size:var(--fs-xs);color:var(--t2);text-align:center;line-height:1.25;overflow:hidden}
.thumb.pdf span{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;word-break:break-all}
.filechip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:8px 12px;
  border:1px solid var(--line2);border-radius:var(--r-sm);background:var(--field);
  color:var(--t1);font-size:var(--fs-sm);text-decoration:none}
.filechip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:var(--r-sm);
  border:1px solid var(--line2);background:var(--field);display:block}
/* 빼기 단추 — 손가락으로 눌러야 하므로 보이는 것보다 누를 곳을 넓게 잡는다 */
.thumb .tx{position:absolute;top:-9px;right:-9px;width:32px;height:32px;
  border-radius:50%;border:1px solid var(--line2);background:var(--card);
  color:var(--t2);font-size:15px;line-height:1;cursor:pointer;padding:0;
  display:flex;align-items:center;justify-content:center}
.thumb .tx:hover{color:var(--dg);border-color:var(--dg-line)}
.thumb .tx:focus-visible{outline:2px solid var(--t2);outline-offset:2px}
/* 올라간 사진 보여주기 (글·기록 안) */
.shots{display:flex;flex-wrap:wrap;gap:var(--sp-2);margin:var(--sp-2) 0}
.shots img{width:104px;height:104px;object-fit:cover;border-radius:var(--r-sm);
  border:1px solid var(--line2);background:var(--field);cursor:zoom-in;display:block}
.none.big{padding:var(--sp-6) var(--sp-1);text-align:center}

/* 의미를 가진 색은 둘뿐 — 빨강(지금 손댈 것) · 노랑(곧 문제) */
.dgv{color:var(--dg)}
/* ★ `.lrow .t{color:var(--t1)}` 이 더 세서, 줄 제목에 색을 넣으려면 여기까지 적어야 한다.
   (2026-09-01: 자가진단 빨간 항목이 흰 글자로 나왔다. 색판에서도 같은 실수를 했다) */
.lrow .t.dgv,.ucard .t.dgv{color:var(--dg)}
.lrow .t.wnv,.ucard .t.wnv{color:var(--wn)}
.wnv{color:var(--wn)}
.secw{margin:0 0 var(--sp-1);font-size:var(--fs-body);font-weight:600;color:var(--wn)}

/* ── 한 칸짜리 화면(결재·내 업무·설정) 의 폭 ──
   글이 가운데 좁게 몰리지 않게 넓게 두되, 한 줄이 너무 길어지지도 않게 한다 */
.page{max-width:1080px}
</style>

/** 링크 주소로 받아들일 것만 통과시킨다 (javascript: 같은 것을 막는다) */
function mkSafeUrl(u){
  var s=String(u||'').trim();
  if(!/^(https?:\/\/|mailto:|tel:)/i.test(s)) return '';
  if(/[\s"'<>]/.test(s)) return '';
  return s;
}

/* ---------------------------------------------------------------------------
   보여주기 — 표시글을 서식으로
--------------------------------------------------------------------------- */

/** `{` 에 맞는 `}` 를 찾는다 (안에 또 `{}` 가 있어도 센다) */
function mkMatch(s, from){
  var depth=0;
  for(var i=from;i<s.length;i++){
    var c=s.charAt(i);
    if(c==='{') depth++;
    else if(c==='}'){ if(!depth) return i; depth--; }
  }
  return -1;
}

/** 여는 표시와 짝이 되는 닫는 표시를 찾는다. `http://` 의 `//` 는 건너뛴다 */
function mkFindMark(s, mark, from){
  var i=from;
  while(i>=0 && i<s.length){
    var at=s.indexOf(mark, i);
    if(at<0) return -1;
    if(mark==='//' && at>0 && s.charAt(at-1)===':'){ i=at+2; continue; }
    return at;
  }
  return -1;
}

var MK_PAIRS=[['~~','s'],['//','i'],['*','b'],['_','u']];

/**
 * 글자 안 서식을 훑어 HTML 로 바꾼다.
 * ★ 서식을 겹쳐 쓸 수 있으므로 정규식이 아니라 한 글자씩 훑습니다.
 *   ({c:빨강|*굵은 빨강*} 처럼 겹칩니다)
 */
/* ── 전화번호 · @이름 (2026-09-02) ────────────────────────────
   ★ **저장 글자는 하나도 안 바뀝니다.** 보여줄 때만 링크·강조로 그립니다.
     그래서 왕복(저장→화면→저장)에 아무 영향이 없습니다.
     mkValue 는 이 상자들을 그냥 글자로 되돌립니다. */

/* 화면이 아는 직원 이름 — applyBoard 가 채웁니다.
   비어 있으면 @이름 을 그냥 글자로 둡니다 (모르는 이름은 강조하지 않는다). */
var MK_NAMES = [];
var MK_AT_RE = null;

/** 명부가 바뀔 때마다 한 번 (board 를 받을 때) */
function mkSetNames(list){
  MK_NAMES = ((list||[]).map(function(s){ return String(s.name||'').trim(); })
              .filter(function(x){ return !!x; }))
             .sort(function(a,b){ return b.length-a.length; });
  MK_AT_RE = MK_NAMES.length
    ? new RegExp('@(' + MK_NAMES.map(function(n){
        return n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      }).join('|') + ')', 'g')
    : null;
}

/** 전화번호를 눌러서 걸 수 있게 (폰에서만 뜻이 있습니다) */
function mkTel(s){
  return String(s).replace(
    /(^|[^0-9\-])(0\d{1,2}-\d{3,4}-\d{4}|01[0-9]\d{7,8})(?![0-9\-])/g,
    function(all, 앞, 번호){
      return 앞+'<a class="mk-tel" href="tel:'+번호.replace(/-/g,'')+'">'+번호+'</a>';
    });
}

/**
 * `@이름` 을 표시로 (명부에 있는 이름만).
 *
 * ★★ **한 번의 `replace` 로 끝냅니다** (2026-09-02).
 *   이름마다 따로 바꾸면 `@남궁민수` 를 바꿔 넣은 글자 안에서
 *   `@남궁민` 이 또 잡혀 상자가 상자 안에 겹칩니다.
 *   목록이 긴 이름부터라, 한 벌짜리 규칙은 언제나 긴 쪽을 먼저 잡습니다.
 */
function mkAt(s){
  if(!MK_AT_RE) return String(s);
  return String(s).replace(MK_AT_RE, function(all){
    return '<span class="mk-at">'+all+'</span>';
  });
}
/**
 * 업무·결재·공지·현장 번호를 눌러서 그리로 (2026-09-02).
 *
 * ★ 전화번호·`@이름` 과 같습니다 — **시트에는 글자 그대로** 들어가고
 *   보여줄 때만 링크가 붙습니다. 왕복해도 한 글자도 안 바뀝니다.
 * ★ `mkTel` 다음에 돕니다. 앞자리가 `0` 이 아니라 전화로는 안 잡힙니다.
 */
var MK_ID_RE = /(^|[^0-9A-Za-z가-힣])(#?)((?:W|EXP|PUR|ADD|SEAL|LEAVE|NT|PS|UO)-[0-9]{6}-[0-9]{3})(?![0-9A-Za-z-])/g;

function mkId(s){
  return String(s).replace(MK_ID_RE, function(all, 앞, 샵, 번호){
    /* ★ 사람이 친 `#` 는 링크 글자 안에 그대로 둡니다.
       빼 버리면 저장했다 다시 열 때마다 `#` 가 하나씩 사라집니다. */
    return 앞+'<a class="mk-id" href="javascript:void 0" onclick="gotoId(&quot;'+번호+'&quot;)">'+
           샵+번호+'</a>';
  });
}

function mkPlain(s){ return mkAt(mkId(mkTel(s))); }

/** 번호 앞글자로 갈 곳을 정한다 (알림에서 쓰는 규칙과 같다) */
function gotoId(id){
  id = String(id||'').trim();
  if(!id) return;
  closeOk();
  if(/^W-/.test(id)){ openTask(id); return; }
  if(/^(NT|PS)-/.test(id)){ openPost(id); return; }
  if(/^UO-/.test(id)){ searchSite(id); return; }   // 견적번호
  openDoc(id);
}

function mkInline(s){
  var out='', i=0;
  var buf='';                       /* 글자만 모았다가 한꺼번에 다듬는다 */
  function flush(){ if(buf){ out+=mkPlain(buf); buf=''; } }

  while(i<s.length){
    var ch=s.charAt(i);

    /* {br} — 표 칸 안의 줄바꿈 (2026-09-02).
       표는 한 줄에 한 행을 적는 모양이라 칸 안에 진짜 줄바꿈을 넣을 수 없습니다.
       그래서 표시를 하나 둡니다. 표 밖에서는 진짜 줄바꿈을 그대로 쓰면 됩니다. */
    if(ch==='{' && s.substr(i,4)==='{br}'){ flush(); out+='<br>'; i+=4; continue; }

    /* {c:빨강|글자} · {h:노랑|글자} · {s:크게|글자} · {a:주소|글자} */
    if(ch==='{'){
      var m=/^\{([chsa]):([^|{}]{1,200})\|/.exec(s.slice(i));
      if(m){
        var st=i+m[0].length;
        var end=mkMatch(s, st);
        if(end>=0){
          var inner=mkInline(s.slice(st,end));
          var made=mkWrapHtml(m[1], m[2], inner);
          if(made!==null){ flush(); out+=made; i=end+1; continue; }
        }
      }
    }

    /* ~~취소선~~  //기울임//  *굵게*  _밑줄_ */
    var hit=null;
    for(var k=0;k<MK_PAIRS.length;k++){
      var mark=MK_PAIRS[k][0];
      if(s.substr(i,mark.length)!==mark) continue;
      if(mark==='//' && i>0 && s.charAt(i-1)===':') continue;   // http:// 는 기울임이 아니다
      var e=mkFindMark(s, mark, i+mark.length);
      if(e>i+mark.length){ hit=[MK_PAIRS[k][1], i+mark.length, e, mark.length]; break; }
    }
    if(hit){
      flush();
      out+='<'+hit[0]+'>'+mkInline(s.slice(hit[1],hit[2]))+'</'+hit[0]+'>';
      i=hit[2]+hit[3];
      continue;
    }

    buf+=ch; i++;
  }
  flush();
  return out;
}

/** {종류:이름|글자} 를 실제 태그로. 모르는 이름이면 null (그냥 글자로 남긴다) */
function mkWrapHtml(kind, name, inner){
  if(kind==='c'){
    var ck=mkKeyOf(MK_COLORS,name);
    return ck ? '<span class="mk-c-'+ck+'">'+inner+'</span>' : null;
  }
  if(kind==='h'){
    var hk=mkKeyOf(MK_MARKS,name);
    return hk ? '<span class="mk-h-'+hk+'">'+inner+'</span>' : null;
  }
  if(kind==='s'){
    var sk=mkKeyOf(MK_SIZES,name);
    return sk ? '<span class="mk-s-'+sk+'">'+inner+'</span>' : null;
  }
  if(kind==='a'){
    /* esc() 를 이미 지났으므로 &amp; 를 주소로 되돌린다 */
    var url=mkSafeUrl(String(name).replace(/&amp;/g,'&'));
    if(!url) return null;
    return '<a class="mk-a" href="'+url.replace(/&/g,'&amp;')+'" target="_blank" rel="noopener">'+inner+'</a>';
  }
  return null;
}

/** 표 한 덩어리를 그린다. rows 는 줄 글자 배열 */
function mkTable(rows, align){
  var h='<div class="mk-tbwrap"><table class="mk-tb">';
  rows.forEach(function(cells, r){
    h+='<tr>';
    cells.forEach(function(c, i){
      var a=align[i] ? ' class="al-'+align[i]+'"' : '';
      h+= r===0 ? ('<th'+a+'>'+mkInline(c)+'</th>') : ('<td'+a+'>'+mkInline(c)+'</td>');
    });
    h+='</tr>';
  });
  return h+'</table></div>';
}

/** `| a | b |` 한 줄을 칸 배열로.
 *
 *  ★★ 중괄호 안의 `|` 로는 자르지 않습니다 (2026-09-02).
 *
 *    표는 `|` 로 칸을 나누는데 **서식 표시도 `|` 를 씁니다** — `{s:작게|폐기물}`.
 *    그냥 split('|') 하면 그 자리에서 칸이 하나 더 생겨 표가 어긋납니다.
 *    그래서 표 칸 안에서는 색·형광펜·글자크기·링크가 전부 깨졌습니다.
 *    (2026-09-02 조소희 님이 '글자크기 작게 서식적용시 텍스트 오류' 로 알려주셨습니다)
 */
function mkCells(line){
  var t=line.trim().replace(/^\|/,'').replace(/\|$/,'');
  var out=[], cur='', depth=0;
  for(var i=0;i<t.length;i++){
    var ch=t.charAt(i);
    if(ch==='{'){ depth++; cur+=ch; continue; }
    if(ch==='}'){ if(depth>0) depth--; cur+=ch; continue; }
    if(ch==='|' && depth===0){ out.push(cur.trim()); cur=''; continue; }
    cur+=ch;
  }
  out.push(cur.trim());
  return out;
}

/** `|---|:-:|--:|` 인가 — 맞으면 칸별 정렬 배열, 아니면 null */
function mkAlignRow(line){
  if(!/^\s*\|/.test(line)) return null;
  var cells=mkCells(line);
  if(!cells.length) return null;
  var out=[];
  for(var i=0;i<cells.length;i++){
    var c=cells[i];
    if(!/^:?-{1,}:?$/.test(c)) return null;
    out.push(c.charAt(0)===':' && c.charAt(c.length-1)===':' ? 'c'
           : (c.charAt(c.length-1)===':' ? 'r' : ''));
  }
  return out;
}

function fmt(s){
  var lines=esc(s).split(/\r?\n/);
  var html='', para=[], list=[], listTag='';

  function flushList(){
    if(!list.length) return;
    if(listTag==='ck'){
      /* ☐ / ☑ 는 CSS 의 ::before 로 그린다.
         글자로 넣으면 사람이 지우거나 복사해 갈 수 있다. */
      html+='<ul class="mk mk-ck">'+list.map(function(x){
        return '<li'+(x.on?' class="on"':'')+'>'+mkInline(x.t)+'</li>';
      }).join('')+'</ul>';
    }else{
      html+='<'+listTag+' class="mk">'+
        list.map(function(x){ return '<li>'+mkInline(x)+'</li>'; }).join('')+'</'+listTag+'>';
    }
    list=[]; listTag='';
  }
  function flushPara(){
    if(!para.length) return;
    html+='<p class="mk">'+para.map(mkInline).join('<br>')+'</p>';
    para=[];
  }
  function push(tag, item){
    if(listTag && listTag!==tag) flushList();
    flushPara();
    listTag=tag; list.push(item);
  }
  function block(h){ flushList(); flushPara(); html+=h; }

  for(var i=0;i<lines.length;i++){
    var t=lines[i].replace(/\s+$/,'');

    /* 표 — 지금 줄이 | 로 시작하고 다음 줄이 |---| 이면 표로 본다 */
    if(/^\s*\|/.test(t)){
      var align=(i+1<lines.length) ? mkAlignRow(lines[i+1]) : null;
      if(align){
        var rows=[mkCells(t)];
        var j=i+2;
        while(j<lines.length && /^\s*\|/.test(lines[j]) && !mkAlignRow(lines[j])){
          rows.push(mkCells(lines[j])); j++;
        }
        block(mkTable(rows, align));
        i=j-1;
        continue;
      }
    }

    /* 주의 상자 · 참고 상자 (2026-09-02)
       안전 공지에서 '꼭 봐야 하는 것' 을 표시할 방법이 없었습니다.
       ★ 빨강은 '지금 손대야 함' 하나뿐이라, 참고는 무채색으로 둡니다. */
    if(/^:!\s?/.test(t)){ block('<div class="mk-cal warn">'+mkInline(t.replace(/^:!\s?/,''))+'</div>'); continue; }
    if(/^:i\s?/.test(t)){ block('<div class="mk-cal info">'+mkInline(t.replace(/^:i\s?/,''))+'</div>'); continue; }

    if(/^\s*---+\s*$/.test(t)){ block('<hr class="mk-hr">'); continue; }
    if(/^##\s+/.test(t)){ block('<h4 class="mk-h2">'+mkInline(t.replace(/^##\s+/,''))+'</h4>'); continue; }
    if(/^#\s+/.test(t)){  block('<h3 class="mk-h1">'+mkInline(t.replace(/^#\s+/,''))+'</h3>'); continue; }
    if(/^&gt;\s?/.test(t)){ block('<blockquote class="mk-q">'+mkInline(t.replace(/^&gt;\s?/,''))+'</blockquote>'); continue; }
    if(/^:c:\s?/.test(t)){ block('<p class="mk mk-al-c">'+mkInline(t.replace(/^:c:\s?/,''))+'</p>'); continue; }
    if(/^:r:\s?/.test(t)){ block('<p class="mk mk-al-r">'+mkInline(t.replace(/^:r:\s?/,''))+'</p>'); continue; }

    var ck=/^\s*\[([ xX])\]\s+/.exec(t);
    if(ck){ push('ck', { on: ck[1]!==' ', t: t.replace(/^\s*\[[ xX]\]\s+/,'') }); continue; }

    if(/^\s*-\s+/.test(t)){ push('ul', t.replace(/^\s*-\s+/,'')); continue; }
    if(/^\s*\d{1,3}\.\s+/.test(t)){ push('ol', t.replace(/^\s*\d{1,3}\.\s+/,'')); continue; }

    flushList();
    if(!t.trim()){ flushPara(); continue; }
    para.push(t);
  }
  flushList(); flushPara();
  return html;
}

      ['중제목', "mkBlock('"+id+"','h4')"],
      ['본문',   "mkBlock('"+id+"','p')"],
      ['인용',   "mkBlock('"+id+"','blockquote')"],
      /* 안전 공지에서 '꼭 봐야 하는 것' 을 표시하는 자리 (2026-09-02) */
      ['⚠ 주의', "mkCallout('"+id+"','warn')"],
      ['참고',   "mkCallout('"+id+"','info')"]
    ])+
    mkGrp('목록', [
      ['☑ 할 일 목록', "mkCheck('"+id+"')"]
    ])+
    mkGrp('넣기', [
      ['표',     "mkTablePanel('"+id+"')"],
      ['링크',   "mkLink('"+id+"')"],
      ['구분선', "mkHr('"+id+"')"]
    ])+
    mkGrp('정렬', [
      ['왼쪽',   "mkAlign('"+id+"','Left')"],
      ['가운데', "mkAlign('"+id+"','Center')"],
      ['오른쪽', "mkAlign('"+id+"','Right')"]
    ])+
    mkGrp('되돌리기', [
      ['서식 지우기', "mkClearAll('"+id+"')"]
    ])+
  '</div>';

  /* 색판 · 표판 — 평소에는 숨어 있다 */
  h+='<div class="mkpal" id="'+id+'Pal" hidden></div>';
  return h;
}

/** 아이콘 버튼 하나 */
function mkIcon(id, cmd){
  for(var i=0;i<MK_BTNS.length;i++){
    if(MK_BTNS[i][0]!==cmd) continue;
    var b=MK_BTNS[i];
    return '<button type="button" data-cmd="'+b[0]+'" title="'+b[1]+'" '+
      'onmousedown="event.preventDefault()" '+
      'onclick="mkCmd(&#39;'+id+'&#39;,&#39;'+b[0]+'&#39;)">'+
      '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">'+b[2]+'</svg></button>';
  }
  return '';
}

/** 이름 붙은 버튼 묶음 한 줄 — [묶음이름] [버튼][버튼]… */
function mkGrp(label, items){
  return '<div class="mkgrp"><span class="mkgl">'+esc(label)+'</span><div class="mkgb">'+
    items.map(function(o){ return mkTx(o[0], o[1]); }).join('')+
    '</div></div>';
}

/** 글자 버튼 하나 */
function mkTx(label, fn){
  return '<button type="button" onmousedown="event.preventDefault()" onclick="'+
    esc(fn).replace(/"/g,'&quot;')+'">'+esc(label)+'</button>';
}

/** [＋ 더보기] — 나머지 서식을 펼치거나 접는다 */
function mkMore(id){
  var box=$(id+'Bar2'); if(!box) return;
  box.hidden=!box.hidden;
  var btn=document.querySelector('.mkbar[data-for="'+id+'"] .mkmore');
  if(btn){
    btn.innerHTML = box.hidden ? ic('plus')+'더보기' : ic('x')+'접기';
    btn.classList.toggle('on', !box.hidden);
  }
  mkShut(id);
}

/** 열려 있는 색판·표판을 닫는다 */
function mkShut(id){
  var p=$(id+'Pal'); if(p){ p.hidden=true; p.innerHTML=''; }
}

/* ---------- 기본 서식 ---------- */

function mkCmd(id, cmd){
  var el=$(id); if(!el) return;
  el.focus();
  /* 브라우저가 이 설정을 모르면 그냥 넘어가면 된다. 서식은 아래 줄이 건다 */
  try{ document.execCommand('styleWithCSS', false, false); }catch(e){}
  /* 실패하면 글자가 안 굵어지는 것뿐이라 사람이 바로 눈으로 안다. 알릴 것 없음 */
  try{ document.execCommand(cmd, false, null); }catch(e){}

  /* ★ [글머리 목록] 이 '할 일 목록 끄기' 를 겸합니다 (2026-09-02).
     mkCheck 가 켜기만 하도록 바뀌었으니, 끄는 길이 여기 하나 있어야 합니다. */
  if(cmd==='insertUnorderedList'){
    var ul=mkClosest(el, 'UL');
    if(ul) ul.classList.remove('mk-ck');
  }

  mkState(id);
}

/** 큰제목 · 중제목 · 인용 · 보통 */
function mkBlock(id, tag){
  var el=$(id); if(!el) return;
  el.focus();
  try{ document.execCommand('formatBlock', false, '<'+tag+'>'); }catch(e){ quiet('문단 서식', e); }
  mkState(id);
}

function mkAlign(id, how){
  var el=$(id); if(!el) return;
  el.focus();

  /* ★★ 표 안에서는 **칸이 아니라 줄(열) 전체**에 겁니다 (2026-09-02).
     표는 저장할 때 열마다 정렬을 하나씩만 적을 수 있는 모양입니다(`|--:|`).
     칸 하나만 오른쪽으로 밀어 봐야 저장하는 순간 사라집니다.
     그래서 그 칸이 속한 **열 전체**를 함께 옮깁니다 — 눈에 보이는 대로 저장됩니다. */
  var cell = mkClosest(el,'TD') || mkClosest(el,'TH');
  if(cell){
    var tb = cell;
    while(tb && tb.tagName!=='TABLE') tb = tb.parentNode;
    if(tb){
      var 열 = [].slice.call(cell.parentNode.children).indexOf(cell);
      var 반 = (how==='Center') ? 'al-c' : (how==='Right' ? 'al-r' : '');
      [].slice.call(tb.rows).forEach(function(r){
        var c = r.children[열];
        if(!c) return;
        c.classList.remove('al-c'); c.classList.remove('al-r');
        if(반) c.classList.add(반);
        if(c.style) c.style.textAlign='';       // 옛 방식으로 걸린 것도 걷어낸다
      });
      mkState(id);
      return;
    }
  }

  try{ document.execCommand('styleWithCSS', false, true); }catch(e){}
  try{ document.execCommand('justify'+how, false, null); }catch(e){ quiet('정렬', e); }
  try{ document.execCommand('styleWithCSS', false, false); }catch(e){}
  mkState(id);
}

function mkHr(id){
  var el=$(id); if(!el) return;
  el.focus();
  try{ document.execCommand('insertHTML', false, '<hr class="mk-hr"><p><br></p>'); }
  catch(e){ quiet('구분선', e); }
}

/** 링크 — 주소를 물어보고 고른 글자에 건다 */
function mkLink(id){
  var el=$(id); if(!el) return;
  el.focus();
  var sel=window.getSelection();
  if(!sel || !sel.rangeCount || sel.isCollapsed){ toast('링크를 걸 글자를 먼저 고르세요'); return; }
  var u=prompt('링크 주소를 넣으세요 (http:// 로 시작)', 'https://');
  if(u===null) return;
  var url=mkSafeUrl(u);
  if(!url){ toast('http:// 또는 https:// 로 시작하는 주소만 됩니다'); return; }
  try{ document.execCommand('createLink', false, url); }catch(e){ quiet('링크', e); }
  /* 새 창에서 열리게 표시를 남긴다 */
  [].forEach.call(el.querySelectorAll('a'), function(a){
    a.className='mk-a'; a.target='_blank'; a.rel='noopener';
  });
}

/* ---------- 색 · 형광펜 · 크기 (execCommand 에 없는 것) ---------- */

/** 색판을 연다.
    ★ 색 이름(빨강·주황…)을 글자로 적지 않습니다 — **'가' 를 그 색으로 보여줄 뿐**입니다.
      색은 눈으로 고르는 것이라 이름을 읽게 하면 오히려 느립니다.
      대신 title 을 달아 두어 PC 에서 올려두면 이름이 뜹니다. */
function mkPal(id, kind){
  var box=$(id+'Pal'); if(!box) return;
  if(!box.hidden && box.dataset.kind===kind){ mkShut(id); return; }

  var list = (kind==='c') ? MK_COLORS : MK_MARKS;
  var 이름 = (kind==='c') ? '글자색' : '형광펜';

  var h='<div class="mkpanel"><div class="mkptitle">'+이름+
        '</div><div class="mkswrow">';

  list.forEach(function(o){
    h+='<button type="button" class="sw '+(kind==='c'?'sw-c-':'sw-h-')+o[1]+'" '+
       'title="'+o[0]+'" onmousedown="event.preventDefault()" '+
       'onclick="mkPick(&#39;'+id+'&#39;,&#39;'+kind+'&#39;,&#39;'+o[0]+'&#39;)">가</button>';
  });

  h+='<button type="button" class="sw sw-off" title="색 없애기" '+
     'onmousedown="event.preventDefault()" '+
     'onclick="mkPick(&#39;'+id+'&#39;,&#39;'+kind+'&#39;,&#39;&#39;)" aria-label="색 없애기">'+ic('x')+'</button>';

  box.innerHTML=h+'</div></div>';
  box.dataset.kind=kind;
  box.hidden=false;
}

function mkSize(id, name){ mkPick(id, 's', name); }

/**
 * 고른 글자를 감싼다. 이름이 비어 있으면 그 갈래의 서식만 벗긴다.
 * ★ 같은 갈래를 겹쳐 쓰지 않습니다 — 빨강을 파랑으로 바꾸면 빨강이 사라집니다.
 *   (색·형광·크기는 서로 다른 갈래라 셋은 같이 걸립니다)
 */
function mkPick(id, kind, name){
  var el=$(id); if(!el) return;
  mkShut(id);
  el.focus();

  var sel=window.getSelection();
  if(!sel || !sel.rangeCount) return;

  var prefix = kind==='c' ? 'mk-c-' : (kind==='h' ? 'mk-h-' : 'mk-s-');
  var list   = kind==='c' ? MK_COLORS : (kind==='h' ? MK_MARKS : MK_SIZES);
  var key    = name ? mkKeyOf(list, name) : '';
  if(name && !key) return;

  var r=sel.getRangeAt(0);

  /* ★★ 고른 글자가 없으면 '이제부터 이 색으로' 입니다 (2026-09-01).

     예전에는 '바꿀 글자를 먼저 고르세요' 라고만 했습니다.
     그런데 사람은 보통 **색을 먼저 누르고 그 다음에 씁니다** (워드·한글이 그렇습니다).
     빈 상자를 하나 만들어 커서를 그 안에 넣어 두면, 이어서 치는 글자가 그 안에 들어가
     저절로 그 색이 됩니다. 굵게·밑줄은 브라우저가 원래 이렇게 해 줍니다.

     ★ 상자 안의 보이지 않는 글자(폭 0)는 저장할 때 mkValue 가 걷어냅니다. */
  if(r.collapsed){
    if(!key){ toast('색을 뺄 글자를 먼저 고르세요'); return; }
    var box=document.createElement('span');
    box.className=prefix+key;
    box.appendChild(document.createTextNode('\u200B'));
    r.insertNode(box);
    try{
      var cr=document.createRange();
      cr.setStart(box.firstChild, 1);
      cr.collapse(true);
      sel.removeAllRanges(); sel.addRange(cr);
    }catch(e){ quiet('색 이어쓰기', e); }
    mkState(id);
    return;
  }
  var frag=r.extractContents();

  /* ① 고른 것 **안에** 이미 걸려 있던 같은 갈래를 벗긴다 */
  (function strip(node){
    [].slice.call(node.childNodes).forEach(function(n){
      if(n.nodeType!==1) return;
      strip(n);
      if(n.tagName==='SPAN' && String(n.className).indexOf(prefix)===0){
        while(n.firstChild) n.parentNode.insertBefore(n.firstChild, n);
        n.parentNode.removeChild(n);
      }
    });
  })(frag);

  /* ② 잠깐 감쌀 상자에 넣어 자리를 잡는다 */
  var hold=document.createElement('span');
  hold.appendChild(frag);
  r.insertNode(hold);

  /* ③ 고른 것을 **통째로 감싸고 있던** 같은 갈래도 벗긴다.
     ★ 이것이 없으면 낱말 하나를 빨강 → 파랑으로 다시 칠할 때
       {c:빨강|{c:파랑|오늘}} 처럼 색이 겹쳐 쌓입니다.
       (일부만 골랐을 때는 바깥 색이 남은 글자에도 걸려 있으므로 건드리지 않습니다) */
  while(hold.parentNode && hold.parentNode!==el &&
        hold.parentNode.tagName==='SPAN' &&
        String(hold.parentNode.className).indexOf(prefix)===0 &&
        mkAloneIn(hold.parentNode, hold)){
    var outer=hold.parentNode, up=outer.parentNode;
    up.insertBefore(hold, outer);
    up.removeChild(outer);
  }

  /* ④ 상자를 색으로 바꾸거나, 색을 빼는 것이면 상자만 걷어낸다 */
  if(key){
    hold.className=prefix+key;
  }else{
    while(hold.firstChild) hold.parentNode.insertBefore(hold.firstChild, hold);
    hold.parentNode.removeChild(hold);
    hold=null;
  }

  /* 방금 바꾼 곳을 다시 고른 상태로 둔다 (이어서 굵게 등을 걸 수 있게) */
  if(hold){
    try{
      var nr=document.createRange();
      nr.selectNodeContents(hold);
      sel.removeAllRanges(); sel.addRange(nr);
    }catch(e){ quiet('선택 되돌리기', e); }
  }

  mkState(id);
}

/** 이 상자 안에 저것 말고 다른 것이 있는가.
    ★ 글자를 뽑아내면 그 자리에 **길이 0짜리 빈 글자마디**가 남습니다.
      그것까지 '다른 것' 으로 세면 색이 겹쳐 쌓입니다. */
function mkAloneIn(parent, node){
  var others=0;
  [].slice.call(parent.childNodes).forEach(function(n){
    if(n===node) return;
    if(n.nodeType===3 && n.nodeValue==='') return;
    others++;
  });
  return others===0;
}

/** 서식 지우기 — 브라우저 것 + 우리 것(색·형광·크기)까지 */
function mkClearAll(id){
  var el=$(id); if(!el) return;
  el.focus();
  ['c','h','s'].forEach(function(k){ mkPick(id, k, ''); });
  try{ document.execCommand('removeFormat', false, null); }catch(e){}
  mkState(id);
}

/* ---------- 할 일 목록 ---------- */

/** 지금 줄을 할 일 목록으로 (다시 누르면 보통 목록으로) */
/**
 * ☑ 할 일 목록.
 *
 * ★★ **켜기만 합니다. 껐다 켰다 하지 않습니다** (2026-09-02).
 *
 *   예전에는 `classList.toggle` 이었습니다. 그래서
 *     ① 첫 줄에 걸어 할 일 목록을 만들고
 *     ② 둘째 줄에 커서를 두고 한 번 더 누르면
 *   **목록 전체가 그냥 글머리 목록으로 풀려 버렸습니다.**
 *   사람은 '이 줄도 할 일로 만들자' 는 뜻으로 누른 것인데 정반대가 됐습니다.
 *   (2026-09-02 조소희 님이 '다음 줄에도 쓰면 목록서식으로 자동 변경됨' 으로 알려주셨습니다)
 *
 *   ★ 끄는 길은 **[글머리 목록]** 단추입니다 (mkCmd 가 mk-ck 를 걷어냅니다).
 *     한 단추가 켜고 끄기를 겸하면, 무엇이 켜져 있는지 모르는 채로 누르게 됩니다.
 */
function mkCheck(id){
  var el=$(id); if(!el) return;
  el.focus();

  var ul=mkClosest(el, 'UL');
  if(!ul){
    try{ document.execCommand('insertUnorderedList', false, null); }catch(e){ quiet('할일 목록', e); }
    ul=mkClosest(el, 'UL');
  }
  if(ul) ul.classList.add('mk-ck');
  mkState(id);
}

/** 커서가 들어 있는 가장 가까운 태그를 찾는다 (편집칸 밖으로는 안 나간다) */
function mkClosest(el, tag){
  var sel=window.getSelection();
  if(!sel || !sel.rangeCount) return null;
  var n=sel.getRangeAt(0).startContainer;
  while(n && n!==el){
    if(n.nodeType===1 && n.tagName===tag) return n;
    n=n.parentNode;
  }
  return null;
}

/** 할 일 앞의 ☐ 를 눌러 ☑ 로 바꾼다 */
function mkClick(e, id){
  var li=e.target;
  if(!li || li.tagName!=='LI') return;
  var ul=li.parentNode;
  if(!ul || !ul.classList || !ul.classList.contains('mk-ck')) return;
  /* 네모는 CSS 로 그린 것이라 왼쪽 끝을 눌렀는지로 판단한다 */
  var box=li.getBoundingClientRect();
  if(e.clientX - box.left > 24) return;
  li.classList.toggle('on');
  e.preventDefault();
}

/* ---------- 표 ---------- */

/* 새로 넣을 표의 크기. 창을 닫아도 그대로 두어 다음에 또 쓰기 쉽게 한다 */
var MK_TB = { row: 3, col: 3 };
var MK_TB_MAX = { row: 30, col: 8 };

/** 표 판을 연다.

    ★ 예전에는 '몇 칸?' '몇 줄?' 을 물어보는 창이 두 번 떴습니다.
      현장에서 장갑 낀 손으로 숫자를 두 번 치는 것은 어렵습니다.
      이제 － ＋ 로 크기를 맞추고 [넣기] 를 눌러야 들어갑니다. */
function mkTablePanel(id){
  var box=$(id+'Pal');
  if(!box) return;
  if(!box.hidden && box.dataset.kind==='tb'){ mkShut(id); return; }
  box.dataset.kind='tb';
  box.hidden=false;
  mkTbDraw(id);
}

/** 표 판을 다시 그린다 (숫자만 바뀌므로 통째로 다시 그려도 값이 없다) */
function mkTbDraw(id){
  var box=$(id+'Pal');
  if(!box || box.dataset.kind!=='tb') return;

  box.innerHTML=
    '<div class="mkpanel"><div class="mkptitle">표 넣기</div>'+
    mkStep(id,'row','가로줄')+
    mkStep(id,'col','세로칸')+
    '<div class="mkgrp"><span class="mkgl"></span><div class="mkgb">'+
      '<button type="button" class="mkgo" onmousedown="event.preventDefault()" '+
        'onclick="mkTableIns(&#39;'+id+'&#39;)">'+
        MK_TB.row+'줄 × '+MK_TB.col+'칸 으로 넣기</button>'+
    '</div></div>'+
    '</div>'+

    '<div class="mkpanel"><div class="mkptitle">이미 넣은 표 고치기</div>'+
    mkGrp('가로줄', [
      ['늘리기', "mkRow('"+id+"',1)"],
      ['줄이기', "mkRow('"+id+"',-1)"]
    ])+
    mkGrp('세로칸', [
      ['늘리기', "mkCol('"+id+"',1)"],
      ['줄이기', "mkCol('"+id+"',-1)"]
    ])+
    '</div>';
}

/** － 숫자 ＋ 한 줄 */
function mkStep(id, what, label){
  return '<div class="mkgrp"><span class="mkgl">'+esc(label)+'</span><div class="mkgb mkstep">'+
    '<button type="button" onmousedown="event.preventDefault()" '+
      'onclick="mkTbSet(&#39;'+id+'&#39;,&#39;'+what+'&#39;,-1)" aria-label="'+esc(label)+' 줄이기">'+ic('minus')+'</button>'+
    '<b class="mknum">'+MK_TB[what]+'</b>'+
    '<button type="button" onmousedown="event.preventDefault()" '+
      'onclick="mkTbSet(&#39;'+id+'&#39;,&#39;'+what+'&#39;,1)" aria-label="'+esc(label)+' 늘리기">'+ic('plus')+'</button>'+
    '</div></div>';
}

function mkTbSet(id, what, d){
  var n = MK_TB[what] + d;
  if(n < 1) n = 1;
  if(n > MK_TB_MAX[what]) n = MK_TB_MAX[what];
  MK_TB[what] = n;
  mkTbDraw(id);
}

/** 정한 크기로 표를 넣는다. 첫 줄은 머리줄이다 */
function mkTableIns(id){
  var el=$(id); if(!el) return;
  var r=MK_TB.row, c=MK_TB.col;

  var h='<table class="mk-tb"><tr>';
  for(var i=0;i<c;i++) h+='<th>&#8203;</th>';
  h+='</tr>';
  for(var y=1;y<r;y++){
    h+='<tr>';
    for(var x=0;x<c;x++) h+='<td>&#8203;</td>';
    h+='</tr>';
  }
  h+='</table><p><br></p>';

  mkShut(id);
  el.focus();
  try{ document.execCommand('insertHTML', false, h); }catch(e){ quiet('표 넣기', e); }
}

/** 행 추가(1) · 지우기(-1) */
function mkRow(id, dir){
  var el=$(id); if(!el) return;
  var tr=mkClosest(el,'TR');
  if(!tr){ toast('표 안에 커서를 두고 눌러 주세요'); return; }
  var tb=tr.parentNode;

  if(dir<0){
    if(tb.rows ? tb.rows.length<=1 : tb.children.length<=1){ toast('마지막 줄은 지울 수 없습니다'); return; }
    tr.parentNode.removeChild(tr);
    return;
  }
  var nw=document.createElement('tr');
  for(var i=0;i<tr.children.length;i++){
    var td=document.createElement('td');

    nw.appendChild(td);
  }
  tr.parentNode.insertBefore(nw, tr.nextSibling);
}

/** 열 추가(1) · 지우기(-1) */
function mkCol(id, dir){
  var el=$(id); if(!el) return;
  var cell=mkClosest(el,'TD') || mkClosest(el,'TH');
  if(!cell){ toast('표 안에 커서를 두고 눌러 주세요'); return; }
  var tr=cell.parentNode, table=mkClosest(el,'TABLE');
  if(!table) return;
  var at=[].indexOf.call(tr.children, cell);

  [].forEach.call(table.rows, function(row){
    if(dir<0){
      if(row.children.length<=1) return;
      if(row.children[at]) row.removeChild(row.children[at]);
    }else{
      var isHead = row.children[0] && row.children[0].tagName==='TH';
      var c=document.createElement(isHead ? 'th' : 'td');
      c.innerHTML='&#8203;';
      row.insertBefore(c, row.children[at] ? row.children[at].nextSibling : null);
    }
  });
}

/* ---------- 상태 · 키 · 붙여넣기 ---------- */

/** 지금 켜져 있는 서식을 버튼에 눌린 상태로 보여준다 */
function mkState(id){
  var bar=document.querySelector('.mkbar[data-for="'+id+'"]');
  if(!bar) return;
  [].forEach.call(bar.querySelectorAll('button[data-cmd]'),function(b){
    var on=false;
    /* 버튼을 눌린 모양으로 보일지만 정하는 곳. 실패해도 서식은 그대로 걸린다 */
    try{ on=document.queryCommandState(b.dataset.cmd); }catch(e){}
    b.classList.toggle('on', !!on);
  });
}

function mkKey(e, id){
  if(e.ctrlKey||e.metaKey){
    var k=String(e.key||'').toLowerCase();
    if(k==='b'){ e.preventDefault(); mkCmd(id,'bold'); }
    else if(k==='u'){ e.preventDefault(); mkCmd(id,'underline'); }
    else if(k==='i'){ e.preventDefault(); mkCmd(id,'italic'); }
    return;
  }
  mkAuto(e, id);
}

/* ── 치면서 바로 서식 (2026-09-02) ───────────────────────────
 *
 *  줄 맨 앞에 표시를 치고 **빈칸을 누르면** 그 자리에서 서식이 걸립니다.
 *
 *      - 빈칸      글머리 목록          # 빈칸     큰제목
 *      1. 빈칸     번호 목록            ## 빈칸    중제목
 *      [] 빈칸     할 일 목록           > 빈칸     인용
 *      --- 빈칸    구분선               :! 빈칸    주의 상자
 *                                       :i 빈칸    참고 상자
 *
 *  ★ 툴바를 하나도 안 늘리고 쓸 수 있는 서식이 늘어납니다.
 *    워드·노션을 쓰던 사람은 이미 손에 익어 있습니다.
 *  ★ **줄 맨 앞에서만** 걸립니다. 글 가운데의 '- ' 는 그냥 빼기표입니다.
 *  ★ 잘못 걸렸으면 Ctrl+Z 로 되돌아갑니다.
 */
var MK_AUTO = [
  ['---', function(id){ mkHr(id); }],
  ['##',  function(id){ mkBlock(id,'h4'); }],
  ['#',   function(id){ mkBlock(id,'h3'); }],
  ['>',   function(id){ mkBlock(id,'blockquote'); }],
  ['1.',  function(id){ mkCmd(id,'insertOrderedList'); }],
  ['-',   function(id){ mkCmd(id,'insertUnorderedList'); }],
  ['*',   function(id){ mkCmd(id,'insertUnorderedList'); }],
  ['[]',  function(id){ mkCheck(id); }],
  ['[ ]', function(id){ mkCheck(id); }],
  [':!',  function(id){ mkCallout(id,'warn'); }],
  [':i',  function(id){ mkCallout(id,'info'); }]
];

/** 커서가 든 '한 덩어리'(문단·제목·목록칸·표칸) 를 찾는다 */
function mkBlockOf(el){
  var sel=window.getSelection();
  if(!sel || !sel.rangeCount) return null;
  var n=sel.getRangeAt(0).startContainer;
  var 덩어리={P:1,DIV:1,LI:1,H3:1,H4:1,BLOCKQUOTE:1,TD:1,TH:1};
  while(n && n!==el){
    if(n.nodeType===1 && 덩어리[n.tagName]) return n;
    n=n.parentNode;
  }
  return (n===el) ? el : null;
}

function mkAuto(e, id){
  if(e.key!==' ' || e.shiftKey || e.altKey || e.isComposing) return;

  var el=$(id); if(!el) return;
  var sel=window.getSelection();
  if(!sel || !sel.rangeCount) return;
  var r=sel.getRangeAt(0);
  if(!r.collapsed) return;

  var blk=mkBlockOf(el);
  if(!blk) return;

  /* 덩어리 맨 앞부터 커서까지의 글자 — 이게 표시와 딱 맞아야 한다 */
  var 앞;
  try{
    var rr=document.createRange();
    rr.setStart(blk, 0);
    rr.setEnd(r.startContainer, r.startOffset);
    앞=rr.toString();
  }catch(err){ return; }

  for(var i=0;i<MK_AUTO.length;i++){
    if(앞 !== MK_AUTO[i][0]) continue;
    e.preventDefault();
    /* ★★ `rr.deleteContents()` 로 지우면 안 됩니다 (2026-09-02).
       문단이 완전히 비어 버려서 그다음 `execCommand` 가 **아무 일도 안 합니다.**
       `- ` 를 쳐도 목록이 안 생기고 글자만 사라졌습니다.
       브라우저의 지우기(`delete`)를 쓰면 `<br>` 을 남기고 커서도 살려 둡니다. */
    try{
      var s2=window.getSelection();
      s2.removeAllRanges(); s2.addRange(rr);
      el.focus();
      document.execCommand('delete', false, null);
    }catch(err){ quiet('자동 서식', err); return; }
    MK_AUTO[i][1](id);
    mkState(id);
    return;
  }
}

/**
 * 주의 상자 · 참고 상자.
 * ★ 같은 것을 다시 누르면 풀립니다. 다른 것을 누르면 종류만 바뀝니다.
 */
function mkCallout(id, kind){
  var el=$(id); if(!el) return;
  el.focus();

  var blk=mkBlockOf(el);
  if(!blk || blk===el) return;

  if(blk.classList && blk.classList.contains('mk-cal')){
    if(blk.classList.contains(kind)){
      /* 같은 것 → 보통 문단으로 되돌린다 */
      var p=document.createElement('p');
      p.className='mk';
      while(blk.firstChild) p.appendChild(blk.firstChild);
      blk.parentNode.replaceChild(p, blk);
    }else{
      blk.classList.remove('warn'); blk.classList.remove('info');
      blk.classList.add(kind);
    }
    mkState(id);
    return;
  }

  var box=document.createElement('div');
  box.className='mk-cal '+kind;
  while(blk.firstChild) box.appendChild(blk.firstChild);
  if(!box.firstChild) box.appendChild(document.createElement('br'));
  blk.parentNode.replaceChild(box, blk);

  /* 커서를 상자 안으로 */
  try{
    var cr=document.createRange();
    cr.selectNodeContents(box); cr.collapse(false);
    var s2=window.getSelection(); s2.removeAllRanges(); s2.addRange(cr);
  }catch(err){ quiet('주의 상자', err); }

  mkState(id);
}

/* ── @이름 부르기 (2026-09-02) ────────────────────────────────
 *
 *  `@` 를 치면 직원 목록이 뜨고, 고르면 `@김형석` 이 박힙니다.
 *  글이 올라가면 **그 사람에게 알림이 갑니다** (서버가 이름을 보고 찾습니다).
 *
 *  ★★ 저장은 그냥 **`@김형석` 글자 그대로**입니다.
 *    번호를 숨겨 담는 방법도 있었지만 그러면
 *      · 댓글칸(글상자)에서 사람이 `{m:010...|김형석}` 을 눈으로 보게 되고
 *      · 시트를 열어 봐도 못 읽습니다
 *    여섯 명 회사에 동명이인이 없으므로 이름으로 충분합니다.
 *
 *  ★ 서식칸(contenteditable)과 댓글칸(글상자) **둘 다**에서 됩니다.
 *    댓글에는 서식 도구를 두지 않기로 했으므로, 이것만 따로 붙습니다.
 */
var AT = { box:null, el:null, at:0 };

function atClose(){
  if(AT.box && AT.box.parentNode) AT.box.parentNode.removeChild(AT.box);
  AT.box=null; AT.el=null;
}

/** 글상자·서식칸 어디서든 `@` 뒤에 목록을 띄운다 */
function atKey(e, el){
  if(e.key==='Escape'){ atClose(); return; }
  setTimeout(function(){ atCheck(el); }, 0);
}

function atCheck(el){
  var 명단=(S.data && S.data.staff) || [];
  if(!명단.length){ atClose(); return; }

  var 글='', 커서=0;
  if(el.tagName==='TEXTAREA' || el.tagName==='INPUT'){
    글=el.value; 커서=el.selectionStart;
  }else{
    var sel=window.getSelection();
    if(!sel || !sel.rangeCount){ atClose(); return; }
    var r=sel.getRangeAt(0);
    if(r.startContainer.nodeType!==3){ atClose(); return; }
    글=r.startContainer.nodeValue||''; 커서=r.startOffset;
  }

  /* 커서 바로 앞에서 `@` 를 찾는다. 빈칸을 만나면 그만둔다 */
  var i=커서-1, 찾는말='';
  while(i>=0){
    var c=글.charAt(i);
    if(c==='@') break;
    if(c===' ' || c==='\n' || c==='\t'){ atClose(); return; }
    찾는말=c+찾는말;
    i--;
    if(커서-i>12){ atClose(); return; }      // 이름이 그렇게 길지 않다
  }
  if(i<0){ atClose(); return; }
  if(i>0 && !/[\s(\[]/.test(글.charAt(i-1))){ atClose(); return; }   // 메일 주소 같은 것 제외

  var 뜰것=명단.filter(function(s){
    return !찾는말 || String(s.name||'').indexOf(찾는말)>=0;
  }).slice(0,6);
  if(!뜰것.length){ atClose(); return; }

  atShow(el, i, 커서, 뜰것);
}

function atShow(el, from, to, list){
  atClose();
  var box=document.createElement('div');
  box.className='atpick';
  box.innerHTML=list.map(function(s, k){
    return '<button type="button" data-i="'+k+'" onmousedown="event.preventDefault()">'+
      esc(s.name)+(s.rank? '<span class="muted"> '+esc(s.rank)+'</span>':'')+'</button>';
  }).join('');

  /* 칸 바로 아래에 붙인다 */
  var 자리=el.parentNode;
  if(getComputedStyle(자리).position==='static') 자리.style.position='relative';
  자리.appendChild(box);

  [].slice.call(box.children).forEach(function(btn, k){
    btn.addEventListener('click', function(){ atPut(el, from, to, list[k].name); });
  });

  AT.box=box; AT.el=el; AT.at=from;
}

/** 고른 이름을 `@김형석 ` 으로 박는다 */
function atPut(el, from, to, name){
  var 넣을것='@'+name+' ';
  if(el.tagName==='TEXTAREA' || el.tagName==='INPUT'){
    var v=el.value;
    el.value=v.substring(0,from)+넣을것+v.substring(to);
    var p=from+넣을것.length;
    el.focus(); el.setSelectionRange(p,p);
  }else{
    var sel=window.getSelection();
    if(sel && sel.rangeCount){
      var r=sel.getRangeAt(0);
      var node=r.startContainer;
      if(node.nodeType===3){
        var t=node.nodeValue||'';
        node.nodeValue=t.substring(0,from)+넣을것+t.substring(to);
        try{
          var cr=document.createRange();
          cr.setStart(node, from+넣을것.length); cr.collapse(true);
          sel.removeAllRanges(); sel.addRange(cr);
        }catch(err){ quiet('@넣기', err); }
      }
    }
    el.focus();
  }
  atClose();
}

/** 붙여넣기 — 우리가 다루는 서식만 남기고 나머지는 버린다 */
function mkPaste(e){
  e.preventDefault();
  var dt=e.clipboardData||window.clipboardData;
  if(!dt) return;
  var html=dt.getData('text/html')||'';
  var text=dt.getData('text/plain')||'';
  var clean = html ? mkClean(html) : esc(text).replace(/\r?\n/g,'<br>');
  try{ document.execCommand('insertHTML', false, clean); }catch(err){ quiet('붙여넣기', err); }
}

var MK_KEEP={B:1,STRONG:1,U:1,I:1,EM:1,S:1,STRIKE:1,DEL:1,SPAN:1,A:1,
             UL:1,OL:1,LI:1,BR:1,P:1,DIV:1,H3:1,H4:1,BLOCKQUOTE:1,HR:1,
             TABLE:1,THEAD:1,TBODY:1,TR:1,TH:1,TD:1};

function mkClean(html){
  var body;
  try{
    // DOMParser 로 만든 문서는 살아 있지 않다 (그림을 불러오거나 코드가 돌지 않는다)
    body=new DOMParser().parseFromString(html,'text/html').body;
  }catch(e){ return ''; }

  (function walk(node){
    [].slice.call(node.childNodes).forEach(function(n){
      if(n.nodeType===3) return;                    // 글자는 그대로
      if(n.nodeType!==1){ if(n.parentNode) n.parentNode.removeChild(n); return; }
      walk(n);
      if(!MK_KEEP[n.tagName]){
        while(n.firstChild) n.parentNode.insertBefore(n.firstChild, n);   // 태그만 벗긴다
        n.parentNode.removeChild(n);
        return;
      }
      /* 우리가 쓰는 표시만 남기고 나머지 속성은 전부 버린다
         (남의 색·글꼴·크기가 그대로 들어오면 화면이 깨진다) */
      var keepCls='';
      var cls=String(n.className||'');
      if(n.tagName==='SPAN' && /^mk-(c|h|s)-[a-z]+$/.test(cls)) keepCls=cls;
      if(n.tagName==='UL' && cls.indexOf('mk-ck')>=0) keepCls='mk-ck';
      if(n.tagName==='LI' && cls.indexOf('on')>=0) keepCls='on';
      var href = (n.tagName==='A') ? mkSafeUrl(n.getAttribute('href')) : '';
      var al = n.style ? String(n.style.textAlign||'') : '';

      [].slice.call(n.attributes).forEach(function(a){ n.removeAttribute(a.name); });

      if(keepCls) n.className=keepCls;
      if(href){ n.className='mk-a'; n.setAttribute('href',href); n.setAttribute('target','_blank'); n.setAttribute('rel','noopener'); }
      else if(n.tagName==='A'){
        while(n.firstChild) n.parentNode.insertBefore(n.firstChild, n);
        n.parentNode.removeChild(n);
        return;
      }
      if(al==='center'||al==='right') n.style.textAlign=al;
      if(n.tagName==='SPAN' && !keepCls){
        while(n.firstChild) n.parentNode.insertBefore(n.firstChild, n);
        n.parentNode.removeChild(n);
      }
    });
  })(body);
  return body.innerHTML;
}

/* ---------------------------------------------------------------------------
   되돌리기 — 편집칸의 내용을 저장할 표시글로

   ★ HTML 을 시트에 넣지 않습니다. 위의 '저장되는 표시' 로만 바꿉니다.
   ★ fmt() 와 짝입니다. 여기서 만든 글자를 fmt() 가 다시 같은 모양으로 그려야 합니다.
     (공지를 고칠 때 서식이 사라지면 안 됩니다)
--------------------------------------------------------------------------- */
function mkValue(id){
  var el=$(id);
  if(!el) return '';
  if(el.tagName==='TEXTAREA'||el.tagName==='INPUT') return el.value;   // 옛 칸도 그대로 받는다

  function clsKey(n, prefix){
    var c=String(n.className||'');
    return c.indexOf(prefix)===0 ? c.slice(prefix.length).split(/\s+/)[0] : '';
  }

  /* 글자 안 서식.
     ★ inCell — 표 칸 안이라는 뜻입니다 (2026-09-02).
       표는 `|` 로 칸을 나누므로 사람이 친 `|` 는 `/` 로 바꿔야 합니다.
       그런데 예전에는 다 만든 뒤에 통째로 바꿔서 **서식 표시의 `|` 까지 망가졌습니다.**
       이제 사람이 친 글자에서만 바꿉니다. 줄바꿈은 {br} 로 남깁니다. */
  function inline(node, inCell){
    var s='';
    [].slice.call(node.childNodes).forEach(function(n){
      if(n.nodeType===3){ s+= inCell ? n.nodeValue.replace(/\|/g,'/') : n.nodeValue; return; }
      if(n.nodeType!==1) return;
      var t=n.tagName;
      if(t==='BR'){ s+= inCell ? '{br}' : '\n'; return; }
      if(t==='HR'){ return; }

      /* ★★ 표 칸 안의 목록 (2026-09-02).
         표는 한 줄에 한 행을 적는 모양이라 진짜 목록을 담을 수 없습니다.
         예전에는 글머리 기호가 **통째로 사라지고 글자만** 남았습니다.
         이제 기호를 글자로 남깁니다 — 눈에 보이는 것은 거의 같고, 왕복해도 안 사라집니다.
         ★ 표 칸 안의 할 일은 눌러서 체크할 수 없습니다 (글자입니다).
           칸 밖에서는 예전 그대로 진짜 목록입니다. */
      if(inCell && (t==='UL'||t==='OL')){
        var 체크 = t==='UL' && String(n.className||'').indexOf('mk-ck')>=0;
        var 번호 = 1;
        var 줄들 = [];
        [].slice.call(n.children).forEach(function(li){
          if(li.tagName!=='LI') return;
          var 머리 = 체크 ? (String(li.className||'').indexOf('on')>=0 ? '☑ ' : '☐ ')
                        : (t==='OL' ? (번호++)+'. ' : '• ');
          줄들.push(머리 + inline(li, true).replace(/\n/g,' ').trim());
        });
        if(줄들.length) s += (s && !/\{br\}$/.test(s) ? '{br}' : '') + 줄들.join('{br}');
        return;
      }

      var inner=inline(n, inCell);
      /* 폭 0짜리 글자만 들어 있으면 빈 것으로 본다
         (색을 눌러 두고 아무것도 안 쓴 자리 — {c:빨강|} 같은 껍데기를 남기지 않는다) */
      if(!inner.replace(/\u200B/g,'').trim()){ s+=inner; return; }

      if(t==='B'||t==='STRONG') s+='*'+inner+'*';
      else if(t==='U') s+='_'+inner+'_';
      else if(t==='I'||t==='EM') s+='//'+inner+'//';
      else if(t==='S'||t==='STRIKE'||t==='DEL') s+='~~'+inner+'~~';
      else if(t==='A'){
        /* ★ 우리가 보여줄 때만 걸어 준 전화번호 링크는 **글자로 되돌린다** (2026-09-02).
           저장 글자에 {a:tel:...} 를 남기면 왕복할 때마다 글이 불어납니다. */
        if(String(n.className||'').indexOf('mk-tel')>=0){ s+=inner; return; }
        if(String(n.className||'').indexOf('mk-id')>=0){ s+=inner; return; }
        var u=mkSafeUrl(n.getAttribute('href'));
        s+= u ? ('{a:'+u+'|'+inner+'}') : inner;
      }
      else if(t==='SPAN'){
        /* @이름 강조도 보여주기용입니다. 저장은 '@김형석' 글자 그대로. */
        if(String(n.className||'').indexOf('mk-at')>=0){ s+=inner; return; }
        var ck=clsKey(n,'mk-c-'), hk=clsKey(n,'mk-h-'), sk=clsKey(n,'mk-s-');
        if(ck) s+='{c:'+mkNameOf(MK_COLORS,ck)+'|'+inner+'}';

  function cellText(node){ return inline(node, true).replace(/\n/g,'{br}').trim(); }

  /* 정렬 표시 (:c: · :r:)
     ★ 세 군데를 다 봅니다 —

  function alignOf(n){
    var c=String(n.className||'');
    if(c.indexOf('mk-al-c')>=0) return ':c: ';
    if(c.indexOf('mk-al-r')>=0) return ':r: ';
    var a = n.style ? String(n.style.textAlign||'') : '';
    if(!a) a = String(n.getAttribute && n.getAttribute('align') || '');
    if(a==='center') return ':c: ';
    if(a==='right')  return ':r: ';

  function table(n){
    var rows=[].slice.call(n.rows||[]);

       한 번 고쳐 저장하면 왼쪽으로 돌아갔습니다.
       ★ 표는 칸 하나가 아니라 **줄(열) 단위**로 정렬합니다 — 어느 줄이든
         그 열에 정렬이 걸려 있으면 그 열 전체를 그렇게 봅니다. */
    var align=[];
    for(var c0=0;c0<wide;c0++){
      var 정렬='';
      rows.forEach(function(r){
        var cell=r.children[c0];
        if(!cell || 정렬) return;
        var cn=String(cell.className||'');
        var st=cell.style? String(cell.style.textAlign||'') : '';
        if(cn.indexOf('al-c')>=0 || st==='center') 정렬='c';
        else if(cn.indexOf('al-r')>=0 || st==='right') 정렬='r';
      });
      align.push(정렬);
    }

    rows.forEach(function(r, i){
      var cells=[];
      for(var c=0;c<wide;c++){
        var cell=r.children[c];
        cells.push(cell ? cellText(cell) : '');
      }
      out.push('| '+cells.join(' | ')+' |');
      if(i===0){
        var bar=[];
        for(var k=0;k<wide;k++){
          bar.push(align[k]==='c' ? ':-:' : (align[k]==='r' ? '--:' : '---'));
        }
        out.push('|'+bar.join('|')+'|');
      }
    });
    out.push('');
  }

      if(n.nodeType===3){ if(n.nodeValue.replace(/\u200B/g,'').trim()) out.push(n.nodeValue); return; }

         화면(DOM)에는 문단 사이 빈 줄이 남지 않으므로, 여기서 넣어 주지 않으면
         공지를 한 번 고칠 때마다 문단이 모두 붙어 버린다. */
      if(t==='TABLE'){ table(n); return; }
      if(t==='HR'){ out.push('---'); out.push(''); return; }
      if(t==='H3'){ out.push('# '+oneLine(n)); out.push(''); return; }
      if(t==='H4'){ out.push('## '+oneLine(n)); out.push(''); return; }
      if(t==='BLOCKQUOTE'){
        inline(n).split('\n').forEach(function(x){ out.push('> '+x.trim()); });
        out.push('');
        return;
      }
      if(t==='UL'||t==='OL'){
        var check = t==='UL' && String(n.className||'').indexOf('mk-ck')>=0;
        var i=1;
        [].slice.call(n.children).forEach(function(li){
          if(li.tagName!=='LI') return;
          var head = check ? (String(li.className||'').indexOf('on')>=0 ? '[x] ' : '[ ] ')
                           : (t==='OL' ? (i++)+'. ' : '- ');
          out.push(head+oneLine(li));
        });
        out.push('');
        return;
      }
      if(t==='BR'){ out.push(''); return; }

      /* 주의 상자 · 참고 상자 (2026-09-02) — 일반 DIV 로 넘어가기 전에 잡는다 */
      if(t==='DIV' && String(n.className||'').indexOf('mk-cal')>=0){

        inline(n).split('\n').forEach(function(x){ out.push(표+x.trim()); });
        out.push('');
        return;
      }

      if((t==='DIV'||t==='P') && n.querySelector('ul,ol,table,hr,h3,h4,blockquote')){ block(n); return; }

      var body=inline(n);
      var pre=alignOf(n);
      if(pre) body.split('\n').forEach(function(x){ out.push(pre+x); });
      else out.push(body);
      out.push('');
    });

/**
 * 날짜를 짧게. 올해면 MM-DD, 작년 것이면 YYYY-MM-DD.
 * 시각이 붙어 있으면 그대로 살린다 ('2026-08-25 16:25' → '08-25 16:25')
 */
function shortDate(v){
  var s=String(v==null?'':v).trim();
  if(s.length<10) return s;
  var y=s.substring(0,4), md=s.substring(5,10), rest=s.substring(10).trim();
  if(!/^\d{4}$/.test(y)) return s;
  var head = (y===String(new Date().getFullYear())) ? md : (y+'-'+md);
  return rest ? (head+' '+rest) : head;
}


/**
 * '누가 언제 · 무엇' 한 줄.
 * parts 는 문자열이거나 {t:'마감 08-28', hot:true} 모양.
 * 빈 값은 아예 만들지 않는다 (하이픈이나 '없음' 을 남기지 마라).
 */
function byline(parts){
  var out=[];
  (parts||[]).forEach(function(p){
    if(!p) return;
    if(typeof p==='string'){ if(p.trim()) out.push(esc(p)); return; }
    if(!p.t || !String(p.t).trim()) return;
    out.push('<span class="'+(p.hot?'hot':(p.on?'on':''))+'">'+esc(p.t)+'</span>');
  });
  if(!out.length) return '';
  return '<p class="byline">'+out.join(' · ')+'</p>';
}

function won(n){ if(!n) return '0'; return Number(n).toLocaleString('ko-KR'); }

/** 60000 -> '6만원' / 1250000 -> '125만원' / 130000000 -> '1억 3000만원' */
function wonKo(n){
  n=Number(n||0);
  if(!n) return '';
  if(n<10000) return won(n)+'원';
  var eok=Math.floor(n/100000000);
  var man=Math.floor((n%100000000)/10000);
  var rest=n%10000;
  var t='';
  if(eok) t+=eok+'억';
  if(man) t+=(t?' ':'')+man.toLocaleString('ko-KR')+'만';
  if(rest) t+=(t?' ':'')+rest.toLocaleString('ko-KR');
  return t+'원';
}

/** 금액 칸: 숫자만 남기고 쉼표를 넣어주며 아래에 한글 금액을 보여준다 */

function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate()); }
/** 지금 시각을 서버와 같은 모양(YYYY-MM-DD HH:mm)으로 — 낙관 반영한 카드의 `upAt` 에 쓴다 */

/**
 * 서버가 보내준 구간별 시간을 콘솔에 표로 찍는다 (v37m).
 *   ms   라벨별 밀리초       n    실행 횟수
 *   hit  캐시가 막아낸 횟수  rows 시트별 줄 수
 */
function printT(fn, t, wall){
  try{
    var rows=[];
    Object.keys(t.ms||{}).forEach(function(k){
      var sheet=k.split(':')[1]||'';
      var info=(t.rows||{})[sheet];
      rows.push({
        구간:k,
        ms:t.ms[k],
        횟수:(t.n||{})[k]||1,
        캐시적중:(t.hit||{})[k]||0,
        줄수:info?info.rows:'',
        열수:info?info.cols:''
      });
    });
    rows.sort(function(a,b){ return b.ms-a.ms; });
    var sheetMs=0, stepMs=0;
    rows.forEach(function(r){
      if(r.구간.indexOf('합계:')===0) return;
      if(/^(시트|머리글|손잡이|열기|쓰기|행삭제|속성|캐시):/.test(r.구간)) sheetMs+=r.ms;
      else stepMs+=r.ms;
    });
    console.groupCollapsed('[구간] '+fn+' 서버 '+t._total+'ms '+
      '(구글 호출 '+sheetMs+'ms + 우리 계산 '+stepMs+'ms) · 왕복 '+wall+'ms');
    console.table(rows);
    var hits=[];
    Object.keys(t.hit||{}).forEach(function(k){ hits.push({대상:k, 캐시가막아낸횟수:t.hit[k]}); });
    if(hits.length){ console.log('캐시 적중 (0 이면 캐시가 놀고 있는 것)'); console.table(hits); }
    console.groupEnd();
  /* 콘솔에 속도표를 그리는 곳. 개발자가 보는 것이라 실패해도 앱과 상관없다 */
  }catch(e){}
}

/** 콘솔에서 perf() 를 치면 최근 동작별 평균 속도가 나옵니다 */
function perf(){
  var g={};
  PERF.forEach(function(p){
    if(!g[p.fn]) g[p.fn]={n:0,sum:0,max:0};
    g[p.fn].n++; g[p.fn].sum+=p.ms; g[p.fn].max=Math.max(g[p.fn].max,p.ms);
  });
  var rows=Object.keys(g).map(function(k){
    return {동작:k, 횟수:g[k].n, 평균초:(g[k].sum/g[k].n/1000).toFixed(2), 최대초:(g[k].max/1000).toFixed(2)};
  }).sort(function(a,b){ return b.평균초-a.평균초; });
  console.table(rows);
  return rows;
}

/** 마지막 응답에서 서버가 무엇에 몇 초를 썼는지 (구간별·시트별) */
function serverBreakdown(){
  var t=S.lastT;
  if(!t || !t.ms) return '';
  var rows=[], google=0, ours=0;
  Object.keys(t.ms).forEach(function(k){
    if(k.indexOf('합계:')===0) return;
    var sheet=k.split(':')[1]||'';
    var info=(t.rows||{})[sheet];
    rows.push({ k:k, ms:t.ms[k], n:(t.n||{})[k]||1, rows:info?info.rows:null });
    if(/^(시트|머리글|손잡이|열기|쓰기|행삭제|속성|캐시):/.test(k)) google+=t.ms[k]; else ours+=t.ms[k];
  });
  rows.sort(function(a,b){ return b.ms-a.ms; });

  var h='<p class="muted" style="font-size:var(--fs-sm);margin:0 0 4px">'+
        esc(S.lastTFn||'')+' · 서버 안에서 '+((t._total||0)/1000).toFixed(2)+'초 '+
        '(구글 호출 '+(google/1000).toFixed(2)+'초 + 우리 계산 '+(ours/1000).toFixed(2)+'초)</p>';
  rows.slice(0,16).forEach(function(r){
    var slow = r.ms>500 ? 'var(--dg)' : (r.ms>250 ? 'var(--wn)' : '');
    h+='<p style="display:flex;justify-content:space-between;gap:10px;font-size:var(--fs-sm)">'+
       '<span class="muted">'+esc(r.k)+

}

/** 콘솔을 열지 않고 설정 화면에서 바로 보는 속도표 */
function paintPerf(){
  var box=$('perfBox'); if(!box) return;
  var g={};
  PERF.forEach(function(p){
    if(!g[p.fn]) g[p.fn]={n:0,sum:0,max:0,srv:0,srvN:0};
    g[p.fn].n++; g[p.fn].sum+=p.ms; g[p.fn].max=Math.max(g[p.fn].max,p.ms);
    if(p.server!=null){ g[p.fn].srv+=p.server; g[p.fn].srvN++; }
  });
  var rows=Object.keys(g).map(function(k){
    var x=g[k];
    return { fn:k, n:x.n, avg:x.sum/x.n/1000, max:x.max/1000,
             srv: x.srvN? (x.srv/x.srvN/1000) : null };
  }).sort(function(a,b){ return b.avg-a.avg; });

  /* ★ 마지막으로 실패한 통신을 맨 위에 (2026-09-02).
     "안 돼요" 만으로는 원인을 알 수 없어서, 무엇이 어떻게 실패했는지 여기에 남깁니다. */

        '<button class="btn sm" style="margin-left:auto;padding:2px 8px" '+
        'onclick="clearFail()">지우기</button></p>'+
      '<p style="margin:0;font-size:var(--fs-sm)" class="sub">'+
        esc(LAST_FAIL.at)+' · '+esc(LAST_FAIL.fn.replace('api_',''))+' · '+esc(LAST_FAIL.why)+
        (LAST_FAIL.status? ' (HTTP '+esc(LAST_FAIL.status)+')' : '')+
        /* 사람이 누른 것이 아니라 앱이 30초마다 뒤에서 확인하던 것이면 그렇게 적습니다.
           그래야 '내가 뭘 잘못했나' 를 생각하지 않게 됩니다. */
        (LAST_FAIL.quiet? '<br>앱이 뒤에서 확인하던 것입니다. 다음 번에 저절로 다시 시도합니다.' : '')+
        '</p>'+
      '<p style="margin:3px 0 0;font-size:var(--fs-xs);word-break:break-all" class="muted">'+
        esc(String(LAST_FAIL.앞부분||'').substring(0,200))+'</p></div>';
  }

  if(!rows.length){
    box.innerHTML=실패글+'<p class="sub">아직 잰 것이 없습니다. 앱을 좀 쓰고 다시 보세요.</p>';
    return;
  }
  var h=실패글+serverBreakdown();
  rows.forEach(function(r){
    var slow = r.avg>2 ? 'var(--dg)' : (r.avg>1.2 ? 'var(--wn)' : '');
    h+='<p style="display:flex;justify-content:space-between;gap:10px">'+
       '<span class="sub" style="min-width:0;overflow:hidden;text-overflow:ellipsis">'+
       esc(r.fn.replace('api_',''))+' <span class="muted">×'+r.n+'</span></span>'+
       '<span class="num" style="white-space:nowrap;color:'+slow+'">'+
       r.avg.toFixed(2)+'초'+
       (r.srv!=null? ' <span class="muted" style="font-weight:400">(서버 '+r.srv.toFixed(2)+')</span>':'')+
       '</span></p>';
  });

}

/* 제목·숫자에 쓰는 에이투지체.

   ★ 글꼴 파일을 app.html 과 **같은 폴더에** 둡니다 (a2z-bold.woff2 · a2z-medium.woff2).
     남의 도메인에서 불러오면 글꼴은 CORS 때문에 조용히 막힐 수 있고,
     같은 폴더에 있으면 서비스워커가 알아서 담아둡니다(.woff2 는 캐시 우선 경로).

   설정 시트의 `폰트URL_제목`·`폰트URL_숫자` 는 **덮어쓰고 싶을 때만** 씁니다.
   비어 있으면 아래 기본값을 쓰므로 평소에는 그대로 두시면 됩니다. */
var A2Z_BOLD   = './a2z-bold.woff2';
var A2Z_MEDIUM = './a2z-medium.woff2';
var _fontOn = '';

function loadFont(bold, medium){
  bold   = bold   || A2Z_BOLD;
  medium = medium || A2Z_MEDIUM;
  var key = bold+'|'+medium;
  if(_fontOn === key) return;          // 같은 주소를 두 번 심지 않는다
  _fontOn = key;
  var old=$('a2zFont'); if(old && old.parentNode) old.parentNode.removeChild(old);
  var css='';
  if(bold)   css+='@font-face{font-family:"A2Z";src:url("'+bold+'") format("woff2");font-weight:700;font-display:swap}';
  if(medium) css+='@font-face{font-family:"A2Z";src:url("'+medium+'") format("woff2");font-weight:500;font-display:swap}';
  if(!medium && bold) css+='@font-face{font-family:"A2Z";src:url("'+bold+'") format("woff2");font-weight:500;font-display:swap}';
  var st=document.createElement('style');
  st.id='a2zFont';
  st.textContent=css;
  document.head.appendChild(st);
}

/* 런처(홈 화면 아이콘)로 들어온 경우 런처가 준 기기 식별값을 쓴다.
   브라우저로 직접 들어온 경우에는 이 값이 비어 있고, 앱이 스스로 만든다. */
var LAUNCH_TOKEN = (function () {
  try {

    if (m && m[1]) return decodeURIComponent(m[1]);
