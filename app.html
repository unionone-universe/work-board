     '<div class="cvper">'+
       '<button class="btn sm" onclick="costMove(-1)" aria-label="이전 달">'+ic('chev-l')+'</button>'+
       '<span class="ym">'+(COSTV.all? '전체 기간' : esc(COSTV.ym))+'</span>'+
       '<button class="btn sm" onclick="costMove(1)" aria-label="다음 달">'+ic('chev')+'</button>'+
       '<button class="chip'+(COSTV.all?' on':'')+'" onclick="costAll()" aria-pressed="'+COSTV.all+'">전체 기간</button>'+
     '</div></div>';
  h+='<div class="chks cvcats" role="group" aria-label="비용 분류">'+
     '<label class="'+(COSTV.cat?'':'on')+'" onclick="costPick(\'\')">전체</label>'+
     VIEW.map(function(c){
       return '<label class="'+(COSTV.cat===c?'on':'')+'" onclick="costPick(\''+esc(c)+'\')">'+esc(c)+'</label>';
     }).join('')+'</div>';

  /* 요약 — 크게 키우지 않는다. 숫자가 읽히는 것이 먼저 */
  h+='<div class="cvsum">'+
     '<div class="cvtile main"><span class="k">승인 금액 합계'+(COSTV.cat? ' · '+esc(COSTV.cat) : '')+'</span>'+
       '<span class="v">'+won(합)+'원</span></div>'+
     고른.map(function(c){
       return '<button class="cvtile'+(COSTV.cat===c?' on':'')+'" onclick="costPick(\''+esc(c)+'\')">'+
              '<span class="k">'+esc(c)+'</span><span class="v">'+won(승인[c])+'원</span></button>';
     }).join('')+'</div>';
  var 보조=[];
  if(대기.n) 보조.push('결재 중 '+대기.n+'건 · '+won(대기.s)+'원 (합계에 안 넣음)');
  if(금액없음) 보조.push('금액이 비어 있는 품목 '+금액없음+'건');
  if(제외) 보조.push('반려·취소 '+제외+'건 제외');
  if(보조.length) h+='<p class="note t2 cvnote">'+esc(보조.join(' · '))+'</p>';

  if(!목록.length){
    h+='<p class="none cvnone">해당 기간에 등록된 비용이 없습니다</p>';
  } else {
    h+='<div class="cvlist">'+
       '<div class="cvrow cvhdr" aria-hidden="true"><span class="n">항목</span>'+
       '<span class="meta"><span class="c">분류</span><span class="d">기준일</span><span class="w">신청자</span></span>'+
       '<span class="s">상태</span><span class="a">금액</span></div>';
    목록.forEach(function(x, i){
      var 이름=x.name;

      h+='<button class="cvrow" onclick="openDoc(\''+esc(x.d.no)+'\')">'+
         '<span class="n"><b>'+esc(이름)+'</b>'+
           (중복.표[i]? ' <span class="tag wn">중복 의심</span>' : '')+
           (문서? '<em>'+esc(문서)+'</em>' : '')+'</span>'+
         '<span class="meta"><span class="c">'+esc(x.it.cat)+'</span>'+
           '<span class="d">'+esc(shortDate(x.day))+'</span>'+

         '<span class="s">'+docBadge(x.st)+'</span>'+

         '</button>';

  }
  if(중복.쌍){
    h+='<p class="note wnv">중복 의심 '+중복.쌍+'쌍 — 구매요청서와 지출결의서의 금액·이름이 같습니다. '+
       '합치지 않았으니 문서를 열어 확인하세요 (합계에는 둘 다 들어 있습니다)</p>';
  }
  h+='<p class="note cvbasis">기준일은 품목의 사용일자(비어 있으면 기안일)입니다 · '+
     '승인 금액은 최종 승인된 문서의 품목 금액입니다 (실제 지급 여부는 여기서 알 수 없습니다)</p>';

  /* 미분류 — 임의로 넣거나 빼지 않고 사람이 확인하게 */
  if(미분류.length){
    var 줄='';
    미분류.forEach(function(x){
      var 고칠수=costCanEdit(x.d) && !x.it.noItem;
      var id='cvu_'+esc(x.d.no)+'_'+Number(x.it.seq||0);
      줄+='<div class="cvurow">'+
          '<button class="linkbtn n" onclick="openDoc(\''+esc(x.d.no)+'\')">'+esc(x.name||x.d.title||x.d.no)+'</button>'+
          '<span class="m">'+esc([x.d.formName, shortDate(x.day), x.d.who,
                                 x.it.amt==null? '금액 없음' : won(x.it.amt)+'원'].filter(Boolean).join(' · '))+
            (x.it.sug? ' <span class="tag gy">추천 '+esc(x.it.sug)+'</span>' : '')+
            (x.it.noItem? ' <span class="tag wn">품목 줄 없음 — 확인 필요</span>' : '')+'</span>'+
          (고칠수
            ? '<span class="f"><select id="'+id+'" aria-label="비용 분류">'+costCatOptions(x.it.sug||'')+'</select>'+
              '<button class="btn sm" onclick="costAssign(\''+esc(x.d.no)+'\','+Number(x.it.seq||0)+',\''+id+'\')">저장</button></span>'
            : '')+
          '</div>';
    });
    h+=foldBox('cost:unsorted', '미분류 <span class="n">'+미분류.length+'</span> — 확인이 필요한 품목',
               '<p class="note">추천은 품목 이름으로 짐작한 것이라 합계에 넣지 않았습니다. '+
               '맞으면 골라 저장하세요 (올린 사람·관리자만 저장할 수 있습니다)</p>'+줄);

}

/** 미분류 품목 하나 — 고른 분류로 저장 (서버가 권한을 다시 봅니다) */
function costAssign(no, seq, selId){
  var el=$(selId); if(!el) return;
  var cat=el.value;
  if(!cat){ toast('분류를 골라 주세요'); return; }
  el.disabled=true;
  call('api_setCostCat', S.token, no, [{ seq:seq, cat:cat }]).then(function(r){
    el.disabled=false;
    if(!r || !r.ok){ toast('저장하지 못했습니다: '+((r&&r.msg)||'')); return; }
    costApplyLocal(no, r.items);
    toast('분류를 저장했습니다');
    if(S.view==='doc') renderDocs();
  });
}

/** 서버가 저장한 분류를 화면이 들고 있는 자료에 반영 (다시 받지 않는다) */
function costApplyLocal(no, items){
  var by={};
  (items||[]).forEach(function(x){ by[Number(x.seq)]=x.cat||''; });
  ((S.data && S.data.costItems) || []).forEach(function(it){
    if(it.no===no && by.hasOwnProperty(Number(it.seq))){ it.cat=by[Number(it.seq)]; it.sug=''; }
  });
  [S.docCache && S.docCache[no], S.data && S.data.docPack && S.data.docPack[no]].forEach(function(r){
    if(!r || !r.items) return;
    r.items.forEach(function(i){ if(by.hasOwnProperty(Number(i.seq))) i.cat=by[Number(i.seq)]; });
  });
  saveSnap();
}

/** 문서 상세의 [비용 분류 바꾸기] */
function catEditToggle(on){

function saveCostCat(no){
  var cats=[].map.call(document.querySelectorAll('#dcCatBox .dcCat'), function(el){
    return { seq:Number(el.dataset.seq), cat:el.value };
  });
  var btn=$('dcCatSave'), msg=$('dcCatMsg');

  /* ★ 저장을 시작한 그 창 — 답이 늦게 오는 사이 닫고 다른 문서를 열었으면 그 창은 건드리지 않는다
     (2026-09-22 Astra 지적). 자료(캐시)는 창과 상관없이 반영한다 */
  var 창=$('modal').firstElementChild;

                     else if(!그창) toast('분류를 저장하지 못했습니다: '+((r&&r.msg)||'')); return; }
    costApplyLocal(no, r.items);
    toast('분류를 저장했습니다');
    var 상세=S.docCache[no] || (S.data && S.data.docPack && S.data.docPack[no]);
    if(그창 && 상세) $('ddBody').innerHTML=docDetailBody(상세);
    if(S.view==='doc') renderDocs();

/* ===================== 결재를 종류별로 모아 보기 (2026-09-17 대표님 지시) =====================
   결재된 문서가 한 목록에 섞여 있어 휴가와 구매요청서가 나란히 쌓였습니다.
   ★★ 칸 목록은 **여기 한 곳**입니다. 양식이 늘거나 이름이 바뀌면 이 줄만 고치세요.
   ★★ 볼 수 있는 사람인지는 **서버가 정해서** `docBox` 로 보냅니다 (화면에서 직급을 보지 않습니다).
   ★ 자료는 이미 화면이 들고 있는 결재 목록입니다 — 칸을 열든 달을 넘기든 **서버 왕복 0회**. */
var DOC_BOXES=[
  { code:'EXP',   name:'지출결의서', money:true  },
  { code:'PUR',   name:'구매요청서', money:true  },
  { code:'ADD',   name:'추가공사',   money:true  },
  { code:'SEAL',  name:'인감',       money:false },
  { code:'LEAVE', name:'휴가',       money:false }
];

var DBOX={ code:'EXP', ym:'', st:'전체' };
var BACK_BOX='';           // 칸에서 문서를 열었으면 닫을 때 그 칸으로 돌아간다

/** 화면이 들고 있는 결재 문서 전부 (내가 결재할 것 · 올린 것 · 열람할 것) */
function docAll(){
  var d=(S.data && S.data.docs) || {};
  return [].concat(d.toAct||[], d.drafts||[], d.others||[]);
}

/** 이 문서가 어느 칸인가. 다섯 칸에 없는 양식(내린 양식 등)은 `기타` */
function docBoxOf(d){
  var c=String(d.form||'');
  var 있나=false;
  DOC_BOXES.forEach(function(b){ if(b.code===c) 있나=true; });
  return 있나? c : '기타';
}

function docBoxesHtml(){
  if(!(S.data && S.data.docBox)) return '';       // 대표·전무가 아니면 이 구역 자체가 없다
  var all=docAll();
  function 센다(code){
    var 전부=all.filter(function(d){ return docBoxOf(d)===code; });
    var 진행=전부.filter(function(d){ return String(d.status||'진행중')==='진행중'; });
    return { all: 전부.length, run: 진행.length };
  }
  var 칸들=DOC_BOXES.slice();
  /* ★ 다섯 칸에 없는 양식으로 올라온 문서가 있으면 그때만 `기타` 를 만든다 —
     문서가 어느 칸에도 안 보여 사라지는 일이 없게 (0건이면 안 그립니다) */
  var 기타=all.filter(function(d){ return docBoxOf(d)==='기타'; }).length;
  if(기타) 칸들=칸들.concat([{ code:'기타', name:'기타', money:false }]);

  var h='<div class="sec"><h4>종류별로 보기</h4></div><div class="boxgrid">';
  칸들.forEach(function(b){
    var c=센다(b.code);
    /* ★ 전체 건수를 먼저 보여 줍니다 — **끝난 문서도 여기 들어 있습니다** (2026-09-17 대표님 지시).
       처리할 것이 있으면 뒤에 `진행중 N` 을 덧붙입니다. 없으면 안 적습니다 */
    var 숫자 = c.all
      ? (c.all + '건' + (c.run? ' · 진행중 '+c.run : ''))
      : '';
    h+='<button class="dbox" onclick="openDocBox(&quot;'+b.code+'&quot;)">'+
       '<span class="t">'+esc(b.name)+'</span>'+
       (숫자? '<span class="n">'+esc(숫자)+'</span>' : '')+
       '</button>';
  });
  return h+'</div>';
}

function ymShift(ym, n){
  var y=Number(String(ym).substring(0,4)), m=Number(String(ym).substring(5,7))+Number(n);
  y+=Math.floor((m-1)/12);
  m=((m-1)%12+12)%12+1;
  return y+'-'+p2(m);
}

function openDocBox(code){
  DBOX.code=code||'EXP';
  DBOX.ym=DBOX.ym||monthNow();
  DBOX.st='전체';
  drawDocBox();
}

function dboxMove(n){ DBOX.ym=ymShift(DBOX.ym, n); drawDocBox(); }
function dboxState(st){ DBOX.st=st; drawDocBox(); }
function closeDocBox(){ BACK_BOX=''; closeOk(); }

/** 칸에서 연 문서는 닫을 때 그 칸으로 돌아간다 */
function openDocFromBox(no){ BACK_BOX=DBOX.code; openDoc(no); }

function drawDocBox(){
  var b=null;
  DOC_BOXES.forEach(function(x){ if(x.code===DBOX.code) b=x; });
  var 이름 = b? b.name : DBOX.code;

  var rows=docAll().filter(function(d){
    if(docBoxOf(d)!==DBOX.code) return false;
    if(String(d.at||'').substring(0,7)!==DBOX.ym) return false;
    if(DBOX.st!=='전체' && String(d.status||'진행중')!==DBOX.st) return false;
    return true;
  }).sort(function(a,c){ return String(a.at||'') < String(c.at||'') ? 1 : -1; });

  /* 반려는 합계에서 뺍니다 — 쓰지 않은 돈입니다 */
  var 합=0;
  rows.forEach(function(d){ if(String(d.status||'')!=='반려') 합+=Number(d.amount||0); });

  var h='<div class="veil"><div class="sheet">'+
    '<div class="sheethead">'+
      '<button class="btn sm" onclick="closeDocBox()">'+ic('back')+'결재</button>'+
      '<h3 class="tt" style="flex:1;text-align:center">'+esc(이름)+'</h3>'+
    '</div>'+
    '<div class="dboxbar">'+
      '<button class="btn sm" onclick="dboxMove(-1)" aria-label="이전 달">'+ic('chev-l')+'</button>'+
      '<span class="ym">'+esc(DBOX.ym)+'</span>'+
      '<button class="btn sm" onclick="dboxMove(1)" aria-label="다음 달">'+ic('chev')+'</button>'+
    '</div>'+
    '<div class="chks">'+
      ['전체','진행중','승인완료','반려'].map(function(x){
        return '<label class="'+(DBOX.st===x?'on':'')+'" onclick="dboxState(&quot;'+x+'&quot;)">'+x+'</label>';
      }).join('')+
    '</div>';

  if(b && b.money && 합) h+='<p class="note right t2">합계 '+won(합)+'원</p>';

  h += rows.length
    ? docSec('', rows, false).split("openDoc('").join("openDocFromBox('")
    : empty('이 달에는 없습니다.');

  h+='</div></div>';
  $('modal').innerHTML=h;
}

/* ── 여러 건 한 번에 승인 (2026-09-02) ─────────────────────────
 *
 *  대표님이 아침에 다섯 건을 **하나씩 열고 하나씩** 누르고 계셨습니다.
 *  체크해서 한 번에 처리합니다. **서버 왕복은 한 번**입니다.
 *
 *  ★ 권한 판정은 그대로 서버가 합니다. 체크칸은 `canAct` 인 문서에만 나옵니다.
 */
var DOC_PICK = {};

function docPick(no, on){
  if(on) DOC_PICK[no] = 1; else delete DOC_PICK[no];
  paintDocBulk();
}
function docPickAll(on){
  DOC_PICK = {};
  var r = docSource();
  if(on && r) (r.toAct||[]).forEach(function(d){ if(d.canAct) DOC_PICK[d.no]=1; });
  [].forEach.call(document.querySelectorAll('.dpick'), function(c){ c.checked = !!on; });
  paintDocBulk();
}
function docPickCount(){ return Object.keys(DOC_PICK).length; }

function paintDocBulk(){
  var bar = $('docBulk');
  if(!bar) return;
  var n = docPickCount();
  bar.classList.toggle('hide', n === 0);
  var b = $('docBulkGo');
  if(b) b.textContent = n + '건 승인';
}

function docBulkAct(action){
  var nos = Object.keys(DOC_PICK);
  if(!nos.length) return;
  if(action === 'reject'){
    if(!confirm(nos.length + '건을 반려합니다. 계속할까요?')) return;
  }

  /* 낙관 처리 — 누르는 즉시 목록에서 뺀다 (결재 승인·반려는 즉시 닫는 쪽) */
  nos.forEach(function(no){
    markDocLocal(no, { canAct:false, canRead:false,
                       status: action==='approve' ? '진행중' : '반려' });
  });
  DOC_PICK = {};
  paintDocBulk();

  call('api_actDocMany', S.token, nos, action, '').then(function(r){
    if(!r || !r.ok){ toast((r&&r.msg)||'처리하지 못했습니다'); softRefresh(); return; }
    (r.done||[]).forEach(function(d){ markDocLocal(d.no, { status: d.status }); });
    if((r.fail||[]).length){
      toast(r.fail.length + '건은 처리하지 못했습니다');
    }else{
      toast((r.done||[]).length + '건 ' + (action==='approve'?'승인':'반려') + '되었습니다');
    }
    softRefresh();
  });
}

/** 상태 뱃지 — 대기(노랑) · 승인완료(무채색) · 반려(빨강) */
function docBadge(st){
  var s=String(st||'진행중');
  var cls=(s==='반려')?'dg':(s==='승인완료'?'gy':'wn');
  return '<span class="tag '+cls+'">'+esc(s)+'</span>';
}

function docSec(title, arr, hot, 종류표시){
  arr = arr || [];
  if(!arr.length) return '';                 // 0건이면 구역 자체를 만들지 않는다
  var h = title
    ? '<div class="sec"><h4'+(hot?' class="hot"':'')+'>'+title+'</h4>'+
      '<span class="n">'+arr.length+'</span></div>'
    : '';
  arr.forEach(function(d){
    /* ★ 색 신호는 한 겹만 (2026-09-09). 결재할 구역의 문서는 전부 진행중이라
       노란 `진행중` 뱃지는 정보가 0이고, `확인 필요` 빨간 태그는 카드의 빨간 선과 같은 말입니다.
       진행중은 회색 글자로, 승인완료는 표시 없음, 반려만 빨강. */
    var st=String(d.status||'진행중');
    /* ★★ 종류가 한눈에 구분되게 제목 앞에 태그 (2026-09-17 대표님 지시).
       섞여 있는 구역에서만 붙입니다 — 종류별 칸 안에서는 창 제목이 이미 그 종류입니다.
       ★ 태그를 붙이면 보조 줄의 양식 이름은 뺍니다 (같은 말을 두 번 적지 않습니다). */
    var 태그 = 종류표시 ? '<span class="tag gy">'+esc(d.formName||d.form||'')+'</span> ' : '';
    var sub=[d.who, shortDate(d.at), (종류표시? '' : d.formName), (!hot && st==='진행중')? '진행중' : '']
      .filter(function(x){ return x; }).join(' · ');
    var tags=(d.proxy? '<span class="tag wn">대리</span>':'');
    /* 체크칸은 실제로 결재할 수 있는 문서에만. 눌러도 창이 안 열리게 막는다 */
    var 체크 = (hot && d.canAct)
      ? '<label class="dpickbox" onclick="event.stopPropagation()">'+
          '<input type="checkbox" class="dpick" onchange="docPick(&quot;'+d.no+'&quot;,this.checked)">'+
        '</label>'
      : '';
    h+='<div class="ucard'+((hot||d.canRead)?' hot':'')+'" onclick="openDoc(\''+d.no+'\')">'+
       체크+
       '<div class="m">'+
         '<p class="t">'+태그+esc(d.title)+'</p>'+
         /* 대리 표시는 같은 보조 줄에 — 따로 줄을 만들면 그 카드만 높아집니다 (2026-09-09) */
         '<p class="b">'+esc(sub)+(tags? (sub?' ':'')+tags : '')+'</p>'+
       '</div>'+
       '<div class="r">'+
         (d.amount? '<span class="v">'+won(d.amount)+'원</span>':'')+
         (st==='반려'? '<span class="s">'+docBadge(st)+'</span>' : '')+
       '</div></div>';
  });
  return h;
}

/** 목록이 이미 가진 값으로 창을 즉시 띄우고 내역·결재선만 뒤에서 채운다 */
function findDocBrief(no){
  var hit=null;
  var src=docSource();
  if(src){
    ['toAct','drafts','others'].forEach(function(k){
      (src[k]||[]).forEach(function(d){ if(d.no===no) hit=d; });
    });
  }
  if(!hit && S.data){
    (S.data.approvals||[]).forEach(function(a){
      if(a.no===no) hit={no:a.no, title:a.title, amount:a.amount, who:a.who, at:a.at, status:'진행중'};
    });
  }
  return hit;
}

/**
 * 문서 상세는 board 가 이미 통째로 실어 보낸다(`docPack`).
 * 여기서는 거기에 안 담긴 오래된 문서만 뒤에서 채운다.
 */
function prefetchDocs(){
  var src=docSource(); if(!src) return;
  var nos=[];
  ['toAct','drafts','others'].forEach(function(k){
    (src[k]||[]).forEach(function(d){
      if(nos.length>=10) return;
      if(!S.docCache[d.no]) nos.push(d.no);
    });
  });
  if(!nos.length) return;
  var at=areaVer('doc');
  call('api_docDetails', S.token, nos).then(function(r){
    if(!r || !r.ok) return;
    Object.keys(r.docs||{}).forEach(function(k){
      S.docCache[k]=r.docs[k]; S.docCacheAt[k]=at;
    });
  });
}

function openDoc(no){
  var b=findDocBrief(no);
  var cached=S.docCache[no];

  if(cached){
    // 미리 받아둔 것이 있으면 그대로 연다 (왕복 0회)
    $('modal').innerHTML=docSheetHtml(cached.doc, cached);
    if(S.docCacheAt[no]===areaVer('doc')) return;   // 결재 쪽이 안 바뀌었으면 다시 받지 않는다
  } else if(b){
    // 승인 버튼은 board 가 이미 canAct 를 줬으므로 기다리지 않고 바로 그린다
    $('modal').innerHTML=docSheetHtml({
      no:b.no, title:b.title, corp:b.corp||'', who:b.who, at:b.at,
      amount:b.amount, status:b.status, canAct:b.canAct, proxy:b.proxy
    }, null);
  }

  var at=areaVer('doc');
  call('api_docDetail', S.token, no).then(function(r){
    if(!r.ok){ if(!b && !cached) toast(r.msg); return; }
    S.docCache[no]=r; S.docCacheAt[no]=at;
    if(!$('ddBody')){
      if(!b && !cached) $('modal').innerHTML=docSheetHtml(r.doc, r);
      return;
    }
    var keep=$('dcComment')? $('dcComment').value : '';   // 적던 의견을 잃지 않게
    $('ddBody').innerHTML=docDetailBody(r);
    if(keep && $('dcComment')) $('dcComment').value=keep;
  });
}

/**
 * 결재 문서 상세 (v42에서 다시 짬).
 * 라벨 붙여 여섯 줄로 늘어놓던 것을 '누가 언제' 한 줄로 바꾸고,
 * 금액만 큰 글씨로 남긴다. 금액이 없는 양식(인감·휴가)에는 그 줄을 만들지 않는다.
 */
function docSheetHtml(d, r){
  var head=[];
  if(d.who) head.push(d.who);
  if(d.at) head.push(shortDate(d.at));
  if(d.status) head.push({ t:d.status, hot:(d.status==='반려') });
  if(d.formName) head.push(d.formName);
  if(d.corp) head.push(d.corp);
  // 문서번호(EXP-260826-001)는 제목 아래에 쓰지 않는다 — 사람이 읽을 것이 아니다

  /* ★ 관리자 삭제는 ⋯ 안에 (2026-09-09). 상세 맨 아래 빨간 단추가 늘 떠 있었습니다.
     업무 상세의 ⋯ 와 같은 방식입니다 — 첫 화면에는 정보만 남깁니다. */
  var 관리자 = S.me && S.me.grade>=9;
  return '<div class="veil"><div class="sheet">'+
    '<div class="sheethead"><h3 class="tt">'+esc(d.title)+'</h3>'+
    (관리자? '<button class="tdico" onclick="taskMenu()" title="삭제" aria-label="삭제">'+ic('dots')+'</button>' : '')+
    '<button class="btn sm" onclick="closeModal()">닫기</button></div>'+
    (관리자? '<div class="tdmenu" id="tdMenu">'+
      '<button class="btn sm dg" onclick="deleteDoc(\''+d.no+'\',\''+esc(d.title).replace(/'/g,'')+'\')">삭제</button></div>' : '')+
    byline(head)+
    (d.amount? '<p style="margin:0 0 18px"><b class="num" style="font-size:var(--fs-num-md)">'+
       won(d.amount)+'원</b> <span class="sub">'+esc(wonKo(d.amount))+'</span></p>' : '')+
    '<div id="ddBody">'+ (r? docDetailBody(r) : waitingBody(d)) +'</div>'+
    '</div></div>';
}

/** 내역이 오기 전에 보여줄 것 — 결재할 수 있으면 버튼부터 먼저 */
function waitingBody(d){
  var h='';
  if(d.canAct){
    h+='<div class="field"><label class="fl">의견</label><input type="text" id="dcComment"></div>'+
       (d.proxy? '<p class="none wnv">'+
                 '대리로 처리합니다. 누가 눌렀는지 문서에 남습니다</p>':'')+
       '<div class="actions">'+
       '<button class="btn" onclick="actDoc(\''+d.no+'\',\'reject\')">반려</button>'+
       '<button class="btn pri" onclick="actDoc(\''+d.no+'\',\'approve\')">'+
         (d.proxy?'대리 승인':'승인')+'</button></div>';
  }
  return h+'<p class="muted" style="font-size:var(--fs-sm);margin-top:12px">내역 불러오는 중...</p>';
}

function docDetailBody(r){
  var d=r.doc;
  var h='';

  /* ★★★ 비고는 `결재문서` 시트의 **열**이라 `fields` 에 안 들어옵니다 (2026-09-07).
     화면은 진작 보내고 있었고(`dfMemo`), 서버는 저장하고(`비고`),
     상세 응답에 `memo` 로 실어 보내고, **PDF 에도 찍고, 검색도 훑습니다.**
     오직 이 화면만 안 그렸습니다 — 그래서 작성자가 쓴 비고를
     **앱 안에서는 볼 방법이 없었습니다.** 오류가 안 나서 아무도 몰랐습니다.
     ★ 빈 값이면 줄 자체를 만들지 않습니다 (CLAUDE.md).
     ★ `fields` 가 없고 비고만 있는 양식도 있으므로 상자를 같이 엽니다. */
  var 칸=[];
  if(d.fields && d.fields.length){
    d.fields.forEach(function(f){ 칸.push(row(f.name, f.value)); });
  }
  if(d.memo) 칸.push(row('비고', d.memo));
  if(칸.length) h+='<div class="kv" style="margin-bottom:14px">'+칸.join('')+'</div>';
  if(r.items.length) h+=sechead(d.itemsTitle||'내역', r.items.length);
  var 비용문서 = !!COST_FORM_CODES[d.form];
  r.items.forEach(function(i){
    var sub=[shortDate(i.date), i.kind, 비용문서 ? (i.cat||'미분류') : ''].filter(function(x){ return x; }).join(' · ');
    h+='<div class="lrow plain"><div class="m"><p class="t">'+esc(i.memo)+'</p>'+
       (sub? '<p class="b">'+esc(sub)+'</p>':'')+'</div>'+
       '<div class="r"><span class="v">'+won(i.amount)+'원</span>'+
       '<span class="s muted">'+esc(wonKo(i.amount))+'</span></div></div>';
  });

  /* 비용 분류 바꾸기 — 올린 사람·관리자만 (d.canCat 은 서버 판정, 저장할 때 서버가 다시 봅니다) */
  if(비용문서 && d.canCat && r.items.length){
    h+='<div class="catedit hide" id="dcCatBox">'+
       r.items.map(function(i){
         return '<div class="catrow"><span class="t">'+esc(i.memo||('품목 '+i.seq))+'</span>'+
                '<select class="dcCat" data-seq="'+Number(i.seq||0)+'" aria-label="비용 분류">'+
                costCatOptions(i.cat||'')+'</select></div>';
       }).join('')+
       '<p class="tfmsg" id="dcCatMsg" role="alert"></p>'+
       '<div class="actions"><button class="btn" onclick="catEditToggle(false)">취소</button>'+
       '<button class="btn pri" id="dcCatSave" onclick="saveCostCat(\''+d.no+'\')">분류 저장</button></div></div>'+
       '<div class="catbtn" id="dcCatBtnBox"><button class="btn sm" onclick="catEditToggle(true)">비용 분류 바꾸기</button></div>';
  }

  // 영수증 — 눌러서 원본 크기로 크게 볼 수 있게 (v42)
  // PDF 는 그림으로 못 그리므로 이름 링크로 (2026-09-11)
  if(r.files.length){
    h+='<div style="margin-top:12px;display:flex;flex-wrap:wrap;gap:8px">';
    r.files.forEach(function(f, i2){
      h+= /\.pdf$/i.test(String(f.name||'')) ? fileChip(f) : receiptThumb(f.url, i2);
    });
    h+='</div>';
  }

  h+=sechead('결재선');
  r.lines.forEach(function(l){
    var st=[l.state, l.at? shortDate(l.at):''].filter(function(x){ return x; }).join(' · ');
    h+='<div class="lrow plain"><div class="m"><p class="t">'+esc(l.name)+
       ' <span class="tag gy">'+esc(l.role)+'</span></p></div>'+
       (st? '<div class="r"><span class="b">'+esc(st)+'</span></div>':'')+'</div>';
  });

  // 내가 아직 확인하지 않은 열람자라면 큰 버튼을 먼저 보여준다
  var viewers = r.viewers || [];
  var needRead = viewers.some(function(v){ return v.mine && !v.done; });
  if(needRead){
    h+='<div style="margin-top:14px">'+
       '<button class="btn pri" style="width:100%;padding:14px;font-size:var(--fs-h1)" '+
       'onclick="readDoc(\''+d.no+'\')">열람 확인</button></div>';
  }
  if(viewers.length){
    h+='<p class="sub" style="margin:8px 0 0;font-size:var(--fs-sm)">열람 · '+
       viewers.map(function(v){
         return esc(v.name)+' '+(v.done? ('확인'+(v.at?' '+esc(shortDate(v.at)):'')) : '미확인');
       }).join(' / ')+'</p>';
  }

  // 승인이 끝난 문서 — 시스템이 찍은 법인 도장과 문서 내려받기
  if(d.status==='승인완료'){
    /* 도장이 없는 유니온원철거 문서는 결재 PDF 와 같은 임시 도장 (판정은 서버 tempSeal_ · 2026-09-28) */
    var sealSrc=d.seal || (d.tempSeal? './uo-temp-seal.png' : '');
    if(sealSrc){
      h+='<div style="margin-top:16px;display:flex;justify-content:flex-end;align-items:center;gap:12px">'+
         (d.done? '<span class="sub" style="font-size:var(--fs-body)">'+esc(String(d.done).substring(0,10))+' 승인</span>':'')+
         '<img src="'+esc(sealSrc)+'" alt="법인 도장" '+
         'style="width:74px;height:74px;object-fit:contain"></div>';
    }
    h+='<div class="actions" style="margin-top:14px">'+
       '<button class="btn" id="dcPdf" onclick="openDocPdf(\''+d.no+'\')">문서 보기</button>'+
       '<button class="btn" onclick="shareDoc(\''+d.no+'\')">보내기</button></div>'+
       '<p class="muted" id="dcPdfMsg" style="margin:6px 0 0;font-size:var(--fs-sm)"></p>';
  }

  // 결재할 수 있는지는 서버가 판정해서 보낸다 (화면에서 이름을 비교하지 않는다)
  if(r.canAct){
    h+='<div class="field" style="margin-top:14px"><label class="fl">의견</label>'+
       '<input type="text" id="dcComment"></div>'+
       (r.proxy? '<p class="none wnv">'+
                 '대리로 처리합니다. 누가 눌렀는지 문서에 남습니다</p>' : '')+
       '<div class="actions">'+
       '<button class="btn" onclick="actDoc(\''+d.no+'\',\'reject\')">반려</button>'+
       '<button class="btn pri" onclick="actDoc(\''+d.no+'\',\'approve\')">'+
         (r.proxy?'대리 승인':'승인')+'</button></div>';
  }

  /* 관리자 삭제는 창 머리의 ⋯ 에 있습니다 (docSheetHtml) */
  return h;
}

/* ---- 영수증 보기 (v42) ----
   드라이브 링크에서 파일 ID 를 뽑아 미리보기를 만든다.
   미리보기를 못 만들면(주소 모양이 다르면) 예전처럼 링크만 보여준다. */
var RCPT={};     // 번호 -> 원본 주소
var RCPT_N=0;    // 사진마다 겹치지 않는 번호를 붙인다 (shotsHtml 이 쓴다)

function driveId(url){
  var m=String(url||'').match(/\/d\/([A-Za-z0-9_\-]{20,})/) ||
        String(url||'').match(/[?&]id=([A-Za-z0-9_\-]{20,})/);
  return m? m[1] : '';
}

/**
 * 올라간 사진들을 썸네일로 (2026-08-31).
 * 눌러 크게 보는 것은 영수증과 같은 길(openReceipt)을 씁니다.
 * 드라이브 주소가 아니면 그냥 링크로 내려앉습니다.
 */
function shotsHtml(urls){
  if(!urls || !urls.length) return '';
  var h='<div class="shots">';
  urls.forEach(function(u){
    if(!u) return;
    var id=driveId(u);
    if(!id){ h+='<a href="'+esc(u)+'" target="_blank" class="btn sm">사진 보기</a>'; return; }
    var i='s'+(RCPT_N++); RCPT[i]=u;
    h+='<img src="https://drive.google.com/thumbnail?id='+esc(id)+'&sz=w400" alt="사진" '+
       'onclick="openReceipt(&#39;'+esc(id)+'&#39;,&#39;'+i+'&#39;)" '+
       'onerror="this.outerHTML=&#39;<a href=&quot;'+esc(u)+'&quot; target=_blank class=&quot;btn sm&quot;>사진 보기</a>&#39;">';
  });
  return h+'</div>';
}

/** 그림이 아닌 첨부(PDF) — 이름을 눌러 새 창에서 연다 */
function fileChip(f){
  return '<a class="filechip" href="'+esc(f.url)+'" target="_blank" rel="noopener">'+
         '<span>'+esc(f.name||'첨부')+'</span></a>';
}

function receiptThumb(url, i){
  var id=driveId(url);
  RCPT[i]=url;
  if(!id) return '<a href="'+esc(url)+'" target="_blank" class="btn sm">영수증 보기</a>';
  return '<img src="https://drive.google.com/thumbnail?id='+esc(id)+'&sz=w400" '+
    'alt="영수증" onclick="openReceipt(\''+esc(id)+'\','+i+')" '+
    'onerror="this.outerHTML=\'<a href=&quot;'+esc(url)+'&quot; target=_blank class=&quot;btn sm&quot;>영수증 보기</a>\'" '+
    'style="width:104px;height:104px;object-fit:cover;border-radius:var(--r);'+
    'border:1px solid var(--line2);cursor:zoom-in;background:var(--field)">';
}

/** 눌러서 크게 — 화면 가득 원본 화질로 */
function openReceipt(id, i){
  var full='https://drive.google.com/thumbnail?id='+id+'&sz=w2400';
  var box=document.createElement('div');
  box.id='rcptView';
  box.style.cssText='position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.92);'+
    'display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px';
  box.innerHTML=
    '<img src="'+esc(full)+'" alt="영수증" '+
      'style="max-width:100%;max-height:82vh;object-fit:contain;border-radius:var(--r-sm)">'+
    '<div style="display:flex;gap:8px">'+
      '<a class="btn sm" href="'+esc(RCPT[i]||full)+'" target="_blank">원본 열기</a>'+
      '<button class="btn sm pri" onclick="closeReceipt()">닫기</button>'+
    '</div>';
  box.addEventListener('click', function(e){ if(e.target===box) closeReceipt(); });
  document.body.appendChild(box);
}
function closeReceipt(){
  var b=$('rcptView');
  if(b && b.parentNode) b.parentNode.removeChild(b);
}

/* ---- 문서 보기 / 보내기 ---- */
var DOCPDF={};   // 이번 접속에서 이미 만든 문서 링크

/** 누를 때만 만든다. 한 번 만든 것은 서버가 첨부에 남겨 다시 쓴다 */
function openDocPdf(no, cb){
  if(DOCPDF[no]){ if(cb) cb(DOCPDF[no]); else window.open(DOCPDF[no],'_blank'); return; }
  var btn=$('dcPdf'), msg=$('dcPdfMsg');
  if(btn) btn.disabled=true;
  if(msg) msg.textContent='문서를 만드는 중입니다...';
  call('api_docPdf', S.token, no).then(function(r){
    if(btn) btn.disabled=false;
    if(!r.ok){ if(msg) msg.textContent=r.msg; else toast(r.msg); return; }
    if(msg) msg.textContent='';
    DOCPDF[no]=r.url;
    if(cb) cb(r.url); else window.open(r.url,'_blank');
  });
}

/** 휴대폰이면 공유 창, 아니면 링크 복사 (앱이 직접 메일을 보내지 않는다) */
function shareDoc(no){
  openDocPdf(no, function(url){
    var d=S.docCache[no];
    var title=(d && d.doc && d.doc.title) || no;
    if(navigator.share){
      /* 사람이 공유창을 그냥 닫아도 여기로 온다. 실패가 아니므로 알리지 않는다 */
      navigator.share({ title:title, text:title, url:url }).catch(function(){});
      return;
    }
    var done=function(){ toast('링크를 복사했습니다'); window.open(url,'_blank'); };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done, function(){ window.open(url,'_blank'); });
    } else {
      window.open(url,'_blank');
    }
  });
}

function deleteDoc(no, title){
  if(!confirm('"'+title+'" 문서를 삭제할까요?\n결재선·지출내역·영수증 기록까지 함께 지워지고 되돌릴 수 없습니다.')) return;
  var back=S.data? JSON.parse(JSON.stringify(S.data.docs||null)) : null;
  var ep=S.epoch;
  dropDocLocal(no);
  closeOk(); toast('삭제되었습니다');
  call('api_deleteDoc', S.token, no, S.corp).then(function(r){
    if(!r.ok){
      if(back && S.data && sameAccess(ep)){ S.data.docs=back; renderDocs(); navCount(); }
      toast('삭제하지 못했습니다: '+r.msg);
      return;
    }
    softRefresh();
  });
}

/** 열람 확인 — 결재선의 내 '열람' 줄을 '확인' 으로 바꾼다 */
/** 열람 확인 — 눌렀으면 바로 닫는다. 되돌릴 수 있는 동작이다 */
function readDoc(no){
  var back=S.data? JSON.parse(JSON.stringify(S.data.docs||null)) : null;
  var ep=S.epoch;

  // 캐시 안의 열람 현황도 바로 고쳐서 다시 열어도 '확인' 으로 보이게
  var cd=S.docCache[no];
  if(cd && cd.viewers){
    cd.viewers.forEach(function(v){
      if(v.mine && !v.done){ v.done=true; v.at=todayStr().substring(5)+' '+nowHM(); }
    });
  }
  markDocLocal(no, { canRead:false });
  closeOk();
  toast('열람 확인되었습니다');

  call('api_readDoc', S.token, no, S.corp).then(function(r){
    if(!r.ok){
      if(back && S.data && sameAccess(ep)){ S.data.docs=back; renderDocs(); navCount(); }
      delete S.docCache[no]; delete S.docCacheAt[no];
      toast('확인 처리를 하지 못했습니다: '+r.msg);
      return;
    }
    softRefresh();
  });
}

/** 결재 목록에서 이 문서 한 건만 고친다 (board 를 기다리지 않는다) */
function markDocLocal(no, patch){
  if(!S.data || !S.data.docs) return;
  var d=S.data.docs;
  ['toAct','drafts','others'].forEach(function(k){
    (d[k]||[]).forEach(function(x){
      if(x.no!==no) return;
      for(var f in patch) x[f]=patch[f];
    });
  });
  // 처리한 문서는 '내가 결재할 문서' 에서 빼고 열람 쪽으로 옮긴다
  if(patch.canAct===false){
    var moved=(d.toAct||[]).filter(function(x){ return x.no===no; });
    d.toAct=(d.toAct||[]).filter(function(x){ return x.no!==no; });
    if(moved.length) d.others=moved.concat(d.others||[]);
    S.data.approvals=(S.data.approvals||[]).filter(function(a){ return a.no!==no; });
  }
  renderBoard(); navCount();
  if(S.view==='doc') renderDocs();
}

/**
 * 승인·반려 — 화면을 먼저 바꾸고 창을 닫는다.
 * 되돌릴 수 있는 동작이고, 정산 반영·휴가 적립·도장은 서버가 확실히 처리하므로
 * 화면이 기다린다고 더 안전해지지 않는다. 실패하면 되돌리고 크게 알린다.
 */
function actDoc(no, action){
  var c=$('dcComment')? $('dcComment').value : '';
  var btns=document.querySelectorAll('.sheet button');
  [].forEach.call(btns,function(b){ b.disabled=true; });   // 두 번 눌리지 않게

  var back=S.data? JSON.parse(JSON.stringify({docs:S.data.docs||null,
                                              apv:S.data.approvals||[]})) : null;
  var ep=S.epoch;
  markDocLocal(no, { canAct:false });
  delete S.docCache[no]; delete S.docCacheAt[no];
  closeOk();
  toast(action==='approve'?'승인되었습니다':'반려되었습니다');

  call('api_actDoc', S.token, no, action, c, S.corp).then(function(r){
    if(!r.ok){
      if(back && S.data && sameAccess(ep)){ S.data.docs=back.docs; S.data.approvals=back.apv; }
      renderBoard(); navCount(); if(S.view==='doc') renderDocs();
      toast('처리하지 못했습니다: '+r.msg);
      return;
    }
    if(r.status) markDocLocal(no, { status:r.status });
    if(r.final && !r.sealed){
      /* 도장이 없는 유니온원철거 문서는 임시 도장이 찍힌다 (서버 tempSeal_ · 2026-09-29) */
      toast(r.tempSeal? '승인되었습니다 · 정식 도장이 등록되지 않아 임시 도장으로 날인되었습니다'
                      : '승인되었습니다 · 이 법인의 도장이 없어 날인은 되지 않았습니다');
    }
    softRefresh();
  });
}

/** 문서 종류 버튼 목록 — 같은 코드·같은 이름이 두 번 나오지 않게 걸러서 준다.
    시트에 겹치는 줄이 남아 있어도 직원 화면에는 한 번만 보이게 하는 안전장치. */
function formList(){
  var seenCode={}, seenName={}, out=[];
  ((S.meta && S.meta.forms) || []).forEach(function(f){
    var c=String(f.code||'').trim();
    var n=String(f.name||'').trim();
    if(!c || seenCode[c]) return;
    seenCode[c]=true;
    if(n && seenName[n]) return;
    if(n) seenName[n]=true;
    out.push(f);
  });
  return out;
}

/* prefill — 달력에서 '휴가 신청' 을 누르면 그 날짜를 시작일·종료일로 채워서 연다.
   { 항목명: 값 } 모양. 결재 흐름 자체는 그대로다. */
function openDocForm(code, prefill){
  var forms=formList();
  if(!forms.length){ toast('문서 양식이 없습니다. 설정에서 기준정보를 새로고침해주세요.'); return; }
  var f=null;
  forms.forEach(function(x){ if(x.code===(code||forms[0].code)) f=x; });
  if(!f) f=forms[0];

  var corps=S.meta.corps, tasks=(S.data? S.data.tasks:[]);
  var h='<div class="veil"><div class="sheet">'+
    '<div class="sheethead"><h3 class="tt">'+esc(f.name)+'</h3></div>';

  if(forms.length>1){
    h+='<div class="field"><label class="fl">문서 종류</label><div class="chks">'+
      forms.map(function(x){
        return '<label class="'+(x.code===f.code?'on':'')+'" onclick="openDocForm(\''+x.code+'\')">'+esc(x.name)+'</label>';
      }).join('')+'</div></div>';
  }

  // 인감·휴가는 업무와 상관이 없다. 승인자가 판단할 때 쓰지 않으므로 칸을 만들지 않는다
  var useTask = (f.code!=='SEAL' && f.code!=='LEAVE');

  /* ★★ 칸의 자리는 '매번 적는 것이 위, 자동으로 채워지거나 드문 것은 아래 접기' (2026-09-09).
       예전에는 종류 → 법인·관련 업무 → 제목 → 항목 → 내역 → 사진 → 비고 → 인감이
       같은 크기로 늘어서서 한 화면 반을 내려야 [상신] 이 나왔습니다.
       칸 이름(id)과 막는 규칙(saveDoc)은 그대로입니다. 자리만 옮겼습니다. */
  var 법인칸 = '<div class="field"><label class="fl req">법인</label><select id="dfCorp">'+
        corps.map(function(c){ return '<option value="'+c.code+'">'+esc(c.name)+'</option>'; }).join('')+
      '</select></div>';
  var 업무칸 = useTask
      ? '<div class="field"><label class="fl'+(f.code==='ADD'?' req':'')+'">관련 업무</label>'+
        '<select id="dfTask">'+
          (f.code==='ADD' ? '<option value=""></option>' : '<option value="">없음</option>')+
          tasks.map(function(t){ return '<option value="'+t.id+'">'+esc(t.title)+'</option>'; }).join('')+
        '</select></div>'
      : '<input type="hidden" id="dfTask" value="">';

  /* ★ 제목 칸 (v42에서 되살림).
     자동 생성만 남겼더니 '지출 57,680원 · 콩나물 350g' 처럼 첫 품목만 남아
     무슨 지출인지 알 수 없었다. 판단이 틀렸으므로 되돌린다.
     빈칸으로 두지 않고 자동 제목을 미리 채워둔다 — 그대로 두면 그게 저장되고,
     고치면 고친 것이 저장된다. 한 번이라도 직접 건드리면 그때부터 덮어쓰지 않는다. */
  var 제목칸 = '<div class="field"><label class="fl req">제목</label>'+
     '<input type="text" id="dfTitle" oninput="DF_TITLE_TOUCHED=1"></div>';

  // 양식별 항목
  var 항목들='';
  (f.fields||[]).forEach(function(fd,i){
    var id='fd_'+i;
    항목들+='<div class="field"><label class="fl'+(fd.req?' req':'')+'">'+esc(fd.name)+'</label>';
    if(fd.kind==='선택'){
      항목들+='<select id="'+id+'" data-name="'+esc(fd.name)+'" class="dfField">'+
         (fd.req?'':'<option value=""></option>')+
         fd.opts.map(function(o){ return '<option value="'+esc(o)+'">'+esc(o)+'</option>'; }).join('')+
         '</select>';
    } else if(fd.kind==='여러줄'){
      항목들+='<textarea id="'+id+'" data-name="'+esc(fd.name)+'" class="dfField"></textarea>';
    } else if(fd.kind==='날짜'){
      /* 휴가 시작일을 고르면 종료일이 같이 따라온다 (하루짜리가 대부분) */
      var 따라감 = (f.code==='LEAVE' && fd.name==='시작일') ? ' onchange="leaveSyncEnd()"' : '';
      항목들+='<input type="date" id="'+id+'" data-name="'+esc(fd.name)+'" class="dfField"'+따라감+'>';
    } else if(fd.kind==='숫자'){
      항목들+='<input type="number" id="'+id+'" data-name="'+esc(fd.name)+'" class="dfField">';
    } else {
      항목들+='<input type="text" id="'+id+'" data-name="'+esc(fd.name)+'" class="dfField">';
    }
    항목들+='</div>';
  });

  var 내역='';
  if(f.useItems){
    /* ★ 내역은 반드시 한 줄 이상 있어야 상신됩니다 (금액도 0원이면 막힙니다).
       그런데 구역 제목이라 * 가 없어서, 상신을 눌러야만 알 수 있었습니다 (v55에서 붙임)
       ★ 머리줄 한 번 (2026-09-09) — 세 칸에 라벨이 없어 금액 칸에 품목을 쓰는 일이 있었습니다. */
    내역='<h4 class="sech req">'+esc(f.itemsTitle)+'</h4>'+
       '<div class="grid3 ithead"><span>품목</span><span>일자</span><span>금액</span></div>'+
       '<div id="dfItems"></div>'+
       '<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px">'+
       '<button class="btn sm" onclick="addItem()">'+ic('plus')+'줄 추가</button>'+
       '<span id="dfTotal" class="sub"></span></div>';
  }

  /* ★★ 사진 칸은 **모든 양식**에 있습니다 (2026-09-11 대표님 지시).
       2026-09-11 까지는 지출·구매·추가공사에만 그리고 인감·휴가에는 안 그렸습니다.
       그런데 휴가 신청서에 진단서·청첩장을, 인감 품의서에 날인할 서류 사진을
       붙일 일이 있습니다. 서버(api_saveDoc)는 원래부터 양식과 상관없이 사진을 받아
       `첨부` 시트에 남기고, 상세 화면도 그것을 그대로 보여줍니다 — 화면 작성 창만 막고 있었습니다.
       ★ 필수는 영수증이 필요한 양식(지출결의서)뿐입니다. 나머지는 붙이고 싶을 때만.
       `결재시험` ⑭ · `화면튼튼시험` ⑮ 가 이것을 지킵니다. */
  /* ★ 결재 첨부만 PDF 도 받습니다 (2026-09-11). `accept` 에 pdf 가 있는 칸에서만
       photoAdd 가 PDF 를 담습니다 — 기록·공지 칸에 PDF 를 넣으면 '사진만' 이라고 알립니다. */
  var 사진칸='<div class="field" style="margin-top:14px"><label class="fl'+

  photoClear('dfPhoto');

  var 비고칸='<div class="field"><label class="fl">비고</label><input type="text" id="dfMemo"></div>';
  /* ★ 비용 분류는 **품목 줄마다** 고릅니다 (addItem · 2026-09-22 Astra 지적).
     문서에 한 칸만 두면 광고비와 식대가 같이 광고비로 저장됩니다.
     지출결의서·구매요청서에만 있고, 안 고르면 '미분류' — 막지 않습니다. */
  /* 인감 체크는 지출·구매·추가공사에만 (2026-09-09). 휴가에 인감이 필요한 경우는 없습니다 —
     칸이 하나 더 있는 것보다 "내가 모르는 뭔가가 있나" 하고 멈추게 하는 것이 문제였습니다. */
  var 인감칸 = useTask

      : '';

  h+='<input type="hidden" id="dfCode" value="'+esc(f.code)+'">';

    /* 지출·구매·추가공사: 내역이 첫 자리. 추가공사의 관련 업무는 필수라 위에 둔다 */

  } else {
    /* 인감·휴가: 항목이 곧 본문. 사진은 접기 밖 — 붙이려는 사람이 찾아야 하면 안 붙입니다 */
    h+=제목칸+ 항목들+ 업무칸+ 사진칸+
       foldBox('doc:more', '그 밖에', 법인칸+ 비고칸);
  }
  h+='<div class="actions"><button class="btn" onclick="closeModal()">취소</button>'+
    '<button class="btn pri" id="dfSave" onclick="saveDoc()">상신</button></div>'+
    '<p class="muted" id="dfMsg" style="margin-top:8px"></p></div></div>';

  $('modal').innerHTML=h;
  DF_TITLE_TOUCHED=0;
  LEAVE_FILLED='';        // 창을 새로 열 때마다 초기화 (앞 창의 값이 남으면 안 된다)

  /* 무엇을 고치든 자동 제목을 다시 만든다.
     칸마다 oninput 을 붙이지 않고 창 전체에서 한 번만 듣는다
     (＋줄 추가로 나중에 생기는 칸도 저절로 걸린다) */
  var sheet=$('modal').querySelector('.sheet');
  if(sheet){
    sheet.addEventListener('input', syncDocTitle, true);
    sheet.addEventListener('change', syncDocTitle, true);

  if(prefill){
    [].forEach.call(document.querySelectorAll('.dfField'), function(el){
      var v=prefill[el.dataset.name];
      if(v!=null && v!=='') el.value=v;
    });
  }
  if(f.useItems) addItem();
  syncDocTitle();
}

/* ---- 자동 제목 (v42) ---- */
var DF_TITLE_TOUCHED=0;

/** 사용자가 제목을 직접 건드렸으면 그때부터 덮어쓰지 않는다 */
function syncDocTitle(e){
  if(e && e.target && e.target.id==='dfTitle') return;
  if(DF_TITLE_TOUCHED) return;
  var el=$('dfTitle'); if(!el) return;
  el.value=autoDocTitle();
}

/** 서버의 docTitle_ 과 같은 규칙. 지출·구매는 품목이 2개 이상이면 '외 N건' 을 붙인다 */
function autoDocTitle(){
  var code=$('dfCode')? $('dfCode').value : '';
  var f=null; (S.meta.forms||[]).forEach(function(x){ if(x.code===code) f=x; });

  var fields={};
  [].forEach.call(document.querySelectorAll('.dfField'),function(el){
    fields[el.dataset.name]=el.value;
  });

  var items=[], box=$('dfItems');
  if(box){
    [].forEach.call(box.children,function(r){
      var m=r.querySelector('.itMemo').value.trim();
      var a=moneyVal(r.querySelector('.itAmt'));
      if(m||a) items.push({ memo:m, amount:a });
    });
  }
  var total=0; items.forEach(function(i){ total+=Number(i.amount||0); });

  var money = total? (won(total)+'원') : '';
  var first = items.length? String(items[0].memo||'').trim() : '';
  var more  = items.length>1? ('외 '+(items.length-1)+'건') : '';
  var join=function(arr,sep){
    return arr.filter(function(x){ return x && String(x).trim(); }).join(sep);
  };

  var t='';
  if(code==='EXP'||code==='PUR'){
    t=join([join([(code==='EXP')?'지출':'구매', money],' '), join([first,more],' ')],' · ');
  } else if(code==='ADD'){
    var tn='', sel=$('dfTask');
    if(sel && sel.value){
      (S.data? S.data.tasks:[]).forEach(function(x){ if(x.id===sel.value) tn=x.title; });
    }
    t=join([tn, join(['추가공사', money],' ')],' ');
  } else if(code==='SEAL'){
    t=join([fields['날인 문서명']||'', '인감 날인'],' ');
  } else if(code==='LEAVE'){
    var s=String(fields['시작일']||''), e2=String(fields['종료일']||'')||s;
    var span='';
    if(s) span=(e2 && e2!==s)? (s.substring(5)+'~'+e2.substring(5)) : s.substring(5);
    t=join([fields['휴가종류']||'', span],' ');
  } else {
    t=join([f? f.name:'', money, first],' · ');
  }
  t=String(t).trim();
  return t || (f? f.name : code);
}

/* 휴가는 하루짜리가 대부분입니다.
   시작일을 고르면 종료일을 같이 채워 둡니다 — 여러 날이면 종료일만 고치면 됩니다.

   ★ 사람이 종료일을 직접 고쳐 두었으면 건드리지 않습니다.
     (직접 고쳤는지는 '방금 우리가 채워 넣은 값 그대로인가' 로 봅니다) */
var LEAVE_FILLED='';

function leaveSyncEnd(){
  var from=null, to=null;
  [].forEach.call(document.querySelectorAll('.dfField'), function(el){
    if(el.dataset.name==='시작일') from=el;
    if(el.dataset.name==='종료일') to=el;
  });
  if(!from || !to) return;
  if(!to.value || to.value===LEAVE_FILLED) to.value=from.value;
  LEAVE_FILLED=from.value;
}

function saveDoc(){
  var code=$('dfCode').value;
  var f=null; (S.meta.forms||[]).forEach(function(x){ if(x.code===code) f=x; });
  var msg=$('dfMsg');

  /* 사진이 아직 안 담겼으면 막는다. 버튼도 잠그고 있지만 이중으로 본다 */
  if(PHOTO_BUSY > 0){ msg.textContent='사진을 정리하는 중입니다. 잠시만 기다려 주세요.'; return; }

  var items=[];
  var box=$('dfItems');
  if(box){
    [].forEach.call(box.children,function(r){
      var m=r.querySelector('.itMemo').value.trim();
      /* ★ 금액 칸이 비었으면 0 이 아니라 빈 값 — 서버가 빈 칸으로 남겨 '금액 없음' 으로 보입니다 (2026-09-22) */
      var 금액칸=String(r.querySelector('.itAmt').value||'').replace(/[^0-9]/g,'');
      var a=금액칸 ? moneyVal(r.querySelector('.itAmt')) : '';
      /* 품목마다 고른 비용 분류 (지출·구매만 칸이 있다). 서버가 모르는 값은 버린다 */
      var c=r.querySelector('.itCat');
      if(m||a) items.push({ memo:m, date:r.querySelector('.itDate').value, amount:a, cat:c? c.value : '' });
    });
  }

  var fields={};
  [].forEach.call(document.querySelectorAll('.dfField'),function(el){
    fields[el.dataset.name]=el.value;
  });

  /* ★ 하루짜리 휴가는 시작일만 고르면 됩니다.
     종료일을 비워 두면 그날 하루로 봅니다 (서버도 같은 규칙입니다). */
  if(code==='LEAVE' && fields['시작일'] && !fields['종료일']) fields['종료일']=fields['시작일'];

  var titleEl=$('dfTitle');
  var title=titleEl? titleEl.value.trim() : '';

  var sealChk=$('dfSeal');
  var p={ formCode:code, corp:$('dfCorp').value, taskId:$('dfTask')?$('dfTask').value:'',
          title:title, memo:$('dfMemo').value, items:items, fields:fields,
          needSeal: !!(sealChk && sealChk.classList.contains('on')) };


  /* ★ 막는 규칙은 서버(api_saveDoc)와 똑같이 맞춰 둡니다 (v55).
     예전에는 제목·내역·영수증 셋만 화면에서 보고, 양식별 필수 칸과
     추가공사의 관련 업무는 **서버까지 갔다가** 되돌아왔습니다.
     지출결의서는 그 사이에 영수증 사진을 2400px 로 줄여 올린 뒤라
     사람이 한참 기다리다 '입력해주세요' 를 봤습니다. */
  function stop(text, id){
    msg.textContent=text;
    var el=id? $(id):null;
    if(el){ el.classList.add('err'); el.focus(); }
    return true;
  }
  [].forEach.call(document.querySelectorAll('#modal .err'), function(e){ e.classList.remove('err'); });

  if(!title) return void stop('제목을 입력해주세요.', 'dfTitle');

  // 양식이 요구하는 칸 (양식항목 시트의 '필수')
  var miss=null;
  ((f && f.fields) || []).forEach(function(fd, i){
    if(miss) return;
    if(fd.req && !String(fields[fd.name]||'').trim()) miss={ name:fd.name, id:'fd_'+i };
  });
  if(miss) return void stop(miss.name+'을(를) 입력해주세요.', miss.id);

  // 추가공사는 어느 업무인지 반드시 고른다 (서버도 같은 것을 본다)
  if(code==='ADD' && !p.taskId) return void stop('어느 업무의 추가공사인지 골라주세요.', 'dfTask');

  /* 휴가는 날짜 앞뒤를 본다. 서버(api_saveDoc)도 같은 것을 다시 본다 (v55) */
  if(code==='LEAVE'){
    var lFrom=String(fields['시작일']||'').trim(), lTo=String(fields['종료일']||'').trim();
    if(lFrom && lTo && lTo < lFrom){
      var bad=null;
      ((f && f.fields)||[]).forEach(function(fd,i){ if(fd.name==='종료일') bad='fd_'+i; });
      return void stop('종료일이 시작일보다 앞설 수 없습니다.', bad);
    }
  }

  if(f && f.useItems){
    if(!items.length) return void stop(f.itemsTitle+'을(를) 한 줄 이상 입력해주세요.');
    var sum=0; items.forEach(function(it){ sum+=Number(it.amount||0); });
    if(sum<=0){
      var first=$('dfItems')? $('dfItems').querySelector('.itAmt') : null;
      msg.textContent='금액을 입력해주세요.';
      if(first){ first.classList.add('err'); first.focus(); }
      return;
    }
  }
  /* 사진은 고르는 순간 이미 줄여서 담아 두었다 (photoAdd).
     그래서 상신을 누른 뒤에는 기다릴 것이 없다. */
  var shots = photoValues('dfPhoto');
  var pdfs = photoFiles('dfPhoto');               // PDF 첨부 (2026-09-11)
  if(f && f.needReceipt && !shots.length && !pdfs.length){
    return void stop('영수증 사진을 첨부해주세요.', 'dfPhoto');
  }

  /* 돈이 걸린 동작이라 낙관 처리하지 않는다. 서버 확인 후 닫는다.
     대신 버튼을 잠가 두 번 눌리지 않게 하고, 서버는 저장까지만 하고 바로 응답한다. */
  var btn=$('dfSave');
  if(btn.disabled) return;
  btn.disabled=true; btn.textContent='상신 중...'; msg.textContent='';

  if(shots.length+pdfs.length) msg.textContent='첨부 '+(shots.length+pdfs.length)+'개 올리는 중입니다...';
  p.photos = shots;
  p.files = pdfs;

  call('api_saveDoc', S.token, p, S.corp).then(function(r){
    btn.disabled=false; btn.textContent='상신';
    if(!r.ok){ msg.textContent=r.msg; return; }
    closeOk();
    toast(r.sealNo? '상신되었습니다 · 인감 날인 품의서도 같이 올라갔습니다' : '상신되었습니다');
    addDocLocal(r);                       // 결재 목록은 화면이 가진 값으로 먼저 갱신
    if(S.view==='doc') renderDocs();
    softRefresh();                        // 진짜 데이터는 뒤에서 조용히
  });
}

/** 방금 올린 문서를 화면 목록에 먼저 얹는다 (서버 board 를 기다리지 않는다) */
function addDocLocal(r){
  if(!S.data) return;
  if(!S.data.docs) S.data.docs={toAct:[],drafts:[],others:[]};
  var who=r.who||(S.me&&S.me.name)||'';
  function row(no,title,amount,formName){
    return { no:no, title:title, amount:amount||0, corp:r.corp, formName:formName,
             status:'진행중', who:who, at:r.at, canAct:false, canRead:false, proxy:false };

  var rows=[row(r.no, r.title, r.amount, r.formName)];
  if(r.sealNo) rows.push(row(r.sealNo, r.sealTitle||'인감 날인', 0, '인감 날인 품의서'));
  S.data.docs.drafts=rows.concat(S.data.docs.drafts||[]);
}

var PUSH = { ready:false, token:'', busy:false };

/** 아이폰인가 */
function isIOS(){
  return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
         (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
}
/** 홈 화면에 추가해서 연 것인가 */
function isInstalled(){
  try{
    return window.matchMedia('(display-mode: standalone)').matches ||
           window.navigator.standalone === true;
  }catch(e){ return false; }
}

/** 지금 이 기기의 상태를 한 줄로 */
function pushState(){
  var conf=(S.meta && S.meta.push) || null;
  if(!conf || !conf.on) return { can:false, why:'서버에 아직 안 켜져 있습니다' };
  if(!('Notification' in window) || !('serviceWorker' in navigator)){
    return { can:false, why:'이 브라우저는 알림을 지원하지 않습니다' };
  }
  if(isIOS() && !isInstalled()){
    return { can:false, why:'아이폰은 홈 화면에 추가한 뒤에만 알림이 옵니다',
             how:'사파리 아래 공유 버튼 → 홈 화면에 추가' };
  }
  if(Notification.permission==='denied'){
    return { can:false, why:'이 기기에서 알림을 차단해 두었습니다',
             how:'폰 설정에서 이 사이트의 알림을 허용해 주세요' };
  }
  return { can:true, on: Notification.permission==='granted' && !!PUSH.token };
}

/** 설정 화면의 알림 칸을 그린다 */
function renderPush(){
  var box=$('pushBox'); if(!box) return;
  var conf=(S.meta && S.meta.push) || null;

  /* 서버에 안 켜져 있으면 이 자리를 아예 만들지 않는다 (0건인 구역은 그리지 않는다) */
  if(!conf || !conf.on){ box.innerHTML=''; return; }

  var st=pushState();
  var h='<div class="field"><label class="fl">폰 알림</label>';

  if(!st.can){

       (st.how? '<p class="b" style="margin:4px 0 0">'+esc(st.how)+'</p>':'')+'</div>';
  }else if(st.on){
    h+='<div class="chks"><label class="on">이 기기에서 받는 중</label></div>'+
       '<div style="margin-top:6px"><button class="btn sm" onclick="pushOff()">그만 받기</button></div>';
  }else{
    h+='<div><button class="btn pri" id="pushBtn" onclick="pushOn()">알림 받기</button></div>';
  }
  box.innerHTML=h+'</div>';
}

/** firebase 를 처음 한 번만 불러온다 */
function pushLoad(){
  if(PUSH.ready) return Promise.resolve(true);
  var conf=(S.meta && S.meta.push) || null;
  if(!conf || !conf.on) return Promise.resolve(false);

  function 넣기(src){
    return new Promise(function(res, rej){
      var s=document.createElement('script');
      s.src=src; s.onload=function(){ res(); }; s.onerror=function(){ rej(new Error(src)); };
      document.head.appendChild(s);
    });
  }

  var 판='10.12.2';
  return 넣기('https://www.gstatic.com/firebasejs/'+판+'/firebase-app-compat.js')
    .then(function(){ return 넣기('https://www.gstatic.com/firebasejs/'+판+'/firebase-messaging-compat.js'); })
    .then(function(){
      firebase.initializeApp({
        apiKey: conf.apiKey, projectId: conf.projectId,
        appId: conf.appId, messagingSenderId: conf.senderId
      });
      PUSH.ready=true;
      return true;
    })
    .catch(function(e){ quiet('푸시 불러오기', e); return false; });
}

/** [알림 받기] */
function pushOn(){
  if(PUSH.busy) return;
  PUSH.busy=true;
  var btn=$('pushBtn'); if(btn){ btn.disabled=true; btn.textContent='허락을 기다리는 중...'; }

  Notification.requestPermission().then(function(p){
    if(p!=='granted'){ throw new Error('허락하지 않았습니다'); }
    return pushLoad();
  }).then(function(ok){
    if(!ok) throw new Error('알림 준비를 못 했습니다');
    return navigator.serviceWorker.ready;
  }).then(function(reg){
    var conf=S.meta.push;
    return firebase.messaging().getToken({ vapidKey: conf.vapid, serviceWorkerRegistration: reg });
  }).then(function(t){
    if(!t) throw new Error('기기 주소를 받지 못했습니다');
    PUSH.token=t;
    return call('api_savePush', S.token, t, navigator.userAgent.substring(0,60));
  }).then(function(r){
    if(!r || !r.ok) throw new Error((r&&r.msg)||'저장하지 못했습니다');
    toast('이제 이 기기로 알림이 옵니다');
  }).catch(function(e){
    toast(e.message||'알림을 켜지 못했습니다', 'bad');
    quiet('푸시 켜기', e);
  }).then(function(){
    PUSH.busy=false;
    renderPush();
  });
}

/** [그만 받기] — 이 기기만 */
function pushOff(){
  if(PUSH.busy) return;
  PUSH.busy=true;
  var t=PUSH.token;
  PUSH.token='';
  renderPush();
  call('api_dropPush', S.token, t).then(function(){
    PUSH.busy=false;
    toast('이 기기로는 알림이 오지 않습니다');
  });
}

/** 판을 그릴 때마다 부르지 않게 한 번만 */
var PUSH_ONCE=false;
function pushOnce(){
  if(PUSH_ONCE || !S.token) return;
  PUSH_ONCE=true;
  pushRefresh();
}

/** 앱을 열 때 — 이미 허락해 둔 기기면 조용히 주소표를 새로 받아 둔다.
    ★ 주소표는 가끔 바뀝니다. 안 갱신하면 어느 날부터 조용히 안 옵니다. */
function pushRefresh(){
  var conf=(S.meta && S.meta.push) || null;
  if(!conf || !conf.on) return;
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  if(isIOS() && !isInstalled()) return;

  pushLoad().then(function(ok){
    if(!ok) return null;
    return navigator.serviceWorker.ready;
  }).then(function(reg){
    if(!reg) return null;
    return firebase.messaging().getToken({ vapidKey: conf.vapid, serviceWorkerRegistration: reg });
  }).then(function(t){
    if(!t) return;
    PUSH.token=t;
    return call('api_savePush', S.token, t, navigator.userAgent.substring(0,60));
  }).catch(function(e){ quiet('푸시 갱신', e); });
}

function paintVendors(){

  applyTheme();
  renderPush();                  // 폰 알림 (서버에 안 켜져 있으면 아예 안 그린다)
  [].forEach.call($('themePick').children,function(l){
    l.onclick=function(){ setTheme(l.dataset.v); };
  });
  if(paintAdminOnly()) paintPerf();
  // 한 번 받아둔 게 있으면 즉시 그린다 (왕복 0회). 최신 값은 뒤에서 갈아끼운다
  if(S.setCache){
    paintSettings(S.setCache);
    /* 설정·직원·서명이 그대로면 다시 받지 않는다 (v43).
       예전에는 설정 화면에 들어올 때마다 무조건 한 번 더 받았다. */
    if(S.setCache.vers && S.setCache.vers.set && S.setCache.vers.set===areaVer('set')) return;
  }
  else {
    var me0=S.me||{};
    $('meInfo').innerHTML='<p><b>'+esc(me0.name||'')+'</b> '+esc(me0.rank||'')+
      (me0.dept?' · '+esc(me0.dept):'')+'</p>'+
      '<p class="sub">'+esc(me0.phone||'')+' · '+gradeName(me0.grade)+'</p>';
    $('adminBox').innerHTML='';
    if($('adminTop')) $('adminTop').innerHTML='';
  }

  call('api_settings', S.token).then(function(r){
    /* ★ 예전에는 ok 를 보지 않고 그대로 그렸습니다 (v54에서 고침).
       불러오기가 실패하면 옛 값이 그대로 남아 있는데 사람은 최신인 줄 압니다.
       관리자가 직원 등급을 바꾸려다 낡은 목록을 보는 일이 생깁니다. */
    if(!r || !r.ok){
      if(r && r.me) paintSettings(r);         // 등급이 낮아 관리자 구역만 못 보는 경우
      else toast('설정을 불러오지 못했습니다. 잠시 후 다시 열어주세요.');
      return;
    }
    S.setCache=r;
    paintSettings(r);
  });
}

function paintSettings(r){
    if(r.me) S.me=r.me;

    var me=S.me||{};
    /* 등급 숫자는 사람에게 보여주지 않습니다 — `현장` 만으로 충분합니다 (2026-09-09).
       숫자는 관리자의 직원 정보 창에서만 봅니다. */
    $('meInfo').innerHTML='<p><b>'+esc(me.name||'(이름 없음)')+'</b> '+esc(me.rank||'')+
      (me.dept?' · '+esc(me.dept):'')+'</p>'+
      '<p class="sub">'+esc(me.phone||'')+' · '+gradeName(me.grade)+'</p>';
    $('verText').textContent='버전 '+((S.meta&&S.meta.version)||'')+
      ((S.meta&&S.meta.code)? ' · 코드 '+S.meta.code : ' · 코드 (옛 버전)');

    /* 서버가 준 등급으로 다시 정합니다 (여기가 최종입니다) */
    var 관리자 = paintAdminOnly();
    if(관리자) paintPerf();

    if(!r.ok || !관리자){
      /* ★ `관리자 설정은 권한등급 9에서만 보입니다` 라고 적어 두지 않습니다.
         그 한 줄이 곧 '여기 뭔가 더 있다' 는 안내가 됩니다. 그냥 비웁니다. */
      $('adminBox').innerHTML='';
      if($('adminTop')) $('adminTop').innerHTML='';
      return;
    }
    paintAdmin(r);
}

function gradeName(g){
/* ★ 등급 이름은 **`[권한]` 창의 목록과 글자까지 같아야** 합니다 (2026-09-03).
   예전에는 목록은 `1 · 현장` 인데 여기만 `사원` 이라, 같은 사람이 화면 위쪽에서는
   `사원`, 권한 창에서는 `현장` 으로 보였습니다.
   ★ 등급(현장·사무실·임원·관리자)과 직급(대표·전무·…·사원)은 **다른 축**입니다.
     `RANK_ORDER` 의 `사원` 은 직급이라 그대로 둡니다. */
  return ({0:'게스트',1:'현장',2:'사무실',3:'임원',9:'관리자'})[g] || '미설정';
}

function paintAdmin(r){
    if(!r.ok){ $('adminBox').innerHTML='<p class="muted">'+esc(r.msg||'')+'</p>'; return; }
    var st=r.settings;
    var h='';
    S.staffCache=r.staff;

    /* ── 위쪽: 매일 누르는 것 (2026-09-09) ────────────────────────────
       승인 대기 → 직원 → 거래처·접속 기록. `#adminTop` 에 그립니다. */
    var top='';
    var wait=r.staff.filter(function(s){ return s.state==='승인대기'; });
    if(wait.length){
      top+='<h4 class="sech hot">승인 대기 '+wait.length+'명</h4>';
      wait.forEach(function(s){
        top+='<div class="lrow plain">'+
           '<div class="m"><p class="t">'+esc(s.name)+'</p>'+
           '<p class="b">'+esc(s.phone)+'</p></div>'+
           '<div class="r" style="display:flex;gap:var(--sp-2)">'+
           '<button class="btn dg sm" onclick="rejectStaff(\''+s.phone+'\',\''+esc(s.name)+'\')">거절</button>'+
           '<button class="btn pri sm" onclick="approveStaff(\''+s.phone+'\',\''+esc(s.name)+'\')">승인</button>'+
           '</div></div>';
      });
    }
    /* ★ 직원 한 줄에 버튼은 **하나** (2026-09-09). 예전에는 [권한] [대리인] [초기화] × 6명 = 18개였고,
       급여를 넣으려면 `권한` 을 눌러야 한다는 것을 알 수 없었습니다.
       부서·직급·급여·등급·재직·대리인·PIN 초기화가 전부 `정보` 창 하나에 있습니다. */
    var members=r.staff.filter(function(s){ return s.state!=='승인대기'; });
    top+='<h4 class="sech">직원 '+members.length+'명</h4>';
    members.forEach(function(s){
      top+='<div class="lrow plain">'+

         '<p class="b">'+esc(s.phone)+' · '+gradeName(s.grade)+

         '<div class="r"><button class="btn sm" onclick="openStaff(\''+s.phone+'\')">정보</button></div></div>';
    });
    top+='<div class="actions" style="margin:14px 0 4px">'+
        /* 거래처 (2026-09-08). 지출결의서 드롭다운이 여기서 채워집니다 */
        '<button class="btn" onclick="openVendors()">거래처</button>'+
        /* 누가 언제 들어왔는지 (2026-09-02). 누를 때만 불러옵니다 */
        '<button class="btn" onclick="openAccess()">접속 기록</button>'+
      '</div>';
    if($('adminTop')) $('adminTop').innerHTML=top;

    /* ── 아래쪽: 처음 설정 (접힘) ── */

    /* ★ 캐시에 못 담고 있는 시트 (v43).
       시트가 캐시 한 칸 한도(100KB)를 넘으면 그 시트만 조용히 예전 방식으로 돌아간다.
       느려질 뿐 틀리지는 않지만, 조용하면 아무도 모르므로 여기에 띄운다. */
    if(r.big && r.big.length){

         '<p class="secw">'+
         '캐시에 담기엔 커진 시트</p>'+
         '<p class="sub" style="margin:0;font-size:var(--fs-sm)">'+
         esc(r.big.map(function(b){
           return b.name+' '+Math.round(b.bytes/1024)+'KB';
         }).join(' · '))+
         '</p><p class="muted" style="margin:4px 0 0;font-size:var(--fs-sm)">'+
         '이 시트는 매번 시트에서 직접 읽습니다. 오래된 줄을 정리하면 다시 빨라집니다.</p></div>';
    }

    // 지금 어느 스프레드시트를 보고 있는지 (프로젝트가 둘이라 헷갈린 적이 있다)
    if(r.ss && r.ss.id){
      h+='<h4 class="sech">지금 연결된 스프레드시트</h4>'+

    // 법인 도장 — 최종 승인되는 순간 시스템이 문서에 찍는다
    h+='<h4 class="sech">법인 도장</h4>';
    ((r.corps)||[]).forEach(function(c){
      var url=(r.signs||{})[c.code]||'';
      h+='<div class="lrow plain">'+
         '<div class="m"><p class="t">'+esc(c.name)+'</p><p class="b">'+esc(c.code)+'</p></div>'+

         (url?'교체':'등록')+'</button></div></div>';
    });

    /* ★ 단가 (2026-09-02) — 여기를 채우면 그때부터 업무 카드에 '남는 것' 이 뜹니다.
       비워 두면 그 항목은 세지 않습니다. */
    /* ★ 저장 버튼은 구역마다 **하나** (2026-09-09). 칸마다 `저장` 이 아홉 개 서 있었고,
       하나 고치고 안 누르면 조용히 안 저장됐습니다. 바뀐 칸만 보냅니다. */
    var 단가키=['기공일당','조공일당','장비일당','폐기물톤당'];
    h+='<h4 class="sech">단가</h4>'+
      cfg('기공일당','기공 하루 품삯 (원)',st['기공일당'])+
      cfg('조공일당','조공 하루 품삯 (원)',st['조공일당'])+
      cfg('장비일당','장비 하루 대여료 (원)',st['장비일당'])+
      cfg('폐기물톤당','폐기물 1톤 처리비 (원)',st['폐기물톤당'])+
      '<div class="actions"><button class="btn pri sm" onclick="saveCfgGroup(\''+단가키.join(',')+'\')">저장</button></div>';

    var 관리키=['출퇴근시트ID','출퇴근시트명','견적시트ID','폰트URL_제목','폰트URL_숫자'];
    h+='<h4 class="sech">연결</h4>'+
      cfg('출퇴근시트ID','출퇴근앱 스프레드시트 ID',st['출퇴근시트ID'])+
      cfg('출퇴근시트명','출퇴근 기록 시트 이름',st['출퇴근시트명'])+
      cfg('견적시트ID','현장견적 스프레드시트 ID',st['견적시트ID'])+
      cfg('폰트URL_제목','제목 글꼴 주소 (비우면 앱에 들어있는 것)',st['폰트URL_제목'])+
      cfg('폰트URL_숫자','숫자 글꼴 주소 (비우면 제목 것)',st['폰트URL_숫자'])+
      '<div class="actions"><button class="btn pri sm" onclick="saveCfgGroup(\''+관리키.join(',')+'\')">저장</button></div>'+
      '<div class="actions" style="margin:14px 0 0">'+
        '<button class="btn" id="syncBtn" onclick="syncNow()">지금 연동 동기화</button>'+
        '<button class="btn" onclick="refreshMeta()">기준정보 새로고침</button>'+
      '</div>'+
      '<p class="muted" id="syncMsg" style="font-size:var(--fs-sm);margin:4px 0 8px"></p>';

    $('adminBox').innerHTML=h;
}
/* ---- 사용 신청 승인 · 거절 (관리자만, v46b) ----
   판정은 서버가 다시 합니다 (가입승인.js 관리자확인_).
   화면에서 버튼을 숨기는 것으로 막지 않습니다. */
function approveStaff(phone, name){
  call('api_approve', S.token, phone).then(function(r){
    toast(r.ok? (name+'님을 승인했습니다') : r.msg);
    if(!r.ok) return;
    S.setCache=null;            // 낡은 목록으로 한 번 그렸다가 바뀌는 깜빡임을 없앤다
    renderSettings();
  });
}

function rejectStaff(phone, name){
  if(!confirm(name+'님의 신청을 거절할까요?\n명부에서 지워지고 되돌릴 수 없습니다.')) return;
  call('api_reject', S.token, phone).then(function(r){
    toast(r.ok? (name+'님의 신청을 거절했습니다') : r.msg);
    if(!r.ok) return;
    S.setCache=null;
    renderSettings();
  });
}

/* ---- 직원 권한 (관리자만, v46b) ----
   부서·직급·등급·재직상태를 한 번에 저장합니다 (왕복 1회).
   ★ 직급에 '대표' 를 넣으면 결재 기본승인자로 잡힙니다. */
function openStaff(phone){
  var list=S.staffCache||[];
  var t=null; list.forEach(function(s){ if(s.phone===phone) t=s; });
  if(!t) return;

  var grades=[[1,'현장'],[2,'사무실'],[3,'임원'],[9,'관리자']];
  $('modal').innerHTML='<div class="veil"><div class="sheet">'+
    '<div class="sheethead"><h3 class="tt">'+esc(t.name)+'</h3></div>'+
    byline([t.phone])+
    '<div class="field"><label class="fl">부서</label>'+
    '<input type="text" id="stDept" value="'+esc(t.dept||'')+'"></div>'+
    '<div class="field"><label class="fl">직급</label>'+
    '<input type="text" id="stRank" value="'+esc(t.rank||'')+'"></div>'+
    /* ★ 급여 (2026-09-08) — 급여 초안을 뽑는 데만 씁니다.
       비워 두면 그 사람은 근무일만 나오고 금액은 빈칸입니다.
       0원이라고 우기지 않습니다 (단가를 안 넣으면 원가를 안 보내는 것과 같은 규칙). */
    '<div class="field"><label class="fl">급여형태</label><select id="stPayKind">'+
      [['','안 정함'],['일당','일당'],['월급','월급']].map(function(g){
        return '<option value="'+g[0]+'"'+((t.payKind||'')===g[0]?' selected':'')+'>'+g[1]+'</option>';
      }).join('')+
    '</select></div>'+
    '<div class="field"><label class="fl">급여액</label>'+
    '<input type="number" inputmode="numeric" id="stPayAmt" value="'+esc(t.payAmount||'')+'"></div>'+
    '<div class="field"><label class="fl">권한등급</label><select id="stGrade">'+
      grades.map(function(g){
        return '<option value="'+g[0]+'"'+(Number(t.grade)===g[0]?' selected':'')+'>'+
               g[0]+' · '+g[1]+'</option>';
      }).join('')+
    '</select></div>'+
    '<div class="field"><label class="fl">재직상태</label><select id="stState">'+
      ['재직','퇴사'].map(function(v){
        return '<option value="'+v+'"'+(t.state===v?' selected':'')+'>'+v+'</option>';
      }).join('')+
    '</select></div>'+
    /* ★ 대리인도 이 창에서 (2026-09-09). 예전에는 칸 하나짜리 창이 따로 있었습니다.
       A 의 대리인에 B 를 넣으면 B 가 A 몫의 결재를 승인·반려할 수 있습니다. 판정은 서버가 합니다. */
    '<div class="field"><label class="fl">대리인</label><select id="stDeputy" data-was="'+esc(t.deputy||'')+'">'+
      '<option value="">없음</option>'+
      list.filter(function(s){ return s.phone!==phone && s.state!=='퇴사' && s.state!=='승인대기'; })
          .map(function(s){
            return '<option value="'+s.phone+'"'+(s.phone===t.deputy?' selected':'')+'>'+
                   esc(s.name)+' '+esc(s.rank)+'</option>';
          }).join('')+
    '</select></div>'+
    '<div class="actions"><button class="btn" onclick="closeModal()">취소</button>'+
    '<button class="btn pri" id="stSave" onclick="saveStaff(\''+phone+'\')">저장</button></div>'+
    '<p class="muted" id="stMsg" style="margin-top:8px"></p>'+
    /* PIN 초기화는 드문 일이라 작은 글자 링크로 맨 아래에 */
    (t.hasPin
      ? '<p class="note t2"><button class="linkbtn" onclick="resetPin(\''+phone+'\',\''+esc(t.name)+'\')">PIN 초기화 (등록된 기기도 모두 해제)</button></p>'
      : '')+
    '</div></div>';
}

function saveStaff(phone){
  var btn=$('stSave'), msg=$('stMsg');
  if(!btn || btn.disabled) return;
  var list=S.staffCache||[];
  var t=null; list.forEach(function(s){ if(s.phone===phone) t=s; });
  if(!t) return;

  btn.disabled=true; msg.textContent='저장 중입니다...';
  var dp=$('stDeputy');
  var 대리바뀜 = dp && dp.value !== String(dp.dataset.was||'');
  call('api_saveStaff', S.token, {
    phone: phone, name: t.name,
    dept: $('stDept').value.trim(), rank: $('stRank').value.trim(),
    grade: Number($('stGrade').value), state: $('stState').value,
    payKind: $('stPayKind').value, payAmount: $('stPayAmt').value.trim()
  }).then(function(r){
    if(!r.ok){ btn.disabled=false; msg.textContent=r.msg; return null; }
    /* 대리인은 바뀌었을 때만 한 번 더 — 평소에는 왕복 1회 그대로입니다 */
    return 대리바뀜 ? call('api_setDeputy', S.token, phone, dp.value) : {ok:true};
  }).then(function(r){
    if(!r) return;
    btn.disabled=false;
    if(!r.ok){ msg.textContent=r.msg||'대리인을 저장하지 못했습니다'; return; }
    closeOk(); toast('저장되었습니다');
    S.setCache=null;
    renderSettings();
  });
}

/* ---- 법인 도장 그리기 (관리자만) ---- */
var SIGN={ on:false, ctx:null, last:null };

function openSignPad(corp, name){
  $('modal').innerHTML='<div class="veil"><div class="sheet">'+
    '<div class="sheethead"><h3 class="tt">'+esc(name)+' 도장</h3>'+
    '<button class="btn sm" onclick="closeModal()">닫기</button></div>'+
    '<canvas id="signPad" width="600" height="600" '+
    'style="width:100%;aspect-ratio:1/1;border:1px solid var(--line);border-radius:var(--r2);'+
    'background:#FFFFFF;touch-action:none;display:block"></canvas>'+
    '<div class="actions"><button class="btn" onclick="clearSign()">지우기</button>'+
    '<button class="btn pri" id="sgSave" onclick="saveSign(\''+corp+'\')">저장</button></div>'+
    '<p class="muted" id="sgMsg" style="margin-top:8px"></p></div></div>';
  setTimeout(initSign, 30);
}

function initSign(){
  var cv=$('signPad'); if(!cv) return;
  var ctx=cv.getContext('2d');
  ctx.lineWidth=10; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#C0272D';
  SIGN.ctx=ctx; SIGN.on=false; SIGN.last=null;

  function pos(e){
    var b=cv.getBoundingClientRect();
    var t=(e.touches&&e.touches[0])||e;
    return { x:(t.clientX-b.left)*(cv.width/b.width), y:(t.clientY-b.top)*(cv.height/b.height) };
  }
  function start(e){ e.preventDefault(); SIGN.on=true; SIGN.last=pos(e); }
  function move(e){
    if(!SIGN.on) return;
    e.preventDefault();
    var p=pos(e);
    ctx.beginPath(); ctx.moveTo(SIGN.last.x,SIGN.last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    SIGN.last=p;
  }
  function end(){ SIGN.on=false; SIGN.last=null; }

  cv.addEventListener('mousedown',start); cv.addEventListener('mousemove',move);
  window.addEventListener('mouseup',end);
  cv.addEventListener('touchstart',start,{passive:false});
  cv.addEventListener('touchmove',move,{passive:false});
  cv.addEventListener('touchend',end);
}

/* ── 이번 달 한 장 (2026-09-02) ────────────────────────────────
 *
 *  임원(3) 이상만 볼 수 있습니다. **판정은 서버가 합니다** —
 *  등급이 모자라면 아예 값이 내려오지 않습니다.
 *
 *  ★ 받아온 달은 담아 둡니다. 달을 앞뒤로 넘겨도 이미 본 달은 왕복 0회입니다.
 */
var MON = { ym:'', cache:{} };

function monthNow(){
  var d = new Date();
  return d.getFullYear() + '-' + p2(d.getMonth()+1);
}

function openMonthly(ym){
  MON.ym = ym || MON.ym || monthNow();
  drawMonthly();
  var got = MON.cache[MON.ym];
  if(got) return;
  var tk=taskTicket('');
  call('api_monthly', S.token, MON.ym).then(function(r){
    if(!ticketOk(tk)) return;                 // 그사이 계정·권한이 바뀌었으면 버린다
    if(!r || !r.ok){ toast((r&&r.msg)||'불러오지 못했습니다'); return; }
    MON.cache[MON.ym] = r;
    if(MON.ym === r.ym) drawMonthly();
  });
}

function monMove(n){
  var y = Number(MON.ym.substring(0,4));
  var m = Number(MON.ym.substring(5,7)) + n;
  while(m < 1){ m += 12; y -= 1; }
  while(m > 12){ m -= 12; y += 1; }
  openMonthly(y + '-' + p2(m));
}

function drawMonthly(){
  var r = MON.cache[MON.ym];
  var h = '<div class="veil"><div class="sheet">'+
    '<div class="sheethead">'+

      '<h3 class="tt" style="flex:1;text-align:center">'+esc(MON.ym)+'</h3>'+
      '<button class="btn sm" onclick="monMove(1)" aria-label="다음 달">'+ic('chev')+'</button>'+
      '<button class="btn sm" onclick="closeOk()">닫기</button>'+

  h += '<div class="stats">'+

    '<div><p class="k">완료 공급가</p><p class="num">'+won(r.sales)+'</p></div>'+
    '<div><p class="k">입금</p><p class="num">'+won(r.paid)+'</p></div>'+
    '<div><p class="k">미수금</p><p class="num" style="color:'+
      (r.unpaid>0?'var(--dg)':'')+'">'+won(r.unpaid)+'</p></div>'+
  '</div>';

  if(r.cost){
    h += '<div class="stats" style="margin-top:var(--sp-2)">'+
      '<div><p class="k">인건비</p><p class="num">'+won(r.cost.man)+'</p></div>'+
      '<div><p class="k">장비</p><p class="num">'+won(r.cost.eq)+'</p></div>'+
      '<div><p class="k">폐기물</p><p class="num">'+won(r.cost.waste)+'</p></div>'+
      '<div><p class="k">남는 것</p><p class="num" style="color:'+
        (r.margin<0?'var(--dg)':'')+'">'+(r.margin<0?'-':'')+won(Math.abs(r.margin))+'</p></div>'+

  if((r.sites||[]).length){

      h += '<div class="lrow" onclick="closeOk();openTask(&quot;'+s.id+'&quot;)">'+
        '<div class="m"><p class="t">'+esc(s.title)+'</p>'+
        byline([s.done?'완료':'', s.supply? '공급가 '+won(s.supply):'',
                s.cost? '원가 '+won(s.cost):'', s.tons? s.tons+'톤':''])+'</div>'+
        '<div class="r"><span class="v"'+(s.margin!=null&&s.margin<0?' style="color:var(--dg)"':'')+'>'+
        esc(오른)+'</span></div></div>';
    });
  }

  if((r.waste||[]).length){
    var 톤합 = 0;
    r.waste.forEach(function(w){ 톤합 += w.tons; });
    h += '<div class="sec">'+sechead('폐기물 대장', Math.round(톤합*10)/10+'톤')+'</div>';
    r.waste.forEach(function(w){
