}

/* 상세에서 [사진 첨부]·[진행률 변경] — 기존 기록 창으로. 쓰던 글은 들고 가고,
   그 창을 취소하고 돌아와도 적는 칸에 남는다 (TD_DRAFT). 저장되면 지운다. */
var TD_DRAFT={}, TD_SEQ={}, TD_N=0;
/* ★ 초안마다 번호표를 붙입니다 (2026-09-22 Astra 지적).
   늦게 온 서버 답이 그사이 새로 쓴 초안을 지우거나 덮어쓰지 않게 — 번호가 같을 때만 손댑니다. */
function draftSet(taskId, text){
  if(text){ TD_DRAFT[taskId]=text; TD_SEQ[taskId]=++TD_N; }
  else { delete TD_DRAFT[taskId]; delete TD_SEQ[taskId]; }
  return TD_SEQ[taskId]||0;
}
/** 보낸 글이 아직 그 초안이면 비운다 (새로 쓴 초안이면 그대로) */
function draftSent(taskId, seq){
  if(seq && TD_SEQ[taskId]===seq) draftSet(taskId, '');
}
/** 저장이 실패했을 때 — 그사이 새 초안이 없으면 보낸 글을 초안으로 되돌린다 */
function draftBack(taskId, text){
  if(text && !TD_DRAFT[taskId]) draftSet(taskId, text);
}
function tdLogWith(taskId, focus){
  var el=$('tdWrite');
  var text=el? String(el.value||'').trim() : '';
  var seq=draftSet(taskId, text);
  /* ★ 기록 창은 완료된 업무를 고를 수 없습니다. 그대로 열면 **다른 업무가 골라진 채**
     쓰던 글이 들어갑니다 (2026-09-22 Astra 지적). 열지 않고 초안은 그대로 둡니다. */
  var t=null;
  ((S.data && S.data.tasks) || []).forEach(function(x){ if(x.id===taskId) t=x; });
  if(!t || t.status==='완료'){ toast('완료된 업무에는 기록을 더할 수 없습니다'); return; }
  openLogForm(taskId, { text:text, focus:focus, seq:seq });
}

/* 기록 한 줄의 ⋯ — 지우기는 여기 안에. 권한(mine)과 확인 창은 예전 그대로 */
function fitemMenu(btn){
  var box=btn.parentNode, on=!box.classList.contains('on');
  [].forEach.call(document.querySelectorAll('#tdFlow .fmenu.on'), function(x){
    x.classList.remove('on');
    var b=x.querySelector('.fmore'); if(b) b.setAttribute('aria-expanded','false');
  });

  btn.setAttribute('aria-expanded', on?'true':'false');
}

/**
 * 기록과 댓글을 하나로 섞어 **오래된 것부터** 세운다 (2026-09-01에 뒤집음).
 * 기록은 `date`(yyyy-MM-dd), 댓글은 `at`(yyyy-MM-dd HH:mm) 이라 글자 비교로 정렬된다
 * — 앞 열 자리가 날짜라 날짜가 다르면 그것으로 갈리고, 같은 날이면 시각이 있는 쪽이 뒤(최신)다.
 *
 * ★ 왜 뒤집었나 — 대화가 읽히는 차례대로 놓기 위해서입니다.
 *   먼저 쓴 것이 위, 나중에 쓴 것이 아래. 새로 쓴 글이 **적는 칸 바로 위**에 붙습니다.
 *   게시글 댓글은 원래부터 이 차례였습니다 (이제 두 곳이 같습니다).
 */
function taskFlow_(r){
  var out=[];
  (r.logs||[]).forEach(function(l){
    out.push({ kind:'log', at:String(l.date||''), o:l });
  });
  (r.comments||[]).forEach(function(c){
    out.push({ kind:'cmt', at:String(c.at||''), o:c });
  });
  out.sort(function(x,y){ return x.at.localeCompare(y.at); });   // 오래된 것부터
  return out;
}

/** 흐름 한 줄. 기록이든 댓글이든 같은 모양으로 그린다.
 *  ★ 2026-09-22 — 날짜 기둥을 없애고 '누가 · 언제 · 진행률' 을 한 줄에 모았습니다.
 *    지우기(×)는 늘 떠 있지 않고 그 줄의 ⋯ 안에 있습니다. */
function flowRow(it, taskId){
  var o=it.o, isLog=(it.kind==='log');
  var mine = S.me && (S.me.grade>=9 ||
             (isLog ? o.who===S.me.name : o.phone===S.me.phone));
  var day  = shortDate(String(it.at).substring(0,10));
  var time = String(it.at).substring(10).trim();

  var tag='';
  if(isLog && o.progress){
    var 바뀜 = (it.prev!=null && Number(it.prev)!==Number(o.progress)) ? it.prev+'% → ' : '';
    tag='<span class="num">진행률 '+바뀜+o.progress+'%</span>';
  }

  var extra=[];
  if(isLog){
    if(o.g||o.j) extra.push('기공'+(o.g||0)+' 조공'+(o.j||0));
    if(o.wton)   extra.push((o.wt||'폐기물')+' '+o.wton+'t');
    if(o.eq)     extra.push(o.eq+(o.eqd? ' '+o.eqd+'일' : ''));
    if(o.next)   extra.push('다음: '+o.next+(o.nextDate? ' ('+shortDate(o.nextDate)+')' : ''));
  }

  var menu = (mine && o.id)
    ? '<div class="fmenu"><button type="button" class="fmore" aria-label="기록 메뉴" aria-haspopup="true" '+
        'aria-expanded="false" onclick="fitemMenu(this)">'+ICO_DOTS+'</button>'+
      '<div class="fpop"><button class="btn sm dg" onclick="'+
      (isLog ? 'deleteLogFromTask(\''+o.id+'\',\''+taskId+'\')'
             : 'deleteComment(\''+o.id+'\')')+'">삭제</button></div></div>'
    : '';

  return '<div class="fitem'+(menu?' hasmenu':'')+'"'+(isLog? '' : ' data-cid="'+esc(o.id||'')+'"')+'>'+
    '<p class="who"><b>'+esc(o.who||'')+'</b>'+
      '<span class="fwhen">'+esc(day)+(time? ' '+esc(time) : '')+'</span>'+ tag +
    '</p>'+
    '<div class="txt">'+fmt(o.text||'')+'</div>'+
    (extra.length? '<p class="ex">'+esc(extra.join(' · '))+'</p>' : '')+
    (isLog && o.extra? '<p class="ex"><span class="tag wn">추가견적 필요</span></p>' : '')+
    (isLog ? shotsHtml(o.photos && o.photos.length ? o.photos : (o.photo? [o.photo] : [])) : '')+
    menu+
  '</div>';
}

/**
 * 흐름에 한 줄 적는다 (댓글로 저장된다).
 * 낙관 처리 — 누르는 즉시 맨 위에 붙이고, 실패하면 떼어내고 쓴 글을 되돌려준다.
 */
function sendFlow(taskId){
  var el=$('tdWrite'); if(!el) return;
  var text=String(el.value||'').trim();
  if(!text) return;
  el.value='';
  draftSent(taskId, TD_SEQ[taskId]);   // 보내는 글이 곧 그 초안 — 다시 열어도 또 보내지 않게 비운다
  var em=$('tdEmpty'); if(em && em.parentNode) em.parentNode.removeChild(em);

  var list=$('tdFlow'), node=null;
  var c={ id:'', who:(S.me&&S.me.name)||'', phone:(S.me&&S.me.phone)||'',
          text:text, at:todayStr()+' '+nowHM() };
  if(list){
    /* 오래된 것부터 놓으므로 새 글은 맨 아래에 붙는다 (적는 칸 바로 위) */
    list.insertAdjacentHTML('beforeend', flowRow({kind:'cmt', at:c.at, o:c}, taskId));
    node=list.lastElementChild;
  }

  call('api_saveComment', S.token, '업무', taskId, text, S.corp).then(function(r){
    if(!r.ok){
      if(node && node.parentNode) node.parentNode.removeChild(node);
      var box=$('tdWrite');
      if(box && !box.value) box.value=text;          // 쓴 글을 잃지 않게
      draftBack(taskId, text);                       // 창을 닫았어도 다시 열면 남아 있게 (새 초안은 안 덮는다)
      toast('저장하지 못했습니다: '+r.msg);
      return;
    }
    if(node && node.parentNode){
      node.outerHTML=flowRow({kind:'cmt', at:r.comment.at, o:r.comment}, taskId);
    }
    addCommentLocal(taskId, r.comment);
    softRefresh();
  });
}

function saveSettle(taskId, kind){
  var amt=moneyVal($('stAmt'));
  var msg=$('stMsg');
  if(!amt){ msg.textContent='금액을 입력해주세요.'; return; }
  var memo=$('stMemo').value.trim();
  if(kind==='입금'){
    var k=pickedVal('stKind');
    memo = (k?k:'') + (memo? ' · '+memo : '');
  } else if(!memo){ msg.textContent='사유를 입력해주세요.'; return; }

  var btn=$('stSave'); if(btn.disabled) return;
  btn.disabled=true;
  var date=$('stDate').value;
  var tax=(kind==='입금'? pickedVal('stTax') : '');
  var send={ taskId:taskId, kind:kind, amount:amt, memo:memo, date:date, tax:tax };

  /* 차감은 낙관 처리 — 즉시 반영하고 창을 닫는다.
     입금은 돈이 걸린 것이라 서버 확인 후에 닫는다. */
  if(kind==='차감'){
    var ep=S.epoch;
    var backup=applySettleLocal(taskId, { id:'', kind:'차감', amount:amt, memo:memo,
                                          date:date||todayStr(), docNo:'', tax:'' });
    closeOk(); toast('차감이 등록되었습니다');
    FOLD={}; FOLD['settle:'+taskId]=1;
    openTask(taskId, true);

    call('api_addSettle', S.token, send, S.corp).then(function(r){
      if(!r.ok){
        toast('차감 저장 실패: '+r.msg);
        if(!sameAccess(ep)) return;          // 보낸 뒤 권한이 줄었으면 되돌리지도 다시 열지도 않는다 (검수 2차)
        if(backup && S.data && S.data.settle) S.data.settle[taskId]=backup;
        renderBoard();
        FOLD={}; FOLD['settle:'+taskId]=1;
        openTask(taskId, true);
        return;
      }
      delete S.taskCache[taskId];
      applySettleRows(taskId, r.sum, r.rows);
      softRefresh();
      FOLD={}; FOLD['settle:'+taskId]=1;
      openTask(taskId, true);
    });
    return;
  }

  msg.textContent='등록 중입니다...';
  call('api_addSettle', S.token, send, S.corp).then(function(r){
    btn.disabled=false;
    if(!r.ok){ msg.textContent=r.msg; return; }
    closeOk(); toast(kind+'이 등록되었습니다');
    delete S.taskCache[taskId];
    applySettleRows(taskId, r.sum, r.rows);
    softRefresh();
    FOLD={}; FOLD['settle:'+taskId]=1;   // 정산 구역은 펼친 채로 다시 연다
    openTask(taskId, true);
  });
}

/** 정산 줄 하나를 화면에 먼저 더한다. 되돌릴 수 있게 원래 값을 돌려준다 */
function applySettleLocal(taskId, row){
  if(!S.data || !S.data.settle || !S.data.settle[taskId]) return null;
  var backup=JSON.parse(JSON.stringify(S.data.settle[taskId]));
  var s=S.data.settle[taskId];
  s.rows=(s.rows||[]).concat([row]);
  recalcSettle(s);
  S.data.tasks.forEach(function(t){ if(t.id===taskId) t.amount=s.supply; });
  return backup;
}

/** 서버 계산식(최초견적 + 추가 - 차감 = 공급가)을 화면에서 잠깐 흉내낸다.
    1초 뒤 서버 응답이 오면 그 값으로 갈아끼워진다 */
function recalcSettle(s){
  var base=0, add=0, minus=0, paid=0, payCnt=0, taxCnt=0;
  (s.rows||[]).forEach(function(r){
    if(r.kind==='최초견적') base+=r.amount;
    else if(r.kind==='추가') add+=r.amount;
    else if(r.kind==='차감') minus+=Math.abs(r.amount);
    else if(r.kind==='입금'){ paid+=r.amount; payCnt++;
      if(String(r.tax||'').indexOf('발행')>=0) taxCnt++; }
  });
  s.base=base; s.add=add; s.minus=minus;
  s.supply=base+add-minus;
  s.vat=Math.round(s.supply*0.1);
  s.total=s.supply+s.vat; s.claim=s.total;
  s.paid=paid; s.unpaid=s.total-paid;
  s.payCount=payCnt; s.taxCount=taxCnt;
  s.rate=s.total>0? Math.round(paid/s.total*100) : 0;
}

function delSettle(settleId, taskId){
  if(!confirm('이 정산 항목을 삭제할까요?\n계약금액이 다시 계산됩니다.')) return;

  // 화면에서 먼저 빼고 합계를 다시 계산한다 (서버 계산식과 같은 식)
  var back=null;
  if(S.data && S.data.settle && S.data.settle[taskId]){
    back=JSON.parse(JSON.stringify(S.data.settle[taskId]));
    var s=S.data.settle[taskId];
    s.rows=(s.rows||[]).filter(function(x){ return x.id!==settleId; });
    recalcSettle(s);
    S.data.tasks.forEach(function(t){ if(t.id===taskId) t.amount=s.supply; });
  }
  delete S.taskCache[taskId];
  toast('삭제되었습니다');
  FOLD={}; FOLD['settle:'+taskId]=1;
  openTask(taskId, true);
  var ep=S.epoch;

  call('api_deleteSettle', S.token, settleId, taskId, S.corp).then(function(r){
    if(!r.ok){
      toast('삭제하지 못했습니다: '+r.msg);
      if(!sameAccess(ep)) return;            // 보낸 뒤 권한이 줄었으면 되돌리지 않는다 (검수 2차)
      if(back && S.data && S.data.settle) S.data.settle[taskId]=back;
      FOLD={}; FOLD['settle:'+taskId]=1;
      openTask(taskId, true);
      return;
    }
    applySettleRows(taskId, r.sum, r.rows);
    softRefresh();
  });
}

/* ===================== 창 닫기 보호 (v38) =====================
   공지를 길게 쓰다 바깥을 눌러 전부 날린 일이 있었다.
   · 어두운 배경을 눌러도, ESC 를 눌러도 닫히지 않는다
   · [닫기]·[취소] 는 손댄 칸이 하나라도 있으면 한 번 물어본다
   · 저장·상신이 끝나서 닫는 것(closeOk)은 묻지 않는다

   손댔는지 판정은 창이 열릴 때의 칸 값을 적어두고 닫을 때 견주는 방식이다.
   창마다 따로 표시할 필요가 없어서 새 창을 만들어도 저절로 보호된다. */
var MODAL_ROOT=null, MODAL_SIG=null, MODAL_TOUCHED=false, MODAL_DRAWN=false;

/** 지금 창 안 입력칸들의 상태를 글자 하나로 */
function modalSig(){
  var box=$('modal');
  if(!box || !box.innerHTML) return null;
  var s=[];
  // 서식 편집칸도 같이 본다 (v44). 안 그러면 공지를 길게 쓰다 [닫기] 를 눌러도 안 물어본다
  [].forEach.call(box.querySelectorAll('[contenteditable]'),function(e){
    s.push(String(e.textContent==null?'':e.textContent));
  });
  [].forEach.call(box.querySelectorAll('input,textarea,select'),function(e){
    if(e.type==='button' || e.type==='submit') return;
    s.push((e.type==='checkbox'||e.type==='radio') ? (e.checked?'1':'0') : String(e.value==null?'':e.value));
  });
  /* 고른 사진도 '쓰던 것' 이다 (2026-08-31).
     사진 칸은 고르는 즉시 비워지므로(같은 사진을 다시 고를 수 있게) 값으로는 안 잡힌다.
     그대로 두면 영수증 다섯 장을 고른 뒤 [닫기] 를 눌러도 묻지 않고 날아간다. */
  [].forEach.call(box.querySelectorAll('.thumbs'),function(e){
    s.push('p'+e.querySelectorAll('.thumb').length);
  });
  return s.join('\u0001');
}

/** 창이 새로 열렸으면 그때의 값을 기준으로 삼는다 */
function modalWatch(){
  var box=$('modal'); if(!box) return;
  var root=box.firstElementChild||null;
  if(root===MODAL_ROOT) return;
  MODAL_ROOT=root; MODAL_TOUCHED=false; MODAL_DRAWN=false;
  MODAL_SIG=modalSig();
  /* 창을 띄운 뒤에 프로그램이 칸을 채우는 곳이 있다 (추가공사 요청이 그렇다).
     사용자가 아직 아무것도 안 건드렸으면 그 값을 기준으로 다시 잡는다.
     그래야 손도 안 댄 창에서 [취소] 를 눌렀을 때 쓸데없이 묻지 않는다. */
  setTimeout(function(){
    if(box.firstElementChild===MODAL_ROOT && !MODAL_TOUCHED) MODAL_SIG=modalSig();
  }, 400);
}

/** 창 안에서 뭔가 건드렸는지 */
function modalDirty(){
  if(MODAL_DRAWN) return true;                        // 도장처럼 칸이 아닌 곳에 그린 경우
  if(MODAL_SIG===null || !MODAL_TOUCHED) return false;
  var now=modalSig();
  return now!==null && now!==MODAL_SIG;
}

/** 사용자가 [닫기]·[취소] 를 누른 경우 — 쓰던 게 있으면 물어본다 */
function closeModal(force){
  var box=$('modal'); if(!box) return;
  if(!force && box.innerHTML && modalDirty()){
    if(!confirm('작성 중인 내용이 사라집니다. 닫을까요?')) return;
  }
  box.innerHTML='';
  MODAL_ROOT=null; MODAL_SIG=null; MODAL_TOUCHED=false; MODAL_DRAWN=false;
  S.openTask=null; S.openTaskFromBoard=false;      // 열린 업무 창 표시도 지운다 (돌아갈 곳이 있으면 openTask 가 다시 적는다)
  /* ★ 어디서 열었으면 거기로 돌아간다 (2026-09-09).
     업무 상세에서 연 수정·기록·입금 창을 [취소] 하면 판으로 떨어져서,
     어떤 창은 돌아오고 어떤 창은 안 돌아오는 상태였습니다.
     저장(closeOk)으로 닫을 때는 각 저장 함수가 알아서 갈 곳을 정합니다. */
  var back=BACK_TASK; BACK_TASK=null;
  /* 종류별 칸에서 연 문서를 닫으면 그 칸으로 (2026-09-17) */
  var backBox=BACK_BOX; BACK_BOX='';
  if(!force && back) { openTask(back, true); return; }
  if(!force && backBox) drawDocBox();
}
/** 업무 상세에서 연 창이 [취소] 됐을 때 돌아갈 업무 */
var BACK_TASK=null;

/** 저장·상신·삭제가 끝나서 닫는 경우 — 묻지 않는다 */
function closeOk(){ closeModal(true); }

/* ★★ 창을 열고 닫을 때의 초점 (2026-09-30 디자인)
   · 열면: 창을 대화상자(role=dialog · aria-modal)로 알리고, 초점을 창 안으로 옮긴다
   · 닫으면: 창을 연 자리(카드 · 단추)로 초점을 돌려준다. 카드는 다시 그려지므로 같은 업무 카드를 찾는다
   · Tab 은 창 안에서만 돈다. ★ ESC 로는 닫지 않는다 — 쓰던 글을 지키는 기존 규칙 그대로 */
var MODAL_FROM=null, DLG_N=0;
(function(){
  var box=$('modal'); if(!box || !window.MutationObserver) return;
  var 열림=false;
  new MutationObserver(function(){
    var sheet=box.querySelector('.sheet');
    if(sheet && !열림){
      열림=true;
      var a=document.activeElement;
      if(a && a!==document.body && !box.contains(a)) MODAL_FROM=a;
    }
    if(sheet){ dialogOn(sheet); return; }
    if(열림){ 열림=false; focusBack(); }
  }).observe(box, { childList:true });
})();
function dialogOn(sheet){
  if(sheet.getAttribute('role')!=='dialog'){
    sheet.setAttribute('role','dialog'); sheet.setAttribute('aria-modal','true'); sheet.setAttribute('tabindex','-1');
    var h=sheet.querySelector('h3');
    if(h){ if(!h.id) h.id='dlgT'+(++DLG_N); sheet.setAttribute('aria-labelledby', h.id); }
  }
  /* 창 안에 이미 초점이 있으면(입력칸 자동 초점 등) 그대로 둔다 */
  setTimeout(function(){
    if(!sheet.isConnected || sheet.contains(document.activeElement)) return;
    try{ sheet.focus({ preventScroll:true }); }catch(e){}
  }, 30);
}
function focusBack(){
  var t=MODAL_FROM; MODAL_FROM=null;
  if(!t) return;
  if(t.isConnected && t.offsetParent!==null){ try{ t.focus({ preventScroll:true }); }catch(e){} return; }
  var tid=t.getAttribute && t.getAttribute('data-tid');
  var c=tid? document.querySelector('[data-tid="'+tid+'"]') : null;
  if(c && c.offsetParent!==null){ try{ c.focus({ preventScroll:true }); }catch(e){} }
}
document.addEventListener('keydown', function(e){
  if(e.key!=='Tab') return;
  var sheet=document.querySelector('#modal .sheet'); if(!sheet) return;
  var f=[].filter.call(sheet.querySelectorAll('a[href],button:not([disabled]),input:not([disabled]):not([type=hidden]),'+
    'select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"]),[contenteditable="true"]'),
    function(x){ return x.offsetParent!==null; });
  if(!f.length) return;
  var first=f[0], last=f[f.length-1], a=document.activeElement;
  if(e.shiftKey && (a===first || a===sheet || !sheet.contains(a))){ e.preventDefault(); last.focus(); }
  else if(!e.shiftKey && (a===last || !sheet.contains(a))){ e.preventDefault(); first.focus(); }
});
/* ★ 폰 자판이 올라오면 보이는 높이가 줄어듭니다 — 창 높이(--vvh)를 그만큼 줄여 [저장] 이 자판에 가리지 않게 */
(function(){
  var vv=window.visualViewport; if(!vv) return;
  function set(){ document.documentElement.style.setProperty('--vvh', Math.round(vv.height)+'px'); }
  vv.addEventListener('resize', set); set();
})();
/* 손가락 화면에서 창 안의 칸에 들어가면 그 칸을 보이는 곳 가운데로 (자판·아래 단추 줄에 가리지 않게) */
document.addEventListener('focusin', function(e){
  var el=e.target;
  if(!el || !el.closest || !el.closest('#modal .sheet')) return;
  if(!/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName) && !el.isContentEditable) return;
  if(!(window.matchMedia && matchMedia('(pointer:coarse)').matches)) return;
  setTimeout(function(){ try{ el.scrollIntoView({ block:'center' }); }catch(x){} }, 320);
});

(function(){
  var box=$('modal');
  if(!box) return;

  // 창이 바뀌면 기준값을 다시 잡는다
  if(window.MutationObserver){
    new MutationObserver(function(){ modalWatch(); }).observe(box, { childList:true });
  }

  /* 사람이 실제로 건드렸을 때만 표시한다. 프로그램이 채워 넣는 값은 여기 안 걸린다.
     ＋－ 버튼처럼 눌러서 숫자가 바뀌는 칸도 클릭이 걸리므로 같이 잡힌다.
     아무것도 안 바꾸고 [취소] 만 눌렀다면 값이 그대로라 묻지 않는다. */
  ['input','change','click','keydown'].forEach(function(ev){
    box.addEventListener(ev, function(){ MODAL_TOUCHED=true; }, true);
  });
  ['pointerdown','mousedown','touchstart'].forEach(function(ev){
    box.addEventListener(ev, function(e){
      if(e.target && e.target.tagName==='CANVAS') MODAL_DRAWN=true;   // 도장을 그렸다
    }, true);
  });
  /* 단축키로 검색 (2026-09-02).
     ★ 글을 쓰는 중에는 걸리지 않습니다 — `/` 한 글자를 못 치면 안 됩니다. */
  document.addEventListener('keydown', function(e){
    if(e.isComposing) return;
    var t = e.target || {};
    var 쓰는중 = t.tagName==='INPUT' || t.tagName==='TEXTAREA' || t.tagName==='SELECT' ||
                 (t.getAttribute && t.getAttribute('contenteditable')==='true');
    var 열까 = ((e.ctrlKey||e.metaKey) && (e.key==='k'||e.key==='K')) ||
               (e.key==='/' && !쓰는중);
    if(!열까) return;
    e.preventDefault();
    openSearch();
  });

  // ESC 로는 닫지 않는다 (쓰던 글이 날아가지 않게)
  document.addEventListener('keydown', function(e){
    if(e.key!=='Escape' && e.keyCode!==27) return;
    if(e.isComposing) return;              // 한글 입력 중의 ESC 는 글자 취소용이라 건드리지 않는다
    var b=$('modal');
    if(b && b.innerHTML){ e.preventDefault(); e.stopPropagation(); }
  }, true);
})();

       새 업무에는 없습니다 — 저장해서 번호를 받아야 붙일 곳이 생깁니다. */
    (id && t ? fileBox_(t, files||[], true) : '')+
    (id && t && S.me && (S.me.grade>=2 || t.owner===S.me.phone)
      ? '<div class="field"><label class="fl">고객 진행 링크</label>'+
        '<div id="tfGuest">'+guestRow_(t, '')+'</div></div>'
      : '')+
    /* 막혔을 때의 안내는 단추 **위**에 — 아래에 두면 붙어 있는 단추 줄에 가립니다 */
    '<p class="tfmsg" id="tfMsg" role="alert"></p>'+
    /* 입력 창의 닫는 길은 아래 [취소] 하나 (2026-09-09).
       ★ 단추 줄은 창 아래에 붙어 있어 긴 창에서도 바로 누를 수 있습니다 (2026-09-22) */
    '<div class="actions tfoot"><button class="btn" onclick="closeModal()">취소</button>'+
    '<button class="btn pri" id="tfSave" onclick="saveTask()">'+(id?'변경 저장':'업무 등록')+'</button></div>'+

  syncDemo();

}

/* 업무명 칸 — 글이 길면 줄이 늘어난다. 붙여넣은 줄바꿈은 띄어쓰기로 (업무명은 한 줄입니다) */
function tfGrow(el){
  if(!el) return;
  if(/[\r\n]/.test(el.value)) el.value=el.value.replace(/\s*[\r\n]+\s*/g,' ');
  el.style.height='auto';
  el.style.height=el.scrollHeight+'px';
}
function tfTitleKey(e){
  if(e.key==='Enter' && !e.isComposing) e.preventDefault();
}
/**
 * 직급 순서 — 위에서 아래로 높은 사람부터 (v50).
 * 대표이사 · 전무 · 실장 · 과장 · 주임 …  여기 없는 직급은 맨 아래, 그 안에서는 이름 순.
 *
 * ★ 글자가 조금 달라도 같은 자리에 놓이도록 '들어 있는지' 로 봅니다
 *   (대표 / 대표이사,  실장 / 전략기획실장).
 * ★ 순서를 바꾸려면 아래 한 줄만 고치면 됩니다. 다른 곳은 손댈 필요가 없습니다.
 */
/* ★★ 직급 차례의 **원본은 서버**입니다 (2026-09-08). `meta.ranks` 로 받아
   `useRanks()` 가 여기에 갈아끼웁니다. 아래 값은 서버가 안 줄 때 버티는 값입니다
   — 옛 서버에 붙어도 사람 정렬이 깨지지 않게. 공휴일 표와 같은 방식입니다. */
var RANK_ORDER=['대표','부사장','전무','상무','이사','실장','부장','차장','과장','대리','주임','사원'];
function useRanks(m){
  if(m && m.ranks && m.ranks.length) RANK_ORDER = m.ranks;
}
function rankNo(rank){
  var r=String(rank||'');
  for(var i=0;i<RANK_ORDER.length;i++) if(r.indexOf(RANK_ORDER[i])>=0) return i;
  return 99;                              // 직급이 비었거나 목록에 없는 직급 → 맨 아래
}

/**
 * 담당자 드롭다운 (v46c에서 다시 짬).
 *
 * 예전에는 '이미 업무를 맡고 있는 사람 + 나' 만 모았다.
 * 그래서 명부에 갓 올라온 사람(대표님·전무님)은 업무를 하나 맡기 전까지
 * 담당자로 고를 수가 없었다. 이제는 board 가 실어 보낸 명부(staff)로 만든다.
 */
/* 같이 보는 사람 — 여럿 고를 수 있다. 값은 숨은 칸(tfCo)에 콤마로 모아 둔다.
   ★ 담당자 본인은 목록에서 뺀다 (이미 알림을 받는다).
   ★ 이름 차례는 담당자 드롭다운과 같은 직급 순이다 (RANK_ORDER). */
function coChips(cur, owner){
  var have={};
  String(cur||'').split(',').forEach(function(x){ x=x.trim(); if(x) have[x]=1; });
  owner = owner || ($('tfOwner')? $('tfOwner').value : '');
  var list=((S.data && S.data.staff)||[]).slice().sort(function(a,b){
    var d=rankNo(a.rank)-rankNo(b.rank);
    return d ? d : ((a.name||'')<(b.name||'') ? -1 : 1);
  });
  var h='';
  list.forEach(function(x){
    if(!x.phone || x.phone===owner) return;
    h+='<label data-ph="'+esc(x.phone)+'"'+(have[x.phone]?' class="on"':'')+
       ' role="checkbox" tabindex="0" aria-checked="'+(have[x.phone]?'true':'false')+'"'+
       ' onkeydown="cardKey(event)" onclick="coToggle(this)">'+esc(x.name||x.phone)+'</label>';
  });
  return h;
}

function coToggle(el){
  el.classList.toggle('on');
  el.setAttribute('aria-checked', el.classList.contains('on')?'true':'false');
  coCollect();
}

/** 눌러둔 이름을 모아 숨은 칸(tfCo)에 콤마로 적어 둔다. saveTask 는 그 칸만 본다 */
function coCollect(){
  var out=[];
  [].forEach.call(document.querySelectorAll('#tfCoPick label.on'), function(l){
    out.push(l.dataset.ph);
  });
  var box=$('tfCo'); if(box) box.value=out.join(',');
}

/** 담당자를 바꾸면 그 사람은 '같이 보는 사람' 목록에서 빠져야 한다 */
function syncCo(){
  var box=$('tfCoPick'); if(!box) return;
  box.innerHTML=coChips($('tfCo')? $('tfCo').value : '', $('tfOwner').value);
  coCollect();
}

function staffOptions(sel){
  /* ★ board 가 준 배열을 고쳐 쓰지 않는다 — slice 로 베낀 뒤에 정렬한다 (v50) */
  var list=((S.data && S.data.staff) || []).slice().sort(function(a,b){
    var d=rankNo(a.rank)-rankNo(b.rank);
    if(d) return d;
    return (a.name||'')<(b.name||'') ? -1 : ((a.name||'')>(b.name||'') ? 1 : 0);
  });
  var opts='', seen={};
  list.forEach(function(s){
    if(!s.phone || seen[s.phone]) return;
    seen[s.phone]=1;
    var label=(s.name||s.phone)+(s.rank? ' '+s.rank : '');
    opts+='<option value="'+esc(s.phone)+'"'+(s.phone===sel?' selected':'')+'>'+esc(label)+'</option>';
  });

  /* 지금 담당자가 목록에 없을 때 — 퇴사한 사람이 담당으로 남아 있는 업무를
     수정하는 경우다. 그 사람을 지우지 않도록 맨 위에 살려둔다. */
  if(sel && !seen[sel]){
    var nm='';
    (S.data? S.data.tasks:[]).forEach(function(t){ if(t.owner===sel && t.ownerName) nm=t.ownerName; });
    if(!nm && S.me && S.me.phone===sel) nm=S.me.name;
    opts='<option value="'+esc(sel)+'" selected>'+esc(nm||sel)+'</option>'+opts;
  }

  // 옛 스냅샷으로 그리는 중이라 명부가 아직 안 왔을 때
  if(!opts && S.me) opts='<option value="'+esc(S.me.phone)+'" selected>'+esc(S.me.name)+'</option>';
  return opts;
}
/** 현장 드롭다운. 예전 데이터의 현장코드가 목록에 없으면 그것도 살려둔다 */
function siteOptions(sel){
  var list=(S.meta&&S.meta.sites)||[];
  var have=false;
  var h='<option value="">선택 안 함</option>';
  list.forEach(function(x){
    if(x.code===sel) have=true;
    h+='<option value="'+esc(x.code)+'"'+(x.code===sel?' selected':'')+'>'+
       esc(x.code)+(x.name?' · '+esc(x.name):'')+'</option>';
  });
  if(sel && !have) h+='<option value="'+esc(sel)+'" selected>'+esc(sel)+'</option>';
  return h;
}

/** 현장을 고르면 비어 있는 칸만 채워준다 (업무명 · 계약금액).
 *
 *  ★ 계약금액은 견적대장에 이미 있는 숫자입니다 (2026-09-02).
 *    지금까지는 견적서를 열어 보고 워크보드에 손으로 다시 쳤습니다.
 *
 *  ★ **이미 적어 둔 값은 절대 덮지 않습니다.** 사람이 고쳐 둔 금액을
 *    현장을 다시 고르는 순간 되돌려 버리면 그것이 더 나쁩니다.
 */
function fillFromSite(){
  var el=$('tfSite'); if(!el) return;
  var v=el.value;
  var hit=null;
  ((S.meta&&S.meta.sites)||[]).forEach(function(x){ if(x.code===v) hit=x; });
  if(!hit) return;

  if(hit.name && $('tfTitle') && !$('tfTitle').value){ $('tfTitle').value=hit.name; tfGrow($('tfTitle')); }

  var amt=$('tfAmount');
  if(hit.amt && amt && !String(amt.value||'').trim()){
    amt.value=hit.amt;
    toast(hit.name+' 견적 금액을 채웠습니다 · '+Number(hit.amt).toLocaleString()+'원');
  }
}

/* ★ 막혔을 때 (2026-09-30) — 이유는 단추 위 빨간 상자에, 칸에는 빨간 테두리. 그 칸으로 초점을 옮겨
   긴 창에서도 어디를 고칠지 바로 보이게 합니다. 다시 적거나 고르면 표시가 풀립니다 */
function tfFail(msg, el){
  var m=$('tfMsg'); if(m) m.textContent=msg;
  if(!el) return;
  el.classList.add('err'); el.setAttribute('aria-invalid','true');
  /* 이유를 그 칸 바로 아래에도 — 긴 창에서 단추 위 상자는 멀리 있습니다 */
  var eid=(el.id||'tfx')+'Err', e2=$(eid);
  if(!e2){ e2=document.createElement('p'); e2.className='ferr'; e2.id=eid; el.parentNode.insertBefore(e2, el.nextSibling); }
  e2.textContent=msg;
  el.setAttribute('aria-describedby', eid);
  var f=(el.tagName==='DIV')? el.querySelector('label') : el;
  try{ f.focus({ preventScroll:true }); el.scrollIntoView({ block:'center' }); }catch(e){}
}
function tfOk(el){
  if(!el || !el.classList.contains('err')) return;
  el.classList.remove('err'); el.removeAttribute('aria-invalid'); el.removeAttribute('aria-describedby');
  var e2=$((el.id||'tfx')+'Err'); if(e2 && e2.parentNode) e2.parentNode.removeChild(e2);
  var m=$('tfMsg'); if(m) m.textContent='';
}
function pickType(el){
  pickOne(el); syncDemo(); tfOk(el.parentNode);
  [].forEach.call(el.parentNode.children, function(c){ c.setAttribute('aria-checked', c===el?'true':'false'); });
}
function pickOne(el){
  [].forEach.call(el.parentNode.children,function(c){ c.classList.remove('on'); });
  el.classList.add('on');
}
function pickedVal(id){
  var box=$(id); if(!box) return '';
  var on=box.querySelector('.on'); return on? (on.dataset.v||on.textContent) : '';
}
function syncDemo(){
  var t=pickedVal('tfType');
  $('tfDemo').classList.toggle('hide', t!=='DEMO');
}
function saveTask(){
  var type=pickedVal('tfType');
  var demo=(type==='DEMO');
  /* 창에 있는 칸만 보낸다.
     주소·면적·작업범위·연락처·시작예정일은 이제 입력받지 않으므로 아예 넣지 않는다.
     서버(taskFields_)는 넘어오지 않은 값을 건드리지 않으므로 예전 데이터가 살아남는다. */
  var p={
    id:$('tfId').value, type:type, corp:$('tfCorp').value,
    title:$('tfTitle').value.replace(/\s*[\r\n]+\s*/g,' ').trim(), content:mkValue('tfContent'),
    owner:$('tfOwner').value, due:$('tfDue').value,
    co:$('tfCo').value
  };
  if(demo){
    p.site=$('tfSite').value;
    p.amount=$('tfAmount').value;
  }
  /* ★★ 진행률과 상태를 같이 보냅니다 (2026-09-03).
     상태는 **진행률이 정합니다** — 서버의 작업기록 저장(api_saveLog)과 같은 규칙입니다.
     완료일은 서버가 붙입니다 (taskFields_). 화면에서 날짜를 만들어 보내지 않습니다. */
  var pg=$('tfProg') ? Number($('tfProg').value) : null;
  if(pg!==null && !isNaN(pg)){
    p.progress=pg;
    p.status = (pg>=100) ? '완료' : (pg>0 ? '진행중' : '대기');
  }
  /* ★ 유형을 미리 골라 두지 않으므로, 안 고르면 여기서 막는다 (2026-09-01).
     예전에는 '철거' 가 미리 켜져 있어서, 다른 유형인데 그대로 저장되는 일이 있었습니다. */
  if(!type){ tfFail('업무 유형을 골라주세요.', $('tfType')); return; }
  if(!p.title){ tfFail('업무명을 입력해주세요.', $('tfTitle')); return; }
  var btn=$('tfSave');
  if(btn.disabled) return;
  btn.disabled=true;

  // 화면에 먼저 반영하고 창을 닫는다 (기다리지 않음)
  var backup = S.data ? JSON.parse(JSON.stringify(S.data.tasks)) : null;
  var ep=S.epoch;
  applyTaskLocal(p);
  closeOk();
  toast('저장되었습니다');

  call('api_saveTask', S.token, p, S.corp).then(function(r){
    if(!r.ok){
      var 같은권한 = sameAccess(ep);
      if(backup && S.data && 같은권한){ S.data.tasks=backup; renderBoard(); if(S.view==='me') renderMe(); }
      toast('저장 실패: '+r.msg);
      /* ★ 쓴 것을 잃지 않게 (2026-09-30) — 창은 이미 닫혔으므로 적은 그대로 다시 열고 이유를 단추 위에 적는다.
         다른 창을 보고 있으면 덮지 않고 남겨 둔다 (다음에 그 업무 창을 열 때 채워진다).
         볼 수 없게 된 업무(denied)는 다시 열지 않는다 — 공통 거절 처리가 이미 지웠다 */
      if(같은권한 && !r.denied) tfKeep(p, r.msg);
      return;
    }
    if(p.id) delete S.taskCache[p.id];
    softRefresh();
  });
}

        '</div><div style="height:6px"></div>'+

  $('modal').innerHTML=h;

    $('lgProg').focus();
  }
}
function syncLogForm(){

/**
 * 오늘 그 현장에 나간 사람 수로 기공·조공을 미리 채운다 (2026-09-02).
 *
 *  ★★ 출퇴근 앱이 **이미 알고 있는 것**입니다. `board_` 가 오늘 출근을
 *    현장명까지 실어 보내는데, 사람이 기록을 쓸 때 그 숫자를 다시 세고 있었습니다.
 *
 *  ★ **사람이 이미 손댔으면 건드리지 않습니다.** 채워 넣은 값과 다르면
 *    그 사람이 고쳐 둔 것이므로 덮어쓰지 않습니다.
 *  ★ 기공·조공을 가릴 방법이 없으므로 **전부 기공으로** 넣습니다.
 *    ＋－ 로 옮기면 됩니다. 0 에서 시작해 손으로 세는 것보다 낫습니다.
 *  ★ 오늘 날짜일 때만. 지난 날짜를 적을 때 오늘 인원을 채우면 틀립니다.
 */
var ATT_FILLED = null;

function fillFromAttendance(taskId){
  var g=$('lgG'), j=$('lgJ');
  if(!g || !j) return;
  var d=$('lgDate');
  if(d && d.value !== todayStr()) return;

  /* 사람이 손댄 뒤면 그대로 둔다 */
  var now = Number(g.textContent||0) + Number(j.textContent||0);
  if(ATT_FILLED != null && now !== ATT_FILLED) return;
  if(ATT_FILLED == null && now !== 0) return;

  var n = attCountFor(taskId);
  g.textContent = n;
  ATT_FILLED = n;
}

/** 오늘 그 현장에 출근한 사람 수 */
function attCountFor(taskId){
  var t=null;
  (S.data? S.data.tasks:[]).forEach(function(x){ if(x.id===taskId) t=x; });
  if(!t || !t.site) return 0;

  var 현장명='';
  ((S.meta&&S.meta.sites)||[]).forEach(function(s){ if(s.code===t.site) 현장명=String(s.name||''); });
  if(!현장명) return 0;

  var n=0;
  var rows=((S.data&&S.data.attendance)||{}).rows||[];
  rows.forEach(function(r){
    if(!r.site) return;                       /* 사무실·기타는 site 가 비어 있다 */
    if(String(r.site).indexOf(현장명)>=0 || 현장명.indexOf(String(r.site))>=0) n+=1;
  });
  return n;
}

/* ★★ 진행률 상자 — **업무 등록 창과 작업기록 창이 같은 것**을 씁니다 (2026-09-03).
 *
 *  `pre` 는 칸 이름 앞에 붙는 글자입니다 —  'lg' 작업기록 · 'tf' 업무 등록.
 *  예전에는 작업기록 창에만 있었고 화면 글자가 그 자리에 통째로 박혀 있었습니다.
 *  두 벌로 베껴 두면 눈금 하나를 고칠 때 반드시 한쪽을 잊습니다.
 *
 *  ★ 0% 일 때의 말은 자리에 따라 다릅니다.
 *    작업기록에서는 `대기 유지`(이 기록으로도 상태는 그대로),
 *    업무 등록에서는 `대기`(지금 정하는 상태 그 자체)입니다. */
var PROG_ST = { lg:['대기 유지','진행중','완료 처리'], tf:['대기','진행중','완료'] };

function progBox(pre, val){
  var v=Number(val||0);
  if(!isFinite(v)) v=0;
  v=Math.max(0, Math.min(100, v));
  /* ★ 슬라이더는 5 단위로 움직입니다. 그런데 저장된 값이 42 처럼 5 단위가 아니면
     브라우저가 40 으로 깎아 버려서, 수정 창을 열고 [저장] 만 눌러도 진행률이 바뀌었습니다.
     그런 값일 때만 1 단위로 둡니다 (2026-09-22). 빠른 선택 단추·눈금 값은 그대로입니다. */
  var step=(v%5===0)? 5 : 1;
  return '<div class="prog">'+
    '<div class="top"><span class="val num" id="'+pre+'Pv">'+v+'%</span>'+
    '<span class="st" id="'+pre+'Ps"></span></div>'+
    '<input type="range" id="'+pre+'Prog" min="0" max="100" step="'+step+'" value="'+v+'" aria-label="진행률" '+
      'oninput="syncProg(&#39;'+pre+'&#39;)" onchange="syncProg(&#39;'+pre+'&#39;)">'+
    '<div class="ticks"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div>'+
    '<div class="quick">'+
      '<button type="button" onclick="setProg(0,&#39;'+pre+'&#39;)">착수 전</button>'+
      '<button type="button" onclick="setProg(30,&#39;'+pre+'&#39;)">30%</button>'+
      '<button type="button" onclick="setProg(50,&#39;'+pre+'&#39;)">절반</button>'+
      '<button type="button" onclick="setProg(80,&#39;'+pre+'&#39;)">마무리 중</button>'+
      '<button type="button" onclick="setProg(100,&#39;'+pre+'&#39;)">완료</button>'+
    '</div></div>';
}

function setProg(v, pre){
  pre=pre||'lg';
  var sl=$(pre+'Prog'); if(!sl) return;
  sl.value=v; syncProg(pre);
}

function syncProg(pre){
  pre=pre||'lg';
  var sl=$(pre+'Prog'); if(!sl) return;
  var v=Number(sl.value);
  $(pre+'Pv').textContent=v+'%';
  var 말=PROG_ST[pre]||PROG_ST.lg;
  var st=$(pre+'Ps');
  if(v<=0){ st.textContent=말[0]; st.className='st'; }
  else if(v>=100){ st.textContent=말[2]; st.className='st done'; }
  else { st.textContent=말[1]; st.className='st run'; }
  // 채워진 만큼 색이 차게
  var pct=v+'%';
  sl.style.background='linear-gradient(to right, #1D9E75 0%, #1D9E75 '+pct+
    ', transparent '+pct+', transparent 100%)';
  sl.style.backgroundSize='100% 8px';
  sl.style.backgroundPosition='0 50%';
  sl.style.backgroundRepeat='no-repeat';
}
function stepN(id,d){
  var el=$(id); var v=Math.max(0, Number(el.textContent)+d); el.textContent=v;
}
function setNextDate(el,d){
  pickOne(el); $('lgNextDate').value=addDays(d);
}
function saveLog(){
  if(PHOTO_BUSY > 0){ toast('사진을 정리하는 중입니다. 잠시만 기다려 주세요.'); return; }
  var p={
    taskId:$('lgTask').value, date:$('lgDate').value,
    text:mkValue('lgText'), next:$('lgNext').value.trim(), nextDate:$('lgNextDate').value,
    extra:$('lgExtra').classList.contains('on')
  };
  p.progress = $('lgProg') ? Number($('lgProg').value) : null;
  if(!$('lgDemo').classList.contains('hide')){
    p.g=Number($('lgG').textContent); p.j=Number($('lgJ').textContent);
    p.wt=$('lgWt').value; p.wton=$('lgWton').value; p.eq=$('lgEq').value; p.eqd=$('lgEqd').value;
  }
  var msg=$('lgMsg2');
  if(!p.text){ msg.textContent='작업내용을 입력해주세요.'; $('lgText').classList.add('err'); return; }
  if(p.next && !p.nextDate){ msg.textContent='다음 할일을 적으셨으면 일정일도 골라주세요.'; $('lgNextDate').classList.add('err'); return; }

  var btn=$('lgSave');
  if(btn.disabled) return;
  btn.disabled=true;
  var seq=LOG_SEQ;                       // 이 창이 들고 온 초안 (다른 창이 열리면 LOG_SEQ 는 바뀐다)
  /* 사진은 고를 때 이미 줄여서 담아 두었다 (photoAdd) */
  var shots = photoValues('lgPhoto');

  if(shots.length){
    // 사진이 있으면 올리는 시간이 필요하니 기다린다
    msg.textContent = shots.length>1
      ? ('사진 '+shots.length+'장과 함께 저장 중입니다...')
      : '사진과 함께 저장 중입니다...';
    p.photos = shots;
    call('api_saveLog', S.token, p, S.corp).then(function(r){
      btn.disabled=false;
      if(!r.ok){ msg.textContent=r.msg; return; }
      draftSent(p.taskId, seq);
      closeOk(); toast('기록이 저장되었습니다');
      addLogLocal(p.taskId, r.log);
      softRefresh();
    });
    return;
  }

  // 사진이 없으면 즉시 닫고 뒤에서 보낸다
  var backup = S.data ? JSON.parse(JSON.stringify(S.data.tasks)) : null;
  var ep=S.epoch;
  draftSent(p.taskId, seq);
  applyLogLocal(p);
  closeOk();
  toast('기록이 저장되었습니다');
  call('api_saveLog', S.token, p, S.corp).then(function(r){
    if(!r.ok){
      if(backup && S.data && sameAccess(ep)){ S.data.tasks=backup; renderBoard(); }
      /* ★ 창은 이미 닫혔습니다. 쓴 글을 잃지 않게 상세의 적는 칸으로 돌려 둡니다 (2026-09-22 Astra 지적).
         그사이 새로 쓴 초안이 있으면 그것을 덮지 않습니다 */
      draftBack(p.taskId, p.text);
      toast('저장 실패: '+r.msg);
      return;
    }
    addLogLocal(p.taskId, r.log);        // 화면이 가진 데이터에 바로 붙인다
    softRefresh();
  });
}

/* 사진 자동 축소 — 업무일지 현장 사진용. 지금 설정을 그대로 둔다 */
/* ===================== 사진 여러 장 고르기 (2026-08-31) =====================
   결재 영수증·업무일지 기록·공지 세 곳이 **똑같은 것**을 씁니다.
   예전에는 어디서나 한 장만 올릴 수 있었고, 공지에는 사진 자리가 아예 없었습니다.

   ★ 화면에 설명문을 두지 않습니다. [라벨] + [칸] + 고른 사진 줄, 그것뿐입니다.
   ★ 최대 5장. 그보다 많이 고르면 앞의 다섯 장만 담고 알려 줍니다.
   =========================================================================== */
var PHOTO_MAX = 5;
var PICKED = {};            // { 칸이름: [ {url, name, blob, thumb} ] }

/** 사진 칸 하나를 그린다. 창을 만들 때 이 한 줄만 넣으면 된다 */
function photoField(id, label){
  photoClear(id);
  return '<div class="field"><label class="fl">'+esc(label)+'</label>'+
    '<input type="file" id="'+id+'" accept="image/*" multiple '+
      'onchange="photoAdd(&#39;'+id+'&#39;,this)">'+
    '<div class="thumbs" id="'+id+'Box"></div></div>';
}

/** 고른 사진을 담는다. 담는 동안 저장 버튼을 잠근다.

    ★ 2026-09-01 부터 **어디서 올리든 원본에 가장 가까운 화질**입니다.
      예전에는 영수증만 2400px·0.92 였고 공지·업무일지는 900px·0.55 라
      사진 속 글씨(안내문·일정표·도면)를 읽을 수 없었습니다.
      지금은 세 곳이 같은 길을 씁니다 — 2400px·품질 0.92 로 시작해
      보낼 수 있는 크기를 넘을 때만 한 단계씩 내립니다. */
/* 사진을 줄이는 동안 저장·상신 버튼을 잠근다 (2026-09-01).

   ★★ 주석에는 '담는 동안 저장 버튼을 잠근다' 고 **적혀만 있고 코드에는 없었습니다.**
     폰에서 영수증 한 장을 2400px 로 줄이는 데 몇 초가 걸리는데,
     그 사이에 상신을 누르면 사진이 아직 안 담겨 있어서
     **'영수증 사진을 첨부해주세요' 가 떴습니다.** 붙였는데 안 붙었다고 하는 셈입니다.
     (2026-09-01 실제로 이 일이 났습니다) */
var PHOTO_BUSY = 0;

function photoBusy(n){
  PHOTO_BUSY = Math.max(0, PHOTO_BUSY + n);
  var on = PHOTO_BUSY > 0;
  [].forEach.call(document.querySelectorAll('#modal .btn.pri'), function(b){
    b.disabled = on;
    if(on){
      if(b.dataset.was === undefined) b.dataset.was = b.textContent;
      b.textContent = '사진 정리 중...';
    }else if(b.dataset.was !== undefined){
      b.textContent = b.dataset.was;
      delete b.dataset.was;
    }
  });
}

/* ★★ PDF 첨부 (2026-09-11 대표님 지시).
   결재 문서에는 사진 말고도 견적서·계약서·진단서 같은 **PDF** 가 붙습니다.
   사진 칸 하나로 같이 받되, PDF 는 줄이지도 그리지도 않고 **파일 그대로** 담습니다.
   서버에서도 길이 다릅니다 — 사진은 savePhoto_(.jpg/.png), PDF 는 saveFile_(이름 그대로).
   ★ 한 개 8MB 까지 (업무의 도면 PDF 와 같은 기준). 사진과 합쳐 PHOTO_MAX 개까지. */
var PDF_MAX = 8 * 1024 * 1024;
function isPdfFile(f){
  return !!f && (String(f.type||'') === 'application/pdf' || /\.pdf$/i.test(String(f.name||'')));
}

function photoAdd(id, el){
  var files = Array.prototype.slice.call(el.files || []);
  el.value = '';                                  // 같은 사진을 다시 고를 수 있게
  if(!files.length) return;

  /* PDF 는 받는 칸(accept 에 pdf 가 있는 칸)에서만. 다른 칸이면 알리고 뺀다 */
  var pdfOk = String(el.accept || '').indexOf('pdf') >= 0;
  var imgs = [], pdfs = [], 사진만 = 0;
  files.forEach(function(f){
    if(isPdfFile(f)){ if(pdfOk) pdfs.push(f); else 사진만 += 1; }
    else imgs.push(f);
  });
  if(사진만) toast('이 칸에는 사진만 붙일 수 있습니다');
  if(!imgs.length && !pdfs.length) return;

  var have = (PICKED[id] || []).length;
  var room = PHOTO_MAX - have;
  if(room <= 0){ toast('첨부는 '+PHOTO_MAX+'개까지입니다'); return; }
  if(imgs.length + pdfs.length > room){
    toast('첨부는 '+PHOTO_MAX+'개까지입니다');
    var all = imgs.concat(pdfs).slice(0, room);
    imgs = all.filter(function(f){ return !isPdfFile(f); });
    pdfs = all.filter(isPdfFile);
  }

  var box = $(id+'Box');
  if(box) box.innerHTML = '<p class="none">사진을 확인하는 중입니다...</p>';

  /* ★★ 한 장씩 따로 봅니다 (2026-09-03).
     5MB 이하면 **손대지 않고 그대로**, 넘을 때만 5MB 미만이 되는 만큼만 줄입니다.
     예전에는 장수로 한도를 나눠 가져서, 다섯 장을 고르면 한 장당 1.4MB 밖에
     못 써 **작은 사진까지 전부 다시 압축**되었습니다. */
  photoBusy(1);
  var 너무큼 = 0;
  var pdfJobs = pdfs.map(function(f){
    if(f.size > PDF_MAX){ 너무큼 += 1; return Promise.resolve(null); }
    return photoDataUrl(f).then(function(u){
      return u ? { pdf: true, name: String(f.name || '첨부.pdf'), blob: f, url: u, thumb: '' } : null;
    });
  });
  Promise.all(imgs.map(function(f){ return photoFit(f); })).then(function(rs){
    var 못담음 = 0;
    rs.forEach(function(r, i){
      if(r){
        PICKED[id].push({
          blob: r.blob, url: '', thumb: '',
          name: r.changed ? r.name : ((imgs[i] && imgs[i].name) || '사진')
        });
      }else{
        못담음 += 1;
      }
    });
    return Promise.all(pdfJobs).then(function(ps){
      ps.forEach(function(o, i){
        if(o) PICKED[id].push(o);
        else if(!(pdfs[i] && pdfs[i].size > PDF_MAX)) 못담음 += 1;
      });
      return photoFitTotal(id);
    }).then(function(더줄임){
      return photoMakeUrls(id).then(function(){
        photoDraw(id);
        /* ★ 조용히 빠뜨리지 않는다. 예전에는 못 읽은 사진이 아무 말 없이 사라졌다 */
        if(너무큼) toast('PDF 는 한 개 8MB 까지입니다. '+너무큼+'개는 담지 못했습니다.');
        if(못담음) toast(못담음+'개는 담지 못했습니다. 다시 골라 주세요.');
        else if(더줄임) toast('사진이 많아 크기를 조금 더 줄였습니다.');
      });
    });
  }).catch(function(err){
    quiet('사진 담기', err);
    photoDraw(id);
    toast('사진을 담지 못했습니다. 다시 시도해 주세요.');
  }).then(function(){
    photoBusy(-1);          /* 실패해도 반드시 풀어 준다 (버튼이 굳으면 아무것도 못 한다) */
  });
}

/** 담은 것을 보낼 수 있는 글자(data URL)로 바꾼다 */
function photoMakeUrls(id){
  var list = PICKED[id] || [];
  return Promise.all(list.map(function(o){
    if(o.url) return null;
    return photoDataUrl(o.blob).then(function(u){
      o.url = u;
      /* ★ 미리보기는 data URL 이 아니라 blob 주소를 씁니다.
         5MB 글자를 화면에 그대로 박으면 그 자리에서 버벅입니다. */
      if(!o.thumb && window.URL && URL.createObjectURL){
        try{ o.thumb = URL.createObjectURL(o.blob); }catch(e){ o.thumb = u; }
      }
    });
  }));
}

/** 워크보드만 있는 총량 확인.
    한 요청에 다 실어 보내므로 전부 합쳐 너무 크면 요청이 통째로 실패합니다.
    ★ 걸렸을 때만 조금 더 줄이고, **사람에게 알립니다.** */
function photoFitTotal(id){
  var list = PICKED[id] || [];
  var bin = 0;
  list.forEach(function(o){ bin += (o.blob && o.blob.size) || 0; });
  if(bin * 4 / 3 <= PHOTO_TOTAL_LIMIT) return Promise.resolve(false);

  var per = Math.floor(PHOTO_TOTAL_LIMIT * 3 / 4 / Math.max(1, list.length));
  return Promise.all(list.map(function(o){

        '<span class="m" id="calM">'+calTitle()+'</span>'+
        '<button class="btn sm" onclick="calMove(1)" title="다음 달" aria-label="다음 달">'+ic('chev')+'</button>'+
      '</div>'+
      '<div class="calbody" id="calBody">'+calBody()+'</div>'+
    '</div></div></div>';
}

function calTitle(){
  return Number(CAL.ym.substring(0,4))+'년 '+Number(CAL.ym.substring(5,7))+'월';
}

/**
 * 달력 안쪽만 다시 그린다 (v50). 창도, 제목줄도, ◀▶ 버튼도 그대로 있습니다.
 *   dir  1 다음 달 · -1 지난 달 · 0 제자리 (날짜를 눌렀을 때 · 저장·삭제 뒤)
 * 달력이 열려 있지 않으면 아무것도 하지 않고 false 를 돌려줍니다.
 */
function calFill(dir){
  var box=$('calBody'), ttl=$('calM');
  if(!box || !ttl) return false;
  ttl.textContent=calTitle();
  box.innerHTML=calBody();
  box.className='calbody';
  if(dir){ void box.offsetWidth; box.classList.add(dir>0?'next':'prev'); }
  return true;
}

/**
 * 지난달·다음달 날짜 칸 (v53).
 *
 * 달을 넘겨서 받아도(0월·13월) 알아서 연도를 맞춥니다.
 * ★ 날짜 숫자만 흐리게 넣습니다. 주말 색·공휴일 이름표·휴가·일정은 넣지 않습니다.
 *   이번 달 날짜와 헷갈리지 않게 하려는 것입니다.
 * ★ 누르면 그 달로 넘어가고 그 날짜가 골라집니다 (calGo).
 */
function offCell(y, m, day){
  while(m < 1){ m += 12; y -= 1; }
  while(m > 12){ m -= 12; y += 1; }
  var ds = y + '-' + p2(m) + '-' + p2(day);
  return '<div class="calcell off" onclick="calGo(\''+ds+'\')">'+
    '<div class="ch"><span class="d">'+day+'</span></div></div>';
}

/**
 * 지난달·다음달 날짜를 눌렀을 때 — 그 달로 넘어가고 그 날짜를 고른 상태로 둔다 (v53).
 * 서버에 묻지 않습니다. 달력에 쓰는 자료는 board 가 이미 다 실어 보냈습니다.
 */
function calGo(ds){
  var before = CAL.ym;
  CAL.ym = ds.substring(0,7);
  CAL.pick = ds;
  if(!calFill(CAL.ym < before ? -1 : 1)) drawCal();
}

/** 요일줄 + 날짜칸 + 한 줄 요약 + 그날 상세 */
function calBody(){
  var y = Number(CAL.ym.substring(0,4));
  var m = Number(CAL.ym.substring(5,7));
  var td = todayStr();

  var first = new Date(y, m-1, 1);
  var startDow = first.getDay();                 // 0 일요일
  var lastDate = new Date(y, m, 0).getDate();

  var dows = ['일','월','화','수','목','금','토'];
  var cells = dows.map(function(d,i){
    var c = (i===0?' sun':(i===6?' sat':''));
    return '<div class="dow'+c+'">'+d+'</div>';
  });

  /* 앞줄의 빈자리에 지난달 끝 날짜를 흐리게 넣는다 (v53).
     ★ 주말 색·공휴일 이름표·휴가·일정은 넣지 않는다. 이번 달 것만 보여준다.
     ★ 1일이 일요일이면 startDow 가 0 이라 이 반복은 한 번도 돌지 않는다. */
  var i;
  var prevLast = new Date(y, m-1, 0).getDate();     // 지난달 마지막 날
  for(i=startDow; i>0; i--) cells.push(offCell(y, m-1, prevLast - i + 1));

  var monthLeave = 0, monthEvent = 0;
  for(i=1; i<=lastDate; i++){
    var ds = y + '-' + p2(m) + '-' + p2(i);
    var hol = holidayOn(ds);
    var items = calChips(ds);
    monthLeave += leavesOn(ds).length;
    eventsOn(ds).forEach(function(v){ if(!isHolidayEvent(v)) monthEvent += 1; });

    var cls = 'calcell';
    if(((startDow + i - 1) % 7) === 0) cls += ' sun';
    if(((startDow + i - 1) % 7) === 6) cls += ' sat';
    if(ds === td) cls += ' today';
    if(ds === CAL.pick) cls += ' pick';

    /* 공휴일이면 무슨 날인지 먼저 놓고, 남는 자리에 휴가·일정을 채운다.
       ★ 칸 높이에 실제로 들어가는 줄 수만 그린다 (v51).
         날짜 줄 18 + 칩 20 x 2 = 58 이라 칩은 두 줄까지다.
         세 줄을 그리면 82px 가 되는데 자리는 72~78px 뿐이라
         마지막 줄이 반쯤 잘려 있었다 (실측).
       ★ 공휴일 칩은 이름을 줄이지 않으려고 두 줄까지 차지합니다 (v52).
         그래서 공휴일이 있는 날은 휴가·일정을 칸 안에 따로 그리지 않고
         개수(+n)로만 알립니다. 자세한 것은 날짜를 누르면 나옵니다.
       ★ 못 그린 개수(+n)는 아래에 줄을 더 만들지 않고
         날짜 줄 오른쪽 빈자리에 붙인다. 그래야 줄 하나를 되찾는다. */
    var holChip = hol ? '<span class="chip hol">'+esc(hol)+'</span>' : '';
    var cap = hol ? 0 : 2;
    var show = items.slice(0, cap);
    var rest = items.length - show.length;
    var chips = show.map(function(c){
      return '<span class="'+c.cls+'">'+esc(c.text)+'</span>';
    }).join('');

    cells.push('<div class="'+cls+'" onclick="calPick(\''+ds+'\')">'+
      '<div class="ch"><span class="d'+(hol?' hol':'')+'">'+i+'</span>'+
      (ds===td ? '<i class="tdot" title="오늘"></i>' : '')+
      '<span class="sp"></span>'+
      (rest > 0 ? '<span class="more">+'+rest+'</span>' : '')+'</div>'+
      holChip+chips+'</div>');
  }

  /* ★ 언제나 여섯 줄로 그린다 (v50).
     달마다 4~6줄로 달라지면 달력 아래에 있는 것들과 창 높이가 같이 움직여서,
     ▶ 를 연달아 누를 때 버튼이 손 밑에서 도망갔습니다.
     요일줄 7칸 + 날짜 42칸 = 49칸.
     남는 칸은 다음 달 첫 날짜로 채웁니다 (v53). 31일이 토요일이라 뒷자리가
     없는 달이면 이 반복이 한 번도 돌지 않습니다. */
  var nextDay = 1;
  while(cells.length < 49) cells.push(offCell(y, m+1, nextDay++));

  var head = monthLeave + monthEvent
    ? ('이 달 휴가 '+monthLeave+'건 · 일정 '+monthEvent+'건 · 날짜를 누르면 자세히 보입니다')
    : '이 달에 등록된 휴가·일정이 없습니다';

  return '<div class="calgrid">'+cells.join('')+'</div>'+
    '<p class="muted" style="margin:var(--sp-3) 0 0;font-size:var(--fs-sm)">'+head+'</p>'+
    calDayBox();
}

/** 날짜를 눌렀을 때 아래에 펼쳐지는 그날 내용 */
function calDayBox(){
  if(!CAL.pick) return '';
  var ds = CAL.pick;
  var hol = holidayOn(ds);
  var lv = leavesOn(ds);
  var ev = eventsOn(ds).filter(function(v){ return !isHolidayEvent(v); });

  var h = '<div class="calday"><h4>'+esc(dateLabelK(ds))+
    (ds===todayStr()? ' <span class="tag">오늘</span>' : '')+
    (hol? ' <span class="dgv">'+esc(hol)+'</span>' : '')+'</h4>';

  if(lv.length){
    h += sechead('휴가', lv.length);
    h += lv.map(function(v){
      /* 휴가는 결재로만 생깁니다. 잘못 올라간 줄을 치우는 길만 관리자에게 엽니다 (v52).
         ★ canDel 은 서버가 정해서 보낸 값입니다. 화면에서 등급을 비교하지 마세요.
         ★ 고치기는 없습니다. 고칠 일이 있으면 결재를 다시 올립니다. */
      /* 되돌릴 수 없는 삭제만 빨강 — 낱말도 `삭제` 로 통일 (2026-09-09) */
      var btn = v.canDel
        ? '<button class="btn sm dg" onclick="deleteLeave(\''+esc(v.id)+'\')">삭제</button>'
        : '';
      return '<div class="lrow plain"><div class="m">'+
        '<p class="t">'+esc(v.name)+' <span class="tag wn">'+esc(v.kind||'휴가')+'</span></p>'+
        byline([v.from + (v.to!==v.from ? (' ~ '+v.to) : ''),
                v.days ? (String(v.days)+'일') : ''])+
        '</div>'+(btn? '<div class="r">'+btn+'</div>' : '')+'</div>';
    }).join('');
  }

  if(ev.length){
    h += sechead('일정', ev.length);
    h += ev.map(function(v){
      var btn = v.canEdit
        ? ('<button class="btn sm" onclick="openEventForm(\''+esc(ds)+'\',\''+esc(v.id)+'\')">수정</button> '+
           '<button class="btn sm dg" onclick="deleteEvent(\''+esc(v.id)+'\')">삭제</button>')
        : '';
      return '<div class="lrow plain"><div class="m">'+
        '<p class="t">'+esc([v.time, v.title].filter(Boolean).join('  '))+'</p>'+
        byline([v.name, kindName(v.kind),
                (v.from!==v.to) ? (v.from+' ~ '+v.to) : ''])+
        /* 본문은 두 줄까지 — 긴 메모 하나가 목록을 열 줄로 늘렸습니다 (2026-09-09) */
        (v.body ? '<p class="sub evbody">'+esc(v.body)+'</p>' : '')+
        '</div>'+(btn? '<div class="r">'+btn+'</div>' : '')+'</div>';
    }).join('');
  }

  if(!lv.length && !ev.length) h += empty('휴가도 일정도 없습니다.');

  h += '<div class="actions">'+
       '<button class="btn" onclick="openLeaveDoc(\''+esc(ds)+'\')">휴가 신청</button>'+
       '<button class="btn pri" onclick="openEventForm(\''+esc(ds)+'\')">일정 추가</button>'+
       '</div></div>';
  return h;
}

/** 그 날짜를 시작일로 하는 휴가 신청서. 결재는 그대로 거친다 */
function openLeaveDoc(ds){
  openDocForm('LEAVE', { '시작일':ds, '종료일':ds });
}

/** 2026-08-28 → 8월 28일 (금) */
function dateLabelK(ds){
  var y=Number(ds.substring(0,4)), m=Number(ds.substring(5,7)), d=Number(ds.substring(8,10));
  var w=['일','월','화','수','목','금','토'][new Date(y,m-1,d).getDay()];
  return m+'월 '+d+'일 ('+w+')';
}

/* ---------------- 일정 넣기 · 고치기 ---------------- */

function openEventForm(ds, id){
  var ev = null;
  if(id) ((S.data && S.data.events) || []).forEach(function(v){ if(v.id===id) ev = v; });

  /* 고를 수 있는 구분. 고치려는 일정이 이미 '그만 쓰기로 한 구분' 이면 그것도 같이 만든다
     (안 그러면 저장할 때 구분이 엉뚱하게 바뀐다 — 업무유형과 같은 이유) */
  var kinds = ((S.data && S.data.eventKinds) || []).slice();
  if(ev && ev.kind && !kinds.some(function(k){ return k.code===ev.kind; })){
    kinds.push({ code:ev.kind, name:kindName(ev.kind) });
  }
  if(!kinds.length) kinds = [{ code:'PERSONAL', name:'개인일정' }];

  /* ★★ 사람이 실제로 넣는 것은 날짜·시각·제목 셋 (2026-09-09).
       종료일·구분·대상자·내용·반복은 대부분 기본값 그대로라 `더 적기` 로 접습니다.
       칸 이름(id)은 그대로라 saveEvent 는 손대지 않았습니다.
       고칠 때 종료일·내용이 들어 있으면 접기를 열어 둡니다. */
  var 더있나 = !!(ev && ((ev.to && ev.to!==ev.from) || ev.body));
  if(더있나) FOLD['ev:more']=true;
  var h='<div class="veil"><div class="sheet">'+
    '<div class="sheethead"><h3 class="tt">'+(ev?'일정 수정':'일정 추가')+'</h3></div>'+
    '<input type="hidden" id="evId" value="'+esc(ev?ev.id:'')+'">'+
    '<div class="field"><label class="fl req">날짜</label>'+
      '<input type="date" id="evFrom" value="'+esc(ev?ev.from:ds)+'"></div>'+
    /* ★ 시각은 한 줄을 통째로 씁니다 (v50). 구분과 반씩 나눠 쓰면 폰에서
         칸 하나가 70px 남짓이 되어 '오전 12시' 가 잘립니다. */
    '<div class="field"><label class="fl req">시각</label>'+
      timeSelect(ev?ev.time:'09:00')+'</div>'+
    '<div class="field"><label class="fl req">제목</label>'+
      '<input type="text" id="evTitle" value="'+esc(ev?ev.title:'')+'"></div>'+
    '<div class="fold'+(FOLD['ev:more']?' open':'')+'">'+
    '<button class="fh" onclick="toggleFold(\'ev:more\',this)">더 적기<span class="arrow">'+ic('chev-d')+'</span></button>'+
    '<div class="fb">'+
    '<div class="field"><label class="fl">종료일</label>'+
      '<input type="date" id="evTo" value="'+esc(ev&&ev.to!==ev.from?ev.to:'')+'"></div>'+
    '<div class="grid2">'+
      '<div class="field"><label class="fl req">구분</label><select id="evKind">'+
        kinds.map(function(k){
          return '<option value="'+esc(k.code)+'"'+((ev&&ev.kind===k.code)?' selected':'')+'>'+
                 esc(k.name)+'</option>';
        }).join('')+
      '</select></div>'+
      '<div class="field"><label class="fl req">대상자</label><select id="evWho">'+
        staffOptions(ev? ev.phone : (S.me? S.me.phone : ''))+'</select></div>'+
    '</div>'+
    '<div class="field"><label class="fl">내용</label>'+
      '<textarea id="evBody" rows="3">'+esc(ev?ev.body:'')+'</textarea></div>'+
    (ev? '' :
      /* ★ 반복 (2026-09-02) — 새 일정일 때만.
         고칠 때 반복 칸이 있으면 '이번 것만' 과 '전부' 를 물어야 하고,
         그 순간 화면이 복잡해집니다. 만들 때 한 번만 정합니다. */
      '<div class="grid2">'+
        '<div class="field"><label class="fl">반복</label>'+
          '<select id="evRep" onchange="repSync()">'+
            '<option value="">없음</option>'+
            '<option value="week">매주</option>'+
            '<option value="month">매달</option>'+
            '<option value="year">해마다</option>'+
          '</select></div>'+
        '<div class="field hide" id="evTimesBox"><label class="fl">몇 번</label>'+
          '<select id="evTimes">'+
            [3,6,12,24].map(function(n){
              return '<option value="'+n+'"'+(n===12?' selected':'')+'>'+n+'번</option>';
            }).join('')+
          '</select></div>'+
      '</div>')+
    '</div></div>'+
    '<div class="actions"><button class="btn" onclick="closeEventForm()">취소</button>'+
    '<button class="btn pri" id="evSave" onclick="saveEvent()">저장</button></div>'+
    '<p class="muted" id="evMsg" style="margin-top:8px"></p></div></div>';

  $('modal').innerHTML=h;
}

/**
 * 시각 고르기 (v50) — 시 · 분 드롭다운 두 개.
 *
 * 예전에는 <input type="time"> 이었습니다. 브라우저가 그리는 시계 상자라
 * 우리 CSS 가 닿지 않아 [오전][09][00] 세 칸이 제멋대로 뜨고, 손가락으로
 * 맞추기도 어려웠습니다. 화면의 다른 선택칸(구분·대상자)과 같은 모양으로 바꿉니다.
 *
 * ★ 분은 5분 단위입니다. 예전에 그 밖의 값으로 넣어둔 일정을 고칠 때는
 *   그 값도 목록에 넣습니다 — 안 그러면 제목만 고쳤는데 시각이 몰래 바뀝니다.
 */
function timeSelect(val){
  var v = /^\d{1,2}:\d{2}$/.test(val||'') ? val : '09:00';
  var hh = p2(Number(v.split(':')[0])), mm = p2(Number(v.split(':')[1]));

  var h='', i;
  for(i=0;i<24;i++){
    var lab = (i<12?'오전 ':'오후 ') + ((i%12)===0 ? 12 : (i%12)) + '시';
    h += '<option value="'+p2(i)+'"'+(p2(i)===hh?' selected':'')+'>'+lab+'</option>';
  }

  var mins=['00','05','10','15','20','25','30','35','40','45','50','55'];
  if(mins.indexOf(mm)<0){ mins.push(mm); mins.sort(); }
  var mh = mins.map(function(x){
    return '<option value="'+x+'"'+(x===mm?' selected':'')+'>'+Number(x)+'분</option>';
  }).join('');

  return '<div class="tsel"><select id="evH">'+h+'</select>'+
         '<select id="evM">'+mh+'</select></div>';
}

/** 반복을 고르면 '몇 번' 칸이 나온다 (안 고르면 아예 안 보인다) */
function repSync(){
  var r=$('evRep'), box=$('evTimesBox');
  if(!r || !box) return;
  box.classList.toggle('hide', !r.value);
}

function timeValue(){
  var h=$('evH'), m=$('evM');
  return (h && m) ? h.value+':'+m.value : '';
}

/** 일정 창을 닫고 달력으로 돌아간다. 쓰던 내용이 있으면 한 번 묻는다 */
function closeEventForm(){
  if(modalDirty() && !confirm('작성 중인 내용이 사라집니다. 닫을까요?')) return;
  drawCal();
}

function saveEvent(){
  var p = {
    id: $('evId').value,
    from: $('evFrom').value,
    to: $('evTo').value,
    time: timeValue(),
    kind: $('evKind').value,
    phone: $('evWho').value,
    title: $('evTitle').value.trim(),
    body: $('evBody').value.trim(),
    repeat: ($('evRep') ? $('evRep').value : ''),
    times: ($('evTimes') ? Number($('evTimes').value||1) : 1)
  };
  if(!p.from){ $('evMsg').textContent='날짜를 정해주세요.'; return; }
  if(p.to && p.to < p.from){ $('evMsg').textContent='종료일이 시작일보다 앞설 수 없습니다.'; return; }
  if(!p.time){ $('evMsg').textContent='시각을 골라주세요.'; return; }
  if(!p.title){ $('evMsg').textContent='제목을 입력해주세요.'; $('evTitle').classList.add('err'); return; }

  var btn=$('evSave');
  if(btn.disabled) return;
  btn.disabled=true;

  // 화면에 먼저 반영하고 달력으로 돌아간다 (기다리지 않음)
  var backup = (S.data && S.data.events) ? S.data.events.slice() : [];
  var ep=S.epoch;
  var tmpId = p.id || ('TMP-'+Date.now());
  var whoName = '';
  ((S.data && S.data.staff) || []).forEach(function(s){ if(s.phone===p.phone) whoName=s.name; });

  applyEventLocal({
    id: tmpId, from: p.from, to: (p.to || p.from), time: p.time, kind: p.kind,
    phone: p.phone, name: whoName, title: p.title, body: p.body,
    by: S.me? S.me.phone : '', byName: S.me? S.me.name : '', canEdit: true
  });
  CAL.pick = p.from;
  CAL.ym = p.from.substring(0,7);
  drawCal();
  toast('저장되었습니다');

  call('api_saveEvent', S.token, p, S.corp).then(function(r){
    if(!r || !r.ok){
      if(S.data && sameAccess(ep)) S.data.events = backup;
      calRedraw();
      toast('저장 실패: '+((r&&r.msg)||'다시 시도해주세요'));
      return;
    }
    dropEventLocal(tmpId);          // 임시로 붙여둔 것을 서버가 준 정확한 값으로 갈아끼운다
    applyEventLocal(r.event);
    calRedraw();
    /* 반복으로 여러 개를 만들었으면 알려 준다. 나머지는 새로고침으로 들어온다 */
    if(r.made > 1) toast(r.made+'개를 넣었습니다');
    softRefresh();
  });
}

function deleteEvent(id){

  var backup = (S.data && S.data.events) ? S.data.events.slice() : [];
  var ep=S.epoch;

  call('api_deleteEvent', S.token, id, S.corp).then(function(r){

      if(S.data && sameAccess(ep)) S.data.events = backup;
      calRedraw();
      toast('삭제 실패: '+((r&&r.msg)||'다시 시도해주세요'));

}

/**
 * 휴가 지우기 — 관리자만 (v52).
 *
 * ★ 휴가는 결재로만 생깁니다. 잘못 올라간 줄을 치우는 용도입니다.
 *   **이미 승인된 결재 문서는 그대로 남습니다** — 결재 기록은 지우지 않습니다.
 *   되돌릴 수 없으므로 물어볼 때 그 점을 분명히 적습니다.
 * ★ 판정은 서버에서 다시 합니다 (api_deleteLeave).
 */
function deleteLeave(id){

  toast('삭제되었습니다');

  call('api_deleteLeave', S.token, id, S.corp).then(function(r){
    if(!r || !r.ok){
      if(S.data && sameAccess(ep)) S.data.leaves = backup;
      calRedraw();
      toast('삭제 실패: '+((r&&r.msg)||'다시 시도해주세요'));

  });
}

/* ---- 화면이 가진 데이터를 직접 고친다 (저장 API 는 board 를 만들지 않는다) ---- */
function applyEventLocal(ev){
  if(!S.data) return;
  S.data.events = (S.data.events || []).filter(function(v){ return v.id !== ev.id; });
  S.data.events.push(ev);
  S.data.events.sort(function(a,b){
    if(a.from!==b.from) return a.from<b.from?-1:1;
    if(a.time!==b.time) return (a.time||'')<(b.time||'')?-1:1;
    return (a.title||'')<(b.title||'')?-1:1;
  });
}
function dropEventLocal(id){
  if(!S.data || !S.data.events) return;
  S.data.events = S.data.events.filter(function(v){ return v.id !== id; });
}

function nowHM(){ var d=new Date(); return p2(d.getHours())+':'+p2(d.getMinutes()); }

/* 게시판은 공지뿐입니다 (그 밖의 이야기는 업무로 올립니다).
   ★ 2026-09-03에 '일반' 종류를 없앴습니다 — 서버가 공지만 보냅니다.

/** 글 상세 — 캐시가 있으면 왕복 0회 */
function openPost(no){
  S.seen['N'+no]=1;
  renderNotices();

  // 캐시에 있으면 그걸로, 없으면 board 가 준 공지 3건(본문 포함)으로 즉시 연다
  var have = S.postCache && (S.postCache.posts||[]).some(function(x){ return x.no===no; });
  if(have){ drawPost(no); return; }

  var stub=noticeStub();
  var inStub=(stub.posts||[]).some(function(x){ return x.no===no; });
  if(inStub){
    /* 글은 즉시 (본문까지 board 에 실려 왔다). 댓글만 뒤에서 채운다.
       ★ 이미 받아오는 중이면 그것을 같이 기다립니다 — 두 번 부르지 않습니다. */
    drawPost(no, stub);
    prefetchPosts().then(function(){
      if(S.postCache && $('pcBody')) drawPost(no);
    });
    return;
  }

  $('modal').innerHTML='<div class="veil"><div class="sheet">'+
    '<p class="muted" style="font-size:var(--fs-sm);margin:0">불러오는 중...</p></div></div>';
  prefetchPosts().then(function(){
    if(!S.postCache){ toast('글을 열 수 없습니다'); closeOk(); return; }
    drawPost(no);
  });
}

function drawPost(no, src){

     글쓴이와 남이 보는 첫 화면이 달랐습니다. 업무 상세와 같은 방식입니다. */
  var h='<div class="veil"><div class="sheet">'+
    '<div class="sheethead"><h3 class="tt">'+esc(p.title)+'</h3>'+
      '<button class="btn sm" onclick="openBoard()">목록</button>'+

      '<button class="btn sm" onclick="closeModal()">닫기</button></div>'+
    (mine? '<div class="tdmenu" id="tdMenu">'+
      '<button class="btn sm" onclick="openPostForm(\''+p.no+'\')">수정</button>'+
      '<button class="btn sm dg" onclick="deletePost(\''+p.no+'\')">삭제</button></div>':'')+
    byline([p.who, shortDate(p.at), p.edited? '수정 '+shortDate(p.edited) : ''])+
    '<div style="margin-bottom:20px">'+fmt(p.body)+shotsHtml(p.photos)+'</div>'+
    '<div id="pcBody">'+
      commentsHtml('게시글', p.no, (r.comments&&r.comments[p.no])||[], null, true)+

  $('modal').innerHTML=h;
}

/** 공지 쓰기 / 수정 — 제목과 내용 두 칸뿐 */
function openPostForm(no){

    '<div class="field"><label class="fl req">제목</label>'+

/* ★★ 아직 저장 중인 공지의 '임시 번호' → '진짜 번호' 로 이어주는 표 (2026-09-02).
 *
 *  공지를 올리면 화면은 그 자리에서 닫히고 저장은 뒤에서 돕니다(낙관 처리).
 *  그 사이에 사람이 방금 올린 공지를 눌러 **바로 수정**하면,
 *  서버에는 아직 없는 임시 번호(_tmp...)가 그대로 보내져
 *  **`없는 글입니다`** 가 떴습니다.
 *  (2026-09-02 조소희 님이 '글 업로드하고 바로 수정 눌렀을때 없는 글이라고 뜸' 으로 알려주셨습니다)
 *
 *  이제 보내기 직전에 진짜 번호가 나올 때까지 기다렸다가 보냅니다.
 *  사람은 아무것도 안 해도 되고, 화면이 늦게 열리지도 않습니다.
 */
var PENDING_POST = {};

/** 임시 번호면 저장이 끝날 때까지 기다렸다가 진짜 번호를 준다 */
function postRealNo(no){
  if(no && PENDING_POST[no]) return PENDING_POST[no];
  return Promise.resolve(no || '');
}

function savePost(no){
  var title=$('pfTitle').value.trim();
  var body=mkValue('pfBody');
  var msg=$('pfMsg');
  if(PHOTO_BUSY > 0){ msg.textContent='사진을 정리하는 중입니다. 잠시만 기다려 주세요.'; return; }
  var shots=photoValues('pfPhoto');
  if(!title){ msg.textContent='제목을 입력해주세요.'; return; }
  if(!body){ msg.textContent='내용을 입력해주세요.'; return; }

  // 전 직원에게 알림이 가므로 한 번 더 묻는다
  if(!confirm('전 직원에게 알림이 갑니다. 올리시겠습니까?')) return;

  var btn=$('pfSave'); if(btn.disabled) return;
  btn.disabled=true;

  /* 낙관 처리 — 즉시 상단에 반영하고 창을 닫는다. 저장은 뒤에서 */
  var nowS=todayStr()+' '+nowHM();
  var tmpNo=no||('_tmp'+Date.now());
  var np={ no:tmpNo, corp:'', title:title, body:body,
           who:(S.me&&S.me.name)||'', phone:(S.me&&S.me.phone)||'',
           at:nowS, edited:no? nowS : '' };

  var backNotice = S.data ? (S.data.notices||[]).slice() : null;
  var backPosts  = S.postCache ? (S.postCache.posts||[]).slice() : null;

  var send = { no:no||'', corp:'', title:title, body:body, photos:shots };

  /* ★ 사진이 있으면 즉시 닫지 않습니다 (2026-08-31).
     사진은 올리는 데 시간이 걸리고, 실패하면 되돌릴 것이 사진까지라
     '저장됐다' 고 먼저 말하면 안 됩니다.
     사진이 없을 때는 예전처럼 즉시 닫고 뒤에서 보냅니다. */
  if(shots.length){
    var btn2=$('pfSave');
    if(btn2){ btn2.disabled=true; }
    msg.textContent='사진 '+shots.length+'장과 함께 올리는 중입니다...';
    /* ★ 앞서 올린 것이 아직 저장 중이면 진짜 번호가 나올 때까지 기다린다 */
    postRealNo(no).then(function(realNo){
      send.no = realNo || '';
      return call('api_savePost', S.token, send, S.corp);
    }).then(function(r){
      if(btn2) btn2.disabled=false;
      if(!r.ok){ msg.textContent = r.msg || '올리지 못했습니다.'; return; }
      np.no = r.no || tmpNo;
      np.photos = r.photos || [];
      putPostLocal(np, no);
      closeOk();
      toast(no? '공지가 수정되었습니다' : '공지가 등록되었습니다');
      softRefresh();
    });
    return;
  }

  putPostLocal(np, no);
  closeOk();
  toast(no? '공지가 수정되었습니다' : '공지가 등록되었습니다');

  /* ★ 새 글이면 '이 임시 번호는 곧 진짜 번호가 된다' 고 적어 둔다.
     그 사이에 수정을 누르면 postRealNo 가 여기서 기다립니다. */
  var 기다림 = postRealNo(no).then(function(realNo){
    send.no = realNo || '';
    return call('api_savePost', S.token, send, S.corp);
  }).then(function(r){
    if(!r.ok){
      // 되돌리고 알린다
      if(backNotice && S.data){ S.data.notices=backNotice; renderNotices(); }
      if(backPosts && S.postCache) S.postCache.posts=backPosts;
      toast('공지 저장 실패: '+r.msg);
      return '';
    }
    // 임시 번호를 진짜 번호로 바꾼다
    if(!no) renumberPost(tmpNo, r.no, r.at||nowS);
    softRefresh();
    return no || r.no || '';
  });

  if(!no){
    PENDING_POST[tmpNo] = 기다림;
    기다림.then(function(){ delete PENDING_POST[tmpNo]; });
  }
}

/** 공지를 상단 줄과 게시판 캐시에 즉시 반영 */
function putPostLocal(np, isEdit){
  if(S.data){
    var list=(S.data.notices||[]).filter(function(n){ return n.no!==np.no; });
    list.unshift({ no:np.no, title:np.title, body:np.body, who:np.who,
                   phone:np.phone, at:String(np.at).substring(0,10), edited:np.edited||'' });
    S.data.notices=list.slice(0,3);
    renderNotices();
  }
  if(S.postCache){
    var found=false;
    S.postCache.posts=(S.postCache.posts||[]).map(function(x){
      if(x.no!==np.no) return x;
      found=true; return np;
    });
    if(!found) S.postCache.posts.unshift(np);
  }
}

/** 저장이 끝나면 임시 번호를 서버가 준 진짜 번호로 */
function renumberPost(tmpNo, realNo, at){
  if(!realNo) return;
  if(S.data && S.data.notices){
    S.data.notices.forEach(function(n){
      if(n.no===tmpNo){ n.no=realNo; n.at=String(at).substring(0,10); }
    });
    renderNotices();
  }
  if(S.postCache && S.postCache.posts){
    S.postCache.posts.forEach(function(x){ if(x.no===tmpNo){ x.no=realNo; x.at=at; } });
  }
}

function deletePost(no){
  if(!confirm('이 글을 지울까요?\n달린 댓글도 함께 지워지고 되돌릴 수 없습니다.')) return;
  var backN=S.data? (S.data.notices||[]).slice() : null;
  var backP=S.postCache? (S.postCache.posts||[]).slice() : null;

  dropNoticeLocal(no);
  if(S.postCache){
    S.postCache.posts=(S.postCache.posts||[]).filter(function(x){ return x.no!==no; });
    if(S.postCache.comments) delete S.postCache.comments[no];
  }
  toast('삭제되었습니다');
  openBoard();

  call('api_deletePost', S.token, no, S.corp).then(function(r){
    if(!r.ok){
      if(backN && S.data){ S.data.notices=backN; renderNotices(); }
      if(backP && S.postCache) S.postCache.posts=backP;
      toast('삭제하지 못했습니다: '+r.msg);
      openBoard();
      return;
    }
    if(S.postCache) S.postCacheAt=areaVer('post');
    softRefresh();
  });
}

/* ===================== 댓글 (업무 상세 · 게시글 공용) ===================== */

/**
 * total 을 주면 '댓글 더 보기' 가 붙는다 (업무 상세용).
 * withHead=true 면 제목줄('댓글 N')을 여기서 그린다. 업무 상세는 접기 제목줄에 얹으므로 false.
 * 개수는 어디에 있든 id=cmCount 하나뿐이라 목록과 항상 같이 움직인다.
 */
function commentsHtml(kind, targetId, list, total, withHead){
  list=list||[];
  var all=(total!=null && total>list.length) ? total : list.length;
  var more=(total!=null && total>list.length) ? (total-list.length) : 0;

  var h='';
  if(withHead){
    h+='<h4 class="sech">댓글 '+
       '<span id="cmCount" data-n="'+all+'">'+all+'</span></h4>';
  }
  h+='<div id="cmList" data-kind="'+esc(kind)+'" data-target="'+esc(targetId)+'">';
  if(!list.length) h+='<p class="muted cmempty" style="font-size:var(--fs-sm);margin:4px 0">아직 댓글이 없습니다</p>';
  cmTree(list).forEach(function(c){ h+=commentRow(c); });
  h+='</div>';

  if(more){
    h+='<div class="actions" style="margin:6px 0"><button class="btn sm" id="cmMore" '+
       'onclick="loadTaskAll(\''+targetId+'\',\'cmMore\')">댓글 더 보기 ('+more+'건)</button></div>';
  }
  /* ★ 댓글에는 서식 도구를 두지 않습니다 (v55에서 뺌).
     굵게·밑줄·목록 버튼 다섯 개가 댓글 한 줄 위에 늘 떠 있어서, 댓글이 하나도
     없는 화면에서도 자리를 다섯 줄이나 썼습니다. 한두 줄 적는 자리라 서식이 필요 없습니다.
     ▸ 보여줄 때는 그대로 fmt() 를 씁니다. 예전에 서식을 넣어 쓴 댓글이 별표가
       그대로 보이는 채로 남으면 안 되기 때문입니다.
     Enter 는 바로 등록, 줄을 바꾸려면 Shift+Enter — 예전 그대로입니다. */
  /* ★ 사진은 클립 하나로 (2026-09-02).
     서식 도구는 안 두기로 했으므로 늘어나는 것은 이 단추 하나뿐입니다.
     '여기 이렇게 깨졌어요' 한 장이 글 열 줄보다 빠릅니다. */
  photoClear('cmPhoto');
  h+='<div class="tdwrite" style="margin-top:10px">'+
     '<textarea id="cmText" rows="1" spellcheck="false" '+
       'onkeydown="cmKey(event,\''+kind+'\',\''+targetId+'\')" '+
       'onkeyup="atKey(event,this)"></textarea>'+
     '<label class="clip" title="사진 붙이기" aria-label="사진 붙이기">'+ic('clip')+
       '<input type="file" id="cmPhoto" accept="image/*" multiple '+
         'onchange="photoAdd(&#39;cmPhoto&#39;,this)"></label>'+
     '<button class="btn sm pri" onclick="sendComment(\''+kind+'\',\''+targetId+'\')">등록</button>'+
     '</div>'+
     '<div class="thumbs" id="cmPhotoBox"></div>';
  return h;
}

/** 목록이 바뀌면 개수도 같이 바꾼다 (목록엔 보이는데 0 으로 남던 버그) */
function syncCommentCount(delta){
  var el=$('cmCount'); if(!el) return;
  var n=Number(el.dataset.n||0)+delta;
  if(n<0) n=0;
  el.dataset.n=n;
  el.textContent=n;
}

/**
 * 댓글을 '맨 댓글 → 그 아래 답글' 차례로 늘어놓는다 (2026-09-02).
 *
 * ★ 한 겹만 접습니다. 답글의 답글은 만들지 않습니다 —
 *   두 겹이 넘어가면 좁은 폰에서 글자가 몇 자 안 남습니다.
 *   답글에 답글을 달면 서버가 같은 줄기에 붙여 줍니다.
 * ★ 서버가 준 차례(오래된 순)를 그대로 씁니다. 받은 배열은 고치지 않습니다.
 */
function cmTree(list){
  var 있는것={}, 맨댓글=[], 답글={};
  (list||[]).forEach(function(c){ if(c && c.id) 있는것[c.id]=true; });

  (list||[]).forEach(function(c){
    if(!c) return;
    var p=c.parent||'';
    /* 원 댓글이 지워졌으면 맨 댓글로 올린다 — 답글이 사라져 버리면 안 됩니다 */
    if(p && 있는것[p]){
      if(!답글[p]) 답글[p]=[];
      답글[p].push(c);
    }else{
      맨댓글.push(c);
    }
  });

  var out=[];
  맨댓글.forEach(function(c){
    out.push(c);
    (답글[c.id]||[]).forEach(function(r){ r.__답글=true; out.push(r); });
  });
  return out;
}

function commentRow(c){
  var mine = S.me && (S.me.grade>=9 || c.phone===S.me.phone);
  var 답글인가 = !!c.__답글 || !!c.parent;
  /* 답글은 붙일 곳이 원 댓글이다 (답글에 답글을 달아도 같은 줄기로) */
  var 붙일곳 = 답글인가 ? (c.parent||c.id) : c.id;

  return '<div class="cmt'+(답글인가?' re':'')+'" data-cid="'+esc(c.id||'')+'">'+
    '<div class="d">'+(답글인가?'<span class="rearrow">↳</span>':'')+
    '<b>'+esc(c.who)+'</b>'+
    '<span class="muted">'+esc(shortDate(c.at))+'</span>'+
    (c.id ? '<button class="reply" onclick="openReply(\''+esc(c.id)+'\',\''+esc(붙일곳)+'\')">답글</button>':'')+
    (mine && c.id ? '<button class="del" title="댓글 삭제" aria-label="댓글 삭제" onclick="deleteComment(\''+c.id+'\')">'+ic('x')+'</button>':'')+
    '</div><div class="body">'+fmt(c.text)+'</div>'+
    shotsHtml(c.photos||[])+'</div>';
}

/** [답글] — 그 댓글 바로 아래에 적는 칸을 연다 (한 번에 하나만) */
function openReply(cid, parentId){
  var 이미=document.getElementById('cmReplyBox');
  var 같은자리 = 이미 && 이미.dataset.cid===cid;
  if(이미) 이미.parentNode.removeChild(이미);
  if(같은자리) return;                       // 다시 누르면 접는다

  var row=document.querySelector('[data-cid="'+cid+'"]');
  var box=document.getElementById('cmList');
  if(!row || !box) return;

  var kind=box.dataset.kind, target=box.dataset.target;
  var d=document.createElement('div');
  d.className='tdwrite cmreply';
  d.id='cmReplyBox';
  d.dataset.cid=cid;
  d.innerHTML='<textarea id="cmReText" rows="1" spellcheck="false" '+
    'onkeyup="atKey(event,this)"></textarea>'+
    '<button class="btn sm pri">등록</button>';

  row.parentNode.insertBefore(d, row.nextSibling);

  var ta=d.querySelector('textarea'), btn=d.querySelector('button');
  ta.addEventListener('keydown', function(e){
    if(e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); sendComment(kind, target, parentId); }
  });
  btn.addEventListener('click', function(){ sendComment(kind, target, parentId); });
  ta.focus();
}

/** 댓글칸 자판 — Enter 등록 / Shift+Enter 줄바꿈 / Ctrl+B·U 서식 */
function cmKey(e, kind, targetId){
  if(e.key==='Enter' && !e.shiftKey && !e.isComposing){
    e.preventDefault();
    sendComment(kind, targetId);
  }
}

/** 낙관 처리 — 화면에 먼저 붙이고 뒤에서 보낸다. 실패하면 되돌린다.
    parentId 가 있으면 답글입니다 (그 댓글 바로 아래에 붙습니다). */
function sendComment(kind, targetId, parentId){
  var 답글 = !!parentId;
  var el = 답글 ? $('cmReText') : $('cmText');
  if(!el) return;
  var text=String(el.value||'').trim();
  /* 답글에는 사진을 두지 않습니다 — 답글은 한 줄짜리 자리입니다 */
  var 사진 = 답글 ? [] : photoValues('cmPhoto');
  if(!text && !사진.length) return;
  if(PHOTO_BUSY > 0){ toast('사진을 정리하는 중입니다. 잠시만요'); return; }
  el.value='';

  var box=$('cmList');
  var ph=box? box.querySelector('.cmempty') : null;
  if(ph) ph.parentNode.removeChild(ph);

  var 새것={ id:'', who:(S.me&&S.me.name)||'', phone:(S.me&&S.me.phone)||'',
             text:text, at:todayStr()+' '+nowHM(), parent: parentId||'', photos:[] };

  var node=null;
  if(box){
    if(답글){
      /* 원 댓글에 딸린 답글들 **맨 아래**에 붙인다 */
      var 자리=document.querySelector('[data-cid="'+parentId+'"]');
      var 다음=자리? 자리.nextSibling : null;
      while(다음 && 다음.classList && (다음.classList.contains('re') || 다음.id==='cmReplyBox')){
        자리=다음; 다음=다음.nextSibling;
      }
      var tmp=document.createElement('div');
      tmp.innerHTML=commentRow(새것);
      node=tmp.firstChild;
      if(자리) 자리.parentNode.insertBefore(node, 자리.nextSibling);
      else box.appendChild(node);

      var rb=$('cmReplyBox');            // 적는 칸은 닫는다
      if(rb && rb.parentNode) rb.parentNode.removeChild(rb);
    }else{
      box.insertAdjacentHTML('beforeend', commentRow(새것));
      node=box.lastElementChild;
    }
  }
  syncCommentCount(1);

  if(!답글){
    photoClear('cmPhoto');
    var pb=$('cmPhotoBox'); if(pb) pb.innerHTML='';
    var pf=$('cmPhoto'); if(pf) pf.value='';
  }

  call('api_saveComment', S.token, kind, targetId, text, S.corp, parentId||'',
       사진.length? { photos: 사진 } : null).then(function(r){
    if(!r.ok){
      if(node && node.parentNode) node.parentNode.removeChild(node);
      syncCommentCount(-1);
      var back=$('cmText');
      if(back && !back.value) back.value=text;                  // 쓴 글을 잃지 않게
      toast('댓글 저장 실패: '+r.msg);
      return;
    }
    if(node && node.parentNode) node.outerHTML=commentRow(r.comment);

    if(kind==='업무') addCommentLocal(targetId, r.comment);
    softRefresh();

    if(kind==='게시글'){
      if(S.postCache){
        if(!S.postCache.comments) S.postCache.comments={};
        if(!S.postCache.comments[targetId]) S.postCache.comments[targetId]=[];
        S.postCache.comments[targetId].push(r.comment);
        S.postCacheAt=areaVer('post');   // 내가 만든 변화는 이미 반영했다
      }
      /* ★ board 가 실어 보낸 공지 댓글에도 같이 넣는다 (2026-09-02).
         안 넣으면 공지를 닫았다 다시 열 때 방금 쓴 댓글이 잠깐 사라집니다. */
      if(S.data){
        if(!S.data.noticeCmt) S.data.noticeCmt={};
        if(S.data.noticeCmt[targetId]) S.data.noticeCmt[targetId].push(r.comment);
      }
    }
  });
}

function deleteComment(id){
  if(!confirm('이 댓글을 지울까요?')) return;
  var node=document.querySelector('[data-cid="'+id+'"]');
  var mark=node? node.nextSibling : null, par=node? node.parentNode : null;
  if(node && par) par.removeChild(node);      // 먼저 지운다
  syncCommentCount(-1);
  S.taskCache={};
  var ep=S.epoch;
  call('api_deleteComment', S.token, id, S.corp).then(function(r){
    if(!r.ok){
      if(sameAccess(ep)){
        if(node && par) par.insertBefore(node, mark);   // 되돌린다
        syncCommentCount(1);
      }
      toast('지우지 못했습니다: '+r.msg);
      return;
    }
    softRefresh();
    if(S.postCache && S.postCache.comments){
      Object.keys(S.postCache.comments).forEach(function(k){
        S.postCache.comments[k]=S.postCache.comments[k].filter(function(c){ return c.id!==id; });
      });
      S.postCacheAt=areaVer('post');
    }
  });
}

/* ===================== 결재 ===================== */
/** 결재 목록은 워크보드를 받을 때 이미 같이 왔다. 탭에 들어갈 때 서버에 가지 않는다 */
function docSource(){
  if(S.data && S.data.docs) return S.data.docs;
  return S.docs || null;
}

function renderDocs(){
  paintDocTabs();
  /* 마케팅·구독·채용비 보기를 켜 두었으면 그것을 그린다 (자료가 새로 와도 보기가 유지된다) */
  if(COSTV.on && S.data && S.data.docBox){ paintCost(); return; }
  var r=docSource();
  if(r){ paintDocs(r); prefetchDocs(); }
  else $('docLists').innerHTML='<p class="muted" style="font-size:var(--fs-sm)">불러오는 중...</p>';
}

/**
 * 결재 화면 (v45에서 다시 짬).
 *
 * · 문서 한 건 = 카드 하나. 제목·금액·상태가 한 카드 안에 묶인다
 *   (예전에는 금액이 오른쪽 끝에 떨어져 어느 문서 것인지 눈으로 이어야 했다)
 * · 0건인 구역은 **아예 그리지 않는다.** '없습니다' 를 반복해 빈 공간을 만들지 않는다
 * · 내가 결재할 문서가 있으면 그 구역이 맨 위 — 지금 손대야 할 것이기 때문이다
 */
function paintDocs(r){
  if(COSTV.on && S.data && S.data.docBox){ paintCost(); return; }
  var h='';
  /* 여러 건을 한 번에 — 결재할 문서가 두 건 이상일 때만 나온다 */
  var 고를수있는 = (r.toAct||[]).filter(function(d){ return d.canAct; });
  if(고를수있는.length > 1){
    h+='<div class="bulkbar">'+
         '<label class="bulkall"><input type="checkbox" onchange="docPickAll(this.checked)">'+
         '<span>모두</span></label>'+
         '<div id="docBulk" class="hide">'+
           '<button class="btn" onclick="docBulkAct(&quot;reject&quot;)">반려</button>'+
           '<button class="btn pri" id="docBulkGo" onclick="docBulkAct(&quot;approve&quot;)">승인</button>'+
         '</div>'+
       '</div>';
  }
  /* ★★ 끝난 문서는 접습니다 (2026-09-09).
     승인완료·반려 카드가 `내가 올린 문서 27 · 열람 문서 84` 아래 영원히 쌓여
     진짜 할 일 두 건 아래로 회색 카드 100장이 이어졌습니다. 완료 업무는 최근 7일로
     끊었는데 결재만 규칙이 없었습니다. 서버 응답은 그대로이고 화면에서만 가릅니다. */
  function 살아있나(d){ return String(d.status||'진행중')==='진행중'; }
  var drafts=r.drafts||[], others=r.others||[];
  var done = drafts.filter(function(d){ return !살아있나(d); })
    .concat(others.filter(function(d){ return !살아있나(d) && !d.canRead; }));
  h+=docSec('내가 결재할 것', r.toAct, true, true);
  h+=docSec('내가 올린 것', drafts.filter(살아있나), false, true);
  h+=docSec('열람할 것', others.filter(function(d){ return 살아있나(d) || d.canRead; }), false, true);
  if(done.length){
    h+=foldBox('docDone', '끝난 문서 <span class="n">'+done.length+'</span>',
               docSec('', done, false, true));
  }
  var 칸 = docBoxesHtml();
  if(!h && !칸) h='<p class="none big">결재할 문서가 없습니다</p>';
  $('docLists').innerHTML=h+칸;
}

/* ===================== 마케팅·구독·채용비 (2026-09-22 전무님 요청) =====================
   광고·홍보 · AI·소프트웨어 구독 · 채용공고 비용을 한 화면에. 휴가·식대·비품·일반 지출은 안 섞입니다.

   ★★ 모으는 기준은 **품목(결재내역) 한 줄마다 저장된 비용 분류**입니다. 제목 글자로 판정하지 않습니다.
     한 문서에 광고비와 식대가 섞여 있으면 광고비 줄만 들어옵니다.
   ★★ 금액은 **품목의 금액 칸**. 비어 있으면 '금액 없음' — 0원과 다릅니다. 합계에 넣지 않고 따로 셉니다.
   ★★ 기준일은 **품목의 사용일자**, 비어 있으면 **기안일**. 세무 자료(api_taxExport)와 같은 규칙입니다.
     승인일을 만들어 넣지 않습니다.
   ★ '승인 금액' 은 최종 승인된 문서의 금액입니다. 실제로 돈이 나갔는지는 이 앱이 모릅니다 —
     그래서 '실제 지출' 이라고 적지 않습니다. 결재 중인 것은 합계에 넣지 않고 따로 보여 줍니다. 반려는 뺍니다.
   ★ 구매요청서와 지출결의서를 잇는 칸이 없습니다. 같은 금액·비슷한 이름이라고 합치지 않고
     '중복 의심' 표시만 붙입니다 (합계에는 둘 다 들어 있습니다).
   ★ 자료는 이미 받은 것(board_ 의 costItems · docs)입니다. 달을 넘기든 분류를 바꾸든 **서버 왕복 0회**.
     볼 수 있는 사람은 종류별 보기와 같습니다 (서버가 docBox 로 정해 보냅니다). */
var COSTV={ on:false, ym:'', all:false, cat:'' };
var COST_FORM_CODES={ EXP:true, PUR:true };
/* 서버가 기준정보(meta.costCats · costView)로 보내 줍니다. 못 받으면 이 값으로 버팁니다 (옛 서버) */
var COST_CATS_FALLBACK=['광고·홍보','AI·소프트웨어','채용광고','일반비용'];
var COST_VIEW_FALLBACK=['광고·홍보','AI·소프트웨어','채용광고'];
function costCats(){ var m=S.meta && S.meta.costCats; return (m && m.length)? m : COST_CATS_FALLBACK; }
function costView(){ var m=S.meta && S.meta.costView; return (m && m.length)? m : COST_VIEW_FALLBACK; }
function costCatOptions(cur){
  return '<option value=""'+(cur?'':' selected')+'>미분류</option>'+
    costCats().map(function(c){
      return '<option value="'+esc(c)+'"'+(c===cur?' selected':'')+'>'+esc(c)+'</option>';
    }).join('');

/** 결재 화면 위의 두 보기 — 종류별 보기를 볼 수 있는 사람에게만 */
function paintDocTabs(){
  var box=$('docTabs'); if(!box) return;

  box.innerHTML='<div class="dtabs" role="tablist" aria-label="결재 보기">'+

}

}

/** 품목 한 줄 + 그 문서 — 이 사람이 받은 문서의 지출·구매 품목만 (서버가 거른 것) */
function costRowsAll(){
  var byNo={};
  docAll().forEach(function(d){ byNo[d.no]=d; });
  var out=[];
  ((S.data && S.data.costItems) || []).forEach(function(it){
    if(!it) return;
    var d=byNo[it.no]; if(!d) return;
    out.push({ it:it, d:d, st:String(d.status||'진행중'),
               day: it.date || String(d.at||'').substring(0,10),     // 사용일자 → 없으면 기안일
               name: it.memo || d.title || '' });
  });
  return out;
}
function costInPeriod(x){ return COSTV.all || String(x.day).substring(0,7)===COSTV.ym; }
function costCanEdit(d){
  if(S.me && S.me.grade>=9) return true;
  return (((S.data && S.data.docs && S.data.docs.drafts) || [])).some(function(x){ return x.no===d.no; });
}

/** 중복 의심 — 구매요청서와 지출결의서가 같은 금액 · 비슷한 이름 · 31일 안. 합치지 않고 표시만 */
function costDupMark(rows){
  function 키(t){ return String(t||'').toLowerCase().replace(/[\s·\-_,.()\[\]]/g,''); }
  function 날(t){ var v=new Date(String(t).substring(0,10)+'T00:00:00').getTime(); return isNaN(v)? null : v; }
  var 표={}, 쌍=0;
  for(var i=0;i<rows.length;i++){
    for(var j=i+1;j<rows.length;j++){
      var a=rows[i], b=rows[j];
      if(a.d.form===b.d.form || a.d.no===b.d.no) continue;
      if(a.it.amt==null || a.it.amt<=0 || a.it.amt!==b.it.amt) continue;
      var da=날(a.day), db=날(b.day);
      if(da==null || db==null || Math.abs(da-db) > 31*86400000) continue;
      var ka=키(a.name), kb=키(b.name);
      if(!ka || !kb || !(ka.indexOf(kb)>=0 || kb.indexOf(ka)>=0)) continue;
      표[i]=1; 표[j]=1; 쌍+=1;
    }
  }
  return { 표:표, 쌍:쌍 };
}

function paintCost(){
  var box=$('docLists'); if(!box) return;
  if(!COSTV.ym) COSTV.ym=monthNow();
  var VIEW=costView();
  var 기간=costRowsAll().filter(costInPeriod);

  /* ★★ 목록과 요약은 **같은 자료**로 셉니다 — 고른 기간 · 고른 분류 (2026-09-22 Astra 지적).
     ★★ 들어오는 상태는 둘뿐 — '승인완료'(합계) · '진행중'(결재 중, 따로). 반려·취소나 그 밖의 상태는
       목록과 합계에서 빼고 건수만 알립니다. 금액이 비면 0원이 아니라 따로 셉니다. */
  function 들어오나(st){ return st==='승인완료' || st==='진행중'; }
  var 대상=기간.filter(function(x){ return 고른.indexOf(x.it.cat)>=0; });
  var 승인={}, 대기={ n:0, s:0 }, 제외=0, 금액없음=0;
  VIEW.forEach(function(c){ 승인[c]=0; });
  대상.forEach(function(x){
    if(!들어오나(x.st)){ 제외+=1; return; }
    if(x.it.amt==null){ 금액없음+=1; return; }
    if(x.st==='승인완료') 승인[x.it.cat]+=x.it.amt;
    else { 대기.n+=1; 대기.s+=x.it.amt; }
  });
  var 합=0; 고른.forEach(function(c){ 합+=승인[c]||0; });

  var 목록=대상.filter(function(x){ return 들어오나(x.st); }).sort(function(a,b){
    if(a.day!==b.day) return a.day<b.day ? 1 : -1;
    return a.d.no<b.d.no ? 1 : -1;
  });
  var 중복=costDupMark(목록);
  var 미분류=기간.filter(function(x){ return !x.it.cat; });

  var h='<div class="costv">';
