/* ===================== 검색 (2026-09-02) =====================
 *
 *  ★★ **서버에 한 번도 안 갑니다.** `board_` 가 업무·기록·댓글·공지·결재를
 *    이미 전부 실어 보내고, 현장은 `meta.sites` 에 있습니다. 왕복 0회입니다.
 *
 *  ★ 글자를 칠 때마다 찾을 거리를 다시 만들지 않습니다.
 *    창을 열 때 한 번만 만들어 두고(`SEARCH_IDX`) 그것만 훑습니다.
 *
 *  ★ 빈칸·하이픈·마침표를 떼고 견줍니다 — `정문 철거` 로 `정문철거` 가 찾아지고
 *    `010-1234-5678` 을 `01012345678` 로 쳐도 찾아집니다.
 * ============================================================= */
var SEARCH_IDX = null;
var SEARCH_Q = '';

function searchNorm(s){
  return String(s==null?'':s).toLowerCase().replace(/[\s\-.,()·]/g,'');
}

/** 창을 열 때 한 번. 화면이 이미 가진 것만 모은다 */
function searchBuild(){
  var d = S.data || {}, m = S.meta || {};
  var rows = [];
  function put(kind, title, sub, body, go){
    rows.push({
      kind: kind, title: String(title==null?'':title), sub: String(sub==null?'':sub),
      /* 칸 사이는 `|` 로 끊는다 — 앞 칸 끝과 뒤 칸 앞이 붙어서 엉뚱하게 걸리지 않게 */
      key: searchNorm(title) + '|' + searchNorm(sub) + '|' + searchNorm(body),
      go: go
    });
  }

  var byId = {};
  (d.tasks||[]).forEach(function(t){ byId[t.id]=t; });

  (d.tasks||[]).forEach(function(t){
    put('업무', t.title,
        [t.typeName, t.ownerName, t.corpName, t.status].filter(Boolean).join(' · '),
        [t.content, t.site, t.lastLog, t.id, t.amount? won(t.amount)+'원' : ''].join(' '),
        "openTask('"+t.id+"')");
  });

  var lb = d.logsByTask || {};
  Object.keys(lb).forEach(function(id){
    var t = byId[id];
    (lb[id]||[]).forEach(function(l){
      put('기록', l.text,
          [(t? t.title : ''), l.who, shortDate(l.date)].filter(Boolean).join(' · '),
          [l.eq, l.wt, l.next].join(' '),
          "openTask('"+id+"')");
    });
  });

  var cb = d.commentsByTask || {};
  Object.keys(cb).forEach(function(id){
    var t = byId[id];
    (cb[id]||[]).forEach(function(c){
      put('댓글', c.text, [(t? t.title : ''), c.who, shortDate(c.at)].filter(Boolean).join(' · '),
          '', "openTask('"+id+"')");
    });
  });

  var nc = d.noticeCmt || {};
  Object.keys(nc).forEach(function(no){
    (nc[no]||[]).forEach(function(c){
      put('댓글', c.text, [c.who, shortDate(c.at)].filter(Boolean).join(' · '),
          '', "openPost('"+no+"')");
    });
  });

  (d.notices||[]).forEach(function(n){
    put('공지', n.title, [n.who, shortDate(n.at)].filter(Boolean).join(' · '),
        n.body, "openPost('"+n.no+"')");
  });

  /* ★★ `d.docs` 는 **배열이 아니라 `{toAct, drafts, others}` 객체**입니다 (2026-09-03).
     `(d.docs||[]).forEach` 라고 적어 두어서 `forEach is not a function` 으로
     **`openSearch()` 가 창을 그리기 전에 죽었습니다.** 돋보기를 눌러도 아무 일도
     일어나지 않았고, 오류는 콘솔에만 남아 아무도 몰랐습니다.
     ★ 서버가 주는 모양을 짐작하지 말고 `docList_` 를 열어 확인하세요. */
  var pack = d.docPack || {};
  var dl = d.docs || {};
  [].concat(dl.toAct||[], dl.drafts||[], dl.others||[]).forEach(function(x){
    var 속 = '';
    var pk = pack[x.no];
    if(pk && pk.doc){
      속 = (pk.items||[]).map(function(i){ return i.memo; }).join(' ') + ' ' +
           (pk.doc.fields||[]).map(function(f){ return f.name+' '+f.value; }).join(' ') + ' ' +
           (pk.doc.memo||'');
    }
    put('결재', x.title,
        [x.formName, x.who, x.status, x.amount? won(x.amount)+'원':''].filter(Boolean).join(' · '),
        x.no + ' ' + 속, "openDoc('"+x.no+"')");
  });

  (m.sites||[]).forEach(function(s){
    put('현장', s.name, [s.code, s.state].filter(Boolean).join(' · '),
        [s.addr, s.amt? won(s.amt)+'원':''].join(' '), "searchSite('"+s.code+"')");
  });

  (d.events||[]).forEach(function(e){
    put('일정', e.title || '',
        [e.kindName||'', e.from||'', e.who||''].filter(Boolean).join(' · '),
        e.memo||'', "searchCal('"+String(e.from||'')+"')");
  });

  (d.staff||[]).forEach(function(s){
    put('사람', s.name, [s.rank, s.dept].filter(Boolean).join(' · '),
        s.phone||'', "searchWho('"+String(s.name||'').replace(/'/g,'')+"')");
  });

  SEARCH_IDX = rows;
}

function openSearch(q){
  SEARCH_Q = q || '';
  searchBuild();
  $('modal').innerHTML =
    '<div class="veil"><div class="sheet">'+
      '<div class="sheethead"><h3 class="tt">검색</h3>'+
      '<button class="btn sm" onclick="closeOk()">닫기</button></div>'+
      '<input type="text" class="in srin" id="sqBox" autocomplete="off" '+
        'oninput="searchRun(this.value)" onkeydown="searchKey(event)" '+
        'value="'+esc(SEARCH_Q)+'">'+
      '<div id="srOut"></div>'+
    '</div></div>';
  var box = $('sqBox');
  if(box){ box.focus(); box.setSelectionRange(box.value.length, box.value.length); }
  searchRun(SEARCH_Q);
}

/* 창은 ESC 로 안 닫힙니다 (쓰던 글 보호). 검색칸에서는 글자만 지웁니다 */
function searchKey(e){
  if(e.key==='Escape'){ e.target.value=''; searchRun(''); }
}

var SR_KINDS = ['업무','기록','댓글','공지','결재','현장','일정','사람'];

function searchRun(q){
  SEARCH_Q = q;
  var out = $('srOut'); if(!out) return;
  var n = searchNorm(q);
  if(!n){ out.innerHTML = empty('찾을 말을 적어 주세요'); return; }

  var 통 = {};
  SR_KINDS.forEach(function(k){ 통[k]=[]; });
  (SEARCH_IDX||[]).forEach(function(r){
    if(r.key.indexOf(n) < 0) return;
    if(통[r.kind]) 통[r.kind].push(r);
  });

  var h = '', 모두 = 0;
  SR_KINDS.forEach(function(k){
    var list = 통[k];
    if(!list.length) return;                    /* 0건인 구역은 아예 안 그린다 */
    모두 += list.length;
    h += '<div class="sec">'+sechead(k, list.length)+
         list.slice(0,8).map(function(r){
           return '<div class="lrow" onclick="'+r.go+'">'+
             '<div class="m"><p class="t">'+srMark(r.title, q)+'</p>'+
             (r.sub? '<p class="b">'+srMark(r.sub, q)+'</p>':'')+'</div></div>';
         }).join('')+
         (list.length>8? '<p class="none">그 밖에 '+(list.length-8)+'건</p>':'')+
         '</div>';
  });
  out.innerHTML = 모두 ? h : empty('찾는 것이 없습니다');
}

/** 찾은 글자를 굵게. 빈칸을 뗀 자리로 견주므로 원래 글자에서 자리를 되짚는다 */
function srMark(s, q){
  var 글 = String(s==null?'':s);
  var n = searchNorm(q);
  if(!n) return esc(글);

  var 자리 = [], 민 = '';
  for(var i=0;i<글.length;i++){
    var c = searchNorm(글.charAt(i));
    if(c){ 민 += c; 자리.push(i); }
  }
  var k = 민.indexOf(n);
  if(k < 0) return esc(글);
  var a = 자리[k], z = 자리[Math.min(k+n.length-1, 자리.length-1)];
  return esc(글.substring(0,a)) + '<b class="srhit">' + esc(글.substring(a, z+1)) +
         '</b>' + esc(글.substring(z+1));
}

/** 현장을 고르면 그 현장으로 만든 업무를 연다 */
function searchSite(code){
  closeOk();
  go('board');
  var t = null;
  (S.data? S.data.tasks:[]).forEach(function(x){ if(x.site===code && !t) t=x; });
  if(t) openTask(t.id);
  else toast('그 현장으로 만든 업무가 아직 없습니다');
}
function searchCal(ds){
  closeOk();
  if(ds){ CAL.ym = String(ds).substring(0,7); CAL.pick = ds; drawCal(); }
  else openCal();
}
function searchWho(name){
  var ph = '';
  ((S.data&&S.data.staff)||[]).forEach(function(s){ if(s.name===name && !ph) ph=s.phone; });
  closeOk();
  go('board');
  if(ph) setOwner(ph);
}

/* ===================== 알림 ===================== */
function showNoti(rows){
  if(!rows) return;
  S.noti=rows;
  var b=$('notiBadge');
  if(rows.length){ b.textContent=rows.length; b.classList.remove('hide'); }
  else b.classList.add('hide');
}
function openNoti(){
  var rows=S.noti||[];
  var h='<div class="veil"><div class="sheet">'+
    '<div class="sheethead"><h3 class="tt">알림 '+rows.length+'</h3>'+
    '<button class="btn sm" onclick="closeModal()">닫기</button></div>';
  if(!rows.length) h+=empty('새 알림이 없습니다');
  rows.forEach(function(n){
    /* ★ 갈 곳이 있는 알림은 누를 수 있게 (2026-09-02).
       예전에는 눌러도 아무 일이 없어서, 어느 업무·어느 공지인지 직접 찾아가야 했습니다. */
    var 갈수있나 = !!notiTarget(n);
    h+='<div class="lrow'+(갈수있나?'':' plain')+'"'+
       (갈수있나? ' onclick="gotoNoti(\''+esc(n.kind)+'\',\''+esc(n.to||'')+'\')"' : '')+'>'+
       '<div class="m"><p class="t">'+esc(n.text)+'</p>'+
       (n.at? '<p class="b">'+esc(shortDate(n.at))+'</p>':'')+'</div>'+
       '<div class="r"><span class="tag gy">'+esc(n.kind)+'</span></div></div>';
  });
  if(rows.length) h+='<div class="actions"><button class="btn" onclick="readNoti()">모두 읽음</button></div>';
  h+='</div></div>';
  $('modal').innerHTML=h;
}

/** 이 알림이 갈 곳이 있는가 (없으면 누를 수 없게 둔다) */
function notiTarget(n){
  var id=String((n&&n.to)||'').trim();
  if(id) return id;
  if(n && n.kind==='가입신청') return 'settings';     // 번호가 없어도 설정으로 간다
  return '';
}

/**
 * 알림을 눌렀을 때 그곳으로 간다.
 *
 * ★ 번호 앞글자로 어디인지 압니다 —
 *     W-      업무          (api_saveTask 가 붙이는 번호)
 *     NT-·PS- 게시글·공지
 *     그 밖   결재문서       (EXP- · PUR- · ADD- · SEAL- · LEAVE-)
 *   유형만으로는 못 가립니다. '댓글' 알림은 업무일 수도 공지일 수도 있습니다.
 */
function gotoNoti(kind, to){
  var id=String(to||'').trim();
  closeOk();

  if(kind==='가입신청' || id==='settings'){ go('settings'); return; }
  if(!id) return;

  if(/^W-/.test(id)){ openTask(id); return; }
  if(/^(NT|PS)-/.test(id)){ openPost(id); return; }
  openDoc(id);
}
function readNoti(){
  showNoti([]);            // 화면에서 먼저 지우고
  closeOk();
  call('api_readNotifications', S.token);   // 서버 정리는 뒤에서
}

boot();

/* ===================== 별도 기록장 (2026-09-03) =====================
 *
 *  ★★ 이 파일(app.html)은 깃허브 공개 저장소에 있습니다.
 *    그래서 **게시판 이름이 여기에 한 글자도 없습니다.**
 *    이름은 서버가 명단에 든 사람에게만 `board.note = {key,label}` 로 보내 줍니다.
 *    명단 밖 사람은 이 코드를 다 읽어도 무엇인지 알 수 없습니다.
 *
 *  ★ 여는 법 — 왼쪽 위 **로고마크를 두 번** 누르면 탭이 잠깐 나타납니다.
 *    5초 안에 누르지 않으면 다시 사라집니다. 또 보려면 다시 세 번 누릅니다.
 *
 *  ★ 서버 왕복
 *    · 탭이 나타날 때 한 번 (`api_noteAll`) — 글·댓글·읽음·첨부목록을 전부 받습니다
 *    · 그래서 **글을 눌러 여는 것은 왕복 0회**입니다
 *    · 첨부 파일만 누를 때 받아옵니다 (드라이브 주소는 화면에 오지 않습니다)
 */

var ROOM = { on:false, timer:null, tick:null, tapN:0, tapAt:0 };
var NOTE = { rows:null, grade:0, loading:null, pick:[] };
var ROOM_SHOW_MS = 5000;

/** 서버가 이 사람에게 탭을 열어 줬나 */
function roomAllowed(){
  return !!(S.data && S.data.note && S.data.note.label);
}

/** 로고마크를 눌렀을 때. **두 번**이면 탭이 나타난다 (2026-09-03) */
function brandTap(){
  var now = Date.now();
  if(now - ROOM.tapAt > 900) ROOM.tapN = 0;
  ROOM.tapAt = now;
  ROOM.tapN += 1;
  /* ★ 누가 눌러도 **하는 일이 똑같아야** 합니다.
     세 번째만 화면을 안 옮기게 두면, 명단 밖 사람도 '세 번째는 뭔가 다르다' 를
     알아챕니다. 언제나 판으로 가고, 명단에 든 사람에게만 탭이 하나 더 뜹니다. */
  go('board');
  if(ROOM.tapN >= 2){
    ROOM.tapN = 0;
    roomReveal();
  }
}

/** 탭을 나타나게 한다 (명단 밖이면 아무 일도 일어나지 않는다) */
function roomReveal(){
  if(!roomAllowed()) return;
  var label = S.data.note.label;

  ['roomPC','roomM'].forEach(function(id){
    var b = $(id); if(!b) return;
    var t = b.querySelector('.rt-name');
    if(t) t.textContent = label;
    b.classList.add('show');
  });
  var tabs = document.querySelector('.tabs');
  if(tabs) tabs.classList.add('room5');

  /* 붙였다가 다음 그림에서 켜야 사이 동작이 보입니다 */
  void document.body.offsetWidth;
  ROOM.on = true;
  ['roomPC','roomM'].forEach(function(id){
    var b = $(id); if(!b) return;
    b.classList.remove('on'); void b.offsetWidth;
    b.classList.add('on');
  });
  roomBadge();

  /* 5초 뒤에 다시 사라진다 (그 안에 누르면 남는다) */
  if(ROOM.timer) clearTimeout(ROOM.timer);
  ROOM.timer = setTimeout(function(){
    if(S.view !== 'note') roomHide();
  }, ROOM_SHOW_MS);

  noteLoad(true);
}

/** 탭을 다시 감춘다 */
function roomHide(){
  if(ROOM.timer){ clearTimeout(ROOM.timer); ROOM.timer = null; }
  ROOM.on = false;
  ['roomPC','roomM'].forEach(function(id){
    var b = $(id); if(!b) return;
    b.classList.remove('on');
  });
  setTimeout(function(){
    if(ROOM.on) return;
    ['roomPC','roomM'].forEach(function(id){
      var b = $(id); if(b) b.classList.remove('show');
    });
    var tabs = document.querySelector('.tabs');
    if(tabs) tabs.classList.remove('room5');
  }, 360);
}

/* 로고 오른쪽 위의 점 — 안 본 글이 있을 때만.
   ★ 판정은 서버가 합니다 (`board.note.dot`). 화면은 그 값만 그립니다.
     명단 밖 사람에게는 `note` 칸 자체가 안 오므로 절대 켜지지 않습니다.
   ★ 폰 알림이 막혀 있어도 이 점 하나로 새 글이 있다는 것을 알 수 있습니다. */
function roomDot(){
  var el = $('brandDot'); if(!el) return;
  el.classList.toggle('hide', !(S.data && S.data.note && S.data.note.dot));
}

/** 안 읽은 글이 있으면 점 하나. 숫자는 쓰지 않는다 (판 카드와 같은 규칙) */
function roomBadge(){
  var n = 0;
  (NOTE.rows||[]).forEach(function(r){ if(r.unread) n += 1; });
  ['roomPC','roomM'].forEach(function(id){
    var b = $(id); if(!b) return;
    var d = b.querySelector('.rt-dot');
    if(d) d.classList.toggle('hide', n === 0);
  });
}

/** 전부 한 번에 받아 둔다. 그 뒤로 글을 열어도 왕복이 없다 */
function noteLoad(force){
  if(NOTE.loading) return NOTE.loading;
  if(NOTE.rows && !force) return Promise.resolve();
  NOTE.loading = call('api_noteAll', S.token).then(function(r){
    NOTE.loading = null;
    if(!r || !r.ok) return;
    NOTE.rows = r.rows || [];
    NOTE.grade = Number(r.grade || 0);
    /* 목록을 받아 왔으면 서버도 '봤다' 로 남깁니다. 로고의 점을 바로 끕니다 */
    if(S.data && S.data.note) S.data.note.dot = false;
    roomDot();
    if(S.view === 'note') renderNote();
    roomBadge();
  });
  return NOTE.loading;
}

function noteById(id){
  var out = null;
  (NOTE.rows||[]).forEach(function(r){ if(r.id === id) out = r; });
  return out;
}

/* ---------- 목록 ---------- */

function renderNote(){
  var box = $('view-note'); if(!box) return;
  /* ★ 명단 밖에서 억지로 이 화면을 열어도 **아무것도 그리지 않습니다.**
     서버가 어차피 거절하지만, 빈 화면이라도 '무언가 있다' 는 것을 알려선 안 됩니다. */
  if(!roomAllowed()){ box.innerHTML=''; go('board'); return; }
  var label = S.data.note.label;
  var h = '<div class="backbar"><button class="btn sm" onclick="go(\'board\')">'+ic('back')+'워크보드</button></div>'+
          '<div class="pagehead"><h3 class="tt">'+esc(label)+'</h3>'+
          '<button class="btn pri sm" onclick="noteForm()">'+ic('plus')+'새 글</button></div>';

  if(!NOTE.rows){
    h += '<p class="none">불러오는 중입니다</p>';
  } else if(!NOTE.rows.length){
    h += '<p class="none big">아직 글이 없습니다</p>';
  } else {
    h += NOTE.rows.map(function(r){
      var 곁 = [];
      if(r.comments && r.comments.length) 곁.push('댓글 '+r.comments.length);
      if(r.files && r.files.length) 곁.push('자료 '+r.files.length);
      return '<div class="lrow" onclick="noteOpen(\''+r.id+'\')">'+
        '<span class="m"><span class="t">'+esc(r.title)+
          (r.unread ? '<span class="cdot"></span>' : '')+'</span>'+
        '<span class="b">'+esc([r.who, shortDate(r.at)].filter(function(x){return x;}).join(' · '))+
        '</span></span>'+
        (곁.length ? '<span class="r"><span class="s">'+esc(곁.join(' · '))+'</span></span>' : '')+
        '</div>';
    }).join('');
  }
  box.innerHTML = h;
}

/* ---------- 글 보기 ---------- */

function noteOpen(id){
  var r = noteById(id);
  if(!r){ toast('글을 찾지 못했습니다'); return; }

  var 자료 = (r.files||[]).map(function(f){
    return '<button class="btn sm" style="margin:0 6px 6px 0" '+
           'onclick="noteFile(\''+f.id+'\')">'+esc(f.name)+
           ' <span class="muted">'+esc(noteSize(f.size))+'</span></button>';
  }).join('');

  var 읽은 = (r.readers||[]).map(function(x){ return x.name; })
              .filter(function(x){ return x; }).join(', ');

  var 댓 = (r.comments||[]).map(noteCmtHtml).join('');

  var 지울수있나 = r.mine || NOTE.grade >= 9;

  $('modal').innerHTML =
    '<div class="veil"><div class="sheet">'+
      '<div class="sheethead"><h3 class="tt">'+esc(r.title)+'</h3>'+
        '<div style="display:flex;gap:6px">'+
          (r.mine ? '<button class="btn sm" onclick="noteForm(\''+r.id+'\')">수정</button>' : '')+
          (지울수있나 ? '<button class="btn sm" onclick="noteDelete(\''+r.id+'\')">삭제</button>' : '')+
          '<button class="btn sm" onclick="closeModal()">닫기</button></div></div>'+
      byline([r.who, shortDate(r.at)])+
      '<div style="margin:var(--sp-3) 0 var(--sp-4)">'+fmt(r.body||'')+'</div>'+
      (자료 ? '<hr class="tdsep"><p class="note t2">자료</p>'+자료 : '')+
      '<hr class="tdsep">'+
      '<div id="ntCmt">'+댓+'</div>'+
      '<div style="display:flex;gap:6px;margin-top:var(--sp-3)">'+
        '<textarea class="in" id="ntCmtIn" rows="1" style="flex:1;min-width:0" '+
          'onkeydown="noteCmtKey(event,\''+r.id+'\')"></textarea>'+
        '<button class="btn sm" onclick="noteComment(\''+r.id+'\')">등록</button></div>'+
      (읽은 ? '<p class="note t2" style="margin-top:var(--sp-4)">읽음 · '+esc(읽은)+'</p>' : '')+
    '</div></div>';

  /* 읽음은 뒤에서 남깁니다 (화면은 기다리지 않습니다) */
  if(r.unread){
    r.unread = false;
    roomBadge();
    if(S.view === 'note') renderNote();
    call('api_noteSeen', S.token, r.id).then(function(){
      var 나 = (S.me && S.me.name) || '';
      if(나 && !(r.readers||[]).some(function(x){ return x.name === 나; })){
        r.readers = (r.readers||[]).concat([{ name:나, at:'' }]);
      }
    });
  }
}

function noteCmtHtml(c){
  return '<div class="cmt" data-cid="'+esc(c.id)+'">'+
    '<p class="byline">'+esc(c.who)+' · '+esc(shortDate(c.at))+
      ((c.mine || NOTE.grade >= 9) ?
        ' <button class="btn sm" onclick="noteCmtDel(\''+c.id+'\')" aria-label="댓글 삭제">'+ic('x')+'</button>' : '')+
    '</p><div>'+fmt(c.text||'')+'</div></div>';
}

/** 지금 시각 (화면에만 쓰는 값. 서버가 준 값으로 곧 갈아끼워집니다) */
function noteNow(){
  var d = new Date();
  return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())+' '+
         p2(d.getHours())+':'+p2(d.getMinutes());
}

function noteSize(n){
  n = Number(n||0);
  if(n < 1024) return n+'B';
  if(n < 1024*1024) return Math.round(n/1024)+'KB';
  return (Math.round(n/1024/1024*10)/10)+'MB';
}

/* ---------- 댓글 ---------- */

function noteCmtKey(e, id){
  if(e.key === 'Enter' && !e.shiftKey && !e.isComposing){
    e.preventDefault();
    noteComment(id);
  }
}

function noteComment(id){
  var el = $('ntCmtIn'); if(!el) return;
  var t = String(el.value||'').trim();
  if(!t){ toast('내용을 넣어주세요'); return; }
  var r = noteById(id); if(!r) return;

  /* 낙관 처리 — 화면에 먼저 붙이고 뒤에서 보냅니다 */
  var 임시 = { id:'_tmp'+Date.now(), who:(S.me&&S.me.name)||'', mine:true,
               text:t, at:noteNow() };
  r.comments = (r.comments||[]).concat([임시]);
  el.value = '';
  var box = $('ntCmt');
  if(box) box.insertAdjacentHTML('beforeend', noteCmtHtml(임시));

  call('api_noteComment', S.token, id, t).then(function(res){
    if(res && res.ok){
      var old = box && box.querySelector('[data-cid^="_tmp"]');
      if(old) old.setAttribute('data-cid', res.id);
      임시.id = res.id;
      if(res.at) 임시.at = res.at;
      return;
    }
    r.comments = r.comments.filter(function(x){ return x !== 임시; });
    var el2 = box && box.querySelector('[data-cid^="_tmp"]');
    if(el2) el2.remove();
    toast((res && res.msg) || '댓글을 남기지 못했습니다');
  });
}

function noteCmtDel(cid){
  if(String(cid).indexOf('_tmp') === 0){ toast('잠시 후 다시 시도해주세요'); return; }
  if(!confirm('댓글을 지울까요?')) return;
  var box = $('ntCmt');
  var el = box && box.querySelector('[data-cid="'+cid+'"]');
  if(el) el.style.display = 'none';
  call('api_noteCommentDelete', S.token, cid).then(function(r){
    if(r && r.ok){
      (NOTE.rows||[]).forEach(function(p){
        p.comments = (p.comments||[]).filter(function(c){ return c.id !== cid; });
      });
      if(el) el.remove();
      return;
    }
    if(el) el.style.display = '';
    toast((r && r.msg) || '지우지 못했습니다');
  });
}

/* ---------- 글 쓰기 ---------- */

function noteForm(id){
  var r = id ? noteById(id) : null;
  NOTE.pick = [];
  var 붙은것 = r ? (r.files||[]).slice() : [];
  NOTE.keep = 붙은것.map(function(f){ return f.id; });

  $('modal').innerHTML =
    '<div class="veil"><div class="sheet">'+
      '<div class="sheethead"><h3 class="tt">'+(r ? '글 수정' : '새 글')+'</h3>'+
        '<button class="btn sm" onclick="closeModal()">닫기</button></div>'+
      /* ★★ `type="text"` 를 빠뜨리면 **칸이 좁게 나옵니다** (2026-09-03).
       앱의 입력칸 규칙이 `input[type=text]` 로 걸려 있어서, type 을 안 적으면
       그 규칙이 하나도 안 붙습니다. 오류는 안 나고 모양만 어긋납니다. */
    '<div class="field"><label class="fl">제목</label>'+
        '<input type="text" id="ntTitle" value="'+esc(r ? r.title : '')+'"></div>'+
      '<div class="field"><label class="fl">내용</label>'+
        mkEditor('ntBody', r ? r.body : '', 160)+'</div>'+
      '<div class="field"><label class="fl">자료</label>'+
        '<div id="ntFiles">'+noteKeepHtml(붙은것)+'</div>'+
        '<input type="file" id="ntPick" multiple style="margin-top:6px" '+
          'onchange="notePicked(this)">'+
        '<div id="ntPickBox"></div></div>'+
      '<div style="display:flex;gap:6px;justify-content:flex-end;margin-top:var(--sp-4)">'+
        '<button class="btn sm" onclick="closeModal()">취소</button>'+
        '<button class="btn pri" id="ntSave" onclick="noteSave(\''+(id||'')+'\')">저장</button></div>'+
    '</div></div>';
  var t = $('ntTitle'); if(t) t.focus();
}

function noteKeepHtml(files){
  if(!files.length) return '';
  return files.map(function(f){
    return '<span class="tag gy" style="margin:0 6px 6px 0;display:inline-block">'+
      esc(f.name)+' <button class="btn sm" aria-label="빼기" '+
      'onclick="noteDropKeep(\''+f.id+'\',this)">'+ic('x')+'</button></span>';
  }).join('');
}

function noteDropKeep(fid, el){
  NOTE.keep = (NOTE.keep||[]).filter(function(x){ return x !== fid; });
  var tag = el && el.parentNode;
  if(tag) tag.remove();
}

function notePicked(input){
  var box = $('ntPickBox');
  var fs = Array.prototype.slice.call(input.files||[]);
  if(!fs.length){ NOTE.pick = []; if(box) box.innerHTML=''; return; }
  if(fs.length > 5){ toast('파일은 한 번에 5개까지입니다'); input.value=''; return; }
  var 너무큰것 = fs.filter(function(f){ return f.size > 8*1024*1024; });
  if(너무큰것.length){
    toast(너무큰것[0].name+' 이 너무 큽니다 (한 개 8MB까지)');
    input.value = '';
    return;
  }
  NOTE.pick = fs;
  /* ★ 무엇이 붙는지 눈에 보여야 합니다. 파일 고르는 칸은 브라우저가 그리는 것이라
     여러 개를 고르면 `3개 파일` 같은 말만 나오고 무엇인지 알 수 없습니다. */
  if(box){
    box.innerHTML = fs.map(function(f){
      return '<span class="tag gy" style="margin:6px 6px 0 0;display:inline-block">'+
             esc(f.name)+' <span class="muted">'+esc(noteSize(f.size))+'</span></span>';
    }).join('');
  }
}

function noteRead(file){
  return new Promise(function(done){
    var fr = new FileReader();
    fr.onload = function(){
      var s = String(fr.result||'');
      var i = s.indexOf(',');
      done({ name:file.name, mime:file.type||'application/octet-stream',
             data: i >= 0 ? s.substring(i+1) : '' });
    };
    fr.onerror = function(){ done(null); };
    fr.readAsDataURL(file);
  });
}

function noteSave(id){
  var title = String(($('ntTitle')||{}).value||'').trim();
  if(!title){ toast('제목을 넣어주세요'); return; }
  var body = mkValue('ntBody');

  var btn = $('ntSave');
  if(btn){ btn.disabled = true; btn.textContent = '저장 중...'; }

  var 버릴것 = [];
  if(id){
    var r0 = noteById(id);
    (r0 ? (r0.files||[]) : []).forEach(function(f){
      if((NOTE.keep||[]).indexOf(f.id) < 0) 버릴것.push(f.id);
    });
  }

  Promise.all((NOTE.pick||[]).map(noteRead)).then(function(files){
    var 보낼것 = files.filter(function(x){ return x && x.data; });
    return call('api_noteSave', S.token,
                { id:id||'', title:title, body:body, files:보낼것, dropFiles:버릴것 });
  }).then(function(res){
    if(btn){ btn.disabled = false; btn.textContent = '저장'; }
    if(!res || !res.ok){ toast((res && res.msg) || '저장하지 못했습니다'); return; }
    NOTE.pick = [];
    closeOk();
    noteLoad(true).then(function(){ if(S.view === 'note') renderNote(); });
  });
}

function noteDelete(id){
  if(!confirm('이 글을 지울까요?')) return;
  call('api_noteDelete', S.token, id).then(function(r){
    if(!r || !r.ok){ toast((r && r.msg) || '지우지 못했습니다'); return; }
    NOTE.rows = (NOTE.rows||[]).filter(function(x){ return x.id !== id; });
    closeOk();
    renderNote();
    roomBadge();
  });
}

/* ---------- 첨부 내려받기 ----------
   ★ 드라이브 주소는 화면에 오지 않습니다. 서버가 명단을 확인한 뒤
     파일 내용만 실어 보내고, 화면이 그것을 파일로 만들어 저장합니다. */
function noteFile(fid){
  toast('내려받는 중입니다');
  call('api_noteFile', S.token, fid).then(function(r){
    if(!r || !r.ok || !r.data){ toast((r && r.msg) || '파일을 열지 못했습니다'); return; }
    try{
      var bin = atob(r.data);
      var arr = new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
      var url = URL.createObjectURL(new Blob([arr], { type:r.mime||'application/octet-stream' }));
      var a = document.createElement('a');
      a.href = url; a.download = r.name || '파일';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 5000);
    }catch(e){ quiet('자료 내려받기', e); toast('파일을 저장하지 못했습니다'); }
  });
}
