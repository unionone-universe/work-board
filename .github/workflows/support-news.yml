name: 지원사업 매일 조사
on:
  schedule:
    # 한국시간 05:13 / 07:13. 정각 혼잡을 피하고 게시 전에 두 번 조사한다.
    - cron: '13 20,22 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: '최대 조사 시간(분, 5~35)'
        default: '30'
        required: false
      refilter_only:
        description: '기존 공개 자료 선별만 다시 적용'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: support-news-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: support/requirements.txt
      - name: 문서 읽기 준비
        run: |
          python -m pip install -r support/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr-kor tesseract-ocr-eng
      - name: 수집기 시험
        run: python -m unittest discover -s support/tests -v
      - name: 이전 조사 이어받기
        run: |
          if [ -n "$(git ls-remote --heads origin support-data)" ]; then
            git fetch origin support-data --depth=1
            git worktree add --detach support-state FETCH_HEAD
          else
            mkdir support-state
            git -C support-state init -b support-data
          fi
      - name: 공식 본문·첨부 조사
        id: research
        env:
          MINUTES: ${{ inputs.minutes || '30' }}
          REFILTER_ONLY: ${{ inputs.refilter_only || 'false' }}
        run: |
          python -c "import os; m=int(os.environ['MINUTES']); assert 5 <= m <= 35"
          if [ "$REFILTER_ONLY" = "true" ]; then
            python support/collect.py --output support-state --refilter-only
          else
            python support/collect.py --output support-state --seconds "$((MINUTES * 60))" --pages 25
          fi
      - name: 결과 저장 (기관 실패와 재시도 목록 포함)
        if: always() && steps.research.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          test -f support-state/state.json
          cd support-state
          git config user.name 'Union One Support News'
          git config user.email 'support-news@users.noreply.github.com'
          git add state.json feed.json runs
          if [ -n "$(find records -name '*.json' -print -quit)" ]; then git add records; fi
          if ! git diff --cached --quiet; then
            git commit -m "공식 지원사업 조사 $(date -u +%Y-%m-%dT%H:%MZ)"
            # checkout's authenticated origin is used; no secret enters public data files.
            if git remote get-url origin >/dev/null 2>&1; then
              git push origin HEAD:support-data
            else
              gh auth setup-git
              git remote add origin "https://github.com/$REPOSITORY.git"
              git push origin HEAD:support-data
            fi
          fi
      - name: 조사 요약
        if: always()
        run: |
          python support/report.py support-state >> "$GITHUB_STEP_SUMMARY"
